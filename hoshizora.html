<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ホシゾラの街 — 環境を守る・公害（小5社会・地理・協力型・1ファイル）
   四大公害病を知る → 高度経済成長の光とかげ（時間送り）→
   立ち上がった人たち（裁判と法律）→ 青空と海をとりもどせシミュレーション（対策の量で町の様子を試す）→
   はかせ（3Rとごみの量の変化）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  kougai: ruby('公害', 'こうがい'),
  kankyou: ruby('環境', 'かんきょう'),
  yuukisuigin: ruby('有機水銀', 'ゆうきすいぎん'),
  cadmium: 'カドミウム',
  aryuusan: ruby('亜硫酸', 'ありゅうさん') + 'ガス',
  koudokeizai: ruby('高度経済成長', 'こうどけいざいせいちょう'),
  saiban: ruby('裁判', 'さいばん'),
  shousho: ruby('勝訴', 'しょうそ'),
  kihonhou: ruby('公害対策基本法', 'こうがいたいさくきほんほう'),
  kankyouchou: ruby('環境庁', 'かんきょうちょう'),
  kankyoushou: ruby('環境省', 'かんきょうしょう'),
  kitakyushu: ruby('北九州市', 'きたきゅうしゅうし'),
  doukaiwan: ruby('洞海湾', 'どうかいわん'),
  taisaku: ruby('対策', 'たいさく'),
  shigen: ruby('資源', 'しげん'),
};

const NUMS = '①②③④⑤⑥⑦⑧';
const TAISAKU_PCT = [5, 20, 35, 50, 65, 78, 90, 100];

// ---------- 判定ロジック ----------
function judgeAozora(n) { // n: 1-8　対策のレベル
  if (n <= 2) return { level: 'low' };
  if (n <= 6) return { level: 'mid' };
  return { level: 'high' };
}
function cleanFrac(idx) { return TAISAKU_PCT[clamp(idx, 0, 7)] / 100; } // idx:0-7
function fishCountOf(idx) { return Math.round(cleanFrac(idx) * 8); }

// ---------- 公害を知ろう：四大公害病 ----------

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

function drawPointMarkers(points, foundSet, X, Y, sc) {

    const px = X(p.x), py = Y(p.y);
    gctx.beginPath(); gctx.arc(px, py, 22 * sc, 0, TAU);
    gctx.fillStyle = done ? '#1f3a63' : '#fff';
    gctx.fill();
    gctx.strokeStyle = '#10233f'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.fillStyle = done ? '#fff' : '#1f3a63';
    gctx.font = `700 ${20 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(p.letter, px, py + 1 * sc);

}

  else if (S.scene === 'seichou') drawSeichouScene(X, Y, sc);
  else if (S.scene === 'tatakau') drawTatakauScene(X, Y, sc);
  else if (S.scene === 'aozora') drawAozoraScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawAozoraScene(X, Y, sc);
}

// ---------- ホシゾラのめがね（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f5f9fe'); grd.addColorStop(1, '#7fa8d6');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#1f3a63'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'gauge') {
    const idx = clamp((S.aozoraLevel || 1) - 1, 0, 7);
    const r = judgeAozora(idx + 1);
    const cx = R, cy = R * 1.05, rad = R * 0.72;
    sctx.strokeStyle = '#dde8f7'; sctx.lineWidth = R * 0.13; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, 0); sctx.stroke();
    const frac = idx / 7;
    const ang = Math.PI - Math.PI * frac;
    sctx.strokeStyle = r.level === 'high' ? '#2f9a5a' : r.level === 'low' ? '#c1442e' : '#e0a020';
    sctx.lineWidth = R * 0.13;
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, ang, true); sctx.stroke();
    sctx.strokeStyle = '#10233f'; sctx.lineWidth = R * 0.045; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(cx + Math.cos(ang) * rad * 0.88, cy + Math.sin(ang) * rad * 0.88); sctx.stroke();
    sctx.fillStyle = '#10233f'; sctx.beginPath(); sctx.arc(cx, cy, R * 0.05, 0, TAU); sctx.fill();
    label(`対策 ${NUMS[idx]}（約${TAISAKU_PCT[idx]}%）`);
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#fff3c0'); g2.addColorStop(1, 'rgba(255,243,192,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#1f3a63'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🌟', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#1f3a63'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🏙️', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#10233f';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#1f3a63', '#ffe38a', '#7fa8d6', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

      if (n === 1) {
        sYes(); scopeBurst(); award('m_tatakau'); S.phase = 'done';
        say(`せいかい！ 苦しんだ 人たちの 声が、国や 会社を 動かし、${W.kougai}を 防ぐ しくみを 作る 力に なったんだ。<br><br>💡 <b>たいせつポイント</b><br>法律と 役所が できても、実際に 空や 海を きれいに するのは、これからの 努力。次は、その 努力を シミュレーションで 試してみよう！`);
        setButtons([{ label: 'つぎへ（青空と海をとりもどせ）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 裁判に 負け、何も 変わらなかった', 'イ 住民側が 勝訴し、その後の 法律や 対策づくりに つながった', 'ウ 裁判は 行われなかった'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- M4：青空と海をとりもどせ（メイン操作） ---
  m_aozora: {
    enter() {
      Object.assign(S, { scene: 'aozora', scope: { type: 'gauge' }, aozoraLevel: 4, aozoraClean: 0.05, aozoraTries: new Set(), aozoraAnimT: 1, aozoraResult: null });
      updateLoc();
      setWish('🏭', `工場は 排水や けむりへの ${W.taisaku}を 進めていった。${W.taisaku}の レベル①〜⑧を えらんで、町の 空や 海が どう 変わるか 試してみよう。`);
      say(`レベルを えらんで「対策を 試す」ボタンを おそう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      const list = [];
      for (let n = 1; n <= 8; n++) list.push({ label: NUMS[n - 1], cls: 'pos' + (S.aozoraLevel === n ? ' sel' : ''), cb: () => { S.aozoraLevel = n; this.refreshCtl(); } });
      list.push({ label: '🏭 対策を 試す', cb: () => this.run() });
      setControls(list);
    },
    run() {
      setControls([]);
      S.aozoraResult = null;
      say(`${W.taisaku}レベル ${NUMS[S.aozoraLevel - 1]}（約${TAISAKU_PCT[S.aozoraLevel - 1]}%）で 取り組みを 進めた……`);
      sSaw();
      startTween(S.aozoraClean, cleanFrac(S.aozoraLevel - 1), 1.2, v => { S.aozoraClean = v; }, () => this.judge());
    },
    judge() {
      const r = judgeAozora(S.aozoraLevel);
      S.aozoraTries.add(S.aozoraLevel);
      S.aozoraResult = r.level;
      if (r.level === 'low') {
        sHmm();
        say(`けむりは まだ 黒く、海には 魚の すがたも 見えない……。${W.taisaku}の レベルを もっと 上げて 試してみよう。`);
        this.refreshCtl();
      } else if (r.level === 'mid') {
        sHmm();
        say(`少しずつ 空が 明るくなり、海にも 魚が もどってきた。でも、まだ 十分とは いえないみたい。レベルを 上げて、もっと 試してみよう。`);
        this.refreshCtl();
      } else {
        sYes(); scopeBurst(); award('m_aozora'); S.phase = 'done';
        say(`✨ 空は 青く すみわたり、海には 魚が たくさん もどってきた！ 夜には 星も 見えるように……！ ✨<br><br>💡 <b>たいせつポイント</b><br>じっさいに ${W.kitakyushu}では、「死の海」と よばれた ${W.doukaiwan}が、対策を 進めてから わずか 数年で 大きく 生まれ変わった。1987年には「星空の街」に えらばれるまでに なったんだよ。`);
        setButtons([{ label: 'つぎへ（はかせチャレンジ）', cb: nextStep }]);
      }
    },
  },

  // --- はかせチャレンジ：3Rとこれからのくらし ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' }, hakaseFound: new Set() });
      updateLoc();
      hideWish();
      say(`さいごは <b>はかせチャレンジ</b>！ 今の わたしたちの くらしに つながる、3つの 取り組みを 見てみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HAKASE_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.hakaseFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.hakaseFound.size >= HAKASE_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.hakaseFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`最近の 日本の、1人が 1日に 出す ごみの 量は、どう 変わってきていると 思う？`);
      setButtons(choiceRow(['ア 増え続けている', 'イ 3Rなどの 取り組みで、少しずつ 減ってきている', 'ウ まったく 変わらない'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 1) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ 1人1日あたりの ごみの 量は、令和元年度の 918gから、令和6年度には 839gまで 少しずつ 減ってきている。<br><br>💡 <b>たいせつポイント</b><br>公害を 乗りこえた 経験は、ごみを 減らし ${W.shigen}を 大切に する、今の くらしにも つながっている。一人ひとりの 行動が、${W.kankyou}を 守る 力に なるんだ。`);
        setButtons([{ label: 'ふりかえりタイムへ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 増え続けている', 'イ 3Rなどの 取り組みで、少しずつ 減ってきている', 'ウ まったく 変わらない'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- ふりかえりタイム：5ミッションを1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      if (slide.video) {
        const videoUrl = `https://www.youtube.com/watch?v=${slide.video}`;
        showOverlay(`
          <h2>${slide.icon} ふりかえりタイム（${n}/${total}）${slide.title}</h2>
          <div id="furikaeriThumb" style="max-width:380px;margin:0 auto;cursor:pointer">
            <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
              <img src="https://img.youtube.com/vi/${slide.video}/hqdefault.jpg" style="width:100%;display:block;opacity:.85">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <div style="width:15%;aspect-ratio:1;min-width:56px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(24px,3vw,34px)">▶</div>
              </div>
            </div>
            <div style="margin-top:.5em;color:#1f5c78;font-size:clamp(12px,1.3vw,16px)">タップすると 新しい タブで 動画が ひらくよ</div>
          </div>
          <p class="talk">${slide.text()}</p>
          <button class="btn" id="furikaeriNextBtn">${isLast ? 'まとめへ すすむ' : 'つぎへ'}</button>
          <div class="foot">先生へ：動画は外部サイト(YouTube)の発信元です。内容を事前にご確認ください。URL: ${videoUrl}</div>
        `);
        $('furikaeriThumb').onclick = () => { sTap(); window.open(videoUrl, '_blank', 'noopener'); };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' }, aozoraLevel: 8, aozoraClean: 1, aozoraResult: 'high' });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ホシゾラの街 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 高度経済成長の 時代に、水俣病・新潟水俣病・イタイイタイ病・四日市ぜんそくという（<span class="blankWord" data-a="四大公害病">？？？</span>）が 起きた。<br>
        ② 苦しんだ 住民たちが（<span class="blankWord" data-a="裁判">？？？</span>）に 立ち上がり、勝訴した ことが、法律や 対策づくりに つながった。<br>
        ③ 今は（<span class="blankWord" data-a="3R">？？？</span>＝Reduce・Reuse・Recycle）の 取り組みで、ごみの 量が 少しずつ 減ってきている。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ ほこりに 思う人も いた</b> でした！ じつは ${W.kitakyushu}では、工場の けむりを「七色の 煙」と よび、発展の しるしとして 絵はがきや 町の 歌の 歌詞にまで するほど、ほこりに 思っていた 時代が あったんだ。でも その後、大気おせんは 全国 最悪に、${W.doukaiwan}は「死の海」と よばれるまでに なり……人々は 力を 合わせて、${W.kankyou}を 取りもどしていった。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🌟 <b>おうちミッション</b><br>家で 出る ごみを、もえる ごみ・もえない ごみ・${'資源(しげん)'}ごみに 分けて 出してみよう。3Rの うち、自分に できそうな ことを 1つ 見つけてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#0f1e38'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'aozora', scope: { type: 'glow' }, aozoraLevel: 8, aozoraClean: 1, aozoraResult: 'high' });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 公害と 環境について、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「四大公害病って 何？」「3Rって 何の 3つ？」`);
      setButtons([
        { label: '🗾 公害を知ろうの 地図', cls: 'sub', cb: () => this.show('kougai') },
        { label: '⚖️ 立ち上がった人たちの 図', cls: 'sub', cb: () => this.show('tatakau') },
        { label: '♻️ 3Rの 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_aozora などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);

</script>
</body>
</html>
