<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

/* =====================================================
   ボルトの町工場 — 自動車をつくる工業（小5社会・協力型・1ファイル）
   工程さがし(発見) → ロボットと人の分担(発見) →
   ジャストインタイム(①〜⑧で搬入タイミングを試す・メイン操作) →
   出荷前けんさ(発見) → はかせ（環境・輸出）。

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  press: ruby('プレス', 'プレス'),
  yousetsu: ruby('溶接', 'ようせつ'),
  tosou: ruby('塗装', 'とそう'),
  kumitate: ruby('組み立て', 'くみたて'),
  kensa: ruby('検査', 'けんさ'),
  kanren: ruby('関連工場', 'かんれんこうじょう'),
  jit: 'ジャストインタイム',
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 手がかりデータ ----------

  { key: 1, letter: 'い', name: '溶接', x: 420, y: 460,
    txt: `${W.press}で できた 部品どうしを、熱で とかして つなぎ合わせる。これで 車の からだ（ボディ）が できあがる。ここは ロボットが 大かつやくする 工程だよ。` },
  { key: 2, letter: 'う', name: '塗装', x: 640, y: 200,
    txt: `できあがった ボディに、色を ぬる。さびを 防ぐ 役目も あるんだ。何回も 色を かさねて、つやつやに 仕上げるよ。` },
  { key: 3, letter: 'え', name: '組み立て', x: 800, y: 460,
    txt: `エンジン・シート・タイヤ・まどガラスなど、たくさんの 部品を つぎつぎに 取りつけていく。ここで はじめて「車のかたち」が そろうんだ。` },

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

    gctx.font = `700 ${20 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(p.letter, px, py + 1 * sc);
  });
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'kotei') drawKoteiScene(X, Y, sc);
  else if (S.scene === 'buntan') drawBuntanScene(X, Y, sc);
  else if (S.scene === 'jit') drawJitScene(X, Y, sc);
  else if (S.scene === 'kensa') drawKensaScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- けんさスコープ ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f9f7ee'); grd.addColorStop(1, '#c7c2b0');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#3d3a34'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔎', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'gauge') {
    const lvl = (S.jit && S.jit.levelF) || 0;
    const bw = R * 0.5, bh = R * 1.0, bx = R - bw / 2, by = R * 0.35;
    sctx.strokeStyle = '#2e2b26'; sctx.lineWidth = R * 0.025;
    sctx.strokeRect(bx, by, bw, bh);
    const fillH = bh * clamp(lvl / 8, 0, 1);
    sctx.fillStyle = '#8a7560';
    sctx.fillRect(bx, by + bh - fillH, bw, fillH);
    label(`タイミング ${NUMS[clamp(Math.round(lvl) - 1, 0, 7)] || ''}`);
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#f2e6b0'); g2.addColorStop(1, 'rgba(242,230,176,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#3d3a34'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🚗', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#3d3a34'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#2e2b26';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#3d3a34', '#f0a838', '#8a7560', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

      this.refreshCtl();
    },
    refreshCtl() {

        cb: () => this.reveal(p),
      })));
      if (S.koteiFound.size >= KOTEI_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.koteiFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`5つの 工程の 中で、いちばん さいしょに 行うのは どれだろう？`);
      setButtons(choiceRow(['ア 溶接', 'イ プレス', 'ウ 検査'], (i, el) => this.pick(i, el)));

      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 溶接', 'イ プレス', 'ウ 検査'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

    enter() {

      hideWish();

    refreshCtl() {
      setButtons(BUNTAN_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.buntanFound.has(p.key) ? '✓' : ''),

    },
    reveal(p) {
      sTap(); S.buntanFound.add(p.key);

    },
    ask() {
      say(`なぜ、ロボットと 人とで 仕事を 分けているのだろう？`);
      setButtons(choiceRow(['ア 人が サボりたいから', 'イ ロボットは 力仕事・正確な くり返しが 得意、人は その場の 判断が 得意だから', 'ウ ロボットの 方が 何でも できるから'], (i, el) => this.pick(i, el)));

    pick(n, el) {

      if (n === 1) {

        say(`せいかい！ ロボットと 人、それぞれの 得意な ことを 生かして、力を 合わせているんだ。<br><br>💡 <b>たいせつポイント</b><br>同じ 作業を 正確に 何回も くり返すのは ロボットが 得意。細かい 確認や とっさの 判断は、今も 人の 目と 手が たよりに されている。`);

      } else {

  // --- M3：ジャストインタイム（メイン操作） ---
  m_jit: {
    enter() {
      Object.assign(S, { scene: 'jit', scope: { type: 'gauge' }, jit: { levelF: 0 }, jitTries: new Set(), tryT: 0 });
      updateLoc();
      hideWish();
      say(`ドアや エンジンなどの 部品は、${W.kanren}から とどく。目もり①〜⑧で「どれくらい 早く 部品を あつめておくか」を えらんで、うまく いくか ためしてみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      const list = [];
      for (let n = 1; n <= 8; n++) list.push({ label: NUMS[n - 1], cls: 'pos' + (S.jitLevel === n ? ' sel' : ''), cb: () => { S.jitLevel = n; this.refreshCtl(); } });
      list.push({ label: '🚚 部品を 運ぶ', cb: () => this.run() });
      setControls(list);
    },
    run() {
      setControls([]);
      say(`目もり ${NUMS[S.jitLevel - 1]} の タイミングで、${W.kanren}から 部品を 運んでもらう……`);
      sClank();
      startTween(0, S.jitLevel, 1.0, v => { S.jit.levelF = v; }, () => this.deliver());
    },
    deliver() {
      say(`くみたてラインに 部品を とどける！`);
      startTween(0, 1, 1.1, v => { S.tryT = v; }, () => this.judge());
    },
    judge() {
      const r = judgeJIT(S.jitLevel);
      S.jitTries.add(S.jitLevel);
      if (r.level === 'good') {
        sYes(); scopeBurst(); award('m_jit'); S.phase = 'done';
        say(`✨ ちょうど よい タイミングで、ラインが 止まらず 進んだ！ ✨<br><br>💡 <b>たいせつポイント</b><br>これが「${W.jit}」方式。必要な 部品を、必要な 時に、必要な 分だけ とどけることで、そうこを 大きくせずに すむんだ。`);
        setButtons([{ label: 'つぎへ（出荷前けんさ）', cb: nextStep }]);
      } else if (r.level === 'low') {
        sHonk(); S.tryT = 0;
        say(`早く 集めすぎて、そうこが 部品で パンパンに なってしまった……もういちど タイミングを えらんでみよう。`);
        this.refreshCtl();
      } else {
        sHonk(); S.tryT = 0;
        say(`おそすぎて、部品が 間に合わず ラインが 止まってしまった……もういちど タイミングを えらんでみよう。`);
        this.refreshCtl();
      }
    },
  },

  // --- はかせチャレンジ：かんきょうと ゆしゅつ ---
  hakase: {
    enter() {

        setButtons(choiceRow(['ア 軽い 方が かっこいいから', 'イ 使う 燃料が 少なくて すみ、かんきょうに やさしいから', 'ウ 運びやすいから'], (i, el2) => this.pick(i, el2)));

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(2);
      showOverlay(`
        <h2>⭐ ボルトの町工場 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 1台の 車には 約（<span class="blankWord" data-a="3万">？？？</span>）この 部品が 使われている。<br>
        ② 必要な 部品を 必要な 時に とどける しくみを（<span class="blankWord" data-a="ジャストインタイム">？？？</span>）と いう。<br>
        ③ 車を 軽く 作るのは、燃料を へらして（<span class="blankWord" data-a="かんきょう">？？？</span>）に やさしくするため。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>ウ 約3万こ</b> でした！ ${votedRight ? '（みんなの よそう、ばっちり！）' : ''} 小さな ネジまで 数えると、1台の 車には それだけ たくさんの 部品と 人の 力が 集まっているんだね。</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>家や 近所で 見かける 車を 1台 見て、どんな 部品で できているか おうちの人と 話してみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>

      `);
      sFanfare();
      setTimeout(scopeBurst, 200);

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 自動車工業について、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「車の 部品は 何こくらい？」「ジャストインタイムって 何？」`);
      setButtons([
        { label: '🏭 工程の 図', cls: 'sub', cb: () => this.show('kotei') },
        { label: '🤖 ロボットと人の 図', cls: 'sub', cb: () => this.show('buntan') },
        { label: '🚚 部品そうこの 図', cls: 'sub', cb: () => this.show('jit') },
        { label: '🔍 けんさの 図', cls: 'sub', cb: () => this.show('kensa') },

    show(scene) {
      S.scene = scene;
      updateLoc(); sTap();

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_jit などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
