<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   いろみずの研究所 — 水よう液の性質（小6理科・協力型・1ファイル）
   水よう液を なかまわけ（リトマス紙・酸性/中性/アルカリ性）→
   とけているのは何？（蒸発実験・気体/固体）→
   塩酸で鉄をとかそう（こさ①〜⑧の数値階段シミュレーション）→
   とけた鉄の正体（磁石・塩酸テストで別の物質と気づく）→
   はかせ（むらさきキャベツ液の連続的な色変化）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function hexToRgb(hex) { hex = hex.replace('#', ''); return { r: parseInt(hex.substr(0, 2), 16), g: parseInt(hex.substr(2, 2), 16), b: parseInt(hex.substr(4, 2), 16) }; }
function lerpColor(c1, c2, t) {
  const p1 = hexToRgb(c1), p2 = hexToRgb(c2);
  const r = Math.round(lerp(p1.r, p2.r, t)), g = Math.round(lerp(p1.g, p2.g, t)), b = Math.round(lerp(p1.b, p2.b, t));
  return `rgb(${r},${g},${b})`;
}

const W = {
  sansei: ruby('酸性', 'さんせい'),
  chuusei: ruby('中性', 'ちゅうせい'),
  arukari: 'アルカリ' + ruby('性', 'せい'),
  enan: ruby('塩酸', 'えんさん'),
  shokuen: ruby('食塩水', 'しょくえんすい'),
  tansan: ruby('炭酸水', 'たんさんすい'),
  sekkai: ruby('石灰水', 'せっかいすい'),
  anmonia: 'アンモニア' + ruby('水', 'すい'),
  tetsu: ruby('鉄', 'てつ'),
  suiso: ruby('水素', 'すいそ'),
  jouhatsu: ruby('蒸発', 'じょうはつ'),
  jishaku: ruby('磁石', 'じしゃく'),
  kinzoku: ruby('金属', 'きんぞく'),
  henka: ruby('変化', 'へんか'),
};

const NUMS = '①②③④⑤⑥⑦⑧';
const NOUDO_PCT = [0.5, 1, 2, 3, 4, 5, 8, 15];

// ---------- 判定ロジック ----------

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#f0fbf9'); g.addColorStop(1, '#dceff0');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.fillStyle = '#e6f6f2';
  gctx.fillRect(X(0), Y(520), 1000 * sc, 120 * sc);
}

// ---------- フラスコ／ビーカーの共通描画 ----------
function drawFlaskShape(X, Y, sc, cx, topY, botY, halfW) {
  const p = new Path2D();
  const nw = halfW * 0.34;
  p.moveTo(X(cx - nw), Y(topY));
  p.lineTo(X(cx - nw), Y(topY + (botY - topY) * 0.32));
  p.lineTo(X(cx - halfW), Y(botY - 10));
  p.quadraticCurveTo(X(cx - halfW), Y(botY), X(cx - halfW + 8), Y(botY));
  p.lineTo(X(cx + halfW - 8), Y(botY));
  p.quadraticCurveTo(X(cx + halfW), Y(botY), X(cx + halfW), Y(botY - 10));
  p.lineTo(X(cx + nw), Y(topY + (botY - topY) * 0.32));
  p.lineTo(X(cx + nw), Y(topY));
  return p;
}

function drawPaperStrip(X, Y, sc, cx, cy, col, label) {
  gctx.fillStyle = col; gctx.strokeStyle = '#163044'; gctx.lineWidth = 1.6 * sc;
  roundRect(gctx, X(cx - 18), Y(cy - 46), 36 * sc, 92 * sc, 5 * sc); gctx.fill(); gctx.stroke();
  gctx.fillStyle = '#fff'; gctx.font = `700 ${14 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(label, X(cx), Y(cy + 60));
}
function wrapText(text, x, y, maxW, lh) {
  const chars = text.split('');
  let line = '', ly = y;
  const lines = [];
  chars.forEach(ch => {
    const test = line + ch;
    if (gctx.measureText(test).width > maxW && line) { lines.push(line); line = ch; } else { line = test; }
  });
  if (line) lines.push(line);
  lines.slice(0, 2).forEach((l, i) => gctx.fillText(l, x, ly + i * lh));
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- 2．蒸発ざら（とけているのは 固体？ 気体？／betsumonoでも流用） ----------
function drawEvapScene(X, Y, sc, levelT, residue, heating, titleTxt) {
  bgFill(X, Y, sc);
  const cx = 500, dishY = 420, standTopY = 470;
  gctx.fillStyle = '#8a8f92'; gctx.fillRect(X(cx - 60), Y(standTopY), 120 * sc, 14 * sc);
  gctx.fillRect(X(cx - 6), Y(standTopY + 14), 12 * sc, 60 * sc);
  gctx.fillRect(X(cx - 60), Y(standTopY + 74), 120 * sc, 12 * sc);
  if (heating) {
    for (let i = 0; i < 3; i++) {
      const fxx = cx + (i - 1) * 26;
      gctx.fillStyle = `rgba(255,150,60,${0.5 + 0.3 * Math.sin(performance.now() / 90 + i)})`;
      gctx.beginPath(); gctx.ellipse(X(fxx), Y(standTopY + 30), 10 * sc, 20 * sc, 0, 0, TAU); gctx.fill();
    }
  }
  // 蒸発皿
  gctx.fillStyle = '#e8e2d0'; gctx.strokeStyle = '#163044'; gctx.lineWidth = 2.4 * sc;
  gctx.beginPath(); gctx.ellipse(X(cx), Y(dishY), 90 * sc, 26 * sc, 0, 0, TAU); gctx.fill(); gctx.stroke();
  // 液体（levelTに応じて縮む）
  if (levelT > 0.02) {
    gctx.fillStyle = 'rgba(180,210,230,.75)';
    gctx.beginPath(); gctx.ellipse(X(cx), Y(dishY - 4), 76 * sc * levelT, 16 * sc * levelT, 0, 0, TAU); gctx.fill();
    gctx.strokeStyle = 'rgba(255,255,255,.6)'; gctx.lineWidth = 1.4 * sc;
    gctx.beginPath(); gctx.ellipse(X(cx), Y(dishY - 4), 76 * sc * levelT, 16 * sc * levelT, 0, 0, TAU); gctx.stroke();
  }
  // 残ったもの
  if (residue === 'solid') {
    gctx.fillStyle = '#fff'; gctx.strokeStyle = '#c9c2a8'; gctx.lineWidth = 1 * sc;
    for (let i = 0; i < 10; i++) {
      const rx = cx + Math.sin(i * 2.3) * 46, ry = dishY - 2 + Math.cos(i * 1.7) * 8;
      gctx.save(); gctx.translate(X(rx), Y(ry)); gctx.rotate(i);
      gctx.fillRect(-4 * sc, -4 * sc, 8 * sc, 8 * sc); gctx.strokeRect(-4 * sc, -4 * sc, 8 * sc, 8 * sc);
      gctx.restore();
    }
  } else if (residue === 'yellow') {
    gctx.fillStyle = '#d9a628'; gctx.strokeStyle = '#8a6a10'; gctx.lineWidth = 1.4 * sc;
    gctx.beginPath();
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * TAU;
      const rr = 34 * (0.7 + 0.3 * Math.sin(i * 2.9));
      const px = cx + Math.cos(a) * rr, py = dishY - 2 + Math.sin(a) * rr * 0.32;
      i === 0 ? gctx.moveTo(X(px), Y(py)) : gctx.lineTo(X(px), Y(py));
    }
    gctx.closePath(); gctx.fill(); gctx.stroke();
  }
  gctx.fillStyle = '#0d3640'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(titleTxt, X(500), Y(70));
}

// ---------- 3．塩酸で 鉄を とかそう（メイン操作） ----------
function drawKinzokuScene(X, Y, sc) {
  bgFill(X, Y, sc);
  const cx = 500, topY = 150, botY = 420, halfW = 130;
  const idx = clamp((S.kinLevel || 1) - 1, 0, 7);
  const pct = NOUDO_PCT[idx];
  const p = drawFlaskShape(X, Y, sc, cx, topY, botY, halfW);
  const liqTop = topY + (botY - topY) * 0.4;
  const conc = clamp(idx / 7, 0, 1);
  gctx.save(); gctx.clip(p);
  const g = gctx.createLinearGradient(0, Y(liqTop), 0, Y(botY));
  g.addColorStop(0, `rgba(${210 - conc * 40},${230 - conc * 60},${200 - conc * 90},.7)`);
  g.addColorStop(1, `rgba(${180 - conc * 40},${205 - conc * 70},${175 - conc * 90},.85)`);
  gctx.fillStyle = g;
  gctx.fillRect(X(cx - halfW), Y(liqTop), halfW * 2 * sc, (botY - liqTop) * sc);
  // 鉄（スチールウール）
  gctx.strokeStyle = '#8a8f92'; gctx.lineWidth = 2.2 * sc;
  const ironY = botY - 26 - (S.kinBubbleT > 0.85 ? (S.kinBubbleT - 0.85) * 30 : 0);
  gctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a0 = i * 1.7;
    gctx.moveTo(X(cx - 20 + i * 8), Y(ironY - 6));
    gctx.bezierCurveTo(X(cx - 10 + i * 8), Y(ironY - 16), X(cx + 6 + i * 8), Y(ironY + 4), X(cx - 4 + i * 8), Y(ironY + 10));
  }
  gctx.stroke();
  // あわ
  if (S.kinBubbleT > 0 && S.kinBubbleT < 1) {
    const rate = idx <= 1 ? 3 : idx >= 6 ? 16 : 8;
    const n = Math.round(rate * S.kinBubbleT);
    gctx.fillStyle = 'rgba(255,255,255,.7)';
    for (let i = 0; i < n; i++) {
      const bx = cx + Math.sin(i * 2.1) * 40;
      const by = ironY - ((S.kinBubbleT * 3 + i * 0.37) % 1) * (ironY - liqTop);
      gctx.beginPath(); gctx.arc(X(bx), Y(by), (2 + (i % 3)) * sc, 0, TAU); gctx.fill();
    }
    if (idx >= 6) {
      gctx.fillStyle = `rgba(200,200,200,${0.25 * S.kinBubbleT})`;
      gctx.beginPath(); gctx.ellipse(X(cx), Y(liqTop - 10), 60 * sc, 20 * sc, 0, 0, TAU); gctx.fill();
    }
  }
  gctx.restore();
  gctx.lineWidth = 2.5 * sc; gctx.strokeStyle = '#163044'; gctx.stroke(p);

  gctx.fillStyle = '#0d3640'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(`${W.enan.replace(/<[^>]+>/g, '')}の こさ ${NUMS[idx]}（やく${pct}%）`, X(500), Y(70));
  if (S.kinResult === 'high') {
    gctx.font = `${28 * sc}px sans-serif`; gctx.fillText('⚠️', X(cx + halfW + 30), Y(topY + 20));

}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'nakama') drawNakamaScene(X, Y, sc);
  else if (S.scene === 'toumei') drawToumeiScene(X, Y, sc);
  else if (S.scene === 'kinzoku') drawKinzokuScene(X, Y, sc);
  else if (S.scene === 'betsumono') drawBetsumonoScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f5fdfb'); grd.addColorStop(1, '#a8dcd8');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = S.scope.color || '#1f6a78';
    sctx.beginPath(); sctx.arc(R, R * 0.82, R * 0.42, 0, TAU); sctx.fill();
    sctx.strokeStyle = '#163044'; sctx.lineWidth = R * 0.03; sctx.stroke();
    label(S.scope.name || '');
  } else if (mode === 'gauge') {
    const idx = clamp((S.kinLevel || 1) - 1, 0, 7);
    const r = judgeNouido(idx + 1);
    const cx = R, cy = R * 1.05, rad = R * 0.72;
    sctx.strokeStyle = '#dfeef2'; sctx.lineWidth = R * 0.13; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, 0); sctx.stroke();
    const frac = idx / 7;
    const ang = Math.PI - Math.PI * frac;
    sctx.strokeStyle = r.level === 'good' ? '#2f9a5a' : r.level === 'low' ? '#e0a020' : '#c1442e';
    sctx.lineWidth = R * 0.13;
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, ang, true); sctx.stroke();
    sctx.strokeStyle = '#163044'; sctx.lineWidth = R * 0.045; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(cx + Math.cos(ang) * rad * 0.88, cy + Math.sin(ang) * rad * 0.88); sctx.stroke();
    sctx.fillStyle = '#163044'; sctx.beginPath(); sctx.arc(cx, cy, R * 0.05, 0, TAU); sctx.fill();
    label(`こさ ${NUMS[idx]}（やく${NOUDO_PCT[idx]}%）`);
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#eafffb'); g2.addColorStop(1, 'rgba(234,255,251,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#1f6a78'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🧪', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#1f6a78'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#163044';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#1f6a78', '#ffe3a0', '#a8dcd8', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

      setControls([]);
      S.kinResult = null; S.kinBubbleT = 0;
      say(`目もり ${NUMS[S.kinLevel - 1]}（やく${NOUDO_PCT[S.kinLevel - 1]}%）の 塩酸に、${W.tetsu}を 入れてみよう……`);
      startTween(0, 1, 1.6, v => { S.kinBubbleT = v; }, () => this.judge());
    },
    judge() {
      const r = judgeNouido(S.kinLevel);
      S.kinTries.add(S.kinLevel); S.kinResult = r.level;
      if (r.level === 'low') {
        sHmm();
        say(`うすすぎて、あわ（${W.suiso}）が ほとんど 出ない……${W.tetsu}は ほとんど かわらないみたい。もっと こい 塩酸で ためそう。`);
        this.refreshCtl();
      } else if (r.level === 'good') {
        sYes(); scopeBurst(); award('m_kinzoku'); S.phase = 'done';
        say(`✨ あわ（${W.suiso}）を 出しながら、${W.tetsu}が とけていく！ 液が すこし 黄色っぽく なった。<br><br>💡 <b>たいせつポイント</b><br>塩酸は ${W.tetsu}を とかす。とけると あわ（${W.suiso}）が 出る。この とけた液を、こんど 蒸発させて 正体を たしかめよう。`);
        setButtons([{ label: 'つぎへ（とけた鉄の正体）', cb: nextStep }]);
      } else {
        sClank();
        say(`こすぎて、あわが すごい いきおいで 出て、けむりのような ものも 見える……⚠️ 本当の 理科室では、こい 塩酸は とても きけんだから 使わないよ。もう少し うすい 塩酸で ためそう。`);
        this.refreshCtl();
      }
    },
  },

  // --- M4：とけた鉄の 正体 ---
  m_betsumono: {
    enter() {
      Object.assign(S, { scene: 'betsumono', scope: { type: 'idle' }, betsuLevelT: 1, betsuResidueShown: false, magnetTested: false, acidTested: false });
      updateLoc();
      hideWish();
      say(`${W.tetsu}を とかした 塩酸を、こんど 蒸発させてみよう。あとに 何が のこると 思う？ シートに 予想を 書いたら、ボタンで えらんでね。`);
      setButtons(choiceRow(['鉄のまま（金属の つぶ）が のこる', '何も のこらない', '鉄とは ちがう、黄色っぽい ものが のこる'], (i, el) => this.pick(i, el)));
    },
    pick(i, el) {
      S.betsuPick = i; markPicked(el);
      say(`よし、じっさいに 蒸発させて たしかめよう！`);
      setButtons([{ label: '🔥 熱して 蒸発させる', cb: () => this.heat() }]);
    },
    heat() {
      setButtons([]);
      S.heating = true;
      say(`ぐつぐつ……水が どんどん 蒸発していく……`);
      startTween(1, 0, 2.0, v => { S.betsuLevelT = v; }, () => this.reveal());
    },
    reveal() {
      S.heating = false; S.betsuResidueShown = true;
      sYes(); S.scope = { type: 'point', name: '黄色っぽい つぶ', color: '#d9a628' }; scopeBurst();
      const hit = S.betsuPick === 2;
      say(`あとには、黄色っぽい つぶが のこった！ これは ${W.tetsu}……なのかな？ ${hit ? 'よそう どおり！' : ''} 2つの 方法で たしかめよう。`);
      setButtons(this.testButtons());
    },
    testButtons() {
      return [
        { label: `🧲 ${W.jishaku.replace(/<[^>]+>/g, '')}を 近づける` + (S.magnetTested ? ' ✓' : ''), cb: () => this.testMagnet() },
        { label: '🧪 塩酸を たらす' + (S.acidTested ? ' ✓' : ''), cb: () => this.testAcid() },
      ];
    },
    testMagnet() {
      if (S.magnetTested) return;
      S.magnetTested = true; sTap();
      say(`🧲 ${W.jishaku}を 近づけても……くっつかない！ ${W.tetsu}なら ${W.jishaku}に くっつくはずなのに。`);
      setButtons(this.testButtons());
      this.checkDone();
    },
    testAcid() {
      if (S.acidTested) return;
      S.acidTested = true; sTap();
      say(`🧪 塩酸を たらしても……さっきのような あわは 出ない！ ${W.tetsu}なら あわが 出るはずなのに。`);
      setButtons(this.testButtons());
      this.checkDone();
    },
    checkDone() {
      if (S.magnetTested && S.acidTested) {
        award('m_betsumono'); S.phase = 'done';
        const votedRight = S.votePicked.has(2);
        say(`💡 <b>たいせつポイント</b><br>とけた ${W.tetsu}は、${W.jishaku}に くっつかず、塩酸を かけても あわが 出ない……つまり <b>${W.tetsu}とは べつの ものに ${W.henka}している</b>んだ！ 水よう液には、${W.kinzoku}を べつの ものに ${W.henka}させる 力が あるんだね。<br><br>さいしょの よそうタイムの こたえは <b>ウ ${W.tetsu}とは べつの、黄色っぽい ものが のこる</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}`);
        setButtons([{ label: 'つぎへ（はかせチャレンジ）', cb: nextStep }]);
      }
    },
  },

  // --- はかせチャレンジ：むらさきキャベツ液 ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' }, cabbageFound: new Set(), cabbageColor: null });
      updateLoc();
      say(`さいごは <b>はかせチャレンジ</b>！ むらさきキャベツの しるも、じつは リトマス紙と おなじ はたらきを する てんねんの 指示薬なんだ。いろいろな 液を たらして 色の 変化を 見てみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(CABBAGE_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.cabbageFound.has(p.key) ? ' ✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.cabbageFound.size >= CABBAGE_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.cabbageFound.add(p.key); S.cabbageColor = p.col;
      S.scope = { type: 'point', name: p.name, color: p.col };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`むらさきキャベツ液が リトマス紙より すごいのは、どんな ところだろう？`);
      setButtons(choiceRow(['色が 変わらないから べんり', '酸性・アルカリ性の 強さも、色の ちがいで わかるから', 'どんな 水よう液にも 使えないから'], (i, el) => this.pick(i, el)));
    },
    pick(i, el) {
      markPicked(el);
      if (i === 1) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ リトマス紙は 赤・青の 2色だけだけど、むらさきキャベツ液は 赤・むらさき・緑・黄色と、こさに よって 色が すこしずつ 変わる。だから ${W.sansei}・${W.arukari}の <b>強さ</b>まで 目で 見て わかるんだ。<br><br>⚠️ ${W.sansei}や ${W.arukari}の つよい 薬品は、目に 入ると とても きけん。理科室では 先生の 話を よく 聞いて、正しく あつかおうね。`);
        setButtons([{ label: 'ふりかえりタイムへ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['色が 変わらないから べんり', '酸性・アルカリ性の 強さも、色の ちがいで わかるから', 'どんな 水よう液にも 使えないから'], (i2, el2) => this.pick(i2, el2)));
      }
    },
  },

  // --- ふりかえりタイム：5ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      if (slide.video) {
        const videoUrl = `https://www.youtube.com/watch?v=${slide.video}`;
        const canEmbed = slide.embeddable !== false;
        showOverlay(`
          <h2>${slide.icon} ふりかえりタイム（${n}/${total}）${slide.title}</h2>
          <div id="furikaeriThumb" style="max-width:380px;margin:0 auto;cursor:pointer">
            <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
              <img src="https://img.youtube.com/vi/${slide.video}/hqdefault.jpg" style="width:100%;display:block;opacity:.85">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <div style="width:15%;aspect-ratio:1;min-width:56px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(24px,3vw,34px)">▶</div>
              </div>
            </div>
            <div style="margin-top:.5em;color:#3a7ab8;font-size:clamp(12px,1.3vw,16px)">${canEmbed ? 'タップすると この画面で 動画が はじまるよ' : 'タップすると 新しい タブで 動画が ひらくよ'}</div>
          </div>
          <p class="talk">${slide.text()}</p>
          <button class="btn" id="furikaeriNextBtn">${isLast ? 'まとめへ すすむ' : 'つぎへ'}</button>
          <div class="foot">先生へ：動画はYouTubeの教育系チャンネルです。内容を事前にご確認ください。URL: ${videoUrl}</div>
        `);
        $('furikaeriThumb').onclick = () => {
          sTap();
          if (canEmbed) {
            const embedUrl = `https://www.youtube-nocookie.com/embed/${slide.video}?rel=0&modestbranding=1&iv_load_policy=3&autoplay=1`;
            $('furikaeriThumb').outerHTML = `<div style="max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#000"><iframe width="100%" height="100%" src="${embedUrl}" title="${slide.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
          } else {
            window.open(videoUrl, '_blank', 'noopener');
          }
        };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' }, cabbageColor: CABBAGE_DEFAULT });
      updateLoc();
      const votedRight = S.votePicked.has(2);
      showOverlay(`
        <h2>⭐ いろみずの研究所 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 水よう液は、${W.sansei}・${W.chuusei}・${W.arukari}の 3つに 分けられる。しらべる 道具は（<span class="blankWord" data-a="リトマス紙">？？？</span>）。<br>
        ② 水よう液には、固体が とけているものと（<span class="blankWord" data-a="気体">？？？</span>）が とけているものが ある。<br>
        ③ 塩酸のような 水よう液には、金属を べつの ものに（<span class="blankWord" data-a="変化させる">？？？</span>）力が ある。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>ウ 鉄とは ちがう、黄色っぽい ものが のこる</b>でした！ 塩酸に とけた 鉄は、磁石にも くっつかず あわも 出さない、まったく べつの ものに 変わっていたね。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>紅茶に レモン汁を 少し たらしてみよう。色が うすく 変わったら、それも 酸性の 力。おうちの人と いっしょに、あんぜんに 試してみてね。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#0d3640'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' }, cabbageColor: CABBAGE_DEFAULT });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「炭酸水は ${W.sansei}？ ${W.chuusei}？」「とけた鉄が べつの ものに 変わった しょうこは？」`);
      setButtons([
        { label: '🧪 なかまわけの 図', cls: 'sub', cb: () => this.show('nakama') },
        { label: '🔥 蒸発ざらの 図', cls: 'sub', cb: () => this.show('toumei') },
        { label: '⚗️ 塩酸と 鉄の 図', cls: 'sub', cb: () => this.show('kinzoku') },
        { label: '🥬 むらさきキャベツの 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_kinzoku などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
