<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   カガミの丘 — 光のひみつ（小3理科・協力型・1ファイル）
   光はまっすぐ進む（発見型・影のしくみ）→
   鏡で光をはね返す（的あて・角度①〜⑧）→
   鏡を重ねて明るさ・あたたかさアップ（メイン操作・①〜⑧の数値階段・単調増加型）→
   虫眼鏡で光を集める（距離①〜⑧・中間が正解型）→
   はかせ（身のまわりの光の利用と安全）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  chokushin: ruby('直進', 'ちょくしん'),
  hansha: ruby('反射', 'はんしゃ'),
  kagami: ruby('鏡', 'かがみ'),
  mushimegane: ruby('虫眼鏡', 'むしめがね'),
  shouten: ruby('焦点', 'しょうてん'),
  totsu: ruby('凸', 'とつ') + 'レンズ',
  seirei: ruby('精霊', 'せいれい'),
  hansharitsu: ruby('反射率', 'はんしゃりつ'),
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 数値データ（本物度） ----------
// 鏡の的あて：正解の角度は⑤（鏡の傾きと反射の関係を試行錯誤で見つける）
const HANSHA_CORRECT = 5;
// 鏡を重ねる：日なた27℃を基準に、鏡1枚ごとにおよそ+3℃（学校実験で確認されている「枚数が多いほど明るく暖かい」傾向のモデル値）
const KASANE_BASE = 27;
const KASANE_STEP = 3;
const KASANE_TEMPS = [1,2,3,4,5,6,7,8].map(n => KASANE_BASE + n * KASANE_STEP);
const KASANE_TARGET = 40; // お湯につかった時と同じくらいの40℃をめざす
// 虫眼鏡：レンズと紙のきょり(cm)。実際の虫眼鏡の焦点距離(およそ12〜15cm)を④⑤に設定
const MEGANE_DIST = [3, 6, 9, 12, 15, 18, 21, 24];
const MEGANE_FOCUS_LO = 4, MEGANE_FOCUS_HI = 5; // ④⑤がちょうどの焦点距離

// ---------- 身のまわりの光の利用 ----------
const HAKASE_POINTS = [
  { key: 0, letter: 'あ', name: '太陽光発電', txt: `屋根の 上の ソーラーパネルは、太陽の 光を 集めて 電気に かえている。光の エネルギーを 利用する くらしの 知恵。` },

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));
const sPlop = () => { tone(220, 0, 0.12, 'sine', 0.1); tone(180, 0.06, 0.15, 'sine', 0.08); };

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#eaf6ff'); g.addColorStop(1, '#cfe6f7');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.fillStyle = '#dcefdc';
  gctx.fillRect(X(0), Y(540), 1000 * sc, 100 * sc);
}
function drawSun(X, Y, sc, cx, cy, r) {
  gctx.save();
  gctx.shadowColor = '#ffd166'; gctx.shadowBlur = 18 * sc;
  gctx.fillStyle = '#ffd166';
  gctx.beginPath(); gctx.arc(X(cx), Y(cy), r * sc, 0, TAU); gctx.fill();
  gctx.restore();
  gctx.strokeStyle = '#f0a020'; gctx.lineWidth = 2.4 * sc;
  for (let i = 0; i < 8; i++) {
    const a = i * TAU / 8;
    gctx.beginPath();
    gctx.moveTo(X(cx) + Math.cos(a) * r * 1.25 * sc, Y(cy) + Math.sin(a) * r * 1.25 * sc);
    gctx.lineTo(X(cx) + Math.cos(a) * r * 1.65 * sc, Y(cy) + Math.sin(a) * r * 1.65 * sc);
    gctx.stroke();
  }
}
function drawMirrorDisc(X, Y, sc, cx, cy, r, angle, active) {
  gctx.save();
  gctx.translate(X(cx), Y(cy)); gctx.rotate(angle);
  // 持ち手（スタンド）
  gctx.strokeStyle = '#c9902a'; gctx.lineWidth = 5 * sc; gctx.lineCap = 'round';
  gctx.beginPath(); gctx.moveTo(0, r * 0.42 * sc); gctx.lineTo(0, r * 0.85 * sc); gctx.stroke();
  // 鏡面（縦長の丸角の板）
  gctx.fillStyle = active === false ? '#c9d6e0' : '#eaf6ff';
  gctx.strokeStyle = active === false ? '#a8b8c4' : '#e0a020'; gctx.lineWidth = r * 0.055 * sc;
  roundRect(gctx, -r * 0.19 * sc, -r * 0.42 * sc, r * 0.38 * sc, r * 0.84 * sc, r * 0.12 * sc);
  gctx.fill(); gctx.stroke();
  if (active !== false) {
    gctx.fillStyle = 'rgba(255,255,255,.75)';
    roundRect(gctx, -r * 0.1 * sc, -r * 0.34 * sc, r * 0.09 * sc, r * 0.44 * sc, r * 0.045 * sc);
    gctx.fill();
  }
  gctx.restore();
}
function drawTarget(X, Y, sc, cx, cy, r, hit) {
  const rings = ['#c1442e', '#fff', '#c1442e', '#fff'];
  for (let i = 0; i < 4; i++) {
    gctx.fillStyle = rings[i];
    gctx.beginPath(); gctx.arc(X(cx), Y(cy), r * (1 - i * 0.24) * sc, 0, TAU); gctx.fill();
  }
  if (hit) {
    gctx.save(); gctx.shadowColor = '#ffd166'; gctx.shadowBlur = 20 * sc;
    gctx.fillStyle = '#ffe9a0';
    gctx.beginPath(); gctx.arc(X(cx), Y(cy), r * 0.3 * sc, 0, TAU); gctx.fill();
    gctx.restore();
  }
}

// ---------- 1．光はまっすぐ進む ----------
function drawChokushinScene(X, Y, sc) {
  bgFill(X, Y, sc);
  const sunX = 90, sunY = 220, endX = 900;
  drawSun(X, Y, sc, sunX, sunY, 34);
  const beamEndY = 220;
  const obsX = 480;
  const litEnd = S.obstacleOn ? obsX : endX;
  gctx.save();
  gctx.strokeStyle = '#ffd166'; gctx.lineWidth = 10 * sc; gctx.lineCap = 'round';
  gctx.globalAlpha = 0.85 * S.chokushinAnimT;
  for (let i = -1; i <= 1; i++) {
    gctx.beginPath();
    gctx.moveTo(X(sunX + 30), Y(beamEndY + i * 26));
    gctx.lineTo(X(sunX + 30 + (litEnd - sunX - 30) * S.chokushinAnimT), Y(beamEndY + i * 26));
    gctx.stroke();
  }
  gctx.restore();
  if (S.obstacleOn) {
    // 障害物（本）
    gctx.fillStyle = '#8a6a3a'; gctx.strokeStyle = '#5a4020'; gctx.lineWidth = 2 * sc;
    roundRect(gctx, X(obsX - 18), Y(140), 36 * sc, 160 * sc, 4 * sc);
    gctx.fill(); gctx.stroke();
    // かげ
    gctx.fillStyle = 'rgba(30,50,70,.35)';
    gctx.fillRect(X(obsX + 18), Y(140), (endX - obsX - 18) * sc, 160 * sc);
    gctx.fillStyle = '#1c3a52'; gctx.font = `700 ${16 * sc}px sans-serif`; gctx.textAlign = 'center';
    gctx.fillText('かげ', X((obsX + endX) / 2), Y(320));
  }
  gctx.fillStyle = '#1c3a52'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(S.obstacleOn ? 'しょうがい物：あり（光がさえぎられている）' : 'しょうがい物：なし（光が奥まで届いている）', X(500), Y(70));
}

// ---------- 2．鏡で光をはね返す（的あて） ----------
function drawHanshaScene(X, Y, sc) {
  bgFill(X, Y, sc);
  const sunX = 130, sunY = 150, mirX = 500, mirY = 380, tgtX = 860, tgtY = 150;
  drawSun(X, Y, sc, sunX, sunY, 30);
  // 太陽→鏡（固定の光線）
  gctx.strokeStyle = '#ffd166'; gctx.lineWidth = 6 * sc; gctx.lineCap = 'round'; gctx.globalAlpha = .85;
  gctx.beginPath(); gctx.moveTo(X(sunX + 26), Y(sunY + 18)); gctx.lineTo(X(mirX), Y(mirY)); gctx.stroke();
  gctx.globalAlpha = 1;
  // 鏡（角度で傾く）
  const angle = (S.hanshaAngle - HANSHA_CORRECT) * (Math.PI / 16);
  drawMirrorDisc(X, Y, sc, mirX, mirY, 110, angle);
  // 的
  drawTarget(X, Y, sc, tgtX, tgtY, 48, S.hanshaHit && S.hanshaAnimT >= 1);
  // 鏡→反射光（正解角度に近いほど的に近づく演出）
  if (S.hanshaAnimT > 0.02) {
    const missOffset = (S.hanshaAngle - HANSHA_CORRECT) * 70;
    const endX2 = tgtX + missOffset, endY2 = tgtY;
    const curX = lerp(mirX, endX2, S.hanshaAnimT), curY = lerp(mirY, endY2, S.hanshaAnimT);
    gctx.strokeStyle = '#4fc3f7'; gctx.lineWidth = 6 * sc; gctx.lineCap = 'round';
    gctx.beginPath(); gctx.moveTo(X(mirX), Y(mirY)); gctx.lineTo(X(curX), Y(curY)); gctx.stroke();
  }
  gctx.fillStyle = '#1c3a52'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(`鏡の むき ${NUMS[S.hanshaAngle - 1]}`, X(500), Y(70));
}

// ---------- 3．鏡を重ねて明るさ・あたたかさアップ（メイン操作） ----------
function drawKasaneScene(X, Y, sc) {
  bgFill(X, Y, sc);
  const cx = 500, cy = 420, r = 300;
  const n = S.kasaneLevel;
  // 的（黒い紙＋温度計）
  gctx.fillStyle = '#2c2c2c'; gctx.fillRect(X(cx - 44), Y(cy - 44), 88 * sc, 88 * sc);
  const temp = KASANE_TEMPS[n - 1] * S.kasaneAnimT + KASANE_BASE * (1 - S.kasaneAnimT);
  if (S.kasaneAnimT > 0.05) {
    const glowR = 40 + 90 * S.kasaneAnimT * (n / 8);
    const g = gctx.createRadialGradient(X(cx), Y(cy), 0, X(cx), Y(cy), glowR * sc);
    g.addColorStop(0, `rgba(255,230,150,${0.55 * S.kasaneAnimT})`);
    g.addColorStop(1, 'rgba(255,230,150,0)');
    gctx.fillStyle = g;
    gctx.beginPath(); gctx.arc(X(cx), Y(cy), glowR * sc, 0, TAU); gctx.fill();
  }
  gctx.strokeStyle = '#fff'; gctx.lineWidth = 3 * sc;
  gctx.beginPath(); gctx.moveTo(X(cx + 60), Y(cy - 30)); gctx.lineTo(X(cx + 60), Y(cy + 30)); gctx.stroke();
  gctx.fillStyle = '#c1442e';
  gctx.beginPath(); gctx.arc(X(cx + 60), Y(cy + 30), 8 * sc, 0, TAU); gctx.fill();
  gctx.fillStyle = '#1c3a52'; gctx.font = `700 ${15 * sc}px sans-serif`; gctx.textAlign = 'left'; gctx.textBaseline = 'middle';
  gctx.fillText(`${temp.toFixed(0)}℃`, X(cx + 78), Y(cy));
  // 鏡（枚数分、円弧状に配置。各鏡は温度計の方を向く）
  for (let i = 0; i < 8; i++) {
    const a = Math.PI * 0.62 + (Math.PI * 0.76) * (i / 7);
    const mx = cx + Math.cos(a) * r, my = cy - Math.sin(a) * (r * 0.62);
    const active = i < n;
    const mAngle = Math.atan2(cy - my, cx - mx);
    if (active && S.kasaneAnimT > 0.05) {
      gctx.save();
      gctx.strokeStyle = '#ffd166'; gctx.lineWidth = 3 * sc; gctx.globalAlpha = .8 * S.kasaneAnimT;
      gctx.beginPath(); gctx.moveTo(X(mx), Y(my)); gctx.lineTo(X(cx), Y(cy)); gctx.stroke();
      gctx.restore();
    }
    drawMirrorDisc(X, Y, sc, mx, my, 62, mAngle, active);
  }
  gctx.fillStyle = '#1c3a52'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(`鏡 ${NUMS[n - 1]}（${n}まい） 温度計 ${temp.toFixed(0)}℃／目ひょう${KASANE_TARGET}℃`, X(500), Y(70));
}

// ---------- 4．虫眼鏡で光を集める ----------
function drawMushimeganeScene(X, Y, sc) {
  bgFill(X, Y, sc);
  const sunX = 500, sunY = 90, lensY = 260, paperY = 470;
  drawSun(X, Y, sc, sunX, sunY, 28);
  const dist = MEGANE_DIST[S.meganeLevel - 1];
  const isFocus = S.meganeLevel >= MEGANE_FOCUS_LO && S.meganeLevel <= MEGANE_FOCUS_HI;
  // 光線
  gctx.strokeStyle = '#ffd166'; gctx.lineWidth = 4 * sc; gctx.globalAlpha = .8;
  for (let i = -2; i <= 2; i++) {
    gctx.beginPath(); gctx.moveTo(X(sunX + i * 26), Y(sunY + 24)); gctx.lineTo(X(sunX), Y(lensY)); gctx.stroke();
  }
  gctx.globalAlpha = 1;
  // レンズ
  gctx.fillStyle = 'rgba(207,232,251,.55)'; gctx.strokeStyle = '#3a8ec2'; gctx.lineWidth = 4 * sc;
  gctx.beginPath(); gctx.ellipse(X(sunX), Y(lensY), 60 * sc, 26 * sc, 0, 0, TAU); gctx.fill(); gctx.stroke();
  // レンズ→紙（収束）
  const spotR = isFocus ? 6 : (10 + Math.abs(S.meganeLevel - (MEGANE_FOCUS_LO + MEGANE_FOCUS_HI) / 2) * 9);
  gctx.strokeStyle = '#ffd166'; gctx.lineWidth = 3 * sc; gctx.globalAlpha = .8;
  gctx.beginPath(); gctx.moveTo(X(sunX - 55), Y(lensY)); gctx.lineTo(X(sunX), Y(paperY)); gctx.stroke();
  gctx.beginPath(); gctx.moveTo(X(sunX + 55), Y(lensY)); gctx.lineTo(X(sunX), Y(paperY)); gctx.stroke();
  gctx.globalAlpha = 1;
  // 黒い紙
  gctx.fillStyle = '#2c2c2c'; gctx.fillRect(X(sunX - 90), Y(paperY - 6), 180 * sc, 12 * sc);
  // 光点
  const t = S.meganeAnimT;
  if (t > 0.05) {
    gctx.save();
    if (isFocus && t > 0.6) { gctx.shadowColor = '#ff7a3a'; gctx.shadowBlur = 26 * sc; gctx.fillStyle = '#ff7a3a'; }
    else { gctx.shadowColor = '#ffe9a0'; gctx.shadowBlur = 10 * sc; gctx.fillStyle = 'rgba(255,230,150,.7)'; }
    gctx.beginPath(); gctx.arc(X(sunX), Y(paperY), spotR * sc * t, 0, TAU); gctx.fill();
    gctx.restore();
    if (isFocus && t >= 1) {
      gctx.fillStyle = '#8a8a8a'; gctx.font = `${22 * sc}px sans-serif`; gctx.textAlign = 'center';
      gctx.fillText('〜', X(sunX - 14), Y(paperY - 26));
      gctx.fillText('〜', X(sunX + 14), Y(paperY - 34));
    }
  }
  gctx.fillStyle = '#1c3a52'; gctx.font = `700 ${16 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(`レンズと紙の きょり ${NUMS[S.meganeLevel - 1]}（${dist}cm）`, X(500), Y(70));
}

// ---------- 5．はかせ：身のまわりの光の利用 ----------
const HAKASE_ICON = ['☀️', '🗼', '🚲', '🪞'];
function drawHakaseScene(X, Y, sc) {
  bgFill(X, Y, sc);
  const xs = [220, 420, 620, 820];
  HAKASE_POINTS.forEach((p, i) => {
    const done = S.hakaseFound.has(p.key);
    const px = xs[i], py = 300;
    gctx.beginPath(); gctx.arc(X(px), Y(py), 46 * sc, 0, TAU);
    gctx.fillStyle = done ? '#ffd166' : '#dce8f5';
    gctx.fill();
    gctx.strokeStyle = '#e0a020'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(HAKASE_ICON[i], X(px), Y(py - 2));
    gctx.fillStyle = '#1c3a52'; gctx.font = `700 ${14 * sc}px sans-serif`;
    gctx.fillText(p.letter + ' ' + p.name, X(px), Y(py + 62));
  });
  gctx.fillStyle = '#1c3a52'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('光の 性質は 身のまわりの いろいろな ところで 使われている', X(500), Y(70));
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'chokushin') drawChokushinScene(X, Y, sc);
  else if (S.scene === 'hansha') drawHanshaScene(X, Y, sc);
  else if (S.scene === 'kasane') drawKasaneScene(X, Y, sc);
  else if (S.scene === 'mushimegane') drawMushimeganeScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- カガミのぞき窓（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#eaf6ff'); grd.addColorStop(1, '#c3e2f5');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#e8940a';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'gauge') {
    const temp = KASANE_TEMPS[S.kasaneLevel - 1];
    const ok = temp >= KASANE_TARGET;
    const cx = R, cy = R * 1.05, rad = R * 0.72;
    sctx.strokeStyle = '#c9d6e0'; sctx.lineWidth = R * 0.13; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, 0); sctx.stroke();
    const frac = clamp((temp - KASANE_BASE) / (KASANE_TEMPS[7] - KASANE_BASE), 0, 1);
    const ang = Math.PI - Math.PI * frac;
    sctx.strokeStyle = ok ? '#2f9a5a' : '#e0a020';
    sctx.lineWidth = R * 0.13;
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, ang, true); sctx.stroke();
    sctx.strokeStyle = '#1c3a52'; sctx.lineWidth = R * 0.045; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(cx + Math.cos(ang) * rad * 0.88, cy + Math.sin(ang) * rad * 0.88); sctx.stroke();
    sctx.fillStyle = '#1c3a52'; sctx.beginPath(); sctx.arc(cx, cy, R * 0.05, 0, TAU); sctx.fill();
    label(`${temp}℃／目ひょう${KASANE_TARGET}℃`);
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffd16655'); g2.addColorStop(1, 'rgba(255,209,102,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#e8940a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🪞', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#e8940a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#1c3a52';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#ffd166', '#4fc3f7', '#ffe9a8', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

        sYes(); scopeBurst(); award('m_mushimegane'); S.phase = 'done';
        say(`せいかい！ 黒い紙は 光を 吸収しやすく、白い紙は 光を はね返しやすい。だから 黒い紙の 方が 熱く なりやすいんだ。<br><br>⚠️ 虫眼鏡で 太陽を 直接 見ては いけない。目を いためる きけんが ある。`);
        setButtons([{ label: 'つぎへ（はかせチャレンジ）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['黒い紙', '白い紙', 'どちらも同じ'], (i2, el2) => this.pick(i2, el2)));
      }
    },
  },

  // --- はかせチャレンジ：身のまわりの光の利用 ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' }, hakaseFound: new Set() });
      updateLoc();
      say(`さいごは <b>はかせチャレンジ</b>！ 光の 性質は 身のまわりの いろいろな ところで 使われているよ。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HAKASE_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.hakaseFound.has(p.key) ? ' ✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.hakaseFound.size >= HAKASE_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.hakaseFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`虫眼鏡や 鏡を 使う 時、いちばん 気をつけることは 何だと 思う？`);
      setButtons(choiceRow(['できるだけ大きい声で使う', '人の目や服、燃えやすい物に光を向けない', '毎回ちがう場所で使う'], (i, el) => this.pick(i, el)));
    },
    pick(i, el) {
      markPicked(el);
      if (i === 1) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ 虫眼鏡や 鏡で 集めたり はね返したり した 光は、人の 目を いためたり、物を こがしたり する 力を 持っている。安全に 気をつけて 使おう。`);
        setButtons([{ label: 'ふりかえりタイムへ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['できるだけ大きい声で使う', '人の目や服、燃えやすい物に光を向けない', '毎回ちがう場所で使う'], (i2, el2) => this.pick(i2, el2)));
      }
    },
  },

  // --- ふりかえりタイム：5ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      if (slide.video) {
        const videoUrl = `https://www.youtube.com/watch?v=${slide.video}`;
        const canEmbed = slide.embeddable !== false;
        showOverlay(`
          <h2>${slide.icon} ふりかえりタイム（${n}/${total}）${slide.title}</h2>
          <div id="furikaeriThumb" style="max-width:380px;margin:0 auto;cursor:pointer">
            <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
              <img src="https://img.youtube.com/vi/${slide.video}/hqdefault.jpg" style="width:100%;display:block;opacity:.85">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <div style="width:15%;aspect-ratio:1;min-width:56px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(24px,3vw,34px)">▶</div>
              </div>
            </div>
            <div style="margin-top:.5em;color:#3a7ab8;font-size:clamp(12px,1.3vw,16px)">${canEmbed ? 'タップすると この画面で 動画が はじまるよ' : 'タップすると 新しい タブで 動画が ひらくよ'}</div>
          </div>
          <p class="talk">${slide.text()}</p>
          <button class="btn" id="furikaeriNextBtn">${isLast ? 'まとめへ すすむ' : 'つぎへ'}</button>
          <div class="foot">先生へ：動画はYouTubeの教育系チャンネルです。内容を事前にご確認ください。URL: ${videoUrl}</div>
        `);
        $('furikaeriThumb').onclick = () => {
          sTap();
          if (canEmbed) {
            const embedUrl = `https://www.youtube-nocookie.com/embed/${slide.video}?rel=0&modestbranding=1&iv_load_policy=3&autoplay=1`;
            $('furikaeriThumb').outerHTML = `<div style="max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#000"><iframe width="100%" height="100%" src="${embedUrl}" title="${slide.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
          } else {
            window.open(videoUrl, '_blank', 'noopener');
          }
        };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ カガミの丘 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 光は（<span class="blankWord" data-a="まっすぐ">？？？</span>）進む。<br>
        ② 鏡を 重ねると、明るさも あたたかさも（<span class="blankWord" data-a="増える">？？？</span>）。<br>
        ③ 虫眼鏡は、光を 一点（${W.shouten}）に（<span class="blankWord" data-a="集める">？？？</span>）。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 明るさも あたたかさも 両方 増える</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>晴れた 日に、鏡で 日光を かべに 映してみよう（人の目には ぜったいに 向けないこと！）。かげが できる 場所も さがしてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#c26a0a'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「光は どんな 進み方を する？」「鏡を 増やすと どうなる？」「虫眼鏡は なぜ 熱くなる？」`);
      setButtons([
        { label: '☀️ 光はまっすぐ進むの 図', cls: 'sub', cb: () => this.show('chokushin') },
        { label: '🪞 鏡で光をはね返すの 図', cls: 'sub', cb: () => this.show('hansha') },
        { label: '✨ 鏡を重ねるの 図', cls: 'sub', cb: () => this.show('kasane') },
        { label: '🔍 虫眼鏡の 図', cls: 'sub', cb: () => this.show('mushimegane') },
        { label: '🚲 身のまわりの光の利用の 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_kasane などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
