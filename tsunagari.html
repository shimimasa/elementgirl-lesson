<script>
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();

<script>
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- アンロック判定 ----------
const REQUIRE_SLUG = 'musubi';
const BADGE_KEY = 'elementgirl_badge_progress';
function nsKey(base){
  try { return (typeof profileNamespacedKey === 'function') ? profileNamespacedKey(base) : base; }
  catch(e){ return base; }
}
function getBadgeProgress(){
  try { return JSON.parse(localStorage.getItem(nsKey(BADGE_KEY)) || '{}'); }
  catch(e){ return {}; }
}
function isUnlocked(){
  const p = getBadgeProgress()[REQUIRE_SLUG];
  return !!(p && p.total > 0 && p.count >= p.total);
}

// ---------- ベストタイム ----------
const BEST_KEY = 'tsunagari_best_ms';
function getBest(){
  const v = localStorage.getItem(nsKey(BEST_KEY));
  return v !== null ? parseInt(v, 10) : null;
}
function setBest(ms){
  try { localStorage.setItem(nsKey(BEST_KEY), String(ms)); } catch(e){}
}
function fmtTime(ms){
  const s = ms / 1000;
  return s.toFixed(1) + 'びょう';
}

// ---------- SDGsの目標(元本編musubi.htmlのSDGS/TSUNAGARIより、健康・ジェンダー平等・エネルギー・陸の豊かさを新規追加) ----------
const GOALS = {
  g1:  { num: 1,  name: '貧困をなくそう',               icon: '🏚️' },
  g3:  { num: 3,  name: 'すべての人に健康と福祉を',       icon: '💊' },
  g4:  { num: 4,  name: '質の高い教育をみんなに',         icon: '📚' },
  g5:  { num: 5,  name: 'ジェンダー平等を実現しよう',     icon: '🤝' },
  g6:  { num: 6,  name: '安全な水とトイレを世界中に',     icon: '💧' },
  g7:  { num: 7,  name: 'エネルギーをみんなに クリーンに', icon: '⚡' },
  g13: { num: 13, name: '気候変動に具体的な対策を',       icon: '🌡️' },
  g15: { num: 15, name: '陸の豊かさも守ろう',             icon: '🌳' },
};
const ALL_GOAL_KEYS = Object.keys(GOALS);

// 支援策→つながるSDGs目標(元本編の井戸の例+新規4件。学校教材・国際協力の啓発資料で一般的な関連)
const SUPPORTS = [
  { key: 'well',     name: '井戸をつくる',           icon: '⛲', correct: ['g6', 'g3', 'g4', 'g5'] },
  { key: 'school',   name: '学校をたてる',           icon: '🏫', correct: ['g4', 'g1', 'g5'] },
  { key: 'forest',   name: '木を植える・森を守る',    icon: '🌱', correct: ['g13', 'g15', 'g6'] },
  { key: 'solar',    name: '太陽光発電を広める',      icon: '☀️', correct: ['g7', 'g13'] },
  { key: 'hospital', name: '病院・保健所をつくる',    icon: '🏥', correct: ['g3', 'g1'] },
];
const SLOT_COUNT = 7;

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- ゲーム状態 ----------
const S = {
  phase: 'title',   // title | lock | level | resultLevel | result
  levelIdx: 0,
  slots: [],         // [{key,x,y}]
  selected: new Set(),
  gameStartAt: 0,
  gameEndAt: 0,
  sound: true,
};

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

// ---------- キャンバス ----------
const stageCv = $('stage'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}
const PAD_T = 30, PAD_B = 16, PAD_X = 14;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#f2fafb'); g.addColorStop(1, '#b8dde5');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
}

// ---------- 矢印(糸)を1本描く（musubi.htmlのdrawArrowを移植） ----------
function drawThread(X, Y, sc, x1, y1, x2, y2, col, lw) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  const ux = dx / len, uy = dy / len;
  const sx = x1 + ux * 46, sy = y1 + uy * 46;
  const ex = x2 - ux * 42, ey = y2 - uy * 42;
  gctx.strokeStyle = col; gctx.lineWidth = lw * sc; gctx.lineCap = 'round';
  gctx.beginPath();
  gctx.moveTo(X(sx), Y(sy)); gctx.lineTo(X(ex), Y(ey));
  gctx.stroke();
}

function drawSlotCircle(X, Y, sc, x, y, icon, num, state) {
  // state: 'idle' | 'sel' | 'good' | 'bad'
  const r = 42;
  gctx.beginPath(); gctx.arc(X(x), Y(y), r * sc, 0, TAU);
  gctx.fillStyle = state === 'good' ? '#fff3d0' : state === 'bad' ? '#ffe0dc' : state === 'sel' ? '#ffe9a8' : '#eaf6f7';
  gctx.fill();
  gctx.strokeStyle = state === 'good' ? '#d4900f' : state === 'bad' ? '#c0463a' : state === 'sel' ? '#e0a020' : '#8ec8d8';
  gctx.lineWidth = (state === 'idle' ? 2 : 3.5) * sc;
  gctx.stroke();
  gctx.font = `${30 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(icon, X(x), Y(y - 4));
  gctx.font = `700 ${12 * sc}px sans-serif`; gctx.fillStyle = '#1a5c7a';
  gctx.fillText(NUMS[num] || '', X(x), Y(y + 30 * sc));
}

function drawStage() {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  if (S.phase !== 'level' && S.phase !== 'resultLevel') return;
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  bgFill(X, Y, sc);

  const sup = SUPPORTS[S.levelIdx];
  const correctSet = new Set(sup.correct);
  const cx = 500, cy = 340;

  // 糸(中心→各スロット)
  S.slots.forEach(s => {
    let col = 'rgba(142,200,216,.5)', lw = 2.5;
    if (S.phase === 'resultLevel') {
      const isCorrectSlot = correctSet.has(s.key);
      const isSelected = S.lastSelected.has(s.key);
      if (isCorrectSlot && isSelected) { col = '#1a5c7a'; lw = 5; }
      else if (isCorrectSlot && !isSelected) { col = '#c0463a'; lw = 3.5; }
      else if (!isCorrectSlot && isSelected) { col = '#c0463a'; lw = 3.5; }
    } else if (S.selected.has(s.key)) {
      col = '#e0a020'; lw = 4;
    }
    drawThread(X, Y, sc, cx, cy, s.x, s.y, col, lw);
  });

  // スロット(目標アイコン)
  S.slots.forEach((s, i) => {
    let state = 'idle';
    if (S.phase === 'resultLevel') {
      const isCorrectSlot = correctSet.has(s.key);
      const isSelected = S.lastSelected.has(s.key);
      if (isCorrectSlot && isSelected) state = 'good';
      else if (isCorrectSlot || isSelected) state = 'bad';
    } else if (S.selected.has(s.key)) {
      state = 'sel';
    }
    drawSlotCircle(X, Y, sc, s.x, s.y, GOALS[s.key].icon, i, state);
  });

  // 中心：支援策アイコン
  gctx.beginPath(); gctx.arc(X(cx), Y(cy), 56 * sc, 0, TAU);
  gctx.fillStyle = '#fff'; gctx.fill();
  gctx.strokeStyle = '#1a5c7a'; gctx.lineWidth = 4 * sc; gctx.stroke();
  gctx.font = `${44 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(sup.icon, X(cx), Y(cy - 2));
  gctx.font = `700 ${16 * sc}px sans-serif`; gctx.fillStyle = '#0f2a3a';
  gctx.fillText(sup.name, X(cx), Y(cy + 84 * sc));

  gctx.font = `700 ${15 * sc}px sans-serif`; gctx.fillStyle = '#1a5c7a';
  gctx.fillText(`${NUMS[S.levelIdx]} つながる 目標を ぜんぶ えらぼう`, X(500), Y(30));
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 60); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 240;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#ffce54', '#ffe9a8', '#2f9ab8', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function stageBurst() {
  const r = $('stageWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 出題進行 ----------
function updateHud(){
  const shown = S.phase === 'result' ? SUPPORTS.length : S.levelIdx + 1;
  $('levelChip').textContent = `れべる ${shown}/${SUPPORTS.length}`;
}
function updateBestChip(){
  const b = getBest();
  $('bestChip').textContent = (b !== null) ? `ベスト ${fmtTime(b)}` : 'ベスト —';
}
function setResultMsg(html){ $('resultMsg').innerHTML = html; }
function setControls(list){
  const el = $('controls');
  el.innerHTML = '';
  list.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'ctl' + (b.cls ? ' ' + b.cls : '');
    btn.innerHTML = b.label;
    btn.disabled = !!b.dis;
    btn.onclick = () => { ac(); b.cb(); };
    el.appendChild(btn);
  });
}

function startLevel(idx){
  S.levelIdx = idx;
  const sup = SUPPORTS[idx];
  const dummyPool = shuffled(ALL_GOAL_KEYS.filter(k => !sup.correct.includes(k)));
  const dummies = dummyPool.slice(0, SLOT_COUNT - sup.correct.length);
  const keys = shuffled([...sup.correct, ...dummies]);
  const cx = 500, cy = 340, r = 220;
  S.slots = keys.map((key, i) => {
    const a = -Math.PI / 2 + i * (TAU / keys.length);
    return { key, x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r };
  });
  S.selected = new Set();
  S.lastSelected = new Set();
  S.phase = 'level';
  updateHud();
  setResultMsg('つながる 目標を ぜんぶ えらんで「けってい！」を おそう。');
  refreshCtl();
}
function toggleSelect(key){
  sTap();
  if (S.selected.has(key)) S.selected.delete(key); else S.selected.add(key);
  refreshCtl();
}
function refreshCtl(){
  const list = S.slots.map((s, i) => ({
    label: `${NUMS[i]} ${GOALS[s.key].icon} ${GOALS[s.key].num}`,
    cls: 'pos' + (S.selected.has(s.key) ? ' sel' : ''),
    cb: () => toggleSelect(s.key),
  }));
  list.push({ label: '✅ これで けってい！', cls: 'go', cb: onConfirm });
  setControls(list);
}
function onConfirm(){
  const sup = SUPPORTS[S.levelIdx];
  const correctSet = new Set(sup.correct);
  const sel = S.selected;
  const ok = sel.size === correctSet.size && [...sel].every(k => correctSet.has(k));
  S.lastSelected = new Set(sel);
  S.phase = 'resultLevel';
  setControls([]);
  if (ok) {
    sYes(); stageBurst();
    setResultMsg(`✨ ${sup.name} は ${correctSet.size}この 目標に つながっていた！`);
    setTimeout(() => {
      if (S.levelIdx >= SUPPORTS.length - 1) onAllClear();
      else startLevel(S.levelIdx + 1);
    }, 1700);
  } else {
    sHmm();
    let hint;
    if (sel.size > correctSet.size) hint = 'ちがう ものが まざっているみたい。';
    else if (sel.size < correctSet.size) hint = 'まだ たりないよ、もう少し 見つけてみよう。';
    else hint = 'おしい！ ちがう ものが まざっているよ。';
    setResultMsg(`もういちど かんがえてみよう。${hint}`);
    setTimeout(() => {
      S.selected = new Set();
      S.phase = 'level';
      setResultMsg('つながる 目標を ぜんぶ えらんで「けってい！」を おそう。');
      refreshCtl();
    }, 1800);
  }
}

function rankText(ms){
  const s = ms / 1000;
  if (s <= 40) return '👑 パーフェクト！すごい かんかく！';
  if (s <= 70) return '🌟🌟🌟 すごい！つながりが よく わかったね！';
  if (s <= 110) return '🌟🌟 いいちょうし！';
  return '🌟 ぜんぶ むすべたね！';
}
function startGame(){
  S.gameStartAt = performance.now();
  startLevel(0);
}
function onAllClear(){
  S.phase = 'result';
  setControls([]);
  sFanfare();
  S.gameEndAt = performance.now();
  const totalMs = S.gameEndAt - S.gameStartAt;
  const best = getBest();
  const isNewBest = (best === null) || (totalMs < best);
  if (isNewBest) setBest(totalMs);
  $('resultTime').textContent = fmtTime(totalMs);
  $('resultRank').textContent = rankText(totalMs);
  $('resultBestMsg').textContent = isNewBest
    ? '🎉 じぶんの ベストタイム こうしん！'
    : `ベストタイム：${fmtTime(best)}`;
  $('starListEl').innerHTML = SUPPORTS.map((s, i) => `<span class="starChip">${NUMS[i]} ${s.icon} むすべた</span>`).join('');
  updateHud();
  showOverlay('resultOverlay');
  updateBestChip();
}

// ---------- オーバーレイ ----------
function showOverlay(id){ $(id).classList.remove('hide'); }
function hideOverlay(id){ $(id).classList.add('hide'); }

$('btnStart').addEventListener('click', () => {
  ac();
  hideOverlay('titleOverlay');
  startGame();
  updateBestChip();
});
$('btnRetry').addEventListener('click', () => {
  hideOverlay('resultOverlay');
  showOverlay('titleOverlay');
  updateBestChip();
});

// ---------- 起動 ----------
function boot(){
  if (!isUnlocked()) {
    S.phase = 'lock';
    showOverlay('lockOverlay');
    return;
  }
  showOverlay('titleOverlay');
  updateBestChip();
  const best = getBest();
  if (best !== null) {
    $('bestInfo').style.display = 'block';
    $('bestInfo').innerHTML = `<p>いまの ベストタイム：<b>${fmtTime(best)}</b></p>`;
  }
}

// ---------- ループ ----------
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  drawStage();
  drawFx(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
boot();
</script>
