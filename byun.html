<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ビュンの原っぱ — 風とゴムの力の働き（小3理科・力学分野3作目・協力型・1ファイル）
   くらしの中の風とゴムの力を発見しよう（発見型）→ 風の力で車を走らせよう（メイン操作・弱中強の3段階）→
   ゴムの力で車を走らせよう（メイン操作・①〜⑧の数値階段）→
   ゴールに車をとめよう（応用・推理クイズ）→ はかせ（風とゴムの力とくらしの安全）。
   数値：学習指導要領・小3理科「風とゴムの力の働き」＝風やゴムの力は物を動かすことができ、
   力の大きさを変えると物の動く様子も変わる（お茶の水女子大学 理科教材データベースでWebSearch裏取り済み）。
   ゴムの伸びと車の進む距離は、福井県学力調査(SASA2020)の実測データ
   （輪ゴムをのばした長さ4cm/8cm/12cmで車の動いた距離を3回ずつ実測：4cm→約2.5m、8cm→約5.5m、12cm→約9.5m）
   に厳密に一致する2次関数 distance(x) = 0.03125x^2 + 0.375x + 0.5 を導出して使用。
   風の力は具体的な距離の実測データが環境依存で標準値がないため、数値を捏造せず
   「近い／中くらい／遠い」ゾーンの定性的表現にとどめている。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
const plain = s => s.replace(/<[^>]+>/g, '');
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {
  seirei: ruby('精霊', 'せいれい'),
  kyori: ruby('距離', 'きょり'),
  jikken: ruby('実験', 'じっけん'),
};
// canvas専用のプレーン文字列（W.xxxはルビ入りHTML文字列なのでplain()を通しても
// タグが消えるだけで<rt>内の読みは残り「距離きょり」のように連結表示されてしまう。
// canvasのfillTextに渡す時は必ずこの安全なプレーン文字列を使う）
const N_KYORI = 'きょり';

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 数値データ（本物度） ----------
// m_kizuki：くらしの中の風とゴムの力を発見しよう（発見型）

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));
const sZoom = () => { tone(240, 0, 0.28, 'sawtooth', 0.05); tone(340, 0.05, 0.22, 'sawtooth', 0.04); };

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#eef9e0'); g.addColorStop(1, '#d3ecb0');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
}

// ---------- カード描画（発見型ミッション共通） ----------
function drawCardGrid(X, Y, sc, cards, foundSet, cols, title) {
  bgFill(X, Y, sc);
  const xs3 = [220, 500, 780];
  const xs4 = [180, 380, 620, 820];
  const xs2 = [340, 660];
  cards.forEach((c, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const px = cols === 3 ? xs3[col] : cols === 2 ? xs2[col] : xs4[col];
    const py = row === 0 ? 250 : 440;
    const done = foundSet.has(c.key);
    gctx.beginPath(); gctx.arc(X(px), Y(py), 46 * sc, 0, TAU);
    gctx.fillStyle = done ? '#4a9e3f' : '#d9edb0';
    gctx.fill(); gctx.strokeStyle = '#4a9e3f'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(c.icon, X(px), Y(py - 2));
    gctx.fillStyle = '#2d4a1f'; gctx.font = `700 ${13 * sc}px sans-serif`;
    gctx.fillText((c.num || c.letter) + ' ' + plain(c.name), X(px), Y(py + 62));
  });
  gctx.fillStyle = '#2d4a1f'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(title, X(500), Y(70));
}

// ---------- コース共通描画（風・ゴム・ゴールの主舞台） ----------
const COURSE_L = 120, COURSE_R = 900, COURSE_Y = 430, MAX_M = 10;
function drawCourseBase(X, Y, sc, opts) {
  // 地面
  gctx.fillStyle = '#c9e6a0';
  gctx.fillRect(X(0), Y(COURSE_Y + 8), 1000 * sc, (COURSE_Y + 100) * sc - Y(COURSE_Y + 8) + Y(0) * 0);
  gctx.fillRect(X(0), Y(COURSE_Y + 8), 1000 * sc, 200 * sc);
  // コースライン
  gctx.strokeStyle = '#2d5016'; gctx.lineWidth = 3 * sc;
  gctx.beginPath(); gctx.moveTo(X(COURSE_L), Y(COURSE_Y)); gctx.lineTo(X(COURSE_R), Y(COURSE_Y)); gctx.stroke();
  // スタート
  gctx.fillStyle = '#2d5016'; gctx.font = `700 ${13 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('スタート', X(COURSE_L), Y(COURSE_Y + 34));
  gctx.beginPath(); gctx.moveTo(X(COURSE_L), Y(COURSE_Y - 46)); gctx.lineTo(X(COURSE_L), Y(COURSE_Y + 6)); gctx.stroke();

  if (opts && opts.showTicks) {
    gctx.fillStyle = '#4a7a35'; gctx.font = `${11 * sc}px sans-serif`;
    for (let m = 0; m <= MAX_M; m += 2) {
      const tx = COURSE_L + (COURSE_R - COURSE_L) * (m / MAX_M);
      gctx.strokeStyle = '#8bbf6a'; gctx.lineWidth = 1.6 * sc;
      gctx.beginPath(); gctx.moveTo(X(tx), Y(COURSE_Y - 6)); gctx.lineTo(X(tx), Y(COURSE_Y + 6)); gctx.stroke();
      gctx.fillText(m + 'm', X(tx), Y(COURSE_Y + 34));
    }
  } else if (opts && opts.zones) {
    const zoneX = [COURSE_L, COURSE_L + (COURSE_R - COURSE_L) * 0.38, COURSE_L + (COURSE_R - COURSE_L) * 0.68, COURSE_R];
    const zoneLabel = ['ちかい', 'まんなかくらい', 'とおい'];
    for (let i = 0; i < 3; i++) {
      gctx.fillStyle = '#4a7a35'; gctx.font = `${12 * sc}px sans-serif`;
      gctx.fillText(zoneLabel[i], X((zoneX[i] + zoneX[i + 1]) / 2), Y(COURSE_Y + 34));
    }
  }
}
function drawCar(X, Y, sc, mapX, y) {
  const cy = y || COURSE_Y;
  gctx.save();
  gctx.font = `${44 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';

}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'kizuki') drawKizukiScene(X, Y, sc);
  else if (S.scene === 'kaze') drawKazeScene(X, Y, sc);
  else if (S.scene === 'gomu') drawGomuScene(X, Y, sc);
  else if (S.scene === 'gooru') drawGooruScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- ビュンのはやさビューア（丸窓） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f8fff0'); grd.addColorStop(1, '#dcf0bd');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'wind') {
    drawWindLines(R, S.scope.level);
    label(S.scope.label || '');
  } else if (mode === 'stretch') {
    drawStretch(R, S.scope.ratio);
    label(S.scope.label || '');
  } else if (mode === 'point') {
    sctx.fillStyle = '#4a9e3f';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#a5d76e88'); g2.addColorStop(1, 'rgba(165,215,110,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#4a9e3f'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🍃', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#4a9e3f'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#2d4a1f';
    sctx.fillText(txt, R, ly);
  }

  function drawWindLines(R, level) {
    const cx = R * 0.36, cy = R;
    const n = clamp((level != null ? level : 0) + 1, 1, 3);
    sctx.strokeStyle = '#4a9e3f'; sctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const ly = cy + (i - (n - 1) / 2) * R * 0.28;
      sctx.lineWidth = R * 0.05;
      sctx.beginPath(); sctx.moveTo(cx, ly); sctx.lineTo(cx + R * 1.1, ly); sctx.stroke();
      sctx.beginPath();
      sctx.moveTo(cx + R * 1.1, ly);
      sctx.lineTo(cx + R * 0.96, ly - R * 0.09);
      sctx.moveTo(cx + R * 1.1, ly);
      sctx.lineTo(cx + R * 0.96, ly + R * 0.09);
      sctx.stroke();
    }
  }
  function drawStretch(R, ratio) {
    const cy = R, half = R * 0.62 * clamp(ratio, 0.15, 1);
    sctx.strokeStyle = '#4a9e3f'; sctx.lineWidth = R * 0.09; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(R - half, cy); sctx.lineTo(R + half, cy); sctx.stroke();
    sctx.fillStyle = '#2d5016';
    sctx.beginPath(); sctx.arc(R - half, cy, R * 0.07, 0, TAU); sctx.fill();
    sctx.beginPath(); sctx.arc(R + half, cy, R * 0.07, 0, TAU); sctx.fill();
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#4a9e3f', '#a5d76e', '#ff8a3d', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') {
    const b = document.querySelector('#btnRow .btn:not(.sub)') || document.querySelector('#panelBody .btn:not(.sub)');

});

const bubbleEl = $('bubble'), wishEl = $('wishCard'), btnRow = $('btnRow');
function say(html) {
  bubbleEl.style.animation = 'none'; void bubbleEl.offsetWidth;
  bubbleEl.style.animation = ''; bubbleEl.innerHTML = html;
}
function setWish(icon, html) {
  wishEl.style.display = 'flex';
  wishEl.querySelector('.icon').textContent = icon;
  wishEl.querySelector('.wbody').innerHTML = html;
}
function hideWish() { wishEl.style.display = 'none'; }
function setButtons(list) {
  btnRow.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.cls ? ' ' + b.cls : '');
    el.innerHTML = b.label;
    el.onclick = () => { sTap(); b.cb(el); };
    btnRow.appendChild(el);
  });
}
function award(id) {
  if (S.badges.has(id)) return;
  S.badges.add(id);
  $('bd_' + id).classList.add('on');
  if (typeof recordBadge === 'function') recordBadge(S.badges.size, document.querySelectorAll('#badges .badge').length);
}
const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }
const controlsEl = $('controls');
function setControls(list) {
  controlsEl.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'ctl' + (b.cls ? ' ' + b.cls : ''); el.innerHTML = b.label;
    el.disabled = !!b.disabled;
    el.onclick = () => { if (el.disabled) return; ac(); b.cb(el); };
    controlsEl.appendChild(el);
  });
}

      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['人に向けて飛ばさない', 'できるだけ遠くまで飛ばす', '大きい音を出す'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- ふりかえりタイム：4ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      hideOverlay();
      scopeBurst();
      say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
      setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ビュンの原っぱ みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>4つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 風の 力を 強くすると、車は（<span class="blankWord" data-a="遠く">？？？</span>）まで 進む。<br>
        ② ゴムを（<span class="blankWord" data-a="長く">？？？</span>）のばすほど、車は 遠くまで 進む。<br>
        ③ ゴムを 2倍 のばすと、進む 距離は（<span class="blankWord" data-a="2倍より大きく">？？？</span>）なる。<br>
        ④ わゴムでっぽうは（<span class="blankWord" data-a="人に向けない">？？？</span>）ように 気をつけて あそぶ。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 2倍よりもっと遠くまで進む</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>①わゴムを のばして はなし、もどる 力を 手で かんじてみよう（人に 向けないでね）。<br>②うちわや せんぷうきの 風を 紙ひこうきに 当てて、強さを 変えると 飛び方が どう 変わるか ためしてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#4a9e3f'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「風を強くすると車の進み方は？」「ゴムを長くのばすとどうなる？」「わゴムでっぽうで遊ぶ時に気をつけることは？」`);
      setButtons([
        { label: '🎐 くらしの例の図', cls: 'sub', cb: () => this.show('kizuki') },
        { label: '💨 風の実験の図', cls: 'sub', cb: () => this.show('kaze') },
        { label: '🏹 ゴムの実験の図', cls: 'sub', cb: () => this.show('gomu') },
        { label: '🚩 ゴールゲームの図', cls: 'sub', cb: () => this.show('gooru') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_gomu などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
