<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ウズの実験室 — 電磁石のひみつ（小5理科・協力型・1ファイル）
   電磁石の正体（電流が流れている間だけ磁石になる）→
   極を調べる（電流の向きで極が入れかわる）→
   巻き数で強さを試す（①〜⑧の数値階段シミュレーション、目標クリップ数）→
   電流の大きさ（かん電池1こ/2こ直列）→
   はかせ（身のまわりの電磁石利用）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  denjishaku: ruby('電磁石', 'でんじしゃく'),
  denryuu: ruby('電流', 'でんりゅう'),
  makisuu: ruby('巻', 'ま') + 'き' + ruby('数', 'すう'),
  tesshin: ruby('鉄', 'てっ') + 'しん',
  kyoku: ruby('極', 'きょく'),
  eikyuu: ruby('永久磁石', 'えいきゅうじしゃく'),
  houi: ruby('方位磁針', 'ほういじしん'),
  chokuretsu: ruby('直列', 'ちょくれつ'),
  kandenchi: 'かん' + ruby('電池', 'でんち'),
};

const NUMS = '①②③④⑤⑥⑦⑧';
const MAKI_TURNS = [25, 50, 75, 100, 125, 150, 175, 200];
const MAKI_CLIPS = [1, 2, 3, 4, 5, 6, 7, 8];
const MAKI_TARGET = 6;

// ---------- 身のまわりの電磁石 ----------
const HAKASE_POINTS = [
  { key: 0, letter: 'あ', name: 'モーター', txt: `せんぷう機や せんたく機の 中では、モーターが 電磁石と ${W.eikyuu}の 間で 引き合ったり しりぞけ合ったり する 力を 使って 回転している。` },

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));
const sBuzz = () => { tone(140, 0, 0.35, 'sawtooth', 0.05); tone(180, 0.08, 0.3, 'sawtooth', 0.04); };
const sPlop = () => { tone(220, 0, 0.12, 'sine', 0.1); tone(180, 0.06, 0.15, 'sine', 0.08); };

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#232c40'); g.addColorStop(1, '#1a2130');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.fillStyle = '#1c2436';
  gctx.fillRect(X(0), Y(520), 1000 * sc, 120 * sc);
}

// ---------- コイル（電磁石本体）の共通描画 ----------
function drawCoil(X, Y, sc, cx, topY, botY, glowT, nCoilsHint) {
  const halfW = 40, coreW = 20;
  // 鉄しん
  gctx.fillStyle = '#8a8f92'; gctx.strokeStyle = '#4a4f52'; gctx.lineWidth = 1.6 * sc;
  roundRect(gctx, X(cx - coreW / 2), Y(topY), coreW * sc, (botY - topY) * sc, 4 * sc);
  gctx.fill(); gctx.stroke();
  // コイル（どう線）
  const n = nCoilsHint || 8;
  gctx.strokeStyle = '#e0954a'; gctx.lineWidth = 4 * sc; gctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const yy = topY + (botY - topY) * (i + 0.5) / n;
    gctx.beginPath();
    gctx.ellipse(X(cx), Y(yy), halfW * sc, 7 * sc, 0, 0, TAU);
    gctx.stroke();
  }
  // 電流の光（回路オン時）
  if (glowT > 0.02) {
    gctx.save();
    gctx.globalAlpha = glowT;
    gctx.shadowColor = '#4fc3f7'; gctx.shadowBlur = 18 * sc;
    gctx.strokeStyle = '#4fc3f7'; gctx.lineWidth = 3 * sc;
    for (let i = 0; i < n; i++) {
      const yy = topY + (botY - topY) * (i + 0.5) / n;
      gctx.beginPath();
      gctx.ellipse(X(cx), Y(yy), halfW * sc, 7 * sc, 0, 0, TAU * glowT);
      gctx.stroke();
    }
    gctx.restore();
  }
  return { halfW, coreW };
}
function drawClipPile(X, Y, sc, cx, y, n) {
  gctx.strokeStyle = '#dfe4ea'; gctx.lineWidth = 2.2 * sc; gctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const cxx = cx + ((i % 5) - 2) * 18, cyy = y + Math.floor(i / 5) * 18;
    gctx.save();
    gctx.translate(X(cxx), Y(cyy));
    // 実際のゼムクリップに近い、細長い二重ループの形
    gctx.beginPath();
    gctx.moveTo(-3 * sc, -8 * sc);
    gctx.lineTo(3 * sc, -8 * sc);
    gctx.arc(3 * sc, -4 * sc, 4 * sc, -Math.PI / 2, Math.PI / 2, false);
    gctx.lineTo(-5 * sc, 0);
    gctx.arc(-5 * sc, 4 * sc, 4 * sc, Math.PI, Math.PI * 2.5, false);
    gctx.lineTo(1 * sc, 9 * sc);
    gctx.stroke();
    gctx.restore();
  }
}
function drawBattery(X, Y, sc, cx, cy, count) {
  const bw = 46, bh = 22;
  for (let i = 0; i < count; i++) {
    const bx = cx + (i - (count - 1) / 2) * (bw + 10);
    gctx.fillStyle = '#3a4560'; gctx.strokeStyle = '#8fb8e8'; gctx.lineWidth = 2 * sc;
    roundRect(gctx, X(bx - bw / 2), Y(cy - bh / 2), bw * sc, bh * sc, 5 * sc);
    gctx.fill(); gctx.stroke();
    gctx.fillStyle = '#ffe9a8'; gctx.fillRect(X(bx + bw / 2 - 2), Y(cy - bh * 0.22), 5 * sc, bh * 0.44 * sc);
    gctx.fillStyle = '#cfe0f5'; gctx.font = `700 ${13 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText('＋ −', X(bx), Y(cy));
  }
}
function drawCompass(X, Y, sc, cx, cy, angle) {
  gctx.fillStyle = '#fdfbf4'; gctx.strokeStyle = '#163044'; gctx.lineWidth = 2 * sc;
  gctx.beginPath(); gctx.arc(X(cx), Y(cy), 22 * sc, 0, TAU); gctx.fill(); gctx.stroke();
  gctx.save();
  gctx.translate(X(cx), Y(cy)); gctx.rotate(angle);
  gctx.fillStyle = '#c1442e';
  gctx.beginPath(); gctx.moveTo(0, -18 * sc); gctx.lineTo(5 * sc, 0); gctx.lineTo(-5 * sc, 0); gctx.closePath(); gctx.fill();
  gctx.fillStyle = '#3a4560';
  gctx.beginPath(); gctx.moveTo(0, 18 * sc); gctx.lineTo(5 * sc, 0); gctx.lineTo(-5 * sc, 0); gctx.closePath(); gctx.fill();
  gctx.restore();
}

const HAKASE_ICON = ['🌀', '🔊', '🏗️', '🚄'];

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'kiso') drawKisoScene(X, Y, sc);
  else if (S.scene === 'kyoku') drawKyokuScene(X, Y, sc);
  else if (S.scene === 'makisuu') drawMakisuuScene(X, Y, sc);
  else if (S.scene === 'denryu') drawDenryuScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- ウズめがね（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#2c3752'); grd.addColorStop(1, '#171d29');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#ffb066';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'gauge') {
    const idx = clamp((S.makiLevel || 1) - 1, 0, 7);
    const clips = MAKI_CLIPS[idx];
    const ok = clips >= MAKI_TARGET;
    const cx = R, cy = R * 1.05, rad = R * 0.72;
    sctx.strokeStyle = '#3a4560'; sctx.lineWidth = R * 0.13; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, 0); sctx.stroke();
    const frac = clamp(clips / 8, 0, 1);
    const ang = Math.PI - Math.PI * frac;
    sctx.strokeStyle = ok ? '#2f9a5a' : '#e0a020';
    sctx.lineWidth = R * 0.13;
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, ang, true); sctx.stroke();
    sctx.strokeStyle = '#eef2fa'; sctx.lineWidth = R * 0.045; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(cx + Math.cos(ang) * rad * 0.88, cy + Math.sin(ang) * rad * 0.88); sctx.stroke();
    sctx.fillStyle = '#eef2fa'; sctx.beginPath(); sctx.arc(cx, cy, R * 0.05, 0, TAU); sctx.fill();
    label(`クリップ ${clips}こ／目ひょう${MAKI_TARGET}こ`);
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#4fc3f733'); g2.addColorStop(1, 'rgba(79,195,247,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#ffb066'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🌀', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#ffb066'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(20,26,40,.85)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#eef2fa';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#ffb066', '#4fc3f7', '#ffe9a8', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ウズの実験室 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 電磁石は、${W.denryuu}を 止めると 磁力が（<span class="blankWord" data-a="なくなる">？？？</span>）。ふつうの 磁石（${W.eikyuu}）とは ちがう。<br>
        ② コイルの ${W.makisuu}を 増やすと、電磁石は（<span class="blankWord" data-a="強く">？？？</span>）なる。<br>
        ③ ${W.denryuu}の 向きを 変えると、電磁石の（<span class="blankWord" data-a="極">？？？</span>）が 入れかわる。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ ${W.denryuu}を 止めると 磁石でなくなる</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>おうちに ある 磁石（冷蔵庫の マグネットなど）を、方位磁針（スマホの 方位アプリでも 可）で N極・S極を 調べてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#c97a3d'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「電磁石は かん電池を 外すと どうなる？」「強くするには どうすればいい？」`);
      setButtons([
        { label: '⚡ 電磁石の正体の 図', cls: 'sub', cb: () => this.show('kiso') },
        { label: '🧭 極を調べるの 図', cls: 'sub', cb: () => this.show('kyoku') },
        { label: '🌀 巻き数の 図', cls: 'sub', cb: () => this.show('makisuu') },
        { label: '🏗️ 身のまわりの電磁石の 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_makisuu などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
