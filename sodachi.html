<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ソダチの学級園 — 植物の一生・ホウセンカ（小3理科・生命分野・優先度Cから選定・協力型・1ファイル）
   めが出るまで（発見型）→そだちの記録（メイン操作・数値階段①〜⑧、週送りで草丈と段階を可視化）→
   実がはじけるひみつ（発見型・驚き演出）→ホウセンカとヒマワリをくらべよう（応用推理）→
   はかせ（いのちのリレー、一年草と多年草、みぢかな野菜も同じじゅんばん、かんさつを続ける大切さ）。
   数値・事実：小学校学習指導要領・理科・第3学年B(1)「植物の育ち方」
   （種子から発芽し、成長して開花し、結実するという一連の過程を、複数の植物を育てて
    体のつくりや育ち方を比較しながら理解する）。
   ホウセンカ：種まき適期4〜5月、発芽適温15〜20℃、条件がそろえば5〜7日で発芽、
   本葉2〜3枚で間引き、開花6〜9月ごろ、実の中の種は約20個、実は触れると弾けて種が飛び散る
   （いずれもWebSearchで裏取り済み）。週ごとの草丈（0/2/5/15/25/30/35/40cm）は複数の栽培記録
   （種まきから約2か月で草丈40cm前後になる実例等）に基づくおおよその目安値であり、
   個体差があることを前提とした教育的モデル値（数値を捏造しない方針）。
   ヒマワリ（比較用）：種まき4〜6月、発芽適温20〜25℃、発芽まで1週間前後、開花から種が
   熟すまで約2か月、草丈は品種により30cm〜3m超（矮性〜ロシアヒマワリ、WebSearchで裏取り済み）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
const plain = s => s.replace(/<[^>]+>/g, '');
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

// W辞書はsay()/setWish()等のHTML文脈だけで使う（canvasのfillTextやscope.label/.name、
// データ配列の.name/.iconには一切渡さない。plain()はHTMLタグを消すだけで<rt>内の読みは

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));
const sZoom = () => { tone(240, 0, 0.28, 'sawtooth', 0.05); tone(340, 0.05, 0.22, 'sawtooth', 0.04); };

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#f4fbea'); g.addColorStop(1, '#cfe8a8');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
}

// ---------- カード描画（発見型ミッション共通） ----------
function drawCardGrid(X, Y, sc, cards, foundSet, cols, title) {
  bgFill(X, Y, sc);
  const xs3 = [220, 500, 780];
  const xs4 = [180, 380, 620, 820];
  const xs2 = [340, 660];
  cards.forEach((c, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const px = cols === 3 ? xs3[col] : cols === 2 ? xs2[col] : xs4[col];
    const py = row === 0 ? 250 : 440;
    const done = foundSet.has(c.key);
    gctx.beginPath(); gctx.arc(X(px), Y(py), 46 * sc, 0, TAU);
    gctx.fillStyle = done ? '#4f9d52' : '#bfe3a6';
    gctx.fill(); gctx.strokeStyle = '#4f9d52'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(c.icon, X(px), Y(py - 2));
    gctx.fillStyle = '#2b3d22'; gctx.font = `700 ${13 * sc}px sans-serif`;
    gctx.fillText((c.num || c.letter) + ' ' + plain(c.name), X(px), Y(py + 62));
  });
  gctx.fillStyle = '#2b3d22'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(title, X(500), Y(70));
}

function drawSeichouScene(X, Y, sc) {
  bgFill(X, Y, sc);
  const groundY = 520, potX = 500, rulerX = 220;
  gctx.strokeStyle = '#5f8a4c'; gctx.lineWidth = 2 * sc;
  gctx.beginPath(); gctx.moveTo(X(rulerX), Y(140)); gctx.lineTo(X(rulerX), Y(groundY)); gctx.stroke();
  for (let cm = 0; cm <= 40; cm += 10) {
    const ry = groundY - cm * 6.5;
    gctx.beginPath(); gctx.moveTo(X(rulerX - 8), Y(ry)); gctx.lineTo(X(rulerX + 8), Y(ry)); gctx.stroke();
    gctx.fillStyle = '#5f8a4c'; gctx.font = `${12 * sc}px sans-serif`; gctx.textAlign = 'right'; gctx.textBaseline = 'middle';
    gctx.fillText(cm + 'cm', X(rulerX - 12), Y(ry));
  }

  const idxNow = clamp(Math.round(S.seichouIdxDisplay), 0, 7);
  const v = clamp(S.seichouIdxDisplay, 0, 7);
  const heightCm = S.seichouIdx >= 0 ? lerpArr(SEICHOU_HEIGHT, v) : 0;
  const stemPx = heightCm * 6.5;
  const stemTopY = groundY - stemPx;

  gctx.fillStyle = '#a9784a';
  gctx.beginPath(); gctx.roundRect(X(potX - 70), Y(groundY), 140 * sc, 26 * sc, 6 * sc); gctx.fill();

  if (S.seichouIdx >= 0 && heightCm > 0) {
    gctx.strokeStyle = '#4f9d52'; gctx.lineWidth = 7 * sc; gctx.lineCap = 'round';
    gctx.beginPath(); gctx.moveTo(X(potX), Y(groundY)); gctx.lineTo(X(potX), Y(stemTopY)); gctx.stroke();
    if (idxNow >= 2) {
      const leafPairs = idxNow >= 4 ? 3 : idxNow >= 3 ? 2 : 1;
      for (let i = 0; i < leafPairs; i++) {
        const ly = groundY - stemPx * (0.35 + i * 0.22);
        gctx.fillStyle = '#6fb552';
        gctx.beginPath(); gctx.ellipse(X(potX - 26), Y(ly), 20 * sc, 10 * sc, -0.4, 0, TAU); gctx.fill();
        gctx.beginPath(); gctx.ellipse(X(potX + 26), Y(ly), 20 * sc, 10 * sc, 0.4, 0, TAU); gctx.fill();
      }
    }
    gctx.font = `${40 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(SEICHOU_ICON[idxNow], X(potX), Y(stemTopY - 26));
  } else {
    gctx.font = `${40 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText('🌰', X(potX), Y(groundY - 20));
  }

  gctx.fillStyle = '#2b3d22'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  const title = S.seichouIdx >= 0 ? `${SEICHOU_WEEK[idxNow]}　草たけ ${Math.round(heightCm)}cm` : 'たねをまいたよ。「つぎの週へ」をおしてみよう';
  gctx.fillText(title, X(500), Y(70));
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'hatsuga') drawHatsugaScene(X, Y, sc);
  else if (S.scene === 'seichou') drawSeichouScene(X, Y, sc);
  else if (S.scene === 'hajike') drawHajikeScene(X, Y, sc);
  else if (S.scene === 'kurabe') drawKurabeScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- ソダチの そだちビューア（丸窓） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f4fbea'); grd.addColorStop(1, '#cfe8a8');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#4f9d52';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'growth') {
    drawGrowthScope(R, S.scope.idx != null ? S.scope.idx : -1);
    label(S.scope.label || '');
  } else if (mode === 'seeds') {
    drawSeedsScope(R, S.scope.count || 0);
    label(S.scope.label || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#8cc87388'); g2.addColorStop(1, 'rgba(140,200,115,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#4f9d52'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🌱', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#4f9d52'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#2b3d22';
    sctx.fillText(txt, R, ly);
  }

  function drawGrowthScope(R, idxFloat) {
    const v = clamp(idxFloat, 0, 7);
    const idxNow = clamp(Math.round(v), 0, 7);
    const heightCm = idxFloat < 0 ? 0 : lerpArr(SEICHOU_HEIGHT, v);
    const baseY = R * 1.62;
    const stemPx = (heightCm / 40) * R * 0.9;
    sctx.fillStyle = '#a9784a';
    sctx.beginPath(); sctx.roundRect(R - R * 0.35, baseY, R * 0.7, R * 0.14, R * 0.04); sctx.fill();
    if (idxFloat >= 0 && heightCm > 0) {
      sctx.strokeStyle = '#4f9d52'; sctx.lineWidth = R * 0.05; sctx.lineCap = 'round';
      sctx.beginPath(); sctx.moveTo(R, baseY); sctx.lineTo(R, baseY - stemPx); sctx.stroke();
      if (idxNow >= 2) {
        const pairs = idxNow >= 4 ? 3 : idxNow >= 3 ? 2 : 1;
        for (let i = 0; i < pairs; i++) {
          const ly2 = baseY - stemPx * (0.35 + i * 0.22);
          sctx.fillStyle = '#6fb552';
          sctx.beginPath(); sctx.ellipse(R - R * 0.16, ly2, R * 0.15, R * 0.075, -0.4, 0, TAU); sctx.fill();
          sctx.beginPath(); sctx.ellipse(R + R * 0.16, ly2, R * 0.15, R * 0.075, 0.4, 0, TAU); sctx.fill();
        }
      }
      sctx.font = `${R * 0.32}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
      sctx.fillText(SEICHOU_ICON[idxNow], R, baseY - stemPx - R * 0.2);
    } else {
      sctx.font = `${R * 0.32}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
      sctx.fillText('🌰', R, baseY - R * 0.15);
    }
  }
  function drawSeedsScope(R, count) {
    const n = count || 0;
    sctx.fillStyle = '#8a6a3a';
    for (let i = 0; i < n; i++) {
      const ang = i * 2.399963;
      const rad = R * 0.72 * Math.sqrt(i / Math.max(1, n));
      const px = R + Math.cos(ang) * rad, py = R * 1.05 + Math.sin(ang) * rad * 0.85;
      sctx.beginPath(); sctx.arc(px, py, R * 0.045, 0, TAU); sctx.fill();
    }
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#4f9d52', '#86c96b', '#e0973a', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function stageBurst() {
  const r = $('stageWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height * 0.4, 110);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

  wishEl.querySelector('.wbody').innerHTML = html;
}
function hideWish() { wishEl.style.display = 'none'; }
function setButtons(list) {
  btnRow.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.cls ? ' ' + b.cls : '');
    el.innerHTML = b.label;
    el.onclick = () => { sTap(); b.cb(el); };
    btnRow.appendChild(el);
  });
}
function award(id) {
  if (S.badges.has(id)) return;
  S.badges.add(id);
  $('bd_' + id).classList.add('on');
  if (typeof recordBadge === 'function') recordBadge(S.badges.size, document.querySelectorAll('#badges .badge').length);
}
const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }
const controlsEl = $('controls');
function setControls(list) {
  controlsEl.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'ctl' + (b.cls ? ' ' + b.cls : ''); el.innerHTML = b.label;
    el.disabled = !!b.disabled;
    el.onclick = () => { if (el.disabled) return; ac(); b.cb(el); };
    controlsEl.appendChild(el);
  });
}
function updateLoc() {

  };
  $('stageTitle').textContent = titles[S.scene] || 'ソダチの学級園';
}

function choiceRow(opts, cb) {
  return opts.map((label, i) => ({ label, cls: 'choice', cb: el => cb(i, el) }));

function markPicked(el) {
  btnRow.querySelectorAll('.choice').forEach(b => b.classList.remove('picked'));

}

        <button class="btn" id="videoCloseBtn">とじる</button>
      `);
      $('videoCloseBtn').onclick = () => { sTap(); hideOverlay(); };
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ソダチの学級園 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>4つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① たねから めが出るまでには（<span class="blankWord" data-a="5日から7日">？？？</span>）くらい かかる。<br>
        ② たねまきから じゅんばんに そだち、さいごは（<span class="blankWord" data-a="つぼみ→はな→み">？？？</span>）に なる。<br>
        ③ 実が じゅくすと、（<span class="blankWord" data-a="はじけて">？？？</span>）たねが 遠くまで 飛び散る。<br>
        ④ じゅんばんは 同じでも、そだつ 速さや 大きさは（<span class="blankWord" data-a="しょくぶつによってちがう">？？？</span>）。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ</b> でした！ たね→め(子葉)→は(本葉)が ふえる→つぼみ→はな→み(たね) の じゅんばんで そだちましたね。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>①お家や 学校の まわりの 植物が、いま たね/め/葉/花/実の どの 段階か 見てみよう。②ミニトマトや アサガオなど、みぢかな 野菜や 花の たねを かんさつしてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#4f9d52'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「たねから めが出るまで何日？」「実がはじけるのはなぜ？」「ヒマワリとホウセンカ、何がちがう？」`);
      setButtons([
        { label: '🌱 めが出るまでの図', cls: 'sub', cb: () => this.show('hatsuga') },
        { label: '📏 そだちの記録の図', cls: 'sub', cb: () => this.show('seichou') },
        { label: '💥 実がはじける図', cls: 'sub', cb: () => this.show('hajike') },
        { label: '🌻 ホウセンカとヒマワリの図', cls: 'sub', cb: () => this.show('kurabe') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_seichou などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
