<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ハヤテの駅 — 高度経済成長と現代（小6社会・歴史・協力型・1ファイル）
   高度経済成長を知る（三種の神器・3C）→ 新幹線の速さ（数値階段・メイン
   操作）→ 情報化社会の広がり → はかせ（バブル経済・東日本大震災・令和）
   → 未来へ（歴史シリーズ全体の総括）。「ホナミの田」（戦後の民主化と
   復興）の続きにあたる、歴史シリーズ最終単元。原始〜現代までの時代の
   流れがこれで一本につながる。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  sanshu: ruby('三種の神器', 'さんしゅのじんぎ'),
  koudokeizai: ruby('高度経済成長', 'こうどけいざいせいちょう'),
  shinsanshu: ruby('新三種の神器', 'しんさんしゅのじんぎ'),
  tokyoorin: ruby('東京オリンピック', 'とうきょうおりんぴっく'),
  shinkansen: ruby('東海道新幹線', 'とうかいどうしんかんせん'),
  johoka: ruby('情報化社会', 'じょうほうかしゃかい'),
  bubble: ruby('バブル経済', 'ばぶるけいざい'),
  daishinsai: ruby('東日本大震災', 'ひがしにほんだいしんさい'),
  reiwa: ruby('令和', 'れいわ'),
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 高度経済成長を知る：手がかり ----------
const KEIKI_POINTS = [
  { key: 0, letter: 'あ', name: '三種の神器', x: 220, y: 260,
    txt: `白黒テレビ・洗濯機・冷蔵庫は ${W.sanshu}と 呼ばれ、多くの 家庭が あこがれたんだ。1956年ごろ、テレビは まだ 1.4%しか 家庭に なかったんだよ。` },
  { key: 1, letter: 'い', name: '高度経済成長', x: 500, y: 340,
    txt: `1950年代 後半から 1970年代 初めごろまで、日本は 毎年 平均10%前後もの、いちじるしい ${W.koudokeizai}を 続けたんだ。` },
  { key: 2, letter: 'う', name: '新三種の神器（3C）', x: 780, y: 260,
    txt: `1960年代 後半には、カラーテレビ・クーラー・車が 頭文字の Cから「3C」＝${W.shinsanshu}と 呼ばれ、新しい あこがれに なったんだよ。` },
];

// ---------- 新幹線の速さ：判定ロジック ----------
const SPEED_STEPS = [
  { n: 1, kmh: 80, txt: `在来線の 特急と あまり 変わらない 速さ。東京-大阪は 6時間以上 かかってしまうよ。` },
  { n: 2, kmh: 110, txt: `少し 早く なったけど、まだ 5時間くらい かかるね。` },
  { n: 3, kmh: 140, txt: `だんだん 近づいてきた。4時間半くらいかな。` },
  { n: 4, kmh: 170, txt: `もう少し！ 4時間 少しで 着けそうだよ。` },

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

function drawPoints(X, Y, sc, points, foundSet) {
  points.forEach(p => {

    gctx.beginPath(); gctx.arc(px, py, 24 * sc, 0, TAU);
    gctx.fillStyle = done ? '#1a5ca8' : '#fff';
    gctx.fill();
    gctx.strokeStyle = '#0e2f4a'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.fillStyle = done ? '#fff' : '#1a5ca8';
    gctx.font = `700 ${18 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(p.letter, px, py + 1 * sc);
  });
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'keiki') drawKeikiScene(X, Y, sc);
  else if (S.scene === 'shinkansen') drawShinkansenScene(X, Y, sc, S.speed.f);
  else if (S.scene === 'johoka') drawJohokaScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'mirai') drawMiraiScene(X, Y, sc);
  else if (S.scene === 'done') drawShinkansenScene(X, Y, sc, S.speed.f);
}

// ---------- はやてめがね（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f4fafd'); grd.addColorStop(1, '#e0472f');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#1a5ca8'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔎', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'speed') {
    sctx.font = `700 ${R * 0.24}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillStyle = '#1a5ca8';
    sctx.fillText(Math.round(S.speed.f) + 'km/h', R, R * 0.78);
    label('新幹線の 最高時速');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffe082'); g2.addColorStop(1, 'rgba(216,201,138,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#1a5ca8'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🚦', R, R * 0.85);
    label('たしかめ かんりょう！');
  } else {
    sctx.fillStyle = '#1a5ca8'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔭', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.09}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#16324a';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#1a5ca8', '#ffe082', '#e0472f', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

      setButtons(KEIKI_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.keikiFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.keikiFound.size >= KEIKI_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.keikiFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      hideWish();
      say(`さいしょの よそうタイムを 思い出そう。「三種の神器」って どんな 道具だったのだろう？`);
      setButtons(choiceRow(['ア テレビ・洗濯機・冷蔵庫', 'イ 自動車・エアコン・パソコン', 'ウ 着物・下駄・ちょうちん'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 0) {
        sYes(); scopeBurst(); award('m_keiki'); S.phase = 'done';
        say(`せいかい！ ${W.sanshu}は 白黒テレビ・洗濯機・冷蔵庫。多くの 家庭が あこがれた「豊かさ」の しるしだったんだ。<br><br>💡 <b>たいせつポイント</b><br>1960年代 後半には、カラーテレビ・クーラー・車の「3C」に あこがれが 移っていったよ。`);
        setButtons([{ label: 'つぎへ（新幹線の 速さ）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア テレビ・洗濯機・冷蔵庫', 'イ 自動車・エアコン・パソコン', 'ウ 着物・下駄・ちょうちん'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- M2：新幹線の速さ（数値階段・メイン操作） ---
  m_shinkansen: {
    enter() {
      Object.assign(S, { scene: 'shinkansen', scope: { type: 'speed' }, speedN: 4, speedTries: new Set(), speed: { f: 80 } });
      updateLoc();
      setWish('🚄', `1964年、${W.tokyoorin}に あわせて ${W.shinkansen}が 開業した。オリンピック開会式の たった 9日前だったんだよ。最高時速 目もり ①〜⑧を えらんで、東京-大阪を どれくらいの 速さで 結べるか 試してみよう。`);
      say(`目もりを えらんで「新幹線を 走らせる」ボタンを おそう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      const list = [];
      for (let n = 1; n <= 8; n++) list.push({ label: NUMS[n - 1], cls: 'pos' + (S.speedN === n ? ' sel' : ''), cb: () => { S.speedN = n; this.refreshCtl(); } });
      list.push({ label: '🚄 新幹線を 走らせる', cb: () => this.run() });
      setControls(list);
    },
    run() {
      setControls([]);
      say(`最高時速 ${SPEED_STEPS[S.speedN - 1].kmh}kmで 走らせてみる……`);
      sClank();
      const info = SPEED_STEPS[S.speedN - 1];
      startTween(S.speed.f, info.kmh, 1.1, v => { S.speed.f = v; }, () => this.judge());
    },
    judge() {
      const r = judgeSpeed(S.speedN);
      S.speedTries.add(S.speedN);
      const info = SPEED_STEPS[S.speedN - 1];
      if (r === 'good') {
        sYes(); scopeBurst(); award('m_shinkansen'); S.phase = 'done';
        say(`✨ ${info.txt} ✨<br><br>💡 <b>たいせつポイント</b><br>世界初の 高速鉄道と して、${W.shinkansen}は 日本の 高度経済成長の シンボルに なったんだよ。`);
        setButtons([{ label: 'つぎへ（情報化社会）', cb: nextStep }]);
      } else {
        sHmm();
        say(`${info.txt}<br>もういちど 目もりを えらんで、試してみよう。`);
        this.refreshCtl();
      }
    },
  },

  // --- M3：情報化社会の広がり ---
  m_johoka: {
    enter() {
      Object.assign(S, { scene: 'johoka', scope: { type: 'idle' }, johokaFound: new Set() });
      updateLoc();
      hideWish();
      say(`💻 くらしは その後も 大きく 変わっていった。${W.johoka}の 広がりを 3つの 手がかりで 調べよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(JOHOKA_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.johokaFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.johokaFound.size >= JOHOKA_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.johokaFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      hideWish();
      say(`${W.johoka}の 広がりで、くらしは どう 変わったのだろう？`);
      setButtons(choiceRow(['ア だれでも すぐに 情報を 調べたり 発信したり できるように なった', 'イ 情報を 得る 手段は まったく 変わらなかった', 'ウ 手紙や 電話が 禁止された'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 0) {
        sYes(); scopeBurst(); award('m_johoka'); S.phase = 'done';
        say(`せいかい！ パソコン・インターネット・スマートフォン・SNSの 広がりで、だれもが 情報を 得たり 発信したり できるように なったんだ。<br><br>💡 <b>たいせつポイント</b><br>世界中の 人と すぐに つながれる、便利な 反面、使い方には 気をつけたいね。`);
        setButtons([{ label: 'つぎへ（はかせチャレンジ）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア だれでも すぐに 情報を 調べたり 発信したり できるように なった', 'イ 情報を 得る 手段は まったく 変わらなかった', 'ウ 手紙や 電話が 禁止された'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- はかせチャレンジ：現代の日本 ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' }, hakaseFound: new Set() });
      updateLoc();
      hideWish();
      say(`さいごは <b>はかせチャレンジ</b>！ 高度経済成長の あと、日本には どんな できごとが あったのだろう？ 2つの 手がかりを 調べよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HAKASE_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.hakaseFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.hakaseFound.size >= HAKASE_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.hakaseFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`これからの 日本や 世界を よりよく していくのは、だれだと 思う？`);
      setButtons(choiceRow(['ア 政治家だけ', 'イ わたしたち 一人ひとり', 'ウ 外国の 人だけ'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 1) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ ${W.bubble}の 好況と その後の 不景気、${W.daishinsai}のような 試練も 乗りこえながら、今の 日本が あるんだ。<br><br>💡 <b>たいせつポイント</b><br>そして これからを つくっていくのは、歴史を 学んだ わたしたち 一人ひとりなんだよ。`);
        setButtons([{ label: 'つぎへ（未来へ）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 政治家だけ', 'イ わたしたち 一人ひとり', 'ウ 外国の 人だけ'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- 未来へ（歴史シリーズ全体の総括） ---
  m_mirai: {
    enter() {
      Object.assign(S, { scene: 'mirai', scope: { type: 'glow' } });
      updateLoc();
      hideWish();
      say(`🌅 土器を 作り、田んぼを 耕し、武士が 世を 治め、鎖国から 開国し、戦争と 復興を 経て……長い 長い 歴史の 旅を、ここまで たしかめてきたね。`);
      setButtons([{ label: 'はかせに にんてい してもらう', cb: () => this.finish() }]);
    },
    finish() {
      sFanfare(); scopeBurst(); award('m_mirai'); S.phase = 'done';
      say(`これで、原始から 現代までの 歴史の 旅が、ぜんぶ つながったよ！ 🎉<br><br>この あとの 歴史を つくっていくのは、これを 学んだ きみたちだよ。`);
      setButtons([{ label: 'まとめへ すすむ', cb: nextStep }]);
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' }, speed: { f: 210 } });
      updateLoc();
      const votedRight = S.votePicked.has(0);
      showOverlay(`
        <h2>⭐ ハヤテの駅 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 1950年代 後半から 高い 経済成長が 続いた 時代を（<span class="blankWord" data-a="高度経済成長">？？？</span>）と いう。<br>
        ② 1964年、東京オリンピックに あわせて 開業した 高速鉄道を（<span class="blankWord" data-a="東海道新幹線">？？？</span>）と いう。<br>
        ③ インターネットや 携帯電話が 広がり、だれもが 情報を 得たり 発信したり できる 社会を（<span class="blankWord" data-a="情報化社会">？？？</span>）と いう。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>ア テレビ・洗濯機・冷蔵庫</b> でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🚄 <b>おうちミッション</b><br>おうちの人に「昔と 今で、くらしの 中で いちばん 変わったと 思う ことは 何？」と 聞いてみよう。家族の 思い出と いっしょに、変わってきた くらしを 想像してみてね。</p>
        <p class="talk">土器や 田んぼの 時代から、武士の 世、鎖国、戦争と 復興を 経て、今の わたしたちの くらしまで——長い 歴史の 旅が、これで ひとつに つながったよ。この あとの 歴史を つくっていくのは、きみたちだよ！</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#0e2f4a'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'shinkansen', scope: { type: 'glow' }, speed: { f: 210 } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 高度経済成長と 現代について、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「三種の神器って 何？」「新幹線は いつ できた？」`);
      setButtons([
        { label: '📺 高度経済成長の 図', cls: 'sub', cb: () => this.show('keiki') },
        { label: '🚄 新幹線の 図', cls: 'sub', cb: () => this.show('shinkansen') },
        { label: '💻 情報化社会の 図', cls: 'sub', cb: () => this.show('johoka') },
        { label: '📈 はかせの 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: '🌅 未来への 図', cls: 'sub', cb: () => this.show('mirai') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      if (scene === 'shinkansen') { S.speed.f = 210; }
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_shinkansen などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
