<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================

   流氷を知る（アムール川・海のめぐみ）→ 昔ながらの家の工夫（二重窓・風除室・断熱材）→
   雪から家を守るシミュレーション（屋根のかたむき）→ 今のくらし（ロードヒーティング・スタッドレスタイヤ・無落雪屋根）→
   はかせ（寒さをいかした産業）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  ryuhyou: ruby('流氷', 'りゅうひょう'),
  amuru: ruby('アムール川', 'あむーるがわ'),
  hyousou: ruby('氷藻', 'ひょうそう'),
  setsugan: ruby('接岸', 'せつがん'),
  nijuumado: ruby('二重窓', 'にじゅうまど'),
  fuujoshitsu: ruby('風除室', 'ふうじょしつ'),
  dannetsu: ruby('断熱材', 'だんねつざい'),
  muraku: ruby('無落雪屋根', 'むらくせつやね'),
  roadheat: 'ロードヒーティング',
  josetsusha: ruby('除雪車', 'じょせつしゃ'),
  supaiku: 'スパイクタイヤ',
  studless: 'スタッドレスタイヤ',
  funjin: ruby('粉じん公害', 'ふんじんこうがい'),
  rakunou: ruby('酪農', 'らくのう'),
  seinyuu: ruby('生乳', 'せいにゅう'),

}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;

  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

function drawSnowPileRoof(X, Y, sc, bx, baseY, angleDeg, snowFrac) {
  const halfW = 220;
  const rise = halfW * Math.tan(clamp(angleDeg, 0, 60) * Math.PI / 180);
  const peakY = baseY - 130 - Math.min(rise, 260);
  gctx.fillStyle = '#3a7a5a'; gctx.strokeStyle = '#163044'; gctx.lineWidth = 2.4 * sc;
  gctx.beginPath();
  gctx.moveTo(X(bx - halfW), Y(baseY - 130));
  gctx.lineTo(X(bx), Y(peakY));
  gctx.lineTo(X(bx + halfW), Y(baseY - 130));
  gctx.lineTo(X(bx + halfW - 45), Y(baseY - 118));
  gctx.lineTo(X(bx), Y(peakY + 24));
  gctx.lineTo(X(bx - halfW + 45), Y(baseY - 118));
  gctx.closePath(); gctx.fill(); gctx.stroke();

  const thick = 6 + clamp(snowFrac, 0, 1) * 26;
  if (thick > 6.5) {
    gctx.fillStyle = 'rgba(255,255,255,.92)';
    gctx.beginPath();
    gctx.moveTo(X(bx - halfW), Y(baseY - 130 - thick * 0.25));
    gctx.lineTo(X(bx), Y(peakY - thick * 0.6));
    gctx.lineTo(X(bx + halfW), Y(baseY - 130 - thick * 0.25));
    gctx.lineTo(X(bx + halfW - 45), Y(baseY - 118 - thick * 0.15));
    gctx.lineTo(X(bx), Y(peakY + 24 - thick * 0.4));
    gctx.lineTo(X(bx - halfW + 45), Y(baseY - 118 - thick * 0.15));
    gctx.closePath(); gctx.fill();
  }
  return { halfW, peakY };
}

  const midY = (peakY + (baseY - 130)) / 2;
  [-1, 1].forEach(dir => {
    const sx = lerp(bx + dir * halfW * 0.4, bx + dir * (halfW + 50), t);
    const sy = lerp(midY, baseY + 6, t);
    gctx.globalAlpha = clamp(1 - t * 0.2, 0.5, 1);
    gctx.fillStyle = '#fff'; gctx.strokeStyle = '#a8d8e8'; gctx.lineWidth = 1.4 * sc;
    gctx.beginPath(); gctx.ellipse(X(sx), Y(sy), 24 * sc * (1 - t * 0.25), 15 * sc * (1 - t * 0.25), 0, 0, TAU); gctx.fill(); gctx.stroke();

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'ryuhyo') drawRyuhyoScene(X, Y, sc);
  else if (S.scene === 'kufuu') drawKufuuScene(X, Y, sc);
  else if (S.scene === 'yane') drawYaneScene(X, Y, sc);
  else if (S.scene === 'ima') drawImaScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawYaneScene(X, Y, sc);
}

// ---------- リュウヒョウの めがね（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f5fbfd'); grd.addColorStop(1, '#a8d8e8');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#1f5c78'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'gauge') {
    const idx = clamp((S.yaneLevel || 1) - 1, 0, 7);
    const r = judgeYane(idx + 1);
    const cx = R, cy = R * 1.05, rad = R * 0.72;
    sctx.strokeStyle = '#dfeef2'; sctx.lineWidth = R * 0.13; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, 0); sctx.stroke();
    const frac = idx / 7;
    const ang = Math.PI - Math.PI * frac;
    sctx.strokeStyle = r.level === 'good' ? '#2f9a5a' : r.level === 'low' ? '#e0a020' : '#c1442e';
    sctx.lineWidth = R * 0.13;
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, ang, true); sctx.stroke();
    sctx.strokeStyle = '#163044'; sctx.lineWidth = R * 0.045; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(cx + Math.cos(ang) * rad * 0.88, cy + Math.sin(ang) * rad * 0.88); sctx.stroke();
    sctx.fillStyle = '#163044'; sctx.beginPath(); sctx.arc(cx, cy, R * 0.05, 0, TAU); sctx.fill();
    label(`かたむき ${NUMS[idx]}（約${ANGLE_DEG[idx]}°）`);
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#eafbff'); g2.addColorStop(1, 'rgba(234,251,255,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#1f5c78'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('❄️', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#1f5c78'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🏠', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#163044';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#1f5c78', '#ffe3a0', '#a8d8e8', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  if ((S.yaneResult === 'good' || S.yaneResult === 'high') && S.yaneAnimT >= 1) S.yaneDoneT = clamp((S.yaneDoneT || 0) + dt * 0.6, 0, 1);
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

    },
  },

  // --- M3：雪から家を守れ（メイン操作） ---
  m_yane: {
    enter() {
      Object.assign(S, { scene: 'yane', scope: { type: 'gauge' }, yaneLevel: 4, yaneTries: new Set(), yaneAnimT: 0, yaneDoneT: 0, yaneResult: null });
      updateLoc();
      setWish('❄️', `屋根の かたむきに よって、雪の つもり方は 変わる。目もり①〜⑧で かたむきを えらんで、雪を ふらせてみよう。`);
      say(`目もりを えらんで「雪を ふらせる」ボタンを おそう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      const list = [];
      for (let n = 1; n <= 8; n++) list.push({ label: NUMS[n - 1], cls: 'pos' + (S.yaneLevel === n ? ' sel' : ''), cb: () => { S.yaneLevel = n; this.refreshCtl(); } });
      list.push({ label: '❄️ 雪を ふらせる', cb: () => this.snow() });
      setControls(list);
    },
    snow() {
      setControls([]);
      S.yaneResult = null; S.yaneDoneT = 0;
      say(`目もり ${NUMS[S.yaneLevel - 1]}（約${ANGLE_DEG[S.yaneLevel - 1]}°の かたむき）に 雪が つもりはじめた……`);
      sWind();
      startTween(0, 1, 1.3, v => { S.yaneAnimT = v; }, () => this.judge());
    },
    judge() {
      const r = judgeYane(S.yaneLevel);
      S.yaneTries.add(S.yaneLevel);
      S.yaneResult = r.level;
      if (r.level === 'low') {
        sHmm();
        say(`かたむきが ほとんど なくて、屋根に 雪が どんどん つもってしまう……このままでは 重みで 心配だ。もっと かたむきを つけて 試してみよう。`);
        this.refreshCtl();
      } else if (r.level === 'good') {
        sYes(); scopeBurst(); award('m_yane'); S.phase = 'done';
        say(`✨ ちょうど よい かたむきで、雪が 自然に すべり落ちた！ ✨<br><br>💡 <b>たいせつポイント</b><br>屋根に かたむきを つけると、つもった 雪が 自分の 重さで すべり落ちる。雪おろしの 手間が へって、家も 守られるんだ。`);
        setButtons([{ label: 'つぎへ（今のくらし）', cb: nextStep }]);
      } else {
        sClank();
        say(`急すぎる かたむきで、大量の 雪が 一気に 落ちてしまった……落雪事故の 心配が あるね。もう少し ゆるやかな かたむきで 試してみよう。`);
        this.refreshCtl();
      }
    },
  },

  // --- M4：今の くらし ---
  m_ima: {
    enter() {
      Object.assign(S, { scene: 'ima', scope: { type: 'idle' }, imaFound: new Set() });
      updateLoc();
      hideWish();
      say(`今の 北海道の まちを 見てみると、雪や 寒さと つきあう 新しい 工夫が たくさん ある。3つの 手がかりを、下の ボタンを ぜんぶ おして 調べよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(IMA_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.imaFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.imaFound.size >= IMA_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.imaFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      hideWish();
      say(`なぜ 今は スパイクタイヤを 使わなくなったと 思う？`);
      setButtons(choiceRow(['ア 値段が 高くなったから', 'イ タイヤの ピンが 道路を けずり、粉じん公害を 引きおこしたから', 'ウ 雪が ふらなくなったから'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 1) {
        sYes(); scopeBurst(); award('m_ima'); S.phase = 'done';
        say(`せいかい！ 昔は ピンの ついた ${W.supaiku}が 使われていたが、ピンが 道路を けずって ${W.funjin}を 引きおこした。1990年に 法律が でき、今は ${W.studless}に かわったんだ。<br><br>💡 <b>たいせつポイント</b><br>${W.roadheat}や ${W.josetsusha}、${W.muraku}……どれも 雪や 寒さと じょうずに つきあうための 新しい 工夫なんだ。`);
        setButtons([{ label: 'つぎへ（はかせチャレンジ）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 値段が 高くなったから', 'イ タイヤの ピンが 道路を けずり、粉じん公害を 引きおこしたから', 'ウ 雪が ふらなくなったから'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- はかせチャレンジ：寒さをいかした産業 ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' }, hakaseFound: new Set() });
      updateLoc();
      hideWish();
      say(`さいごは <b>はかせチャレンジ</b>！ 寒さの きびしい 気候は、こまることばかりでは ない。北海道ならではの 産業を 3つ、しょうかいしよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HAKASE_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.hakaseFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.hakaseFound.size >= HAKASE_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.hakaseFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`寒い 気候は、北海道の くらしに とって どんな 意味が あるだろう？`);
      setButtons(choiceRow(['ア こまった ことしか ない', 'イ 寒さや 雪を 生かした 産業や 楽しみ方が たくさん 生まれている', 'ウ 何も 関係ない'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 1) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ ${W.rakunou}は 生乳生産量 日本一、${W.jagaimo}や ${W.tensai}は 北海道が 大きな 産地、そして ${W.ryuhyou}観光も 冬ならではの 楽しみ。<br><br>💡 <b>たいせつポイント</b><br>寒さと 向き合いながら、その 気候を うまく 生かす……それが 北海道の くらしの 知恵なんだ。`);
        setButtons([{ label: 'ふりかえりタイムへ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア こまった ことしか ない', 'イ 寒さや 雪を 生かした 産業や 楽しみ方が たくさん 生まれている', 'ウ 何も 関係ない'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- ふりかえりタイム：5ミッションを1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      if (slide.video) {
        const videoUrl = `https://www.youtube.com/watch?v=${slide.video}`;
        showOverlay(`
          <h2>${slide.icon} ふりかえりタイム（${n}/${total}）${slide.title}</h2>
          <div id="furikaeriThumb" style="max-width:380px;margin:0 auto;cursor:pointer">
            <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
              <img src="https://img.youtube.com/vi/${slide.video}/hqdefault.jpg" style="width:100%;display:block;opacity:.85">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <div style="width:15%;aspect-ratio:1;min-width:56px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(24px,3vw,34px)">▶</div>
              </div>
            </div>
            <div style="margin-top:.5em;color:#1f5c78;font-size:clamp(12px,1.3vw,16px)">タップすると 新しい タブで 動画が ひらくよ</div>
          </div>
          <p class="talk">${slide.text()}</p>
          <button class="btn" id="furikaeriNextBtn">${isLast ? 'まとめへ すすむ' : 'つぎへ'}</button>
          <div class="foot">先生へ：動画は外部サイト(YouTube)の発信元です。内容を事前にご確認ください。URL: ${videoUrl}</div>
        `);
        $('furikaeriThumb').onclick = () => { sTap(); window.open(videoUrl, '_blank', 'noopener'); };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' }, yaneLevel: 5, yaneAnimT: 1, yaneResult: 'good' });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ リュウヒョウの岸 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 流氷は、ロシアと 中国の 国境を 流れる 大きな川「（<span class="blankWord" data-a="アムール川">？？？</span>）」から やってくる。<br>
        ② まどを 二重に するのは、空気の層で 冷たい 外の空気を（<span class="blankWord" data-a="ふせぐ">？？？</span>）ため。<br>
        ③ 昔 使われていた スパイクタイヤは、ピンが 道路を けずり（<span class="blankWord" data-a="粉じん公害">？？？</span>）を 引きおこした。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 流氷が 運ぶ 栄養で、逆に 海が 豊かになる</b> でした！ 流氷が とけると 鉄分や 栄養が 海に とけ出して、${W.hyousou}が ふえ、それを 食べる 魚たちが 集まる 豊かな 海に なるんだよ。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">❄️ <b>おうちミッション</b><br>おうちの 窓が 1まいガラスか、2まい（ペアガラス）かを、おうちの人と いっしょに しらべてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#0d2536'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'yane', scope: { type: 'glow' }, yaneLevel: 5, yaneAnimT: 1, yaneResult: 'good' });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 北海道の くらしについて、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「流氷は どこから 来る？」「まどは なぜ 二重？」`);
      setButtons([
        { label: '🧊 流氷の 図', cls: 'sub', cb: () => this.show('ryuhyo') },
        { label: '🏠 家の 工夫の 図', cls: 'sub', cb: () => this.show('kufuu') },
        { label: '🚜 今の くらしの 図', cls: 'sub', cb: () => this.show('ima') },
        { label: '🐄 産業の 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_yane などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);

</script>
</body>
</html>
