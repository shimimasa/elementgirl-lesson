<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'taisen') drawTaisenScene(X, Y, sc);
  else if (S.scene === 'kome') drawKomeScene(X, Y, sc, S.kome.f);
  else if (S.scene === 'seito') drawSeitoScene(X, Y, sc);
  else if (S.scene === 'fusen') drawFusenScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawKomeScene(X, Y, sc, S.kome.f);
}

// ---------- たわらめがね（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fff8e6'); grd.addColorStop(1, '#c9a227');

  const mode = S.scope.type;

    sctx.fillStyle = '#7a2a3a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔎', R, R * 0.85);

  } else if (mode === 'price') {
    sctx.font = `700 ${R * 0.26}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillStyle = '#7a2a3a';
    sctx.fillText(S.kome.f.toFixed(1) + '倍', R, R * 0.78);
    label('米の 値段（1916年比）');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#e8c860'); g2.addColorStop(1, 'rgba(216,201,138,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#7a2a3a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🚦', R, R * 0.85);
    label('たしかめ かんりょう！');
  } else {
    sctx.fillStyle = '#7a2a3a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔭', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.09}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#3a2018';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#7a2a3a', '#e8c860', '#c9a227', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

}

const STEPS = {
  intro: {
    enter() {
      Object.assign(S, { scene: 'taisen', scope: { type: 'idle' }, taisenFound: new Set() });
      say('……');
      setButtons([]);
      showOverlay(`
        <div class="phasesStrip">⚓🌾🏛️</div>
        <h1>タワラの辻</h1>
        <div class="sub">〜 大正デモクラシーの ひみつ 〜</div>
        <p class="talk">ようこそ！ わたしは 米俵から 生まれた 精霊、<b>タワラ</b>。大正時代、民衆の 声が 政治を 動かしていった 時代を、<b>いっしょに たしかめに いこう！</b><br>
        戦争・米騒動・選挙……いろいろな できごとが 待っているよ。</p>
        <button class="btn" id="startBtn">辻を たしかめに 出かける！</button>
        <div class="foot">先生へ：F11キーで全画面表示になります。操作は画面のボタンとタッチです。</div>
      `);
      $('startBtn').onclick = () => { ac(); sTap(); nextStep(); };
    },
  },

  vote: {
    enter() {
      showOverlay(`
        <h2>🤔 よそうタイム</h2>
        <p class="talk">${VOTE_TXT}</p>
        <div class="voteCards">
          <div class="vcard" data-v="0"><span class="vicon">👨</span>${VOTE_OPTS[0]}</div>
          <div class="vcard" data-v="1"><span class="vicon">👥</span>${VOTE_OPTS[1]}</div>
          <div class="vcard" data-v="2"><span class="vicon">💰</span>${VOTE_OPTS[2]}</div>
        </div>
        <div class="sub">思う ものに タッチ。きろくシートにも 〇を つけてね。</div>
        <button class="btn" id="voteGo">よし、たしかめよう！</button>
      `);
      panelEl.querySelectorAll('.vcard').forEach(c => {
        c.onclick = () => { sTap(); panelEl.querySelectorAll('.vcard').forEach(x => x.classList.remove('picked')); c.classList.add('picked');
          S.votePicked = new Set([+c.dataset.v]);
        };
      });
      $('voteGo').onclick = () => { sTap(); nextStep(); };
    },
  },

  // --- M1：第一次世界大戦と日本 ---
  m_taisen: {
    enter() {
      Object.assign(S, { scene: 'taisen', scope: { type: 'idle' }, taisenFound: new Set() });
      updateLoc();
      hideWish();
      say(`⚓ 1914年、${W.daisen}が 始まった。日本は どう かかわったのだろう？ 3つの 手がかりを 調べて たしかめよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(TAISEN_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.taisenFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.taisenFound.size >= TAISEN_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.taisenFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      hideWish();
      say(`日本が ${W.daisenkeiki}で 好景気に なったのは なぜだろう？`);
      setButtons(choiceRow(['ア 戦場の ヨーロッパへの 輸出が 急増したから', 'イ 米が たくさん とれたから', 'ウ 外国から 観光客が 増えたから'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 0) {
        sYes(); scopeBurst(); award('m_taisen'); S.phase = 'done';
        say(`せいかい！ 戦場から 遠かった 日本は、戦争で 生産が 落ちこんだ ヨーロッパへの 輸出を 急増させ、${W.daisenkeiki}に わいたんだ。<br><br>💡 <b>たいせつポイント</b><br>ただし この 好景気が、この あとの 米の 値上がりにも つながっていくよ。`);
        setButtons([{ label: 'つぎへ（米騒動）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 戦場の ヨーロッパへの 輸出が 急増したから', 'イ 米が たくさん とれたから', 'ウ 外国から 観光客が 増えたから'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- M2：米騒動（時間送り型・メイン操作） ---
  m_kome: {
    enter() {
      Object.assign(S, { scene: 'kome', scope: { type: 'price' }, komeN: 1, kome: { f: 1.0 } });
      updateLoc();
      setWish('🌾', `${W.shiberia}の うわさで、米商人が 米を 買いしめ始めた。「次の 月へ すすめる」ボタンを おして、米の 値段が どう 変わっていくか たしかめよう。`);
      say(KOME_STEPS[0].txt);
      this.refreshCtl();
    },
    refreshCtl() {
      if (S.komeN >= KOME_STEPS.length) {
        setControls([]);
        return;
      }
      setControls([{ label: '📅 次の 月へ すすめる', cb: () => this.advance() }]);
    },
    advance() {
      setControls([]);
      const info = KOME_STEPS[S.komeN];
      S.komeN += 1;
      sClank();
      startTween(S.kome.f, info.price, 0.9, v => { S.kome.f = v; }, () => this.reveal(info));
    },
    reveal(info) {
      scopeBurst();
      say(info.txt);
      if (S.komeN >= KOME_STEPS.length) {
        sYes(); award('m_kome'); S.phase = 'done';
        say(`${info.txt}<br><br>💡 <b>たいせつポイント</b><br>1916〜1918年の 2年間で、米の 値段は およそ 3倍に なったんだよ。`);
        setButtons([{ label: 'つぎへ（政党内閣と 普通選挙法）', cb: nextStep }]);
      } else {
        this.refreshCtl();
      }
    },
  },

  // --- M3：原敬内閣 ---
  m_seito: {
    enter() {
      Object.assign(S, { scene: 'seito', scope: { type: 'idle' }, seitoFound: new Set() });
      updateLoc();
      hideWish();
      say(`🏛️ ${W.komesoudou}の あと、政治の しくみも 変わっていった。2つの 手がかりを 調べよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(SEITO_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.seitoFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.seitoFound.size >= SEITO_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.seitoFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      hideWish();
      say(`爵位を 持たず、${W.heiminsaisho}と 呼ばれた 首相は だれだろう？`);
      setButtons(choiceRow(['ア 原敬', 'イ 吉野作造', 'ウ 徳川家康'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 0) {
        sYes(); scopeBurst(); award('m_seito'); S.phase = 'done';
        say(`せいかい！ ${W.harakei}は 初めての 本格的な ${W.seitounaikaku}を 作り、${W.heiminsaisho}と 呼ばれて 親しまれたんだ。<br><br>💡 <b>たいせつポイント</b><br>${W.komesoudou}が きっかけで 前の 内閣が たおれ、政党が 中心の 内閣へと 変わったんだよ。`);
        setButtons([{ label: 'つぎへ（普通選挙法）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 原敬', 'イ 吉野作造', 'ウ 徳川家康'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- M4：普通選挙法（よそう回収） ---
  m_fusen: {
    enter() {
      Object.assign(S, { scene: 'fusen', scope: { type: 'idle' }, fusenFound: new Set() });
      updateLoc();
      hideWish();
      say(`📜 大正時代の 終わりごろ、選挙の しくみが 大きく 変わった。2つの 手がかりを 調べよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(FUSEN_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.fusenFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.fusenFound.size >= FUSEN_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.fusenFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      hideWish();
      say(`さいしょの よそうタイムを 思い出そう。${VOTE_TXT}`);
      setButtons(choiceRow(VOTE_OPTS, (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 0) {
        sYes(); scopeBurst(); award('m_fusen'); S.phase = 'done';
        say(`せいかい！ ${W.fusenkyoho}で 選挙権を 得たのは 満25歳以上の 男子のみ。女性が 選挙に 参加できるのは、まだ ずっと あとの 1945年まで 待つことに なるんだ。<br><br>💡 <b>たいせつポイント</b><br>「普通」選挙と いっても、この 時点では まだ 女性は ふくまれていなかったんだよ。`);
        setButtons([{ label: 'つぎへ（はかせチャレンジ）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(VOTE_OPTS, (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- はかせチャレンジ：大正デモクラシーの広がり ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' }, hakaseFound: new Set() });
      updateLoc();
      hideWish();
      say(`さいごは <b>はかせチャレンジ</b>！ この 時代の 動きを まとめる 言葉を、2つの 手がかりで 調べよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HAKASE_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.hakaseFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.hakaseFound.size >= HAKASE_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.hakaseFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`${W.taisho}デモクラシーの 説明として 正しいのは どれだろう？`);
      setButtons(choiceRow(['ア 民衆の 声が 政治に 反映されるように なっていった 時代', 'イ 軍隊の 力が もっとも 強かった 時代', 'ウ 外国との 交流が すべて 絶たれた 時代'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 0) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ ${W.minponshugi}や 政党内閣、普通選挙など、民衆の 声を 政治に いかそうとする 動きが 広がった 時代だったんだ。<br><br>💡 <b>たいせつポイント</b><br>しかし この あと、世界的な 不景気や 軍部の 力が 強まる 中で、日本は 次第に 戦争への 道を 進んでいくことに なるんだよ。`);
        setButtons([{ label: 'まとめへ すすむ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 民衆の 声が 政治に 反映されるように なっていった 時代', 'イ 軍隊の 力が もっとも 強かった 時代', 'ウ 外国との 交流が すべて 絶たれた 時代'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' }, kome: { f: 3.0 } });
      updateLoc();
      const votedRight = S.votePicked.has(0);
      showOverlay(`
        <h2>⭐ タワラの辻 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 1918年、米の 値段の 急上昇を きっかけに 全国に 広がった 暴動を（<span class="blankWord" data-a="米騒動">？？？</span>）と いう。<br>
        ② 1925年、納税額の 制限を なくし 満25歳以上の 男子に 選挙権を 認めた 法律を（<span class="blankWord" data-a="普通選挙法">？？？</span>）と いう。<br>
        ③ 天皇主権の 中でも 民衆の 意見を 大切にする 政治を 目ざした 吉野作造の 考えを（<span class="blankWord" data-a="民本主義">？？？</span>）と いう。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>ア 満25歳以上の すべての 男子</b> でした！ 「普通」選挙と いっても、女性が 選挙に 参加できるのは まだ ずっと あとの 1945年まで 待つことに なるんだよ。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🌾 <b>おうちミッション</b><br>おうちの人に「もし 米の 値段が 急に 3倍に なったら、どんな 気持ちに なると 思う？」と 聞いてみよう。くらしへの えいきょうを、いっしょに 考えてみてね。</p>
        <p class="talk">民衆の 声が 政治を 動かした 大正時代。でも この あと、世の中は 大きく 変わっていくことに なるんだよ。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#3a1420'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'kome', scope: { type: 'glow' }, kome: { f: 3.0 } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 大正デモクラシーについて、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「米騒動って 何？」「普通選挙法で 選挙できたのは だれ？」`);
      setButtons([
        { label: '⚓ 第一次世界大戦の 図', cls: 'sub', cb: () => this.show('taisen') },
        { label: '🌾 米騒動の 図', cls: 'sub', cb: () => this.show('kome') },
        { label: '🏛️ 原敬内閣の 図', cls: 'sub', cb: () => this.show('seito') },
        { label: '📜 普通選挙法の 図', cls: 'sub', cb: () => this.show('fusen') },
        { label: '📢 はかせの 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      if (scene === 'kome') { S.kome.f = 3.0; }
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_kome などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
