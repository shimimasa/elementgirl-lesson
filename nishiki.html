<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ニシキの座 — 江戸の産業と文化（小6社会・歴史・協力型・1ファイル）
   元禄文化を知る（松尾芭蕉・井原西鶴・尾形光琳）→ 化政文化を知る
   （葛飾北斎・歌川広重・十返舎一九）→ 浮世絵の色を重ねる（数値階段・
   メイン操作）→ 寺子屋のひみつ（よそう回収）→ はかせ（三都のにぎわい・
   貨幣経済）。「オウギの島」（鎖国）の後、既存作「ケムリの港」（黒船
   来航）の前史にあたる、泰平の世に花開いた町人文化を扱う。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  genroku: ruby('元禄文化', 'げんろくぶんか'),
  kasei: ruby('化政文化', 'かせいぶんか'),
  bashou: ruby('松尾芭蕉', 'まつおばしょう'),
  okuno: ruby('おくの細道', 'おくのほそみち'),
  saikaku: ruby('井原西鶴', 'いはらさいかく'),
  ukiyozoushi: ruby('浮世草子', 'うきよぞうし'),
  korin: ruby('尾形光琳', 'おがたこうりん'),
  rinpa: ruby('琳派', 'りんぱ'),
  hokusai: ruby('葛飾北斎', 'かつしかほくさい'),
  fugaku: ruby('富嶽三十六景', 'ふがくさんじゅうろっけい'),
  hiroshige: ruby('歌川広重', 'うたがわひろしげ'),
  tokaido: ruby('東海道五十三次', 'とうかいどうごじゅうさんつぎ'),
  jippensha: ruby('十返舎一九', 'じっぺんしゃいっく'),
  hizakurige: ruby('東海道中膝栗毛', 'とうかいどうちゅうひざくりげ'),
  ukiyoe: ruby('浮世絵', 'うきよえ'),
  nishikie: ruby('錦絵', 'にしきえ'),
  terakoya: ruby('寺子屋', 'てらこや'),
  daidokoro: ruby('天下の台所', 'てんかのだいどころ'),
  ryougae: ruby('両替商', 'りょうがえしょう'),
};

const NUMS = '①②③④⑤⑥⑦⑧';
const VOTE_TXT = `江戸時代、字の 読み書きが できたのは、どんな 人たちだったと 思う？`;
const VOTE_OPTS = ['ア 武士だけ', 'イ 一部の お金持ちの 商人だけ', 'ウ 町人や 農民の 子どもたちも、寺子屋で たくさん 学んでいた'];

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

function drawPoints(X, Y, sc, points, foundSet) {
  points.forEach(p => {
    const done = foundSet.has(p.key);
    const px = X(p.x), py = Y(p.y);
    gctx.beginPath(); gctx.arc(px, py, 24 * sc, 0, TAU);
    gctx.fillStyle = done ? '#2a4a6a' : '#fff';
    gctx.fill();
    gctx.strokeStyle = '#182a3c'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.fillStyle = done ? '#fff' : '#2a4a6a';
    gctx.font = `700 ${18 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(p.letter, px, py + 1 * sc);
  });
}

// ---------- 浮世絵の色を重ねる（メイン操作） ----------
function drawUkiyoeScene(X, Y, sc, colF) {
  bgScene(X, Y, sc);
  const cx = 500, baseY = 460, w = 420, h = 300;
  const left = cx - w / 2, top = baseY - h;
  // わく
  gctx.fillStyle = '#fffdf4'; gctx.strokeStyle = '#182a3c'; gctx.lineWidth = 3 * sc;
  gctx.beginPath(); gctx.rect(X(left), Y(top), w * sc, h * sc); gctx.fill(); gctx.stroke();

  // 空（col>0.25で藍色のグラデーション）
  if (colF > 0.2) {
    const a1 = clamp((colF - 0.2) / 0.3, 0, 1);
    gctx.save(); gctx.globalAlpha = a1;
    const skyGrd = gctx.createLinearGradient(0, Y(top), 0, Y(top + h * 0.55));
    skyGrd.addColorStop(0, '#3d6a94'); skyGrd.addColorStop(1, '#a8c8d8');
    gctx.fillStyle = skyGrd;
    gctx.fillRect(X(left + 6), Y(top + 6), (w - 12) * sc, (h * 0.55) * sc);
    gctx.restore();
  }
  // 山（富士山シルエット、col>0.4）
  if (colF > 0.35) {
    const a2 = clamp((colF - 0.35) / 0.3, 0, 1);
    gctx.save(); gctx.globalAlpha = a2;
    gctx.fillStyle = colF > 0.65 ? '#c23b3b' : '#5a5a6a';
    gctx.beginPath();
    gctx.moveTo(X(cx - 150), Y(top + h * 0.62));
    gctx.lineTo(X(cx - 30), Y(top + h * 0.2));
    gctx.lineTo(X(cx + 30), Y(top + h * 0.2));
    gctx.lineTo(X(cx + 150), Y(top + h * 0.62));
    gctx.closePath(); gctx.fill();
    gctx.restore();
  }
  // 雪（col>0.85）
  if (colF > 0.8) {
    const a3 = clamp((colF - 0.8) / 0.2, 0, 1);
    gctx.save(); gctx.globalAlpha = a3;
    gctx.fillStyle = '#fffdf4';
    gctx.beginPath();
    gctx.moveTo(X(cx - 6), Y(top + h * 0.2));
    gctx.lineTo(X(cx - 60), Y(top + h * 0.36));
    gctx.lineTo(X(cx - 10), Y(top + h * 0.3));
    gctx.lineTo(X(cx + 10), Y(top + h * 0.3));
    gctx.lineTo(X(cx + 60), Y(top + h * 0.36));
    gctx.lineTo(X(cx + 6), Y(top + h * 0.2));
    gctx.closePath(); gctx.fill();
    gctx.restore();
  }
  // 手前の海（col>0.55、藍の波）
  if (colF > 0.5) {
    const a4 = clamp((colF - 0.5) / 0.3, 0, 1);
    gctx.save(); gctx.globalAlpha = a4;
    gctx.fillStyle = '#2a4a6a';
    gctx.fillRect(X(left + 6), Y(top + h * 0.62), (w - 12) * sc, (h * 0.34) * sc);
    gctx.restore();
  }
  // 輪郭線(常に見える)
  gctx.strokeStyle = '#182a3c'; gctx.lineWidth = 2.6 * sc;
  gctx.beginPath();
  gctx.moveTo(X(cx - 150), Y(top + h * 0.62));
  gctx.lineTo(X(cx - 30), Y(top + h * 0.2));
  gctx.lineTo(X(cx + 30), Y(top + h * 0.2));
  gctx.lineTo(X(cx + 150), Y(top + h * 0.62));
  gctx.stroke();

  gctx.fillStyle = '#22314a'; gctx.font = `700 ${22 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(`色版を 重ねた 割合 ${Math.round(colF * 100)}%（目もり ${NUMS[S.suriN - 1]}）`, X(500), Y(140));
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'genroku') drawGenrokuScene(X, Y, sc);
  else if (S.scene === 'kasei') drawKaseiScene(X, Y, sc);
  else if (S.scene === 'ukiyoe') drawUkiyoeScene(X, Y, sc, S.suri.f);
  else if (S.scene === 'terakoya') drawTerakoyaScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawUkiyoeScene(X, Y, sc, S.suri.f);
}

// ---------- にしきめがね（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fdf8ec'); grd.addColorStop(1, '#c23b3b');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#2a4a6a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔎', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'suri') {
    const pct = Math.round(S.suri.f * 100);
    sctx.font = `700 ${R * 0.26}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillStyle = '#2a4a6a';
    sctx.fillText(pct + '%', R, R * 0.78);
    label('色版を 重ねた 割合');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#e8b830'); g2.addColorStop(1, 'rgba(216,201,138,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#2a4a6a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🚦', R, R * 0.85);
    label('たしかめ かんりょう！');
  } else {
    sctx.fillStyle = '#2a4a6a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔭', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.09}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#22314a';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#2a4a6a', '#c23b3b', '#e8b830', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' }, suri: { f: 1 } });
      updateLoc();
      const votedRight = S.votePicked.has(2);
      showOverlay(`
        <h2>⭐ ニシキの座 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 元禄文化を 代表する 俳人で「おくの細道」を 書いたのは（<span class="blankWord" data-a="松尾芭蕉">？？？</span>）。<br>
        ② 「富嶽三十六景」を 描いた 化政文化を 代表する 浮世絵師は（<span class="blankWord" data-a="葛飾北斎">？？？</span>）。<br>
        ③ 読み・書き・そろばんを 学ぶ 町人や 農民の 子どもの 学び場を（<span class="blankWord" data-a="寺子屋">？？？</span>）と いう。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>ウ</b> でした！ 町人や 農民の 子どもたちも 寺子屋で たくさん 学んでいて、江戸時代の 識字率は 当時の 世界でも かなり 高い 水準だったんだよ。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🎨 <b>おうちミッション</b><br>おうちの人に「もし 学校が なかったら、どうやって 字や 計算を 覚えると 思う？」と 聞いてみよう。寺子屋のような 学びの 場の 大切さを、いっしょに 考えてみてね。</p>
        <p class="talk">戦の ない 泰平の 世で、文化・産業・学びが 大きく 花開いたんだよ。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#182a3c'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'ukiyoe', scope: { type: 'glow' }, suri: { f: 1 } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 江戸の 産業と 文化について、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「元禄文化と 化政文化の ちがいは？」「錦絵って 何？」`);
      setButtons([
        { label: '🎭 元禄文化の 図', cls: 'sub', cb: () => this.show('genroku') },
        { label: '🗻 化政文化の 図', cls: 'sub', cb: () => this.show('kasei') },
        { label: '🎨 浮世絵の 図', cls: 'sub', cb: () => this.show('ukiyoe') },
        { label: '📖 寺子屋の 図', cls: 'sub', cb: () => this.show('terakoya') },
        { label: '💰 はかせの 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      if (scene === 'ukiyoe') { S.suri.f = 1; }
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_ukiyoe などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
