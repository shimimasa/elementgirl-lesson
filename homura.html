<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ホムラの炉 — ものの燃え方と空気（小6理科・協力型・1ファイル）
   燃え続けるための条件（発見型）→
   酸素の割合と燃え方（メイン操作・数値階段①〜⑦）→
   燃える前と燃えた後の空気（時間送り①〜⑦・気体検知管シミュレーション）→
   なぜ消える？（発見型・誤概念くずし）→
   はかせ（くらしの中の燃焼と安全）。
   数値は静岡県総合教育センター資料の気体検知管実測値（酸素21%→17%・二酸化炭素0.03%→4%、
   ろうそくの消える限界16〜17%）に基づく。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {
  nensho: ruby('燃焼', 'ねんしょう'),
  sanso: ruby('酸素', 'さんそ'),
  nisan: ruby('二酸化炭素', 'にさんかたんそ'),
  chisso: ruby('窒素', 'ちっそ'),
  kenchikan: ruby('検知管', 'けんちかん'),
  sanka: ruby('酸化', 'さんか'),
  seirei: ruby('精霊', 'せいれい'),
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 数値データ（本物度：静岡県総合教育センター資料） ----------
const AIR_O2 = 21, AIR_CO2 = 0.03; // ふつうの空気
const LIMIT_O2 = 17; // ろうそくの火が消える限界(16〜17%)
const AFTER_O2 = 17, AFTER_CO2 = 4.0; // 燃やした後の実測値

// m_sanso: 酸素の割合(%)。index0=スタート(0%)、①〜⑦は残り7値
const SANSO_STEPS = [0, 5, 10, 15, 17, 21, 40, 100];
// m_kikan: 経過時間(秒)。index0=スタート(0秒)、①〜⑦は残り7値
const KIKAN_ELAPSED = [0, 10, 20, 30, 40, 50, 60, 70];
const KIKAN_O2 = [21.0, 20.4, 19.9, 19.3, 18.7, 18.1, 17.6, 17.0];
const KIKAN_CO2 = [0.03, 0.6, 1.2, 1.7, 2.3, 2.9, 3.4, 4.0];

function flameFactor(o2) {
  if (o2 < LIMIT_O2) return 0;
  if (o2 <= AIR_O2) return lerp(0.15, 1, (o2 - LIMIT_O2) / (AIR_O2 - LIMIT_O2));
  return lerp(1, 2.3, clamp((o2 - AIR_O2) / (100 - AIR_O2), 0, 1));
}

// ---------- くらしの中の燃焼と安全 ----------

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function bgFurnace(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#f2ece2'); g.addColorStop(1, '#ded2c2');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.fillStyle = '#3a3a3a';
  gctx.fillRect(X(0), Y(560), 1000 * sc, 80 * sc);
}
function drawFlame(px, py, sc, factor) {
  if (factor <= 0) return;
  const now = performance.now() / 1000;
  const flick = 1 + Math.sin(now * 9 + px * 0.01) * 0.06;
  const hBase = 58 * Math.min(factor, 1) + Math.max(0, factor - 1) * 46;
  const wBase = 22 * Math.min(factor, 1.3) + Math.max(0, factor - 1.3) * 9;
  const h = hBase * sc * flick, w = wBase * sc * flick;
  const g = gctx.createLinearGradient(px, py, px, py - h);
  g.addColorStop(0, '#c62828'); g.addColorStop(0.55, '#ff7043'); g.addColorStop(1, '#ffe08a');
  gctx.fillStyle = g;
  gctx.beginPath();
  gctx.moveTo(px, py);
  gctx.quadraticCurveTo(px - w, py - h * 0.55, px, py - h);
  gctx.quadraticCurveTo(px + w, py - h * 0.55, px, py);
  gctx.closePath();
  gctx.fill();
}
function drawCandle(px, py, sc, factor) {
  const cw = 26 * sc, ch = 120 * sc;
  gctx.fillStyle = '#fdf3df'; gctx.strokeStyle = '#c9a888'; gctx.lineWidth = 2 * sc;
  roundRect(gctx, px - cw / 2, py - ch, cw, ch, 4 * sc);
  gctx.fill(); gctx.stroke();
  gctx.strokeStyle = '#5a4020'; gctx.lineWidth = 2 * sc;
  gctx.beginPath(); gctx.moveTo(px, py - ch); gctx.lineTo(px, py - ch - 14 * sc); gctx.stroke();
  drawFlame(px, py - ch - 14 * sc, sc, factor);
}
function drawGaugeTube(px, py, sc, label, value, minV, maxV, color) {
  const tubeW = 30 * sc, tubeH = 160 * sc;
  const top = py - tubeH, bot = py;
  gctx.strokeStyle = '#8a7a68'; gctx.lineWidth = 2.4 * sc;
  gctx.strokeRect(px - tubeW / 2, top, tubeW, tubeH);
  const frac = clamp((value - minV) / (maxV - minV), 0, 1);
  const fillH = tubeH * frac;
  gctx.fillStyle = color;
  gctx.fillRect(px - tubeW / 2, bot - fillH, tubeW, fillH);
  gctx.fillStyle = '#2a2a2a'; gctx.font = `700 ${13 * sc}px sans-serif`; gctx.textAlign = 'center';
  gctx.fillText(label, px, top - 18 * sc);
  gctx.fillText(`${value < 1 ? value.toFixed(2) : value.toFixed(1)}%`, px, top - 2 * sc);
}

// ---------- 1．燃え続けるための条件 ----------
function drawFutaScene(X, Y, sc) {
  bgFurnace(X, Y, sc);
  const cx = 500, baseY = 470;
  let factor;
  if (!S.futaState) factor = 1;
  else if (S.futaState === 'gap') factor = 1 + Math.sin(performance.now() / 1000 * 2) * 0.05;
  else factor = lerp(1, 0, S.futaAnimT);
  const jarR = 100, jarTop = baseY - 190, jarBot = baseY + 40;
  gctx.strokeStyle = 'rgba(143,176,204,.9)'; gctx.lineWidth = 4 * sc;
  gctx.fillStyle = 'rgba(207,232,251,.14)';
  roundRect(gctx, X(cx - jarR), Y(jarTop), jarR * 2 * sc, (jarBot - jarTop) * sc, 24 * sc);
  gctx.fill(); gctx.stroke();
  drawCandle(X(cx), Y(baseY), sc, factor);
  if (S.futaState === 'gap') {
    gctx.font = `${22 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    const flow = (performance.now() / 1000 * 40) % 40;
    gctx.fillText('→', X(cx - jarR - 30 + flow), Y(jarBot - 10));
    gctx.fillText('→', X(cx - jarR - 50 + flow), Y(jarBot - 10));
  }
  gctx.fillStyle = '#2a2a2a'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  const label = !S.futaState ? 'ボタンで ふた・すきまを 試してみよう'
    : S.futaState === 'sealed' ? 'ふたをして 密閉中……' : 'すきまから 新しい 空気が 入っている';

}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'futa') drawFutaScene(X, Y, sc);
  else if (S.scene === 'sanso') drawSansoScene(X, Y, sc);
  else if (S.scene === 'kikan') drawKikanScene(X, Y, sc);
  else if (S.scene === 'naze') drawNazeScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- 気体つぶビューア（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f2ece2'); grd.addColorStop(1, '#cfc2ae');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'particles') {
    drawParticleGrid(R, S.scope.o2, S.scope.co2);
    label(S.scope.label || '');
  } else if (mode === 'point') {
    sctx.fillStyle = '#c62828';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffb74d55'); g2.addColorStop(1, 'rgba(255,183,77,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#c62828'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔥', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#c62828'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.09}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#2a2a2a';
    sctx.fillText(txt, R, ly);
  }

  function drawParticleGrid(R, o2, co2) {
    const total = 25;
    let nCo2 = co2 >= 1 ? Math.max(1, Math.round(total * co2 / 100)) : 0;
    let nO2 = Math.max(0, Math.round(total * o2 / 100));
    if (nO2 + nCo2 > total) nO2 = total - nCo2;
    const nN2 = Math.max(0, total - nO2 - nCo2);
    const colors = [];
    for (let i = 0; i < nO2; i++) colors.push('#e05a3a');
    for (let i = 0; i < nCo2; i++) colors.push('#3a7ab8');
    for (let i = 0; i < nN2; i++) colors.push('#9aa0a6');
    const cols = 5, rows = 5, cellSize = R * 0.26;
    const startX = R - (cols - 1) * cellSize / 2, startY = R * 0.62 - (rows - 1) * cellSize / 2;
    let idx = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (idx >= total) break;
        const px = startX + c * cellSize, py = startY + r * cellSize;
        sctx.beginPath(); sctx.arc(px, py, cellSize * 0.36, 0, TAU);
        sctx.fillStyle = colors[idx] || '#9aa0a6'; sctx.fill();
        sctx.strokeStyle = 'rgba(255,255,255,.6)'; sctx.lineWidth = 1; sctx.stroke();
        idx++;
      }
    }
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#ffb74d', '#ff7043', '#c62828', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

function setButtons(list) {

    pick(i, el) {
      markPicked(el);
      if (i === 1) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ ぬれタオルで おおって ${W.sanso}を さえぎれば 火は 消える。水を かけると 大きく 燃え広がるので 絶対に しないこと。`);
        setButtons([{ label: 'ふりかえりタイムへ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['水をかけて消す', 'ぬれタオルでおおって酸素を断つ', 'そのままにする'], (i2, el2) => this.pick(i2, el2)));
      }
    },
  },

  // --- ふりかえりタイム：5ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      if (slide.video) {
        const videoUrl = `https://www.youtube.com/watch?v=${slide.video}`;
        showOverlay(`
          <h2>${slide.icon} ふりかえりタイム（${n}/${total}）${slide.title}</h2>
          <div id="furikaeriThumb" style="max-width:380px;margin:0 auto;cursor:pointer">
            <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
              <img src="https://img.youtube.com/vi/${slide.video}/hqdefault.jpg" style="width:100%;display:block;opacity:.85">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <div style="width:15%;aspect-ratio:1;min-width:56px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(24px,3vw,34px)">▶</div>
              </div>
            </div>
            <div style="margin-top:.5em;color:#3a7ab8;font-size:clamp(12px,1.3vw,16px)">タップすると 新しい タブで 動画が ひらくよ</div>
          </div>
          <p class="talk">${slide.text()}</p>
          <button class="btn" id="furikaeriNextBtn">${isLast ? 'まとめへ すすむ' : 'つぎへ'}</button>
          <div class="foot">先生へ：動画は外部サイト(YouTube)の教育系チャンネルです。内容を事前にご確認ください。URL: ${videoUrl}</div>
        `);
        $('furikaeriThumb').onclick = () => { sTap(); window.open(videoUrl, '_blank', 'noopener'); };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ホムラの炉 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① ものが 燃え続けるには、新しい 空気の（<span class="blankWord" data-a="入れかえ">？？？</span>）が 必要。<br>
        ② ものが 燃えると、${W.sanso}は（<span class="blankWord" data-a="減り">？？？</span>）、${W.nisan}は（<span class="blankWord" data-a="増える">？？？</span>）。<br>
        ③ ろうそくの 火が 消えても、${W.sanso}は（<span class="blankWord" data-a="まだ残っている">？？？</span>）。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 17%くらい（まだ かなり 残っている）</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>お部屋の 換気扇を 回したり 窓を あけたりすると、空気が どんな風に 動くか、湯気や せんこうの けむりなどで 見つけてみよう（火は 使わず、おうちの人と いっしょに）。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#c62828'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「ものが 燃え続けるには 何が 必要？」「${W.sanso}の 割合が 多いと 燃え方は どうなる？」「火が 消えても ${W.sanso}は 0%に なる？」`);
      setButtons([
        { label: '🔥 燃え続けるための図', cls: 'sub', cb: () => this.show('futa') },
        { label: '💨 酸素の割合と燃え方の図', cls: 'sub', cb: () => this.show('sanso') },
        { label: '🧪 燃える前と後の空気の図', cls: 'sub', cb: () => this.show('kikan') },
        { label: '❓ なぜ消える？の図', cls: 'sub', cb: () => this.show('naze') },
        { label: '🧯 くらしの中の燃焼と安全の図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_kikan などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
