<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ネンリンの杜 — 森と わたしたちの くらし（小5社会・地理・協力型・1ファイル）
   森の種類さがし（天然林・人工林）→ 木を育てる一生（苗木〜主伐の時間送り）→
   間伐しようシミュレーション（間伐の量で森の様子を試す）→ 森のはたらき発見（緑のダム・空気・土をささえる）→
   はかせ（木材自給率と国産材）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  tennenrin: ruby('天然林', 'てんねんりん'),
  jinkourin: ruby('人工林', 'じんこうりん'),
  sugi: 'スギ',
  hinoki: 'ヒノキ',
  naegi: ruby('苗木', 'なえぎ'),
  shitakari: ruby('下刈り', 'したがり'),
  edauchi: ruby('枝打ち', 'えだうち'),
  kanbatsu: ruby('間伐', 'かんばつ'),
  shubatsu: ruby('主伐', 'しゅばつ'),
  midorinodamu: '緑の ダム',
  mokuzai: ruby('木材', 'もくざい'),
  jikyuuritsu: ruby('自給率', 'じきゅうりつ'),
  kokusanzai: ruby('国産材', 'こくさんざい'),
  yunyuuzai: ruby('輸入材', 'ゆにゅうざい'),
  doshasaigai: ruby('土砂災害', 'どしゃさいがい'),

// ---------- 判定ロジック ----------
function judgeKanbatsu(n) { // n: 1-8　間伐の量
  if (n <= 2) return { level: 'low' };
  if (n >= 7) return { level: 'high' };
  return { level: 'good' };
}
function treeSurvival(idx) { // idx: 0-7（レベル1〜8に対応）
  const pct = KANBATSU_PCT[clamp(idx, 0, 7)];
  const cut = Math.round(TREE_COUNT * pct / 100);
  const survive = new Array(TREE_COUNT).fill(true);
  for (let i = 0; i < cut; i++) survive[THIN_ORDER[i]] = false;
  return survive;
}

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

// ---------- 木を描く（共通） ----------
function drawSapling(X, Y, sc, cx, baseY, scale) {
  const s = Math.max(0.35, scale / 0.06);
  gctx.strokeStyle = '#3a8a3a'; gctx.lineWidth = 2 * sc;
  gctx.beginPath(); gctx.moveTo(X(cx), Y(baseY)); gctx.lineTo(X(cx), Y(baseY - 15 * s)); gctx.stroke();
  gctx.strokeStyle = '#2b2013'; gctx.lineWidth = 1 * sc;
  [[-1, -10], [1, -14]].forEach(([dx, dy]) => {
    gctx.fillStyle = '#4a9a4a';
    gctx.beginPath();
    gctx.save(); gctx.translate(X(cx + dx * 7 * s), Y(baseY + dy * s)); gctx.rotate(dx * 0.5);
    gctx.ellipse(0, 0, 9 * s * sc, 4.4 * s * sc, 0, 0, TAU);
    gctx.restore();
    gctx.fill(); gctx.stroke();
  });
}
function drawForestTree(X, Y, sc, cx, baseY, scale, pruned) {
  scale = clamp(scale, 0, 1.3);
  if (scale <= 0.09) { drawSapling(X, Y, sc, cx, baseY, Math.max(scale, 0.03)); return; }
  const trunkW = Math.max(6, 11 * scale), trunkH = 42 * scale;
  gctx.fillStyle = '#6b4a24'; gctx.strokeStyle = '#2b2013'; gctx.lineWidth = 1.6 * sc;
  gctx.fillRect(X(cx - trunkW / 2), Y(baseY - trunkH), trunkW * sc, trunkH * sc);
  gctx.strokeRect(X(cx - trunkW / 2), Y(baseY - trunkH), trunkW * sc, trunkH * sc);
  if (pruned) {
    gctx.strokeStyle = 'rgba(43,32,19,.5)'; gctx.lineWidth = 1 * sc;
    for (let k = 0; k < 3; k++) {
      const yy = baseY - trunkH * 0.25 - k * trunkH * 0.28;
      gctx.beginPath(); gctx.moveTo(X(cx - trunkW / 2), Y(yy)); gctx.lineTo(X(cx + trunkW / 2), Y(yy)); gctx.stroke();
    }
  }
  const segH = 34 * scale, segW = 32 * scale;
  for (let i = 0; i < 3; i++) {
    const topY = baseY - trunkH - segH * 1.15 - i * segH * 0.8;
    const botY = baseY - trunkH - i * segH * 0.62;
    const ww = segW * (1 - i * 0.14);
    gctx.beginPath();
    gctx.moveTo(X(cx), Y(topY));
    gctx.lineTo(X(cx - ww), Y(botY));
    gctx.lineTo(X(cx + ww), Y(botY));
    gctx.closePath();
    gctx.fillStyle = i % 2 === 0 ? '#2f6a3a' : '#3a8a4a';
    gctx.fill(); gctx.strokeStyle = '#1e4a26'; gctx.lineWidth = 1.4 * sc; gctx.stroke();
  }
}
function drawBroadTree(X, Y, sc, cx, baseY, scale) {
  scale = clamp(scale, 0.2, 1.2);
  const trunkW = 9 * scale, trunkH = 34 * scale;
  gctx.fillStyle = '#7a5a30'; gctx.strokeStyle = '#2b2013'; gctx.lineWidth = 1.4 * sc;
  gctx.fillRect(X(cx - trunkW / 2), Y(baseY - trunkH), trunkW * sc, trunkH * sc);
  gctx.strokeRect(X(cx - trunkW / 2), Y(baseY - trunkH), trunkW * sc, trunkH * sc);
  const r = 30 * scale;
  gctx.fillStyle = '#6a9a4a'; gctx.strokeStyle = '#1e4a26'; gctx.lineWidth = 1.4 * sc;
  [[-0.4, -0.3, 0.75], [0.4, -0.32, 0.7], [0, -0.62, 0.85]].forEach(([dx, dy, rr]) => {
    gctx.beginPath(); gctx.ellipse(X(cx + dx * r), Y(baseY - trunkH + dy * r), r * rr * sc, r * rr * 0.82 * sc, 0, 0, TAU);
    gctx.fill(); gctx.stroke();
  });
}
function drawStump(X, Y, sc, cx, baseY, size) {
  size = size || 1;
  gctx.fillStyle = '#c9a878'; gctx.strokeStyle = '#2b2013'; gctx.lineWidth = 1.6 * sc;
  gctx.beginPath(); gctx.ellipse(X(cx), Y(baseY - 4 * size), 13 * size * sc, 7 * size * sc, 0, 0, TAU); gctx.fill(); gctx.stroke();
  gctx.strokeStyle = '#a8845a'; gctx.lineWidth = 1 * sc;
  gctx.beginPath(); gctx.ellipse(X(cx), Y(baseY - 4 * size), 8 * size * sc, 4 * size * sc, 0, 0, TAU); gctx.stroke();
  gctx.fillStyle = '#8a6438'; gctx.strokeStyle = '#2b2013'; gctx.lineWidth = 1.2 * sc;
  gctx.fillRect(X(cx - 13 * size), Y(baseY - 4 * size), 26 * size * sc, 8 * size * sc);
  gctx.strokeRect(X(cx - 13 * size), Y(baseY - 4 * size), 26 * size * sc, 8 * size * sc);
}

// ---------- 間伐しよう（メイン操作） ----------
function drawKanbatsuScene(X, Y, sc) {
  const idx = clamp((S.kanbatsuLevel || 1) - 1, 0, 7);
  const r = judgeKanbatsu(idx + 1);
  const groundCol = r.level === 'low' ? '#7a8a52' : r.level === 'high' ? '#b89858' : '#8fbf58';
  drawForestBG(X, Y, sc, groundCol);

  const survive = treeSurvival(idx);
  const cutFrac = clamp(S.kanbatsuAnimT || 0, 0, 1);
  const baseY = 500;
  for (let i = 0; i < TREE_COUNT; i++) {
    const tx = 150 + i * 87.5;
    const alive = survive[i];
    if (alive) {
      drawForestTree(X, Y, sc, tx, baseY, 0.85);
    } else {
      // 伐採アニメーション：cutFracが進むにつれ木→切り株へ
      if (cutFrac < 0.999) {
        gctx.globalAlpha = clamp(1 - cutFrac, 0, 1);
        drawForestTree(X, Y, sc, tx, baseY, 0.85 * clamp(1 - cutFrac * 0.5, 0.3, 1));
        gctx.globalAlpha = 1;
      }
      if (cutFrac > 0.15) { gctx.globalAlpha = clamp((cutFrac - 0.15) / 0.5, 0, 1); drawStump(X, Y, sc, tx, baseY, 0.75); gctx.globalAlpha = 1; }
    }
  }

  // 下草・日光・土砂の演出（結果確定後のみ）
  if (S.kanbatsuResult) {
    if (r.level === 'good') {
      gctx.fillStyle = 'rgba(58,138,58,.55)';
      for (let i = 0; i < TREE_COUNT; i++) {
        if (!survive[i]) continue;
        const tx = 150 + i * 87.5;
        [-22, 0, 22].forEach(dx => { gctx.beginPath(); gctx.ellipse(X(tx + dx), Y(baseY + 6), 12 * sc, 6 * sc, 0, 0, TAU); gctx.fill(); });
      }
      gctx.strokeStyle = 'rgba(255,240,180,.5)'; gctx.lineWidth = 10 * sc;
      [260, 500, 740].forEach(lx => { gctx.beginPath(); gctx.moveTo(X(lx), Y(60)); gctx.lineTo(X(lx - 40), Y(400)); gctx.stroke(); });
    } else if (r.level === 'high') {
      gctx.strokeStyle = 'rgba(90,60,20,.55)'; gctx.lineWidth = 2.4 * sc;
      for (let i = 0; i < 5; i++) {
        const lx = 200 + i * 150;
        gctx.beginPath(); gctx.moveTo(X(lx), Y(430)); gctx.lineTo(X(lx + 30), Y(470)); gctx.lineTo(X(lx - 10), Y(510)); gctx.stroke();
      }
      gctx.font = `${26 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
      gctx.fillText('⚠️', X(880), Y(160));
    } else {
      gctx.fillStyle = 'rgba(40,50,20,.28)';
      gctx.fillRect(X(0), Y(300), 1000 * sc, 340 * sc);
    }
  }

  gctx.fillStyle = '#2b2013'; gctx.font = `700 ${18 * sc}px sans-serif`; gctx.textAlign = 'center';
  gctx.fillText(`間伐の 量 ${NUMS[idx]}（切る木 約${KANBATSU_PCT[idx]}%）`, X(500), Y(46));
}

// ---------- はかせ：木材とわたしたちのくらし ----------
function drawJikyuuGraph(X, Y, sc) {
  const bars = [{ label: '1950\n年代', val: 94 }, { label: '2002\n年', val: 18.8 }, { label: '2024\n年', val: 42.5 }];
  const bx0 = 380, bw = 90, gap = 130, baseY = 380, maxH = 220;
  gctx.strokeStyle = '#7a6030'; gctx.lineWidth = 2 * sc;
  gctx.beginPath(); gctx.moveTo(X(bx0 - 40), Y(baseY)); gctx.lineTo(X(bx0 + gap * 2 + bw + 40), Y(baseY)); gctx.stroke();
  bars.forEach((b, i) => {
    const bx = bx0 + i * gap;
    const h = maxH * b.val / 100;
    gctx.fillStyle = i === 1 ? '#c1442e' : (i === 2 ? '#e0a020' : '#3a8a4a');
    gctx.fillRect(X(bx), Y(baseY - h), bw * sc, h * sc);
    gctx.strokeStyle = '#2b2013'; gctx.lineWidth = 1.6 * sc; gctx.strokeRect(X(bx), Y(baseY - h), bw * sc, h * sc);
    gctx.fillStyle = '#2b2013'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(`${b.val}%`, X(bx + bw / 2), Y(baseY - h - 16));
    b.label.split('\n').forEach((ln, li) => gctx.fillText(ln, X(bx + bw / 2), Y(baseY + 20 + li * 20)));
  });
  gctx.font = `700 ${19 * sc}px sans-serif`; gctx.fillText('木材自給率の うつりかわり', X(bx0 + gap + bw / 2), Y(90));
}
function drawHakaseScene(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#eaf3d8'); g.addColorStop(1, '#f5efd8');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  drawJikyuuGraph(X, Y, sc);
  gctx.font = `${28 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  ['🏠', '🪑', '📄', '🥢'].forEach((ch, i) => gctx.fillText(ch, X(770 + (i % 2) * 60), Y(460 + Math.floor(i / 2) * 60)));
  drawPointMarkers(HAKASE_POINTS, S.hakaseFound, X, Y, sc);
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'shurui') drawShuruiScene(X, Y, sc);
  else if (S.scene === 'sodateru') drawSodateruScene(X, Y, sc);
  else if (S.scene === 'kanbatsu') drawKanbatsuScene(X, Y, sc);
  else if (S.scene === 'hataraki') drawHatarakiScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawKanbatsuScene(X, Y, sc);
}

// ---------- ネンリンのめがね（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#faf6ea'); grd.addColorStop(1, '#c9b878');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#6b4a24'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'gauge') {
    const idx = clamp((S.kanbatsuLevel || 1) - 1, 0, 7);
    const r = judgeKanbatsu(idx + 1);
    const cx = R, cy = R * 1.05, rad = R * 0.72;
    sctx.strokeStyle = '#e6dcc0'; sctx.lineWidth = R * 0.13; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, 0); sctx.stroke();
    const frac = idx / 7;
    const ang = Math.PI - Math.PI * frac;
    sctx.strokeStyle = r.level === 'good' ? '#2f9a5a' : r.level === 'low' ? '#7a8a3a' : '#c1442e';
    sctx.lineWidth = R * 0.13;
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, ang, true); sctx.stroke();
    sctx.strokeStyle = '#2b2013'; sctx.lineWidth = R * 0.045; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(cx + Math.cos(ang) * rad * 0.88, cy + Math.sin(ang) * rad * 0.88); sctx.stroke();
    sctx.fillStyle = '#2b2013'; sctx.beginPath(); sctx.arc(cx, cy, R * 0.05, 0, TAU); sctx.fill();
    label(`間伐 ${NUMS[idx]}（約${KANBATSU_PCT[idx]}%）`);
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#f5efd8'); g2.addColorStop(1, 'rgba(245,239,216,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#6b4a24'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🌲', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#6b4a24'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🌳', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#2b2013';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#2f6a3a', '#ffe3a0', '#c9a878', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

        this.refreshCtl();
      }
    },
  },

  // --- M4：森のはたらき発見 ---
  m_hataraki: {
    enter() {
      Object.assign(S, { scene: 'hataraki', scope: { type: 'idle' }, hatarakiFound: new Set() });
      updateLoc();
      hideWish();
      say(`森は 木材を 生み出すだけでなく、わたしたちの くらしを 守る いろいろな はたらきを している。3つの 手がかりを、下の ボタンを ぜんぶ おして 調べよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HATARAKI_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.hatarakiFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.hatarakiFound.size >= HATARAKI_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.hatarakiFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      hideWish();
      say(`もし 森が なかったら、大雨の ときに どうなると 思う？`);
      setButtons(choiceRow(['ア 何も かわらない', 'イ 一気に 川へ 水が 流れこみ、こう水が おきやすくなる', 'ウ かえって 安全に なる'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 1) {
        sYes(); scopeBurst(); award('m_hataraki'); S.phase = 'done';
        say(`せいかい！ 森の 土は 雨水を すいこんで 少しずつ 流す ${W.midorinodamu}。木が なくなると、雨水が 一気に 川へ 流れこんで こう水が おきやすくなる。<br><br>💡 <b>たいせつポイント</b><br>森は「見えない ダム」として、わたしたちの くらしを 守ってくれているんだ。`);
        setButtons([{ label: 'つぎへ（はかせチャレンジ）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 何も かわらない', 'イ 一気に 川へ 水が 流れこみ、こう水が おきやすくなる', 'ウ かえって 安全に なる'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- はかせチャレンジ：木材とわたしたちのくらし ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' }, hakaseFound: new Set() });
      updateLoc();
      hideWish();
      say(`さいごは <b>はかせチャレンジ</b>！ 森から 生まれる ${W.mokuzai}と、わたしたちの くらしの つながりを 見てみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HAKASE_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.hakaseFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.hakaseFound.size >= HAKASE_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.hakaseFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`最近、日本の 木材${W.jikyuuritsu}は どうなってきていると 思う？`);
      setButtons(choiceRow(['ア 減り続けている', 'イ 下がりきってから、また 少しずつ 回復してきている', 'ウ ずっと 変わらない'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 1) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ 2002年ごろに 大きく 落ちこんだ 木材${W.jikyuuritsu}は、${W.kokusanzai}が 見直されて、今は 約4わりまで 回復してきている。<br><br>💡 <b>たいせつポイント</b><br>森を 育て、木を 使い、また 植える……この くりかえしが 続けば、森は これからも わたしたちの くらしを 支えてくれる。`);
        setButtons([{ label: 'まとめへ すすむ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 減り続けている', 'イ 下がりきってから、また 少しずつ 回復してきている', 'ウ ずっと 変わらない'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' }, kanbatsuLevel: 5, kanbatsuAnimT: 1, kanbatsuResult: 'good' });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ネンリンの杜 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 日本の 国土の 約（<span class="blankWord" data-a="7わり">？？？</span>）は 森林。<br>
        ② 苗木を 植えてから 木材に 使えるようになるまで（<span class="blankWord" data-a="40〜50年">？？？</span>）くらい かかる。<br>
        ③ 間伐を しないと、下草が 育たず 土が（<span class="blankWord" data-a="むきだし">？？？</span>）に なってしまう。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 森林</b> でした！ 日本の 国土の 約7わりは 森林。世界の 国々の 中でも トップクラスの 森林の 多さなんだよ。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🌲 <b>おうちミッション</b><br>家の 中に ある、木で できた ものを 5つ さがしてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#241a0d'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'kanbatsu', scope: { type: 'glow' }, kanbatsuLevel: 5, kanbatsuAnimT: 1, kanbatsuResult: 'good' });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 森と くらしについて、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「人工林って 何？」「間伐は なぜ 必要？」`);
      setButtons([
        { label: '🌳 森の種類の 図', cls: 'sub', cb: () => this.show('shurui') },
        { label: '🌱 木を育てる 図', cls: 'sub', cb: () => this.show('sodateru') },
        { label: '💧 森のはたらきの 図', cls: 'sub', cb: () => this.show('hataraki') },
        { label: '🪑 木材とくらしの 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_kanbatsu などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);

</script>
</body>
</html>
