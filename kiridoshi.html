<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   キリドオシの関 — 鎌倉幕府の成立（小6社会・歴史・協力型・1ファイル）
   平氏の栄華と滅亡（清盛の政治・壇ノ浦の戦い）→ 頼朝と鎌倉（なぜ鎌倉か）→
   守護・地頭を置く（1185年・全国支配） → 御恩と奉公のバランス（天びんで） →
   はかせ（承久の乱と北条政子）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  kiyomori: ruby('平清盛', 'たいらのきよもり'),
  heiji: ruby('平治の乱', 'へいじのらん'),
  daijodaijin: ruby('太政大臣', 'だじょうだいじん'),
  nissou: ruby('日宋貿易', 'にっそうぼうえき'),
  dannoura: ruby('壇ノ浦の戦い', 'だんのうらのたたかい'),
  yoritomo: ruby('源頼朝', 'みなもとのよりとも'),
  yoshitsune: ruby('源義経', 'みなもとのよしつね'),
  samuraidokoro: ruby('侍所', 'さむらいどころ'),
  shugo: ruby('守護', 'しゅご'),
  jitou: ruby('地頭', 'じとう'),
  goon: ruby('御恩', 'ごおん'),
  houkou: ruby('奉公', 'ほうこう'),
  gokenin: ruby('御家人', 'ごけにん'),
  bakufu: ruby('鎌倉幕府', 'かまくらばくふ'),
  seii: ruby('征夷大将軍', 'せいいたいしょうぐん'),
  jokyu: ruby('承久の乱', 'じょうきゅうのらん'),
  gotoba: ruby('後鳥羽上皇', 'ごとばじょうこう'),
  masako: ruby('北条政子', 'ほうじょうまさこ'),
  rokuhara: ruby('六波羅探題', 'ろくはらたんだい'),
};

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

// ---------- 発見ポイントの共通描画 ----------
function drawPoints(X, Y, sc, points, foundSet) {
  points.forEach(p => {
    const done = foundSet.has(p.key);
    const px = X(p.x), py = Y(p.y);
    gctx.beginPath(); gctx.arc(px, py, 24 * sc, 0, TAU);
    gctx.fillStyle = done ? '#2e4a5e' : '#fff';
    gctx.fill();
    gctx.strokeStyle = '#17211d'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.fillStyle = done ? '#fff' : '#2e4a5e';
    gctx.font = `700 ${18 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(p.letter, px, py + 1 * sc);
  });
}

// ---------- 空の背景 ----------
function bgSky(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#dfe6f0'); g.addColorStop(1, '#c4ccdc');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.fillStyle = '#e8dcb8';
  gctx.fillRect(X(0), Y(560), 1000 * sc, 80 * sc);
}

// ---------- 宮殿のシルエット ----------
function drawPalace(X, Y, sc, cx, baseY) {
  gctx.fillStyle = '#46697e'; gctx.strokeStyle = '#1c2622'; gctx.lineWidth = 2.4 * sc;
  gctx.beginPath();
  gctx.rect(X(cx - 90), Y(baseY - 90), 180 * sc, 90 * sc);
  gctx.fill(); gctx.stroke();
  gctx.fillStyle = '#3a3f4c';
  gctx.beginPath();
  gctx.moveTo(X(cx - 120), Y(baseY - 90)); gctx.lineTo(X(cx - 70), Y(baseY - 150));
  gctx.lineTo(X(cx + 70), Y(baseY - 150)); gctx.lineTo(X(cx + 120), Y(baseY - 90));
  gctx.closePath(); gctx.fill(); gctx.stroke();
  gctx.fillStyle = '#ffce54';
  gctx.beginPath(); gctx.arc(X(cx), Y(baseY - 150), 8 * sc, 0, TAU); gctx.fill();
}

function drawKamakuraScene(X, Y, sc) {

  g.addColorStop(0, '#dfe6f0'); g.addColorStop(1, '#a8c8d8');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.strokeStyle = 'rgba(255,255,255,.5)'; gctx.lineWidth = 2 * sc;
  for (let i = 0; i < 4; i++) {
    const wy = 460 + i * 35;
    gctx.beginPath();
    for (let x = 0; x <= 1000; x += 40) {
      const yy = wy + Math.sin(x / 60) * 5;
      if (x === 0) gctx.moveTo(X(x), Y(yy)); else gctx.lineTo(X(x), Y(yy));
    }
    gctx.stroke();
  }
  gctx.fillStyle = '#5a6b62'; gctx.strokeStyle = '#17211d'; gctx.lineWidth = 2.4 * sc;
  function mountain(cx, topY, baseY, w) {
    gctx.beginPath();
    gctx.moveTo(X(cx - w / 2), Y(baseY)); gctx.lineTo(X(cx), Y(topY)); gctx.lineTo(X(cx + w / 2), Y(baseY));

// ---------- 租庸調の天びん（メイン操作） ----------
function drawBalance(X, Y, sc, cx, cy, tilt, leftLabel, leftIcon, rightLabel, rightIcon) {
  const armLen = 220, armAngle = tilt * 0.22;
  gctx.strokeStyle = '#17211d'; gctx.lineWidth = 6 * sc; gctx.lineCap = 'round';
  gctx.beginPath(); gctx.moveTo(X(cx), Y(cy)); gctx.lineTo(X(cx), Y(cy + 140)); gctx.stroke();
  gctx.fillStyle = '#17211d';
  gctx.beginPath(); gctx.moveTo(X(cx - 40), Y(cy + 140)); gctx.lineTo(X(cx + 40), Y(cy + 140)); gctx.lineTo(X(cx + 30), Y(cy + 156)); gctx.lineTo(X(cx - 30), Y(cy + 156)); gctx.closePath(); gctx.fill();

  const lx = cx - Math.cos(armAngle) * armLen, ly = cy - Math.sin(armAngle) * armLen;
  const rx = cx + Math.cos(armAngle) * armLen, ry = cy + Math.sin(armAngle) * armLen;
  gctx.strokeStyle = tilt !== 0 ? '#b8523a' : '#17211d'; gctx.lineWidth = (tilt !== 0 ? 6 : 5) * sc;
  gctx.beginPath(); gctx.moveTo(X(lx), Y(ly)); gctx.lineTo(X(rx), Y(ry)); gctx.stroke();
  gctx.beginPath(); gctx.arc(X(cx), Y(cy), 7 * sc, 0, TAU); gctx.fillStyle = '#d4900f'; gctx.fill();

  [[lx, ly, leftLabel, leftIcon], [rx, ry, rightLabel, rightIcon]].forEach(([px, py, label, icon]) => {
    const dy = 34;
    gctx.strokeStyle = '#17211d'; gctx.lineWidth = 2 * sc;
    gctx.beginPath(); gctx.moveTo(X(px), Y(py)); gctx.lineTo(X(px), Y(py + dy)); gctx.stroke();
    gctx.fillStyle = '#fff'; gctx.strokeStyle = '#17211d'; gctx.lineWidth = 2.5 * sc;
    gctx.beginPath(); gctx.ellipse(X(px), Y(py + dy + 20), 58 * sc, 16 * sc, 0, 0, TAU); gctx.fill(); gctx.stroke();
    gctx.font = `${26 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(icon, X(px), Y(py + dy + 18));
    gctx.fillStyle = '#17211d'; gctx.font = `700 ${13 * sc}px sans-serif`;
    gctx.fillText(label, X(px), Y(py + dy + 46));
  });
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'heike') drawHeikeScene(X, Y, sc);
  else if (S.scene === 'kamakura') drawKamakuraScene(X, Y, sc);
  else if (S.scene === 'shugo') drawShugoScene(X, Y, sc);
  else if (S.scene === 'goon') drawGoonScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawGoonScene(X, Y, sc);
}

// ---------- まほうのめがね（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#eef4f5'); grd.addColorStop(1, '#a8bcc2');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#2e4a5e'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔎', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'tilt') {
    const deg = Math.round(S.goon.tiltF * 12);
    sctx.font = `700 ${R * 0.26}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillStyle = '#2e4a5e';
    sctx.fillText((deg >= 0 ? '+' : '') + deg + '°', R, R * 0.78);
    label('てんびんの かたむき');
  } else if (mode === 'scroll') {
    sctx.fillStyle = '#8a5a3a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('📜', R, R * 0.85);
    label(S.scope.name || '記録');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffe9a8'); g2.addColorStop(1, 'rgba(255,233,168,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#2e4a5e'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🚦', R, R * 0.85);
    label('たしかめ かんりょう！');
  } else {
    sctx.fillStyle = '#2e4a5e'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔭', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.09}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#1c2622';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#2e4a5e', '#ffe9a8', '#46697e', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

const bubbleEl = $('bubble'), wishEl = $('wishCard'), btnRow = $('btnRow');
function say(html) {
  bubbleEl.style.animation = 'none'; void bubbleEl.offsetWidth;
  bubbleEl.style.animation = ''; bubbleEl.innerHTML = html;
}
function setWish(icon, html) {
  wishEl.style.display = 'flex';
  wishEl.querySelector('.icon').textContent = icon;
  wishEl.querySelector('.wbody').innerHTML = html;
}
function hideWish() { wishEl.style.display = 'none'; }
function setButtons(list) {
  btnRow.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.cls ? ' ' + b.cls : '');
    el.innerHTML = b.label;
    el.onclick = () => { sTap(); b.cb(el); };
    btnRow.appendChild(el);
  });
}
function award(id) {
  if (S.badges.has(id)) return;
  S.badges.add(id);
  $('bd_' + id).classList.add('on');
  if (typeof recordBadge === 'function') recordBadge(S.badges.size, document.querySelectorAll('#badges .badge').length);
}
const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }
const controlsEl = $('controls');
function setControls(list) {
  controlsEl.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'ctl' + (b.cls ? ' ' + b.cls : ''); el.innerHTML = b.label;
    el.disabled = !!b.disabled;
    el.onclick = () => { if (el.disabled) return; ac(); b.cb(el); };
    controlsEl.appendChild(el);
  });
}

      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 頼朝から 受けた 御恩への 感謝と、政子の 呼びかけで 心が まとまったから', 'イ 朝廷の 方が 弱そうに 見えたから', 'ウ ただの 偶然で'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- ふりかえりタイム：5ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      if (slide.video) {
        const videoUrl = `https://www.youtube.com/watch?v=${slide.video}`;
        showOverlay(`
          <h2>${slide.icon} ふりかえりタイム（${n}/${total}）${slide.title}</h2>
          <div id="furikaeriThumb" style="max-width:380px;margin:0 auto;cursor:pointer">
            <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
              <img src="https://img.youtube.com/vi/${slide.video}/hqdefault.jpg" style="width:100%;display:block;opacity:.85">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <div style="width:15%;aspect-ratio:1;min-width:56px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(24px,3vw,34px)">▶</div>
              </div>
            </div>
            <div style="margin-top:.5em;color:#5a6478;font-size:clamp(12px,1.3vw,16px)">タップすると 新しい タブで 動画が ひらくよ</div>
          </div>
          <p class="talk">${slide.text()}</p>
          <button class="btn" id="furikaeriNextBtn">${isLast ? 'まとめへ すすむ' : 'つぎへ'}</button>
          <div class="foot">先生へ：動画は外部サイト(YouTube)の発信元です。内容を事前にご確認ください。URL: ${videoUrl}</div>
        `);
        $('furikaeriThumb').onclick = () => { sTap(); window.open(videoUrl, '_blank', 'noopener'); };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' }, goon: { tiltF: 0 } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ キリドオシの関 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 国ごとに 置かれ、軍事や 警察を 担当した 役目を（<span class="blankWord" data-a="守護">？？？</span>）と いう。<br>
        ② 荘園や 公領ごとに 置かれ、年貢の 取り立てを 行った 役目を（<span class="blankWord" data-a="地頭">？？？</span>）と いう。<br>
        ③ 将軍が 御家人に 土地を 守り、新しい 土地を 与える ことを（<span class="blankWord" data-a="御恩">？？？</span>）と いう。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 1185年ごろ</b> でした！ 守護・地頭を 全国に 置いた この 年を、今の 教科書では 鎌倉幕府の 実質的な 始まりと 考えているんだよ。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>おうちの人に「もし 何かを して もらったら、お礼に 何を するべきだと 思う？」と 聞いてみよう。御恩と 奉公のように、たがいに 支えあう 関係について、いっしょに 話してみてね。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#17211d'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'goon', scope: { type: 'glow' }, goon: { tiltF: 0 } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 鎌倉幕府の 成立について、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「御恩と 奉公って どんな しくみ？」「守護と 地頭は 何を したの？」`);
      setButtons([
        { label: '🏯 平氏の 図', cls: 'sub', cb: () => this.show('heike') },
        { label: '⛰️ 鎌倉の 図', cls: 'sub', cb: () => this.show('kamakura') },
        { label: '🗾 守護・地頭の 図', cls: 'sub', cb: () => this.show('shugo') },
        { label: '⚖️ 天びんの 図', cls: 'sub', cb: () => this.show('goon') },
        { label: '⚔️ 承久の乱の 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      if (scene === 'goon') { S.goon.tiltF = 0; }
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_shugo などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
