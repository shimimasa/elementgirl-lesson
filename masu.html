<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================

   検地を知る（検地帳・検地竿・京枡）→ 一地一作人（検地帳に記録される
   のはただ1人）→ 刀狩のバランス（数値階段・メイン操作）→ 朝鮮出兵
   （文禄・慶長の役）→ はかせ（兵農分離の完成・関ヶ原への道）。
   「ヒナワの陣」（戦国・鉄砲伝来〜長篠の戦い）の直後、「ケヤリの道」
   （江戸幕府成立・参勤交代）の前史にあたる。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  taikou: ruby('太閤', 'たいこう'),
  kenchi: ruby('検地', 'けんち'),
  kenchichou: ruby('検地帳', 'けんちちょう'),
  kenchizao: ruby('検地竿', 'けんちざお'),
  kyouMasu: ruby('京枡', 'きょうます'),
  kokudaka: ruby('石高', 'こくだか'),
  shouen: ruby('荘園領主', 'しょうえんりょうしゅ'),
  jitou: ruby('地頭', 'じとう'),
  nanushi: ruby('名主', 'なぬし'),
  katanagari: ruby('刀狩', 'かたながり'),
  katanagarirei: ruby('刀狩令', 'かたながりれい'),
  houkouji: ruby('方広寺', 'ほうこうじ'),
  daibutsu: ruby('大仏', 'だいぶつ'),
  heinoubunri: ruby('兵農分離', 'へいのうぶんり'),
  bunroku: ruby('文禄の役', 'ぶんろくのえき'),
  keichou: ruby('慶長の役', 'けいちょうのえき'),
  sekigahara: ruby('関ヶ原の戦い', 'せきがはらのたたかい'),
  ieyasu: ruby('徳川家康', 'とくがわいえやす'),
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 検地を知る：手がかり ----------

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

// ---------- 発見ポイントの共通描画 ----------
function drawPoints(X, Y, sc, points, foundSet) {
  points.forEach(p => {
    const done = foundSet.has(p.key);
    const px = X(p.x), py = Y(p.y);
    gctx.beginPath(); gctx.arc(px, py, 24 * sc, 0, TAU);
    gctx.fillStyle = done ? '#a83828' : '#fff';
    gctx.fill();
    gctx.strokeStyle = '#4a2a10'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.fillStyle = done ? '#fff' : '#a83828';
    gctx.font = `700 ${18 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(p.letter, px, py + 1 * sc);
  });
}

// ---------- 田畑と空の背景 ----------
function bgScene(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#e8c078'); g.addColorStop(1, '#9a7a4a');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  const g2 = gctx.createLinearGradient(0, Y(500), 0, Y(640));
  g2.addColorStop(0, '#7a6248'); g2.addColorStop(1, '#5a4a38');
  gctx.fillStyle = g2;
  gctx.fillRect(X(0), Y(500), 1000 * sc, 140 * sc);
}

function drawKenchiScene(X, Y, sc) {

  gctx.fillStyle = '#d4af37'; gctx.strokeStyle = '#4a2a10'; gctx.lineWidth = 2.4 * sc;

// ---------- 一地一作人（メイン操作） ----------
function drawIchiScene(X, Y, sc) {
  bgScene(X, Y, sc);
  const cx = 500, cy = 420, f = S.ichi.f;
  // 田んぼ
  gctx.fillStyle = '#c8e6a0'; gctx.strokeStyle = '#4a2a10'; gctx.lineWidth = 3 * sc;
  gctx.beginPath(); gctx.roundRect(X(cx - 120), Y(cy - 40), 240 * sc, 100 * sc, 10 * sc); gctx.fill(); gctx.stroke();
  gctx.fillStyle = '#4a2a10'; gctx.font = `700 ${20 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('田', X(cx), Y(cy + 10));

  const offs = [
    { dx: -110, dy: -170, fly: [-70, -60] },
    { dx: 110, dy: -170, fly: [70, -60] },
    { dx: 0, dy: -110, fly: [0, -40] },
  ];
  ICHI_TAGS.forEach((tag, i) => {
    const o = offs[i];
    const isLast = i === 2;
    const alpha = isLast ? 1 : (1 - f);
    if (alpha <= 0.02) return;
    const px = cx + o.dx + o.fly[0] * f, py = cy + o.dy + o.fly[1] * f;
    const scale = isLast ? (1 + f * 0.2) : 1;
    gctx.save();
    gctx.globalAlpha = alpha;
    const bw = 150 * scale, bh = 50 * scale;
    gctx.fillStyle = isLast ? '#f3d968' : '#fff';
    gctx.strokeStyle = isLast && f > 0.5 ? '#a83828' : '#4a2a10';
    gctx.lineWidth = (isLast && f > 0.5 ? 3.4 : 2.2) * sc;
    gctx.beginPath(); gctx.roundRect(X(px - bw / 2), Y(py - bh / 2), bw * sc, bh * sc, 8 * sc); gctx.fill(); gctx.stroke();
    gctx.fillStyle = '#3a2210'; gctx.font = `700 ${16 * scale * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(tag.sub, X(px), Y(py));
    gctx.restore();
  });

  if (f > 0.6) {
    const a2 = clamp((f - 0.6) / 0.4, 0, 1);
    gctx.save(); gctx.globalAlpha = a2;
    gctx.fillStyle = '#a83828';
    gctx.beginPath(); gctx.roundRect(X(cx - 90), Y(cy + 70), 180 * sc, 44 * sc, 8 * sc); gctx.fill();
    gctx.fillStyle = '#fff'; gctx.font = `700 ${18 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText('検地帳に 記録', X(cx), Y(cy + 92));
    gctx.restore();
  }
}

function drawKatanagariScene(X, Y, sc, kataF) {
  bgScene(X, Y, sc);

  const pileX = 260, pileY = 500, count = Math.round(kataF * 8);

  gctx.fillText('あつめた 刀', X(pileX), Y(pileY - 130));
  for (let i = 0; i < count; i++) {
    const ang = -0.9 + i * 0.24;
    const bx = pileX + (i % 4) * 6 - 9, by = pileY - i * 5;
    gctx.save();
    gctx.translate(X(bx), Y(by));
    gctx.rotate(ang);
    gctx.strokeStyle = '#c8c8d0'; gctx.lineWidth = 4 * sc; gctx.lineCap = 'round';
    gctx.beginPath(); gctx.moveTo(0, 0); gctx.lineTo(70 * sc, 0); gctx.stroke();

  const forgeX = 720, forgeY = 460;

  gctx.fillStyle = grd; gctx.beginPath(); gctx.arc(X(forgeX), Y(forgeY), 90 * sc, 0, TAU); gctx.fill();
  gctx.fillStyle = '#5a4a38'; gctx.strokeStyle = '#4a2a10'; gctx.lineWidth = 2.6 * sc;
  gctx.beginPath(); gctx.roundRect(X(forgeX - 60), Y(forgeY - 10), 120 * sc, 60 * sc, 10 * sc); gctx.fill(); gctx.stroke();

  }

  gctx.fillText('釘・かすがいに', X(forgeX), Y(forgeY - 40));

  // 農民と農具（右奥、多すぎると農具が消える）
  const farmX = 860, farmY = 560;
  gctx.fillStyle = '#fdf0c8'; gctx.strokeStyle = '#4a2a10'; gctx.lineWidth = 2.2 * sc;
  gctx.beginPath(); gctx.arc(X(farmX), Y(farmY - 34), 16 * sc, 0, TAU); gctx.fill(); gctx.stroke();
  const hoeAlpha = kataF >= 0.95 ? clamp((1 - (kataF - 0.95) / 0.05), 0, 1) : 1;

  gctx.beginPath(); gctx.moveTo(X(farmX + 20), Y(farmY - 10)); gctx.lineTo(X(farmX + 40), Y(farmY + 30)); gctx.stroke();
  gctx.fillStyle = '#3a2210';
  gctx.beginPath(); gctx.roundRect(X(farmX + 34), Y(farmY + 26), 16 * sc, 8 * sc, 3 * sc); gctx.fill();
  gctx.restore();
  gctx.fillStyle = '#3a2210'; gctx.font = `700 ${16 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(hoeAlpha > 0.3 ? '農具は のこる' : '農具まで なくなった…', X(farmX), Y(farmY + 60));

  gctx.fillStyle = '#3a2210'; gctx.font = `700 ${22 * sc}px sans-serif`; gctx.textAlign = 'center';
  gctx.fillText(`武器を 集めた 割合 ${Math.round(kataF * 100)}%（目もり ${NUMS[S.kataN - 1]}）`, X(500), Y(140));

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'kenchi') drawKenchiScene(X, Y, sc);
  else if (S.scene === 'ichi') drawIchiScene(X, Y, sc);
  else if (S.scene === 'katanagari') drawKatanagariScene(X, Y, sc, S.kata.f);
  else if (S.scene === 'choutou') drawChoutouScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawKatanagariScene(X, Y, sc, S.kata.f);
}

// ---------- ますめがね（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fdf0c8'); grd.addColorStop(1, '#d4af37');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#a83828'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔎', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'pile') {
    const pct = Math.round(S.kata.f * 100);
    sctx.font = `700 ${R * 0.26}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillStyle = '#a83828';
    sctx.fillText(pct + '%', R, R * 0.78);
    label('武器を あつめた 割合');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#f3d968'); g2.addColorStop(1, 'rgba(216,201,138,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#a83828'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🚦', R, R * 0.85);
    label('たしかめ かんりょう！');
  } else {
    sctx.fillStyle = '#a83828'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔭', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.09}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#3a2210';
    sctx.fillText(txt, R, ly);
  }
}

let particles = [];

  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#a83828', '#f3d968', '#d4af37', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

  });

const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }

        <p class="talk">検地と 刀狩で 武士と 農民の 身分が 分かれ、この あと 徳川家康が 力を 強めて、江戸幕府の 時代へと 進んでいくんだよ。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#4a2a10'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'katanagari', scope: { type: 'glow' }, kata: { f: 0.9 } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 秀吉の 全国統一について、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「検地って 何？」「刀狩の 建前は 何だった？」`);
      setButtons([
        { label: '📜 検地を 知るの 図', cls: 'sub', cb: () => this.show('kenchi') },
        { label: '📐 一地一作人の 図', cls: 'sub', cb: () => this.show('ichi') },
        { label: '⚔️ 刀狩の バランスの 図', cls: 'sub', cb: () => this.show('katanagari') },
        { label: '⛵ 朝鮮出兵の 図', cls: 'sub', cb: () => this.show('choutou') },
        { label: '🏯 はかせの 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      if (scene === 'ichi') { S.ichi.f = 1; }
      if (scene === 'katanagari') { S.kata.f = 0.9; }
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_katanagari などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
