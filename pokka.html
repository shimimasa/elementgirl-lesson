<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ポカポカの里 — 天気の様子・気温の1日の変化（小4理科・気象分野2作目・協力型・1ファイル）
   気温の正しいはかり方（発見型）→ 時こく送りで気温グラフ（メイン操作・時こく①〜⑧）→
   晴れvsくもり・雨のグラフ比べ → 水のゆくえ（発見型・気体つぶビューア）→
   はかせ（気温がいちばん高くなる午後2時ごろの生活の知恵）。
   数値：気温は地上1.2〜1.5m・風通しのよい日かげではかる（気象庁の観測基準）。
   晴れの日は太陽が最も高くなる正午（南中）から2時間ほど遅れて、午後2時ごろに
   気温が最高になる（地面が太陽にあたためられ、その熱が空気に伝わるまでに時間が
   かかるため）。くもり・雨の日は1日の気温の変化が小さい。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
const plain = s => s.replace(/<[^>]+>/g, '');
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {
  kion: ruby('気温', 'きおん'),
  taiyou: ruby('太陽', 'たいよう'),
  shougo: ruby('正午', 'しょうご'),
  jimen: ruby('地面', 'じめん'),
  kuuki: ruby('空気', 'くうき'),
  tenki: ruby('天気', 'てんき'),
  seirei: ruby('精霊', 'せいれい'),
  jouhatsu: ruby('蒸発', 'じょうはつ'),
  ketsuro: ruby('結露', 'けつろ'),
  suijouki: ruby('水蒸気', 'すいじょうき'),
  nissha: ruby('直射日光', 'ちょくしゃにっこう'),
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 数値データ（本物度） ----------
// m_hakarikata：気温の正しいはかり方（発見型）
const HAKARIKATA_CARDS = [

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#fff8e8'); g.addColorStop(1, '#ffdca0');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
}

// ---------- カード描画（発見型ミッション共通） ----------
function drawCardGrid(X, Y, sc, cards, foundSet, cols, title) {
  bgFill(X, Y, sc);
  const xs3 = [220, 500, 780];
  const xs4 = [180, 380, 620, 820];
  const xs2 = [340, 660];
  cards.forEach((c, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const px = cols === 3 ? xs3[col] : cols === 2 ? xs2[col] : xs4[col];
    const py = row === 0 ? 250 : 440;
    const done = foundSet.has(c.key);
    gctx.beginPath(); gctx.arc(X(px), Y(py), 46 * sc, 0, TAU);
    gctx.fillStyle = done ? '#e8791e' : '#ffe4b8';
    gctx.fill(); gctx.strokeStyle = '#d9720f'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(c.icon, X(px), Y(py - 2));
    gctx.fillStyle = '#4a2e10'; gctx.font = `700 ${13 * sc}px sans-serif`;
    gctx.fillText((c.num || c.letter) + ' ' + plain(c.name), X(px), Y(py + 62));
  });
  gctx.fillStyle = '#4a2e10'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(title, X(500), Y(70));
}

// ---------- 気温グラフ共通描画（時こく送り／晴れくもり比較で共用） ----------
const GX0 = 120, GX1 = 900, GY0 = 190, GY1 = 520;
function graphX(i) { return GX0 + (GX1 - GX0) * (i / (TIMES.length - 1)); }
function graphY(temp) { return GY1 - (GY1 - GY0) * ((temp - TEMP_MIN) / (TEMP_MAX - TEMP_MIN)); }
function drawSkyAndSun(X, Y, sc, floatIdx) {
  const skyG = gctx.createLinearGradient(0, Y(30), 0, Y(190));
  skyG.addColorStop(0, '#fff3d2'); skyG.addColorStop(1, '#ffe4b8');
  gctx.fillStyle = skyG; gctx.fillRect(X(60), Y(30), 880 * sc, 160 * sc);
  // 太陽の弧（演出用、南中=正午で最も高い）
  const sunAlt = lerpArr(ALT, floatIdx);
  const sunX = graphX(floatIdx);
  const sunY = 185 - (sunAlt / 66) * 130;
  gctx.beginPath(); gctx.arc(X(sunX), Y(sunY), 22 * sc, 0, TAU);
  gctx.fillStyle = '#ffcb3f'; gctx.fill(); gctx.strokeStyle = '#e8791e'; gctx.lineWidth = 2 * sc; gctx.stroke();
  gctx.fillStyle = '#8a5a2e'; gctx.font = `700 ${12 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'top';
  gctx.fillText('太陽の高さ', X(sunX), Y(sunY - 40));
}
function drawGraphAxes(X, Y, sc) {
  gctx.strokeStyle = '#c9a06a'; gctx.lineWidth = 2 * sc;
  gctx.beginPath(); gctx.moveTo(X(GX0), Y(GY0)); gctx.lineTo(X(GX0), Y(GY1)); gctx.lineTo(X(GX1), Y(GY1)); gctx.stroke();
  TIMES.forEach((tm, i) => {
    const x = graphX(i);
    gctx.strokeStyle = '#f0dcb0'; gctx.lineWidth = 1 * sc;
    gctx.beginPath(); gctx.moveTo(X(x), Y(GY0)); gctx.lineTo(X(x), Y(GY1)); gctx.stroke();
    gctx.fillStyle = '#8a5a2e'; gctx.font = `700 ${13 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'top';
    gctx.fillText(NUMS[i], X(x), Y(GY1 + 8));
    gctx.font = `${11 * sc}px sans-serif`;
    gctx.fillText(tm + '時', X(x), Y(GY1 + 26));
  });
  [TEMP_MIN, 14, 20, TEMP_MAX].forEach(v => {
    gctx.fillStyle = '#a67a4a'; gctx.font = `${11 * sc}px sans-serif`; gctx.textAlign = 'right'; gctx.textBaseline = 'middle';
    gctx.fillText(v + '℃', X(GX0 - 10), Y(graphY(v)));
  });
}
function drawTempLine(X, Y, sc, temps, upToFloat, color) {
  const upTo = Math.min(upToFloat, TIMES.length - 1);
  gctx.beginPath();
  for (let i = 0; i <= Math.floor(upTo); i++) {
    const x = graphX(i), y = graphY(temps[i]);
    if (i === 0) gctx.moveTo(X(x), Y(y)); else gctx.lineTo(X(x), Y(y));
  }
  const frac = upTo - Math.floor(upTo);
  if (frac > 0 && Math.floor(upTo) < temps.length - 1) {
    const i0 = Math.floor(upTo), i1 = i0 + 1;
    const t = temps[i0] + (temps[i1] - temps[i0]) * frac;
    gctx.lineTo(X(graphX(upTo)), Y(graphY(t)));
  }
  gctx.strokeStyle = color; gctx.lineWidth = 4 * sc; gctx.lineJoin = 'round'; gctx.lineCap = 'round'; gctx.stroke();
  for (let i = 0; i <= Math.floor(upTo); i++) {
    const x = graphX(i), y = graphY(temps[i]);
    gctx.beginPath(); gctx.arc(X(x), Y(y), 6 * sc, 0, TAU);
    gctx.fillStyle = color; gctx.fill(); gctx.strokeStyle = '#fff'; gctx.lineWidth = 1.6 * sc; gctx.stroke();
  }
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'hakarikata') drawHakarikataScene(X, Y, sc);
  else if (S.scene === 'jikoku') drawJikokuScene(X, Y, sc);
  else if (S.scene === 'hikaku') drawHikakuScene(X, Y, sc);
  else if (S.scene === 'yukue') drawYukueScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- ポッカのめもり（丸窓） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fffdf5'); grd.addColorStop(1, '#ffdca0');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'thermo') {
    drawThermo(R, S.scope.temp, S.scope.label);
  } else if (mode === 'particles') {
    drawWaterParticles(R, S.scope.pct);
    label(S.scope.label || '');
  } else if (mode === 'point') {
    sctx.fillStyle = '#d9720f';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffe3a888'); g2.addColorStop(1, 'rgba(255,227,168,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#d9720f'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('☀️', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#d9720f'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#4a2e10';
    sctx.fillText(txt, R, ly);
  }

  function drawThermo(R, temp, lb) {
    const cx = R, topY = R * 0.35, botY = R * 1.5, bulbR = R * 0.22, tubeW = R * 0.13;
    const frac = clamp(((temp || 0) - TEMP_MIN) / (TEMP_MAX - TEMP_MIN), 0, 1);
    sctx.strokeStyle = '#c9a06a'; sctx.lineWidth = R * 0.03;
    sctx.beginPath(); sctx.roundRect(cx - tubeW / 2, topY, tubeW, botY - topY, tubeW / 2); sctx.stroke();
    sctx.beginPath(); sctx.arc(cx, botY, bulbR, 0, TAU); sctx.strokeStyle = '#c9a06a'; sctx.stroke();
    const fillTop = botY - (botY - topY) * frac;
    sctx.beginPath(); sctx.roundRect(cx - tubeW / 2 + 2, fillTop, tubeW - 4, botY - fillTop, (tubeW - 4) / 2); sctx.fillStyle = '#e8632c'; sctx.fill();
    sctx.beginPath(); sctx.arc(cx, botY, bulbR - 3, 0, TAU); sctx.fillStyle = '#e8632c'; sctx.fill();
    sctx.fillStyle = '#4a2e10'; sctx.font = `700 ${R * 0.13}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(Math.round(temp || 0) + '℃', cx + R * 0.5, R * 0.7);
    label(lb || '');
  }

  function drawWaterParticles(R, pct) {
    const total = 25;
    const nWater = clamp(Math.round(total * (pct || 0) / 100), 0, total);
    const cols = 5, rows = 5, cellSize = R * 0.26;
    const startX = R - (cols - 1) * cellSize / 2, startY = R * 0.62 - (rows - 1) * cellSize / 2;
    let idx = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (idx >= total) break;
        const px = startX + c * cellSize, py = startY + r * cellSize;
        sctx.beginPath(); sctx.arc(px, py, cellSize * 0.36, 0, TAU);
        sctx.fillStyle = idx < nWater ? '#4fa6d9' : '#dccca0'; sctx.fill();
        sctx.strokeStyle = 'rgba(255,255,255,.6)'; sctx.lineWidth = 1; sctx.stroke();
        idx++;
      }
    }
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#d9720f', '#e8632c', '#ffd54f', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ポカポカの里 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>4つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 気温は 地上1.2〜1.5m・（<span class="blankWord" data-a="風通しのよい日かげ">？？？</span>）で はかる。<br>
        ② 晴れの日、太陽が いちばん 高い ${W.shougo}より、気温が いちばん 高くなるのは（<span class="blankWord" data-a="午後2時ごろ">？？？</span>）。<br>
        ③ くもり・雨の日は、気温の 変化が（<span class="blankWord" data-a="小さい">？？？</span>）。<br>
        ④ 水は ${W.jouhatsu}して 目に 見えない（<span class="blankWord" data-a="水蒸気">？？？</span>）に なる。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ ${W.shougo}より あとが いちばん 高い</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>①晴れた日の 朝と 昼すぎで、外の あたたかさが どう ちがうか 感じてみよう。<br>②冷たい 飲み物を 入れた コップを 少し 置いておいて、外がわに 水てきが つくか かんさつしてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#d9720f'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「温度計はどんな場所ではかる？」「気温がいちばん高くなるのはいつ？」「コップに水てきがつくのはなぜ？」`);
      setButtons([
        { label: '📏 気温の正しいはかり方の図', cls: 'sub', cb: () => this.show('hakarikata') },
        { label: '📈 気温グラフの図', cls: 'sub', cb: () => this.show('jikoku') },
        { label: '⚖️ 晴れvsくもりの図', cls: 'sub', cb: () => this.show('hikaku') },
        { label: '💧 水のゆくえの図', cls: 'sub', cb: () => this.show('yukue') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_jikoku などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
