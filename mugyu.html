<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ムギュの実験小屋 — とじこめた空気や水・空気と水の性質（小4理科・粒子分野3作目・協力型・1ファイル）
   空気でっぽうのしくみを発見しよう（発見型）→ とじこめた空気をおしてみよう（メイン操作・①〜⑧の数値階段）→
   とじこめた水をおしてみよう（対照実験・同じ①〜⑧のUIで体積が変わらないことを発見）→
   くらしの中の空気の力を発見しよう（発見型）→ はかせ（空気の力とくらしの安全）。
   数値：学習指導要領・小4理科「とじこめた空気や水」＝閉じ込めた空気に力を加えると体積は小さくなるが
   押し返す力は大きくなり、閉じ込めた水は力を加えても体積がほとんど変わらない（非圧縮性）。
   体積変化はボイルの法則（圧力と体積は反比例）に基づく実際の比率で計算：
   60mLの空気を圧力係数1.00〜3.00気圧相当でおしたときの体積＝60/係数（60,52,46,40,34,30,24,20mL）。
   水は8段階すべて60mL固定（WebSearchで裏取り済み）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
const plain = s => s.replace(/<[^>]+>/g, '');
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {
  seirei: ruby('精霊', 'せいれい'),
  taiseki: ruby('体積', 'たいせき'),
  asshuku: ruby('圧縮', 'あっしゅく'),
  kuukiatsu: ruby('空気圧', 'くうきあつ'),
};

const NUMS = '①②③④⑤⑥⑦⑧';
// canvas専用のプレーン文字列（W.taisekiはルビ入りHTML文字列なのでplain()を通しても
// タグが消えるだけで<rt>内の読みは残り「体積たいせき」のように連結表示されてしまう。
// canvasのfillTextに渡す時は必ずこの安全なプレーン文字列を使う）
const N_TAISEKI = 'たいせき';

// ---------- 数値データ（本物度） ----------
// m_teppou：空気でっぽうのしくみを発見しよう（発見型）
const TEPPOU_CARDS = [

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));

const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#eef9ff'); g.addColorStop(1, '#bfe3f5');

}

const STAGE_DOTS_BASE = [
  { x: 0.12, y: 0.22 }, { x: 0.32, y: 0.15 }, { x: 0.55, y: 0.28 }, { x: 0.78, y: 0.18 }, { x: 0.90, y: 0.42 },

  { x: 0.48, y: 0.85 }, { x: 0.68, y: 0.78 }, { x: 0.88, y: 0.85 }, { x: 0.05, y: 0.4 },
];
const BARREL_L = 220, BARREL_R = 780, BARREL_TOP = 220, BARREL_BOT = 360;
function drawTube(X, Y, sc, volMl, isWater) {
  const volFrac = clamp(volMl / 60, 0, 1);
  const capW = 20, pistonHeadW = 18;
  const chamberRight = BARREL_R - capW;
  const chamberLeftAtFull = BARREL_L + pistonHeadW + 30;
  const chamberFullLen = chamberRight - chamberLeftAtFull;
  const pistonX = chamberRight - volFrac * chamberFullLen;

  // 筒（バレル）本体
  gctx.fillStyle = '#ffffff'; gctx.strokeStyle = '#0c3346'; gctx.lineWidth = 3 * sc;
  gctx.beginPath(); gctx.roundRect(X(BARREL_L), Y(BARREL_TOP), (BARREL_R - BARREL_L) * sc, (BARREL_BOT - BARREL_TOP) * sc, 14 * sc);
  gctx.fill(); gctx.stroke();

  // 先たん（キャップ／ノズル）
  gctx.fillStyle = '#1976a8';
  gctx.beginPath(); gctx.roundRect(X(BARREL_R - 4), Y(BARREL_TOP + 20), (capW + 16) * sc, (BARREL_BOT - BARREL_TOP - 40) * sc, 6 * sc); gctx.fill();

  // 中の空気／水（チャンバー）
  const chTop = BARREL_TOP + 14, chBot = BARREL_BOT - 14;
  gctx.save();
  gctx.beginPath(); gctx.rect(X(pistonX), Y(chTop), (chamberRight - pistonX) * sc, (chBot - chTop) * sc); gctx.clip();
  if (isWater) {
    gctx.fillStyle = '#bfe3f5';
    gctx.fillRect(X(pistonX), Y(chTop), (chamberRight - pistonX) * sc, (chBot - chTop) * sc);
    gctx.fillStyle = '#1f5f96';
    gctx.fillRect(X(pistonX), Y(chTop), (chamberRight - pistonX) * sc, (chBot - chTop) * sc);
  } else {
    gctx.fillStyle = '#f5fbff';
    gctx.fillRect(X(BARREL_L), Y(chTop), (chamberRight - BARREL_L) * sc, (chBot - chTop) * sc);
    STAGE_DOTS_BASE.forEach(p => {
      const px = pistonX + p.x * (chamberRight - pistonX), py = chTop + p.y * (chBot - chTop);
      gctx.beginPath(); gctx.arc(X(px), Y(py), 9 * sc, 0, TAU);
      gctx.fillStyle = '#6cc3ea'; gctx.fill();
      gctx.strokeStyle = '#1976a8'; gctx.lineWidth = 1.4 * sc; gctx.stroke();
    });
  }
  gctx.restore();

  // おし棒（ピストン＋ロッド）
  gctx.fillStyle = '#0c3346';
  gctx.beginPath(); gctx.roundRect(X(pistonX - pistonHeadW / 2), Y(BARREL_TOP - 6), pistonHeadW * sc, (BARREL_BOT - BARREL_TOP + 12) * sc, 4 * sc); gctx.fill();
  const rodStartX = BARREL_L - 60;
  gctx.fillStyle = '#7bb8d4';
  gctx.fillRect(X(rodStartX), Y((BARREL_TOP + BARREL_BOT) / 2 - 7), (pistonX - pistonHeadW / 2 - rodStartX) * sc, 14 * sc);
  gctx.beginPath(); gctx.arc(X(rodStartX), Y((BARREL_TOP + BARREL_BOT) / 2), 16 * sc, 0, TAU);
  gctx.fillStyle = '#0c3346'; gctx.fill();

  // 目もり（mL）
  gctx.strokeStyle = '#1976a8'; gctx.fillStyle = '#2f6b8a'; gctx.font = `700 ${11 * sc}px sans-serif`; gctx.textAlign = 'center';
  for (let v = 0; v <= 60; v += 10) {
    const tx = chamberLeftAtFull + (1 - v / 60) * chamberFullLen;
    gctx.lineWidth = 1.6 * sc;
    gctx.beginPath(); gctx.moveTo(X(tx), Y(BARREL_BOT + 6)); gctx.lineTo(X(tx), Y(BARREL_BOT + 16)); gctx.stroke();
    gctx.fillText(String(v), X(tx), Y(BARREL_BOT + 30));
  }
  return { volFrac, pistonX };
}
function drawResistBar(X, Y, sc, cx, cy, w, h, pct) {
  gctx.fillStyle = '#bfe3f5';
  gctx.beginPath(); gctx.roundRect(X(cx - w / 2), Y(cy - h / 2), w * sc, h * sc, 6 * sc); gctx.fill();
  const fillW = w * clamp(pct / 100, 0, 1);
  gctx.fillStyle = '#ff8a3d';
  gctx.beginPath(); gctx.roundRect(X(cx - w / 2), Y(cy - h / 2), fillW * sc, h * sc, 6 * sc); gctx.fill();
  gctx.strokeStyle = '#1976a8'; gctx.lineWidth = 2.4 * sc;
  gctx.strokeRect(X(cx - w / 2), Y(cy - h / 2), w * sc, h * sc);
  gctx.fillStyle = '#133a4d'; gctx.font = `700 ${14 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('てごたえ', X(cx), Y(cy - h / 2 - 16));

}

      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#1976a8', '#6cc3ea', '#ff8a3d', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {

  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['タイヤの色をきれいに保つため', 'パンクやじこをふせぐため', '音を大きくするため'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- ふりかえりタイム：4ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      hideOverlay();
      scopeBurst();
      say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
      setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ムギュの実験小屋 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>4つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① とじこめた 空気を おすと、体積は（<span class="blankWord" data-a="ちいさく">？？？</span>）なる。<br>
        ② とじこめた 水を おすと、体積は（<span class="blankWord" data-a="かわらない">？？？</span>）。<br>
        ③ ちぢんだ 空気が もとに もどろうとする 力を「（<span class="blankWord" data-a="おし返す">？？？</span>）力」という。<br>
        ④ 自転車の タイヤの 中には（<span class="blankWord" data-a="空気">？？？</span>）が おしこまれている。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ かわらない</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>①ペットボトルや ふくろに 空気を とじこめて、手で おしてみよう。水を 入れた ふくろとも くらべてみよう。<br>②自転車が あれば、タイヤを おして かたさを かくにんしてみよう（おうちの人と いっしょに）。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#1976a8'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「空気でっぽうの玉が飛ぶのはなぜ？」「おす力を強くすると空気の体積は？」「水をおすと体積はどうなる？」`);
      setButtons([
        { label: '💨 空気でっぽうの図', cls: 'sub', cb: () => this.show('teppou') },
        { label: '🌬️ 空気をおす図', cls: 'sub', cb: () => this.show('oshiku') },
        { label: '💧 水をおす図', cls: 'sub', cb: () => this.show('mizu') },
        { label: '🚲 くらしの例の図', cls: 'sub', cb: () => this.show('kurashi') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_oshiku などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
