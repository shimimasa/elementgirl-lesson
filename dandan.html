<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ダンダンの実験場 — 温度と体積・あたたまり方（小4理科・協力型・1ファイル）
   空気の温度と体積（発見型）→
   金属の温度と体積（発見型・空気との対比）→
   金属のあたたまり方=伝導（メイン操作・時間送り）→
   水と空気のあたたまり方=対流（発見型）→
   はかせ（くらしの中の伝導・対流の利用と安全）。
   数値はシャルルの法則・実在の金属球膨張実験・示温インクの変色温度(約40℃)に基づく。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {
  taiseki: ruby('体積', 'たいせき'),
  ondo: ruby('温度', 'おんど'),
  dendou: ruby('伝導', 'でんどう'),
  tairyu: ruby('対流', 'たいりゅう'),
  bouchou: ruby('膨張', 'ぼうちょう'),
  kinzoku: ruby('金属', 'きんぞく'),
  seirei: ruby('精霊', 'せいれい'),
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 数値データ（本物度） ----------
// 空気：シャルルの法則（0℃を基準に1℃ごとに1/273）。20℃を基準(100)に80℃で約120、0℃で約93
const KUKI_BASE_T = 20, KUKI_HOT_T = 80, KUKI_COLD_T = 0;
const KUKI_BASE_V = 100, KUKI_HOT_V = Math.round(100 * (273 + KUKI_HOT_T) / (273 + KUKI_BASE_T)), KUKI_COLD_V = Math.round(100 * (273 + KUKI_COLD_T) / (273 + KUKI_BASE_T));
// 金属（黄銅の体積膨張率 約57×10^-6/℃）：100℃上がっても体積は約0.57%しか増えない
const KINZOKU_HOT_T = 80, KINZOKU_FIRE_T = 300;
// 金属のあたたまり方＝伝導：熱した点からの距離(cm)と、40℃(示温インクの変色温度)に達するモデル時間(秒)＝0.2×距離^2

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function bgBench(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#fdf6ec'); g.addColorStop(1, '#eee6da');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.fillStyle = '#d8c8ae';
  gctx.fillRect(X(0), Y(560), 1000 * sc, 80 * sc);
}
function tempColor(t) {
  const f = clamp((t - 5) / 60, 0, 1);
  const r = Math.round(lerp(70, 217, f)), g = Math.round(lerp(140, 80, f)), b = Math.round(lerp(200, 47, f));
  return `rgb(${r},${g},${b})`;
}

// ---------- 1．空気の温度と体積 ----------
function drawKukiScene(X, Y, sc) {
  bgBench(X, Y, sc);
  const cx = 500, neckTopY = 260, bulbCy = 420, bulbR = 90;
  const t = S.kukiAnimT;
  const targetV = S.kukiState === 'hot' ? KUKI_HOT_V : S.kukiState === 'cold' ? KUKI_COLD_V : KUKI_BASE_V;
  const curV = lerp(KUKI_BASE_V, targetV, t);
  const bubbleScale = curV / KUKI_BASE_V;
  // 容器（湯/氷水）
  if (S.kukiState) {
    const bathColor = S.kukiState === 'hot' ? 'rgba(217,80,47,.18)' : 'rgba(58,122,184,.18)';
    gctx.fillStyle = bathColor;
    roundRect(gctx, X(cx - 170), Y(bulbCy - 130), 340 * sc, 260 * sc, 20 * sc);
    gctx.fill();
  }
  // フラスコ
  gctx.fillStyle = 'rgba(207,232,251,.35)'; gctx.strokeStyle = '#8fb0cc'; gctx.lineWidth = 4 * sc;
  gctx.beginPath(); gctx.arc(X(cx), Y(bulbCy), bulbR * sc, 0, TAU); gctx.fill(); gctx.stroke();
  gctx.fillStyle = 'rgba(207,232,251,.35)';
  gctx.fillRect(X(cx - 14), Y(neckTopY), 28 * sc, (bulbCy - neckTopY) * sc);
  gctx.strokeRect(X(cx - 14), Y(neckTopY), 28 * sc, (bulbCy - neckTopY) * sc);
  // せっけん膜（体積に応じて膨らむ）
  const membR = 22 * bubbleScale;
  gctx.save();
  gctx.globalAlpha = 0.8;
  const g2 = gctx.createRadialGradient(X(cx) - 6 * sc, Y(neckTopY) - 6 * sc, 2, X(cx), Y(neckTopY), membR * sc);
  g2.addColorStop(0, 'rgba(255,255,255,.9)'); g2.addColorStop(1, 'rgba(180,220,255,.5)');
  gctx.fillStyle = g2;
  gctx.beginPath(); gctx.arc(X(cx), Y(neckTopY), membR * sc, 0, TAU); gctx.fill();
  gctx.strokeStyle = '#8fb0cc'; gctx.lineWidth = 1.6 * sc; gctx.stroke();
  gctx.restore();
  gctx.fillStyle = '#2a2a2a'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  const label = !S.kukiState ? 'ボタンで お湯・氷水に つけてみよう' : `${S.kukiState === 'hot' ? 'お湯(約80℃)' : '氷水(約0℃)'}　体積：約${Math.round(curV)}（20℃を100とした場合）`;
  gctx.fillText(label, X(500), Y(70));
}

// ---------- 2．金属の温度と体積 ----------
function drawKinzokuScene(X, Y, sc) {
  bgBench(X, Y, sc);
  const ringCx = 380, ballCx = 660, cy = 360, ringR = 70;
  const t = S.kinzokuAnimT;
  const targetScale = S.kinzokuState === 'fire' ? 1.16 : S.kinzokuState === 'hotwater' ? 1.012 : 1;
  const curScale = lerp(1, targetScale, t);
  const ballR = ringR * 0.86 * curScale;
  // 輪（スタンド付き）
  gctx.strokeStyle = '#8a6a3a'; gctx.lineWidth = 8 * sc; gctx.lineCap = 'round';
  gctx.beginPath(); gctx.moveTo(X(ringCx), Y(cy + ringR + 10)); gctx.lineTo(X(ringCx), Y(cy + ringR + 60)); gctx.stroke();
  gctx.strokeStyle = '#5a4020'; gctx.lineWidth = 10 * sc;
  gctx.beginPath(); gctx.arc(X(ringCx), Y(cy), ringR * sc, 0, TAU); gctx.stroke();
  // 熱源
  if (S.kinzokuState) {
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(S.kinzokuState === 'fire' ? '🔥' : '♨️', X(ballCx), Y(cy + ringR + 40));
  }
  // 球（輪へ近づく演出）
  const passable = ballR <= ringR - 2;
  const ballX = lerp(ballCx, ringCx, t * 0.55 * (passable ? 1 : 0.5));
  gctx.save();
  gctx.shadowColor = 'rgba(217,150,60,.5)'; gctx.shadowBlur = 8 * sc;
  const g3 = gctx.createRadialGradient(X(ballX) - ballR * 0.3 * sc, Y(cy) - ballR * 0.3 * sc, 2, X(ballX), Y(cy), ballR * sc);
  g3.addColorStop(0, S.kinzokuState === 'fire' ? '#ffb060' : '#f0d090');
  g3.addColorStop(1, S.kinzokuState === 'fire' ? '#c2500a' : '#b8860a');
  gctx.fillStyle = g3;
  gctx.beginPath(); gctx.arc(X(ballX), Y(cy), ballR * sc, 0, TAU); gctx.fill();
  gctx.restore();
  if (t >= 0.95) {
    gctx.fillStyle = passable ? '#2f9a5a' : '#c1442e'; gctx.font = `700 ${20 * sc}px sans-serif`; gctx.textAlign = 'center';
    gctx.fillText(passable ? '通った ○' : '通らない ×', X(ringCx), Y(cy - ringR - 26));
  }
  gctx.fillStyle = '#2a2a2a'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  const label = !S.kinzokuState ? 'ボタンで 金属の球を あたためてみよう' : `${S.kinzokuState === 'fire' ? '火であぶる(約300℃)' : 'お湯であたためる(約80℃)'}`;
  gctx.fillText(label, X(500), Y(70));
}

// ---------- 3．金属のあたたまり方＝伝導（メイン操作） ----------
function drawDendouScene(X, Y, sc) {
  bgBench(X, Y, sc);
  const rodY = 340, rodX0 = 160, rodX1 = 880, rodH = 30;
  const elapsed = lerpArr(DENDOU_ELAPSED, S.dendouIdxDisplay);
  // 熱源
  gctx.font = `${40 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('🔥', X(rodX0 - 40), Y(rodY));
  // 棒
  const g = gctx.createLinearGradient(X(rodX0), 0, X(rodX1), 0);
  g.addColorStop(0, '#e8845a'); g.addColorStop(0.35, '#cbb896'); g.addColorStop(1, '#a8b8c4');
  gctx.fillStyle = g; gctx.strokeStyle = '#5a4a3a'; gctx.lineWidth = 2 * sc;
  roundRect(gctx, X(rodX0), Y(rodY - rodH / 2), (rodX1 - rodX0) * sc, rodH * sc, 6 * sc);
  gctx.fill(); gctx.stroke();
  // 示温インクの点
  DENDOU_POINTS.forEach(p => {
    const px = rodX0 + (p.d / 25) * (rodX1 - rodX0);
    const reached = elapsed >= p.t;
    const localTemp = reached ? THERMO_INK_TEMP + 6 : lerp(20, THERMO_INK_TEMP, clamp(elapsed / p.t, 0, 1));
    gctx.beginPath(); gctx.arc(X(px), Y(rodY), 16 * sc, 0, TAU);
    gctx.fillStyle = tempColor(localTemp);
    gctx.fill();
    gctx.strokeStyle = '#fff'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.fillStyle = '#2a2a2a'; gctx.font = `700 ${13 * sc}px sans-serif`; gctx.textAlign = 'center';
    gctx.fillText(`${p.d}cm`, X(px), Y(rodY + 34));
  });
  gctx.fillStyle = '#2a2a2a'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  const pressNum = Math.round(S.dendouIdxDisplay);
  const dendouLabel = pressNum === 0 ? `スタート　0びょう けいか` : `${NUMS[pressNum - 1]} ${Math.round(elapsed)}びょう けいか`;
  gctx.fillText(`${dendouLabel}　（${THERMO_INK_TEMP}℃で 色が 変わる 示温インク）`, X(500), Y(70));
}

// ---------- 4．水と空気のあたたまり方＝対流 ----------
function drawTairyuScene(X, Y, sc) {
  bgBench(X, Y, sc);
  const tankX0 = 260, tankX1 = 740, tankY0 = 180, tankY1 = 500;
  const t = S.tairyuAnimT;
  gctx.fillStyle = 'rgba(207,232,251,.55)'; gctx.strokeStyle = '#8fb0cc'; gctx.lineWidth = 4 * sc;
  gctx.fillRect(X(tankX0), Y(tankY0), (tankX1 - tankX0) * sc, (tankY1 - tankY0) * sc);
  gctx.strokeRect(X(tankX0), Y(tankY0), (tankX1 - tankX0) * sc, (tankY1 - tankY0) * sc);
  if (S.tairyuHeated) {
    // 熱源
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText('🔥', X((tankX0 + tankX1) / 2), Y(tankY1 + 40));
    // 上昇・循環する色つき粒
    const cx = (tankX0 + tankX1) / 2;
    for (let i = 0; i < 10; i++) {
      const phase = (t * 1.4 + i / 10) % 1;
      const loopA = phase * TAU;
      const rx = (tankX1 - tankX0) * 0.34, ry = (tankY1 - tankY0) * 0.36;
      const px = cx + Math.sin(loopA) * rx;
      const py = (tankY0 + tankY1) / 2 - Math.cos(loopA) * ry;
      const heat = 0.5 + 0.5 * Math.cos(loopA);
      gctx.beginPath(); gctx.arc(X(px), Y(py), 10 * sc, 0, TAU);
      gctx.fillStyle = tempColor(lerp(20, 45, heat));
      gctx.globalAlpha = 0.85; gctx.fill(); gctx.globalAlpha = 1;
    }
    // 循環矢印
    gctx.strokeStyle = 'rgba(90,70,50,.5)'; gctx.lineWidth = 2.4 * sc; gctx.setLineDash([8, 6]);
    gctx.beginPath(); gctx.ellipse(X(cx), Y((tankY0 + tankY1) / 2), (tankX1 - tankX0) * 0.34 * sc, (tankY1 - tankY0) * 0.36 * sc, 0, 0, TAU);
    gctx.stroke(); gctx.setLineDash([]);
  }
  gctx.fillStyle = '#2a2a2a'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(S.tairyuHeated ? 'あたたまった 水が 上へ、冷たい 水が 下へ動いている' : 'ボタンで 水そうの 底を 熱してみよう', X(500), Y(70));
}

// ---------- 5．はかせ：くらしの中の伝導・対流の利用 ----------
function drawHakaseScene(X, Y, sc) {
  bgBench(X, Y, sc);
  const xs = [180, 380, 620, 820];
  HAKASE_POINTS.forEach((p, i) => {
    const done = S.hakaseFound.has(p.key);
    const px = xs[i], py = 320;
    gctx.beginPath(); gctx.arc(X(px), Y(py), 46 * sc, 0, TAU);
    gctx.fillStyle = done ? '#ffd166' : '#ece4da';
    gctx.fill();
    gctx.strokeStyle = '#e0a020'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(p.icon, X(px), Y(py - 2));
    gctx.fillStyle = '#2a2a2a'; gctx.font = `700 ${13 * sc}px sans-serif`;
    gctx.fillText(p.letter + ' ' + p.name, X(px), Y(py + 62));
  });
  gctx.fillStyle = '#2a2a2a'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('伝導と対流は、くらしの いろいろな ところに いかされている', X(500), Y(70));
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'kuki') drawKukiScene(X, Y, sc);
  else if (S.scene === 'kinzoku') drawKinzokuScene(X, Y, sc);
  else if (S.scene === 'dendou') drawDendouScene(X, Y, sc);
  else if (S.scene === 'tairyu') drawTairyuScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- おんどのぞき窓（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fdf6ec'); grd.addColorStop(1, '#e4d8c4');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'thermo') {
    const temp = S.scope.temp, over = S.scope.over;
    const tubeX = R, tubeTop = R * 0.32, tubeBot = R * 1.28, bulbR = R * 0.22;
    sctx.strokeStyle = '#c9a888'; sctx.lineWidth = R * 0.09; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(tubeX, tubeTop); sctx.lineTo(tubeX, tubeBot); sctx.stroke();
    sctx.fillStyle = '#fff'; sctx.beginPath(); sctx.arc(tubeX, tubeBot, bulbR, 0, TAU); sctx.fill();
    const frac = clamp(temp / 100, 0, 1);
    const liqTop = lerp(tubeBot - R * 0.06, tubeTop + R * 0.08, frac);
    sctx.strokeStyle = tempColor(temp); sctx.lineWidth = R * 0.05; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(tubeX, tubeBot); sctx.lineTo(tubeX, liqTop); sctx.stroke();
    sctx.fillStyle = tempColor(temp); sctx.beginPath(); sctx.arc(tubeX, tubeBot, bulbR * 0.8, 0, TAU); sctx.fill();
    label(over ? `${Math.round(temp)}℃ 以上！` : `やく ${Math.round(temp)}℃`);
  } else if (mode === 'point') {
    sctx.fillStyle = '#c2500a';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffd16655'); g2.addColorStop(1, 'rgba(255,209,102,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#d9502f'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🌡️', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#d9502f'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.095}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#2a2a2a';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#ffd166', '#e8845a', '#7ec9a8', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

      markPicked(el);
      if (i === 1) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ なべつかみや 厚手の 布を 使って、やけどに 気をつけよう。急に 冷やすと 割れることも あるので 注意。`);
        setButtons([{ label: 'ふりかえりタイムへ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['素手ですぐ持つ', 'なべつかみや厚手の布を使う', '冷たい水で急に冷やす'], (i2, el2) => this.pick(i2, el2)));
      }
    },
  },

  // --- ふりかえりタイム：5ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      if (slide.video) {
        const videoUrl = `https://www.youtube.com/watch?v=${slide.video}`;
        showOverlay(`
          <h2>${slide.icon} ふりかえりタイム（${n}/${total}）${slide.title}</h2>
          <div id="furikaeriThumb" style="max-width:380px;margin:0 auto;cursor:pointer">
            <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
              <img src="https://img.youtube.com/vi/${slide.video}/hqdefault.jpg" style="width:100%;display:block;opacity:.85">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <div style="width:15%;aspect-ratio:1;min-width:56px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(24px,3vw,34px)">▶</div>
              </div>
            </div>
            <div style="margin-top:.5em;color:#3a7ab8;font-size:clamp(12px,1.3vw,16px)">タップすると 新しい タブで 動画が ひらくよ</div>
          </div>
          <p class="talk">${slide.text()}</p>
          <button class="btn" id="furikaeriNextBtn">${isLast ? 'まとめへ すすむ' : 'つぎへ'}</button>
          <div class="foot">先生へ：動画は外部サイト(YouTube)の教育系チャンネルです。内容を事前にご確認ください。URL: ${videoUrl}</div>
        `);
        $('furikaeriThumb').onclick = () => { sTap(); window.open(videoUrl, '_blank', 'noopener'); };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ダンダンの実験場 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 空気を あたためると、${W.taiseki}は（<span class="blankWord" data-a="増える">？？？</span>）。<br>
        ② ${W.kinzoku}は 熱した点から（<span class="blankWord" data-a="順番に">？？？</span>）あたたまる。これを ${W.dendou}と いう。<br>
        ③ 水や 空気は、あたたまった 部分が（<span class="blankWord" data-a="動いて">？？？</span>）全体に 伝わる。これを ${W.tairyu}と いう。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 動かず 順番に 伝わる</b>でした！${W.kinzoku}は 動かず 順番に 伝わり、水や 空気は 動いて 全体に 伝わる。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>あたたかい お茶や スープに 金属の スプーンを 入れて、持ち手まで だんだん 熱くなるか、おうちの人と いっしょに 確かめてみよう（やけどに 注意）。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#c2500a'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「空気を あたためると ${W.taiseki}は どうなる？」「${W.kinzoku}は どうやって あたたまる？」「水や 空気は どうやって あたたまる？」`);
      setButtons([
        { label: '💨 空気の温度と体積の 図', cls: 'sub', cb: () => this.show('kuki') },
        { label: '🔩 金属の温度と体積の 図', cls: 'sub', cb: () => this.show('kinzoku') },
        { label: '🔥 金属のあたたまり方の 図', cls: 'sub', cb: () => this.show('dendou') },
        { label: '🌊 水と空気のあたたまり方の 図', cls: 'sub', cb: () => this.show('tairyu') },
        { label: '🍳 くらしの中の伝導・対流の 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_dendou などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
