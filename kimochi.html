<style>

<script>
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;

// ---------- ベストきろく ----------
const BEST_KEY = 'kimochi_best';
function nsKey(base){
  try { return (typeof profileNamespacedKey === 'function') ? profileNamespacedKey(base) : base; }
  catch(e){ return base; }
}
function getBest(){
  const v = localStorage.getItem(nsKey(BEST_KEY));
  return v === null ? null : parseInt(v, 10);
}
function setBest(n){
  try { localStorage.setItem(nsKey(BEST_KEY), String(n)); } catch(e){}
}

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(740, 0, 0.08, 'triangle', 0.07);
const sNg = () => tone(220, 0, 0.16, 'sawtooth', 0.06);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

// ---------- 表情定義(200×200論理座標系。目・まゆ・くちの組み合わせ) ----------
const EMOTIONS = {
  ureshii: { label: 'うれしい', browAngle: 0, eyeType: 'normal', mouthType: 'smile' },
  kanashii: { label: 'かなしい', browAngle: -12, eyeType: 'normal', mouthType: 'frown' },
  okotteiru: { label: 'おこっている', browAngle: 14, eyeType: 'narrow', mouthType: 'straight' },
  bikkuri: { label: 'びっくり', browAngle: 9, eyeType: 'wide', mouthType: 'open' },
  komatteiru: { label: 'こまっている', browAngle: -9, eyeType: 'normal', mouthType: 'wavy' },
};
const EMOTION_KEYS = Object.keys(EMOTIONS);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function choiceCountForLevel(level) {
  if (level <= 2) return 3;
  if (level <= 5) return 4;
  return 5;
}
function buildChoices(correctKey, count) {
  const others = EMOTION_KEYS.filter(k => k !== correctKey);
  const dummies = shuffle(others).slice(0, count - 1);
  return shuffle([correctKey, ...dummies]);
}
function buildTrial(level) {
  const key = EMOTION_KEYS[Math.floor(Math.random() * EMOTION_KEYS.length)];
  const count = choiceCountForLevel(level);
  return { key, choices: buildChoices(key, count) };
}

// ---------- ゲーム状態 ----------
const S = {
  phase: 'title', // title | play | clear | fail | result
  levelsCleared: 0,
  currentKey: null,
  choices: null,
};

// ---------- 表情描画 ----------
function drawEyes(ctx, type) {
  ctx.fillStyle = '#3f4f9c';
  [72, 128].forEach(ex => {
    if (type === 'narrow') {
      ctx.beginPath();
      ctx.ellipse(ex, 88, 11, 4, 0, 0, TAU);
      ctx.fill();
    } else if (type === 'wide') {
      ctx.beginPath();
      ctx.arc(ex, 86, 13, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ex + 3, 82, 4, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#3f4f9c';
    } else {
      ctx.beginPath();
      ctx.arc(ex, 88, 9, 0, TAU);
      ctx.fill();
    }
  });
}
function drawBrows(ctx, angleDeg) {
  ctx.strokeStyle = '#3f4f9c';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  const rad = angleDeg * Math.PI / 180;
  [{ cx: 72, dir: 1 }, { cx: 128, dir: -1 }].forEach(({ cx, dir }) => {
    const dx = 16 * Math.cos(rad) * dir;
    const dy = 16 * Math.sin(rad);
    ctx.beginPath();
    ctx.moveTo(cx - dx, 62 - dy);
    ctx.lineTo(cx + dx, 62 + dy);
    ctx.stroke();
  });
}
function drawMouth(ctx, type) {
  ctx.strokeStyle = '#3f4f9c';
  ctx.fillStyle = '#3f4f9c';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  if (type === 'smile') {
    ctx.beginPath();
    ctx.arc(100, 122, 26, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  } else if (type === 'frown') {
    ctx.beginPath();
    ctx.arc(100, 155, 26, 1.15 * Math.PI, 1.85 * Math.PI);
    ctx.stroke();
  } else if (type === 'straight') {
    ctx.beginPath();
    ctx.moveTo(76, 135);
    ctx.lineTo(124, 135);
    ctx.stroke();
  } else if (type === 'open') {
    ctx.beginPath();
    ctx.ellipse(100, 138, 14, 18, 0, 0, TAU);
    ctx.fill();
  } else if (type === 'wavy') {
    ctx.beginPath();
    ctx.moveTo(74, 132);
    ctx.quadraticCurveTo(87, 124, 100, 132);
    ctx.quadraticCurveTo(113, 140, 126, 132);
    ctx.stroke();
  }
}
function drawFaceOn(canvasEl, key) {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvasEl.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width * dpr)), h = Math.max(1, Math.round(rect.height * dpr));
  if (canvasEl.width !== w || canvasEl.height !== h) { canvasEl.width = w; canvasEl.height = h; }
  const ctx = canvasEl.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, rect.width, rect.height);

  const scale = Math.min(rect.width, rect.height) / 200;
  const offX = (rect.width - 200 * scale) / 2, offY = (rect.height - 200 * scale) / 2;
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);

  ctx.fillStyle = '#ffe0b0';
  ctx.strokeStyle = '#e0a868';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(100, 105, 80, 0, TAU);
  ctx.fill();
  ctx.stroke();

  const def = EMOTIONS[key];
  drawBrows(ctx, def.browAngle);
  drawEyes(ctx, def.eyeType);
  drawMouth(ctx, def.mouthType);

  ctx.restore();
}

// ---------- キラキラ ----------
const fxCv = $('fx');
const fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 60); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 240;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#3f4f9c', '#6ec7a6', '#ffd66b', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function stageBurst() {
  const r = $('stageWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- HUD ----------
function updateHud() {
  $('roundChip').textContent = S.phase === 'title' ? 'れべる —' : `れべる ${S.levelsCleared + 1}`;
}
function updateBestChip() {
  const b = getBest();
  $('bestChip').textContent = (b === null) ? 'ベスト —' : `ベスト ${b} れべる`;
}
function updateBestInfo() {
  const b = getBest();
  const el = $('bestInfo');
  if (b !== null) {
    el.style.display = 'block';
    el.innerHTML = `<p>いまの ベストきろく：<b>${b} れべる</b></p>`;
  } else {
    el.style.display = 'none';
  }
}
function setResultMsg(text) { $('resultMsg').textContent = text; }

// ---------- 描画 ----------
function renderChoices() {
  const row = $('choiceButtons');
  row.innerHTML = '';
  S.choices.forEach(key => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cbtn';
    btn.textContent = EMOTIONS[key].label;
    btn.addEventListener('click', () => onChoiceTap(key));
    row.appendChild(btn);
  });
}

// ---------- ゲーム進行 ----------
function runLevel(level) {
  const trial = buildTrial(level);
  S.currentKey = trial.key;
  S.choices = trial.choices;
  S.phase = 'play';
  updateHud();
  setResultMsg('どんな きもちかな？');
  drawFaceOn($('faceCanvas'), S.currentKey);
  renderChoices();
}
function flashStage(cls) {
  const wrap = $('stageWrap');
  wrap.classList.add(cls);
  setTimeout(() => wrap.classList.remove(cls), 220);
}
function onChoiceTap(key) {
  if (S.phase !== 'play') return;
  ac();
  if (key === S.currentKey) {
    S.phase = 'clear';
    S.levelsCleared++;
    sTap(); sYes(); stageBurst();
    setResultMsg(`🎉 せいかい！ れべる${S.levelsCleared} クリア！（こたえ：${EMOTIONS[key].label}）`);
    setTimeout(() => {
      if (S.phase !== 'clear') return;
      runLevel(S.levelsCleared + 1);
    }, 1100);
  } else {
    S.phase = 'fail';
    sNg();
    flashStage('flash-ng');
    setResultMsg(`ちがったね…（こたえは「${EMOTIONS[S.currentKey].label}」だったよ）`);
    setTimeout(finishGame, 1300);
  }
}
function finishGame() {
  S.phase = 'result';
  const best = getBest();
  let isNewBest = false;
  if (S.levelsCleared > 0 && (best === null || S.levelsCleared > best)) {
    setBest(S.levelsCleared);
    isNewBest = true;
  }
  if (isNewBest) { sFanfare(); stageBurst(); }
  $('resultLevel').textContent = `${S.levelsCleared} れべる`;
  $('resultBestMsg').textContent = S.levelsCleared === 0
    ? 'つぎは がんばろう！'
    : (isNewBest ? '🎉 じぶんの ベストきろく こうしん！' : `ベストきろく：${best} れべる`);
  showOverlay('resultOverlay');
}
function startGame() {
  S.levelsCleared = 0;
  runLevel(1);
}

// ---------- オーバーレイ ----------
function showOverlay(id) { $(id).classList.remove('hide'); }
function hideOverlay(id) { $(id).classList.add('hide'); }

$('btnStart').addEventListener('click', () => {
  ac();
  hideOverlay('titleOverlay');
  startGame();
  updateBestChip();
});
$('btnRetry').addEventListener('click', () => {
  hideOverlay('resultOverlay');
  showOverlay('titleOverlay');
  updateBestChip();
  updateBestInfo();
});

// ---------- 起動 ----------
function boot() {
  showOverlay('titleOverlay');
  drawFaceOn($('titleDemoCanvas'), 'ureshii');
  updateHud();
  updateBestChip();
  updateBestInfo();
}

// ---------- ループ（キラキラ演出のみ） ----------
let lastT = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  drawFx(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
boot();
</script>
</body>
