<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   てこの工房 — てこのはたらき（小6理科・協力型・1ファイル）
   支点・力点・作用点の3点発見 → うでの長さとつり合い →
   おもさ×めもりの かけ算のつり合い発見 → 3種類のてこ探し →
   はかせ（遠くを持つほど楽になる＝反比例）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeOutBack(x) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  shiten: ruby('支点', 'してん'),
  rikiten: ruby('力点', 'りきてん'),
  sayouten: ruby('作用点', 'さようてん'),
  tsuriai: ruby('釣', 'つ') + 'り合い',
  omosa: ruby('重', 'おも') + 'さ',
  kyori: ruby('距離', 'きょり'),
  jikken: ruby('実験', 'じっけん'),
  kankei: ruby('関係', 'かんけい'),
  hatsumei: ruby('発明', 'はつめい'),
  douguya: ruby('道具屋', 'どうぐや'),
};

// ---------- 道具の3点データ（tool モード） ----------
const NUMS = '①②③④⑤⑥⑦⑧';
const TOOLS = {

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));
const sClank = () => { tone(220, 0, 0.14, 'square', 0.05); tone(180, 0.08, 0.22, 'square', 0.05); };

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

// ---------- 背景（道具工房） ----------
function drawWorkshopBG(t, X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(560));
  g.addColorStop(0, '#f7e9d2'); g.addColorStop(1, '#fbf3e2');
  gctx.fillStyle = g;
  gctx.fillRect(X(0), Y(0), 1000 * sc, 560 * sc);
  // 木の板かべ
  gctx.strokeStyle = 'rgba(160,110,60,.18)'; gctx.lineWidth = 2 * sc;
  for (let y = 40; y <= 420; y += 70) { gctx.beginPath(); gctx.moveTo(X(0), Y(y)); gctx.lineTo(X(1000), Y(y)); gctx.stroke(); }
  // まどからの ひざし
  gctx.fillStyle = 'rgba(255,224,150,.5)';
  gctx.beginPath(); gctx.arc(X(900), Y(70), 50 * sc, 0, TAU); gctx.fill();
  // 道具だな（かざり・すみ）
  gctx.strokeStyle = '#a0521f'; gctx.lineWidth = 3 * sc;
  gctx.beginPath(); gctx.moveTo(X(10), Y(30)); gctx.lineTo(X(130), Y(30)); gctx.stroke();
  const tools = ['🔧', '🔨', '🪛', '⚙️'];
  tools.forEach((ic, i) => {
    gctx.font = `${20 * sc}px sans-serif`; gctx.textAlign = 'center';
    gctx.fillText(ic, X(30 + i * 32), Y(16));
  });
  // ほしずくの お店への とびら（世界観の つながり）
  gctx.save();
  gctx.translate(X(945), Y(20));
  gctx.fillStyle = '#c9843f'; gctx.strokeStyle = '#7a4315'; gctx.lineWidth = 1.6 * sc;
  gctx.beginPath(); gctx.roundRect(-22 * sc, 0, 44 * sc, 56 * sc, 6); gctx.fill(); gctx.stroke();
  gctx.fillStyle = '#fff6e2'; gctx.font = `700 ${9 * sc}px sans-serif`; gctx.textAlign = 'center';
  gctx.fillText('ほしずく', 0, 14 * sc);
  gctx.fillText('の 店へ', 0, 24 * sc);
  gctx.restore();
  // さぎょうだい（あし場）
  gctx.fillStyle = '#c9a06a';
  gctx.fillRect(X(0), Y(560), 1000 * sc, 80 * sc);
  gctx.strokeStyle = 'rgba(140,100,50,.35)'; gctx.lineWidth = 1.5 * sc;
  for (let x = 60; x < 1000; x += 130) { gctx.beginPath(); gctx.moveTo(X(x), Y(560)); gctx.lineTo(X(x), Y(640)); gctx.stroke(); }
}

// ---------- 道具の絵（tool モード） ----------
function drawToolShape(key, X, Y, sc) {
  const tl = TOOLS[key];
  gctx.lineCap = 'round'; gctx.lineJoin = 'round';
  if (key === 'bar') {
    gctx.strokeStyle = '#8a8a90'; gctx.lineWidth = 20 * sc;
    gctx.beginPath(); gctx.moveTo(X(tl.effort.x), Y(tl.effort.y)); gctx.lineTo(X(tl.load.x), Y(tl.load.y)); gctx.stroke();
    // 支点(台)
    gctx.fillStyle = '#7a4315';
    gctx.beginPath(); gctx.moveTo(X(tl.fulcrum.x - 30), Y(tl.fulcrum.y + 34)); gctx.lineTo(X(tl.fulcrum.x + 30), Y(tl.fulcrum.y + 34)); gctx.lineTo(X(tl.fulcrum.x), Y(tl.fulcrum.y)); gctx.closePath(); gctx.fill();
    // つめ(作用点)
    gctx.strokeStyle = '#8a8a90'; gctx.lineWidth = 12 * sc;
    gctx.beginPath(); gctx.moveTo(X(tl.load.x), Y(tl.load.y)); gctx.lineTo(X(tl.load.x - 30), Y(tl.load.y - 26)); gctx.stroke();
    gctx.fillStyle = '#5a3a1a'; gctx.font = `700 ${16 * sc}px sans-serif`; gctx.textAlign = 'center';
    gctx.fillText('くぎ', X(tl.load.x - 40), Y(tl.load.y - 30));
  } else if (key === 'scissors') {
    gctx.strokeStyle = 'rgba(140,140,150,.55)'; gctx.lineWidth = 14 * sc;
    gctx.beginPath(); gctx.moveTo(X(500 - (tl.load.x - 500)), Y(tl.load.y)); gctx.lineTo(X(tl.fulcrum.x), Y(tl.fulcrum.y)); gctx.lineTo(X(500 - (tl.effort.x - 500)), Y(tl.effort.y)); gctx.stroke();
    gctx.strokeStyle = '#8a8a90'; gctx.lineWidth = 14 * sc;
    gctx.beginPath(); gctx.moveTo(X(tl.load.x), Y(tl.load.y)); gctx.lineTo(X(tl.fulcrum.x), Y(tl.fulcrum.y)); gctx.lineTo(X(tl.effort.x), Y(tl.effort.y)); gctx.stroke();
    gctx.fillStyle = '#c9843f'; gctx.beginPath(); gctx.arc(X(tl.fulcrum.x), Y(tl.fulcrum.y), 12 * sc, 0, TAU); gctx.fill();
    [tl.effort.x, 500 - (tl.effort.x - 500)].forEach(ex => {
      gctx.strokeStyle = '#5a3a1a'; gctx.lineWidth = 5 * sc; gctx.beginPath();
      gctx.arc(X(ex), Y(tl.effort.y + 20), 20 * sc, 0, TAU); gctx.stroke();
    });
  } else if (key === 'opener') {
    gctx.strokeStyle = '#8a8a90'; gctx.lineWidth = 16 * sc;
    gctx.beginPath(); gctx.moveTo(X(tl.fulcrum.x), Y(tl.fulcrum.y)); gctx.lineTo(X(tl.effort.x), Y(tl.effort.y)); gctx.stroke();
    gctx.beginPath(); gctx.moveTo(X(tl.fulcrum.x), Y(tl.fulcrum.y)); gctx.lineTo(X(tl.fulcrum.x + 18), Y(tl.fulcrum.y - 30)); gctx.stroke();
    gctx.fillStyle = '#5a3a1a'; gctx.font = `700 ${16 * sc}px sans-serif`; gctx.textAlign = 'center';
    gctx.fillText('びんの ふち', X(tl.fulcrum.x - 30), Y(tl.fulcrum.y + 30));
    gctx.strokeStyle = '#c9843f'; gctx.lineWidth = 10 * sc;
    gctx.beginPath(); gctx.moveTo(X(tl.load.x), Y(tl.load.y + 20)); gctx.lineTo(X(tl.load.x), Y(tl.load.y - 20)); gctx.stroke();
    gctx.fillStyle = '#5a3a1a';
    gctx.fillText('キャップ', X(tl.load.x), Y(tl.load.y + 46));
  } else if (key === 'tweezers') {
    gctx.strokeStyle = '#8a8a90'; gctx.lineWidth = 10 * sc;
    [-1, 1].forEach(dir => {
      gctx.beginPath();
      gctx.moveTo(X(tl.fulcrum.x), Y(tl.fulcrum.y));
      gctx.quadraticCurveTo(X(tl.fulcrum.x + dir * 40), Y(tl.effort.y), X(tl.fulcrum.x + dir * 14), Y(tl.load.y));
      gctx.stroke();
    });
    gctx.fillStyle = '#c9843f';
    gctx.beginPath(); gctx.ellipse(X(tl.fulcrum.x), Y(tl.fulcrum.y), 16 * sc, 10 * sc, 0, 0, TAU); gctx.fill();
  }
}
function drawToolPoints(X, Y, sc, showAll) {
  ['fulcrum', 'effort', 'load'].forEach(k => {
    const p = TOOLS[S.tool][k];
    const known = showAll || S.hitPts[k];
    gctx.beginPath(); gctx.arc(X(p.x), Y(p.y), 22 * sc, 0, TAU);
    gctx.fillStyle = known ? PT_COLOR[k] : 'rgba(255,255,255,.85)';
    gctx.fill();
    gctx.strokeStyle = known ? '#3a2a1a' : '#c9a06a'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    if (known) {
      gctx.fillStyle = '#fff'; gctx.font = `700 ${13 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
      gctx.fillText(PT_LABEL[k].replace(/<[^>]+>/g, '')[0], X(p.x), Y(p.y));
    }
    if (S.askKey === k && !S.hitPts[k]) {
      gctx.strokeStyle = `rgba(200,120,30,${0.6 + 0.35 * Math.sin(performance.now() / 180)})`;
      gctx.lineWidth = 3; gctx.setLineDash([8, 6]);
      gctx.beginPath(); gctx.arc(X(p.x), Y(p.y), 32 * sc, 0, TAU); gctx.stroke();
      gctx.setLineDash([]);
    }
  });
}
function drawTool(t, X, Y, sc) {
  drawWorkshopBG(t, X, Y, sc);
  if (!S.tool) return;
  drawToolShape(S.tool, X, Y, sc);
  drawToolPoints(X, Y, sc, S.phase === 'reveal' || S.phase === 'quiz2');
  gctx.fillStyle = '#5a3a1a'; gctx.font = `700 ${Math.max(13, 19 * sc)}px sans-serif`; gctx.textAlign = 'center';
  gctx.fillText(TOOLS[S.tool].name, X(500), Y(560));
}

// ---------- シーソー実験の絵（seesaw モード） ----------
function weightRadius(w) { return 16 + w * 0.55; }
function drawSeesaw(t, X, Y, sc) {
  drawWorkshopBG(t, X, Y, sc);
  if (!S.mission) return;
  const px = PIVOT.x, py = PIVOT.y;
  // 台座
  gctx.fillStyle = '#7a4315';
  gctx.beginPath(); gctx.moveTo(X(px - 42), Y(py + 60)); gctx.lineTo(X(px + 42), Y(py + 60)); gctx.lineTo(X(px), Y(py)); gctx.closePath(); gctx.fill();
  gctx.strokeStyle = '#5a3010'; gctx.lineWidth = 2 * sc; gctx.stroke();

  gctx.save();
  gctx.translate(X(px), Y(py));
  gctx.rotate(S.tiltAngle);
  const armLen = 8 * SCALE_PX;
  // 棒
  gctx.strokeStyle = '#c9843f'; gctx.lineWidth = 14 * sc; gctx.lineCap = 'round';
  gctx.beginPath(); gctx.moveTo(-armLen * sc, 0); gctx.lineTo(armLen * sc, 0); gctx.stroke();
  gctx.strokeStyle = '#a0521f'; gctx.lineWidth = 2 * sc; gctx.stroke();
  // めもり
  for (let n = 1; n <= 8; n++) {
    [-1, 1].forEach(dir => {
      const mx = dir * n * SCALE_PX * sc;
      gctx.strokeStyle = '#7a4315'; gctx.lineWidth = 2 * sc;
      gctx.beginPath(); gctx.moveTo(mx, -10 * sc); gctx.lineTo(mx, 10 * sc); gctx.stroke();
      gctx.fillStyle = '#5a3a1a'; gctx.font = `700 ${11 * sc}px sans-serif`; gctx.textAlign = 'center';
      gctx.fillText(NUMS[n - 1], mx, 26 * sc);
    });
  }
  // 支点マーク
  gctx.fillStyle = '#d84a3a'; gctx.beginPath(); gctx.arc(0, 0, 9 * sc, 0, TAU); gctx.fill();

  // おもり
  function weight(pos, w, color, label) {
    const wx = -pos * SCALE_PX * sc;
    const r = weightRadius(w) * sc;
    gctx.fillStyle = color; gctx.strokeStyle = '#3a2a1a'; gctx.lineWidth = 2 * sc;
    gctx.beginPath(); gctx.roundRect(wx - 3 * sc, -r - 14 * sc, 6 * sc, 14 * sc, 2); gctx.fill();
    gctx.beginPath(); gctx.arc(wx, -r - 14 * sc, r, 0, TAU); gctx.fill(); gctx.stroke();
    gctx.fillStyle = '#fff'; gctx.font = `700 ${Math.max(11, 14 * sc)}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(label, wx, -r - 14 * sc);
  }
  weight(S.mission.leftPos, S.mission.leftW, '#3d7fd8', S.mission.leftW + 'g');
  if (S.mission.rightPlaced) weight(S.rightPos, S.mission.rightW, '#3fa04a', S.mission.rightW + 'g');
  gctx.restore();

  if (S.mission.rightPlaced && (S.phase === 'ask' || S.phase === 'pending')) {
    gctx.fillStyle = 'rgba(160,82,31,.9)'; gctx.font = `700 ${Math.max(13, 18 * sc)}px sans-serif`; gctx.textAlign = 'center';
    gctx.fillText('めもり ' + NUMS[S.rightPos - 1] + ' に セット中', X(px), Y(py + 110));
  }
}

function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.stageMode === 'tool') drawTool(t, X, Y, sc);
  else drawSeesaw(t, X, Y, sc);
}

// ---------- しくみメガネ（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fbf3e2'); grd.addColorStop(1, '#e8cd9c');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    const k = S.scope.key;
    sctx.fillStyle = PT_COLOR[k];
    sctx.beginPath(); sctx.arc(R, R * 0.92, R * 0.26, 0, TAU); sctx.fill();
    sctx.strokeStyle = '#3a2a1a'; sctx.lineWidth = R * 0.03; sctx.stroke();
    label(PT_LABEL[k].replace(/<[^>]+>/g, ''));
  } else if (mode === 'torque') {
    // 左右の力のおおきさを棒グラフで比較
    const l = S.scope.left, r = S.scope.right;
    const maxV = Math.max(l, r, 1);
    const barW = R * 0.34;
    [['ひだり', l, R * 0.55, '#3d7fd8'], ['みぎ', r, R * 1.45, '#3fa04a']].forEach(([lb, v, cx, col]) => {
      const bh = (v / maxV) * R * 0.85;
      sctx.fillStyle = col;
      sctx.beginPath(); sctx.roundRect(cx - barW / 2, h - R * 0.32 - bh, barW, bh, 6); sctx.fill();
      sctx.fillStyle = '#5a3a1a'; sctx.font = `700 ${R * 0.09}px sans-serif`; sctx.textAlign = 'center';
      sctx.fillText(lb, cx, h - R * 0.14);
    });
    label(Math.abs(l - r) < 0.01 ? 'つり合ってる！' : (l > r ? 'ひだりが おもい' : 'みぎが おもい'));
  } else if (mode === 'kind') {
    const kind = S.scope.kind;
    const y0 = R * 0.55;
    sctx.strokeStyle = '#a0521f'; sctx.lineWidth = R * 0.045; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(R * 0.35, y0); sctx.lineTo(R * 1.65, y0); sctx.stroke();
    const order = kind === 1 ? ['effort', 'fulcrum', 'load'] : kind === 2 ? ['fulcrum', 'load', 'effort'] : ['fulcrum', 'effort', 'load'];
    const xs = [R * 0.35, R, R * 1.65];
    order.forEach((k, i) => {
      sctx.fillStyle = PT_COLOR[k];
      sctx.beginPath(); sctx.arc(xs[i], y0, R * 0.11, 0, TAU); sctx.fill();
      sctx.strokeStyle = '#3a2a1a'; sctx.lineWidth = R * 0.02; sctx.stroke();
    });
    label(KIND_NAME[kind]);
  } else {
    sctx.fillStyle = '#c9a06a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔧', R, R * 0.85);
    label('タップして しらべよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#7a4315';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#a0521f', '#ffce54', '#e0863f', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (S.anim.tilting) {
    S.tiltT = clamp(S.tiltT + dt / 1.1, 0, 1);
    S.tiltAngle = lerp(S.anim.fromAngle, S.anim.toAngle, easeInOut(S.tiltT));
    if (S.tiltT >= 1) {
      S.anim.tilting = false;
      const step = STEPS[FLOW[S.stepIndex]];
      if (step.onTiltDone) step.onTiltDone();
    }
  }

  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

// ---------- タッチ（道具の点を しらべる） ----------
stageCv.addEventListener('pointerdown', ev => {
  ac();
  if (!S.tapEnabled || S.stageMode !== 'tool' || !S.tool) return;
  const r = stageCv.getBoundingClientRect();
  const { sc, ox, oy } = mapTransform(r.width, r.height);
  const mx = (ev.clientX - r.left - ox) / sc, my = (ev.clientY - r.top - oy) / sc;
  ['fulcrum', 'effort', 'load'].forEach(k => {
    const p = TOOLS[S.tool][k];
    if (Math.hypot(mx - p.x, my - p.y) < 34) {
      sTap();
      const step = STEPS[FLOW[S.stepIndex]];
      if (step.onPointTap) step.onPointTap(k);
    }
  });
});

window.addEventListener('keydown', ev => {

});

const bubbleEl = $('bubble'), wishEl = $('wishCard'), btnRow = $('btnRow');
function say(html) {

}
function setWish(icon, html) {
  wishEl.style.display = 'flex';
  wishEl.querySelector('.icon').textContent = icon;
  wishEl.querySelector('.wbody').innerHTML = html;
}
function hideWish() { wishEl.style.display = 'none'; }
function setButtons(list) {
  btnRow.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.cls ? ' ' + b.cls : '');
    el.innerHTML = b.label;
    el.onclick = () => { sTap(); b.cb(el); };
    btnRow.appendChild(el);
  });
}
function award(id) {
  if (S.badges.has(id)) return;
  S.badges.add(id);
  $('bd_' + id).classList.add('on');
  if (typeof recordBadge === 'function') recordBadge(S.badges.size, document.querySelectorAll('#badges .badge').length);
}
const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }
const controlsEl = $('controls');
function setControls(list) {
  controlsEl.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'ctl' + (b.cls ? ' ' + b.cls : ''); el.innerHTML = b.label;
    el.disabled = !!b.disabled;
    el.onclick = () => { if (el.disabled) return; ac(); b.cb(el); };
    controlsEl.appendChild(el);
  });
}
function posButtons(cb) {
  const list = [];
  for (let n = 1; n <= 8; n++) {
    list.push({ label: NUMS[n - 1], cls: 'pos' + (S.rightPos === n ? ' sel' : ''), cb: () => cb(n) });
  }
  return list;
}
function updateLoc() {

    $('stageTitle').innerHTML = `🔧 ${TOOLS[S.tool] ? TOOLS[S.tool].name : 'どうぐ'} 〜 3つの 点を さがそう 〜`;
  } else {

  }
}
function startTilt(toAngle) {
  if (S.anim.tilting) return;
  S.anim = { tilting: true, fromAngle: S.tiltAngle, toAngle }; S.tiltT = 0;

}

          sTap();
          if (canEmbed) {
            const embedUrl = `https://www.youtube-nocookie.com/embed/${slide.video}?rel=0&modestbranding=1&iv_load_policy=3&autoplay=1`;
            $('furikaeriThumb').outerHTML = `<div style="max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#000"><iframe width="100%" height="100%" src="${embedUrl}" title="${slide.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
          } else {
            window.open(videoUrl, '_blank', 'noopener');
          }
        };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      const votedOk = S.votePicked.has(0);
      showOverlay(`
        <h2>⭐ てこの工房 見習い はっけんいん にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① てこには（<span class="blankWord" data-a="支点・力点・作用点">？？？</span>）の 3つの 点が ある。<br>
        ② ${W.omosa} × ${W.shiten}からの めもりが（<span class="blankWord" data-a="同じ">？？？</span>）だと つり合う。<br>
        ③ ${W.rikiten}を ${W.shiten}から とおざけると、力は（<span class="blankWord" data-a="小さくて すむ">？？？</span>）。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>ア 軽く感じる</b> でした！ ${W.shiten}から とおい ところを 持つほど、小さな 力で すみます。${votedOk ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>おうちに ある「てこ」の どうぐを <b>3つ</b> さがしてみよう（はさみ・くぎぬき・せんぬき・ピンセットなど）。それぞれの ${W.shiten}・${W.rikiten}・${W.sayouten}が どこか、おうちの 人と 話してみてね。<br>
        🚨 やくそく：はさみや くぎぬきは するどい どうぐ。使う ときは 大人と いっしょに。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#7a4315'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { stageMode: 'tool', tool: 'bar', hitPts: { fulcrum: true, effort: true, load: true }, scope: { type: 'point', key: 'fulcrum' } });
      updateLoc();
      S.tapEnabled = false; S.phase = 'done';
      say(`<b>じゆうモード</b>だよ！ どうぐを えらんで しらべながら、${ruby('友', 'とも')}だちと クイズを ${ruby('出', 'だ')}しあおう。<br>れい：「はさみの 支点は どこ？」「力点を 遠くすると なぜ 楽？」`);
      setButtons([
        { label: '🔩 くぎぬきを 見る', cls: 'sub', cb: () => this.show('bar') },
        { label: '✂️ はさみを 見る', cls: 'sub', cb: () => this.show('scissors') },
        { label: '🍾 せんぬきを 見る', cls: 'sub', cb: () => this.show('opener') },
        { label: '🥢 ピンセットを 見る', cls: 'sub', cb: () => this.show('tweezers') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(key) {
      Object.assign(S, { tool: key, hitPts: { fulcrum: true, effort: true, load: true }, scope: { type: 'kind', kind: TOOLS[key].kind } });
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_balance などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
