<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ツタエの放送局 — 情報産業と情報化社会（小5社会地理・協力型・1ファイル）
   ニュースができるまでを体験しよう（メイン操作・ステップ送り）→
   いろいろなメディアを発見しよう（発見型）→情報を生かす商店を発見しよう（発見型）→
   正しい情報を選ぼう（応用推理）→はかせ（情報を使う時に気をつけること）。
   数値・事実：小学校学習指導要領・社会・第5学年「我が国の産業と情報との関わり」
   （放送、新聞などの産業は、情報を集め、まとめ、伝えるなどの働きをし、国民生活に
    大きな影響を及ぼしていること。大量の情報や情報通信技術の活用は、様々な産業を
    発展させ、国民生活を向上させていること）。
   ニュース番組は取材→編集→放送の工程を経て作られる（取材した情報がそのまま放送
   されるわけではない）、POSシステム（バーコード読み取りで売上・在庫を記録し、
   仕入れ・発注に活用する仕組み）はいずれもWebSearchで裏取り済み。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
const plain = s => s.replace(/<[^>]+>/g, '');
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {
  seirei: ruby('精霊', 'せいれい'),
  shuzai: ruby('取材', 'しゅざい'),
  henshuu: ruby('編集', 'へんしゅう'),
};
// canvas専用のプレーン文字列（W.xxxはルビ入りHTML文字列なのでcanvasのfillTextや
// scope.label/nameに渡すとタグが消えるだけで<rt>内の読みは残り連結表示されてしまう。
// canvas文脈は必ずこの安全なひらがな定数を使う）
const N_HENSHUU = 'へんしゅう';

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 数値データ（本物度） ----------
// m_nagare：ニュースができるまでを体験しよう（メイン操作・ステップ送り①〜③）
// name はcanvas/ボタンラベル(plain()経由)にも使われるため、W辞書のruby文字列を使わずプレーン文字列にする

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#f0f2fb'); g.addColorStop(1, '#c8d4ec');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
}

// ---------- カード描画（発見型ミッション共通） ----------
function drawCardGrid(X, Y, sc, cards, foundSet, cols, title) {
  bgFill(X, Y, sc);
  const xs3 = [220, 500, 780];
  const xs4 = [180, 380, 620, 820];
  const xs2 = [340, 660];
  cards.forEach((c, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const px = cols === 3 ? xs3[col] : cols === 2 ? xs2[col] : xs4[col];
    const py = row === 0 ? 250 : 440;
    const done = foundSet.has(c.key);
    gctx.beginPath(); gctx.arc(X(px), Y(py), 46 * sc, 0, TAU);
    gctx.fillStyle = done ? '#7b4fb0' : '#d0c0ec';
    gctx.fill(); gctx.strokeStyle = '#7b4fb0'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(c.icon, X(px), Y(py - 2));
    gctx.fillStyle = '#2e1f4a'; gctx.font = `700 ${13 * sc}px sans-serif`;
    gctx.fillText((c.num || c.letter) + ' ' + plain(c.name), X(px), Y(py + 62));
  });
  gctx.fillStyle = '#2e1f4a'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(title, X(500), Y(70));
}

  bgFill(X, Y, sc);
  const xs = [250, 500, 750];
  gctx.strokeStyle = '#8a9ac0'; gctx.lineWidth = 4 * sc;
  gctx.beginPath(); gctx.moveTo(X(xs[0]), Y(320)); gctx.lineTo(X(xs[2]), Y(320)); gctx.stroke();
  const idxNow = clamp(Math.round(S.nagareIdxDisplay), 0, 2);
  NAGARE_STEPS.forEach((st, i) => {
    const done = S.nagareIdx >= i;
    const active = S.nagareIdx >= 0 && idxNow === i;
    gctx.beginPath(); gctx.arc(X(xs[i]), Y(320), (active ? 54 : 46) * sc, 0, TAU);
    gctx.fillStyle = done ? '#7b4fb0' : '#d0c0ec';
    gctx.fill(); gctx.strokeStyle = '#4a2d70'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(st.icon, X(xs[i]), Y(320 - 2));
    gctx.fillStyle = '#2e1f4a'; gctx.font = `700 ${14 * sc}px sans-serif`;
    gctx.fillText((i + 1) + ' ' + plain(st.name), X(xs[i]), Y(320 + 74));
  });
  gctx.fillStyle = '#2e1f4a'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  const title = S.nagareIdx >= 0 ? `${plain(NAGARE_STEPS[idxNow].name)} の 工程` : 'ニュースが できるまでの 工程を 見てみよう';

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'nagare') drawNagareScene(X, Y, sc);
  else if (S.scene === 'baitai') drawBaitaiScene(X, Y, sc);
  else if (S.scene === 'pos') drawPosScene(X, Y, sc);
  else if (S.scene === 'hantei') drawHanteiScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- ツタエの電波ビューア（丸窓） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f6f0fc'); grd.addColorStop(1, '#dcc8f0');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#7b4fb0';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'wave') {
    drawWaveScope(R, S.scope.level);
    label(S.scope.label || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#b09ad688'); g2.addColorStop(1, 'rgba(176,154,214,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#7b4fb0'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('📡', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#7b4fb0'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#2e1f4a';
    sctx.fillText(txt, R, ly);
  }

  function drawWaveScope(R, level) {
    const cx = R * 0.3, cy = R;
    const n = clamp((level != null ? level : 1), 1, 3);
    sctx.strokeStyle = '#7b4fb0'; sctx.lineCap = 'round';
    for (let i = 1; i <= n; i++) {
      sctx.lineWidth = R * 0.045;
      sctx.beginPath();
      sctx.arc(cx, cy, R * 0.3 * i, -0.5, 0.5);
      sctx.stroke();
    }
    sctx.fillStyle = '#4a2d70';
    sctx.beginPath(); sctx.arc(cx, cy, R * 0.08, 0, TAU); sctx.fill();
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#7b4fb0', '#b09ad6', '#3d6ba8', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

    text: () => `お店は POSシステムで 集めた 売れ行きの 情報を、仕入れに 生かしていたね。` },
  { scene: 'hantei', icon: '🔍', title: '正しい情報を選ぼう',
    setup: () => { S.hanteiFound = new Set(HANTEI_CASES.map(c => c.key)); },
    scope: () => ({ type: 'point', icon: '🏫', name: '出どころを確かめる' }),
    text: () => `SNSの うわさと、公式な 発表。出どころを 確かめる ことが 大切だったね。` },
];

function gotoStep(i) {
  S.stepIndex = clamp(i, 0, FLOW.length - 1);
  S.phase = ''; S.tween = null;
  hideOverlay(); hideWish();
  setControls([]); setButtons([]);
  STEPS[FLOW[S.stepIndex]].enter();
  updateLoc();
}
const nextStep = () => gotoStep(S.stepIndex + 1);

const STEPS = {
  intro: {
    enter() {
      Object.assign(S, { scene: 'nagare', scope: { type: 'idle' } });
      say('……');
      setButtons([]);
      showOverlay(`
        <div class="phasesStrip">📡📺🛒🔍</div>
        <h1>ツタエの放送局</h1>
        <div class="sub">〜 情報産業と 情報化社会 〜</div>
        <p class="talk">ようこそ！ わたしは 情報を「伝える」から 生まれた ${W.seirei}、<b>ツタエ</b>。この 放送局で、情報産業と 情報化社会の ひみつを、いっしょに たしかめよう。ニュース番組は、${W.shuzai}した 情報が そのまま すぐに 放送されると 思う？<br>
        今日は、ニュースが できるまでから、いろいろな メディア、正しい 情報の 選び方まで、たしかめに 行こう！</p>
        <button class="btn" id="startBtn">たいけんを はじめる！</button>
        <div class="foot">先生へ：F11キーで全画面表示になります。操作はぜんぶ画面のボタンです。</div>
      `);
      $('startBtn').onclick = () => { ac(); sTap(); nextStep(); };
    },
  },

  vote: {
    enter() {
      showOverlay(`
        <h2>🤔 よそうタイム</h2>
        <p class="talk">ニュース番組は、${W.shuzai}した 情報が そのまま すぐに 放送されると 思う？</p>
        <div class="voteCards">
          <div class="vcard" data-v="0"><span class="vicon">🎤</span><b>ア</b> そのまま放送される</div>
          <div class="vcard" data-v="1"><span class="vicon">🖥️</span><b>イ</b> 編集してから放送される</div>
        </div>
        <div class="sub">思う ものに タッチ。きろくシートにも 〇を つけてね。</div>
        <button class="btn" id="voteGo">よし、たしかめよう！</button>
      `);
      panelEl.querySelectorAll('.vcard').forEach(c => {
        c.onclick = () => { sTap(); panelEl.querySelectorAll('.vcard').forEach(x => x.classList.remove('picked')); c.classList.add('picked');
          S.votePicked = new Set([+c.dataset.v]);
        };
      });
      $('voteGo').onclick = () => { sTap(); nextStep(); };
    },
  },

  // --- M1：ニュースができるまでを体験しよう（メイン操作・ステップ送り） ---
  m_nagare: {
    enter() {
      Object.assign(S, { scene: 'nagare', nagareIdx: -1, nagareIdxDisplay: -1, scope: { type: 'wave', level: 1, label: 'はじまる前' } });
      updateLoc();
      setWish('📡', `「つぎの工程へ」ボタンで、${W.shuzai}→${W.henshuu}→放送の 3つの 工程を、じゅんばんに 見てみよう。`);
      say(`ニュース番組は、どんな 工程を へて できるのかな？`);
      this.refreshCtl();
    },
    refreshCtl() {
      if (S.nagareIdx >= NAGARE_STEPS.length - 1) { this.finish(); return; }
      const nextSt = NAGARE_STEPS[S.nagareIdx + 1];
      setControls([{ label: `${nextSt.icon} つぎの工程へ（${plain(nextSt.name)}）`, cb: () => this.advance() }]);
    },
    advance() {
      if (S.nagareIdx >= NAGARE_STEPS.length - 1) return;
      setControls([]);
      sZoom();
      const fromV = S.nagareIdx, toV = S.nagareIdx + 1;
      startTween(fromV, toV, 0.7, v => {
        S.nagareIdxDisplay = v;
        S.scope = { type: 'wave', level: clamp(Math.round(v) + 1, 1, 3), label: plain(NAGARE_STEPS[clamp(Math.round(v), 0, 2)].name) };
      }, () => {
        S.nagareIdx++; S.nagareIdxDisplay = S.nagareIdx;
        const st = NAGARE_STEPS[S.nagareIdx];
        say(`${plain(st.name)}：${st.txt}`);
        this.refreshCtl();
      });
    },
    finish() {
      setControls([]);
      say(`${W.shuzai}→${W.henshuu}→放送の 3つの 工程を 見たね。取材した 情報は、そのまま 放送されたかな？`);
      setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
    },
    ask() {
      hideWish(); setButtons([]);
      say(`${W.shuzai}した 情報は、そのまま すぐに 放送される？`);
      setButtons(choiceRow(['そのまま放送される', '編集して整理してから放送される'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 1) {
        sYes(); scopeBurst(); award('m_nagare'); S.phase = 'done';
        const votedRight = S.votePicked.has(1);
        say(`せいかい！ ${W.shuzai}した 情報は、${W.henshuu}の 工程で 整理されてから、放送される。多くの 人に わかりやすく 正確に 伝える ための くふうなんだ。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}`);
        setButtons([{ label: 'つぎへ（いろいろなメディアを発見しよう）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど、3つの 工程を 思い出してみよう。`);
        setButtons(choiceRow(['そのまま放送される', '編集して整理してから放送される'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- M2：いろいろなメディアを発見しよう（発見型） ---
  m_baitai: {
    enter() {
      Object.assign(S, { scene: 'baitai', scope: { type: 'idle' }, baitaiFound: new Set() });
      updateLoc();
      setWish('📺', `①〜④を タッチして、いろいろな メディアの 特ちょうを 発見しよう。`);
      say(`情報を 伝える 方法には、いろいろな 種類が あるよ。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(BAITAI_CARDS.map(c => ({
        label: c.num + ' ' + (S.baitaiFound.has(c.key) ? plain(c.name) : '？？？'),
        cb: () => this.reveal(c),
      })));
      if (S.baitaiFound.size >= BAITAI_CARDS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(c) {
      sTap(); S.baitaiFound.add(c.key);
      S.scope = { type: 'point', icon: c.icon, name: plain(c.name) };
      scopeBurst();
      say(`${c.num} <b>${plain(c.name)}</b>：${c.txt}`);
      this.refreshCtl();
    },
    ask() {
      hideWish(); setButtons([]);
      say(`災害の 時、いちばん はやく 情報を 得られるのは？`);
      setButtons(choiceRow(['新聞', 'テレビ・インターネット', 'どれも同じ速さ'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 1) {
        sYes(); scopeBurst(); award('m_baitai'); S.phase = 'done';
        say(`せいかい！ テレビや インターネットは、速報性が 高く、いち早く 情報を 伝えられる。新聞は くわしく 記録として 残る、という ちがった 良さが あるんだ。`);
        setButtons([{ label: 'つぎへ（情報を生かす商店を発見しよう）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['新聞', 'テレビ・インターネット', 'どれも同じ速さ'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- M3：情報を生かす商店を発見しよう（発見型） ---
  m_pos: {
    enter() {
      Object.assign(S, { scene: 'pos', scope: { type: 'idle' }, posFound: new Set() });
      updateLoc();
      setWish('🛒', `①〜③を タッチして、お店が 情報を どう 生かしているか 発見しよう。`);
      say(`お店の レジにも、情報を 生かす しくみが あるんだよ。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(POS_CARDS.map(c => ({
        label: c.num + ' ' + (S.posFound.has(c.key) ? plain(c.name) : '？？？'),
        cb: () => this.reveal(c),
      })));
      if (S.posFound.size >= POS_CARDS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(c) {
      sTap(); S.posFound.add(c.key);
      S.scope = { type: 'point', icon: c.icon, name: plain(c.name) };
      scopeBurst();
      say(`${c.num} <b>${plain(c.name)}</b>：${c.txt}`);
      this.refreshCtl();
    },
    ask() {
      hideWish(); setButtons([]);
      say(`お店が POSシステムで 集めた 情報を、何に 生かす？`);
      setButtons(choiceRow(['仕入れ(発注)に生かす', '何にも使わない', '捨てる'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 0) {
        sYes(); scopeBurst(); award('m_pos'); S.phase = 'done';
        say(`せいかい！ お店は、レジで 集めた 売れ行きの 情報を、仕入れ(発注)に 生かしている。むだを へらし、お客さんの ほしい 商品を 用意できるんだ。`);
        setButtons([{ label: 'つぎへ（正しい情報を選ぼう）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['仕入れ(発注)に生かす', '何にも使わない', '捨てる'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- M4：正しい情報を選ぼう（応用推理） ---
  m_hantei: {
    enter() {
      Object.assign(S, { scene: 'hantei', scope: { type: 'idle' }, hanteiFound: new Set() });
      updateLoc();
      setWish('🔍', `①②を タッチして、2つの 情報を くらべ、正しい 情報の 見分け方を 考えよう。`);
      say(`世の中には、たくさんの 情報が あふれている。どうやって 見分ければ いいのかな？`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HANTEI_CASES.map(c => ({
        label: c.num + ' ' + (S.hanteiFound.has(c.key) ? plain(c.name) + ' ✓' : '？？？'),
        cb: () => this.reveal(c),
      })));
      if (S.hanteiFound.size >= HANTEI_CASES.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(c) {
      sTap();
      S.scope = { type: 'point', icon: c.icon, name: plain(c.name) };
      scopeBurst();
      say(c.txt);
      setButtons([{ label: 'クイズに ちょうせん', cb: () => this.itemAsk(c) }]);
    },
    itemAsk(c) {
      hideWish(); setButtons([]);
      say(c.ask.q);
      setButtons(choiceRow(c.ask.opts, (i, el) => this.judgeItem(c, i, el)));
    },
    judgeItem(c, i, el) {
      markPicked(el);
      if (i === c.ask.correct) {
        sYes(); scopeBurst();
        say(c.ask.explain);
        S.hanteiFound.add(c.key);
        setWish('🔍', `①②を タッチして、2つの 情報を くらべ、正しい 情報の 見分け方を 考えよう。`);
        this.refreshCtl();
      } else {
        sHmm();
        say(`ちがうよ。もういちど 考えてみよう。`);
        setButtons(choiceRow(c.ask.opts, (i2, el2) => this.judgeItem(c, i2, el2)));
      }
    },
    ask() {
      hideWish(); setButtons([]);
      say(`正しい 情報を 見分けるために 大切な ことは？`);
      setButtons(choiceRow(['出どころを確かめる', '最初に見た情報をそのまま信じる', 'みんなが言っているから信じる'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 0) {
        sYes(); scopeBurst(); award('m_hantei'); S.phase = 'done';
        say(`せいかい！ だれが、どこから 発信した 情報かという「出どころ」を 確かめる ことが、正しい 情報を 見分ける 大切な コツなんだ。`);
        setButtons([{ label: 'つぎへ（はかせチャレンジ）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['出どころを確かめる', '最初に見た情報をそのまま信じる', 'みんなが言っているから信じる'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- はかせチャレンジ：情報を使う時に気をつけること ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' }, hakaseFound: new Set() });
      updateLoc();
      say(`さいごは <b>はかせチャレンジ</b>！ 情報を 使う時に 気をつける ことを 見てみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HAKASE_POINTS.map(p => ({
        label: p.letter + ' ' + plain(p.name) + (S.hakaseFound.has(p.key) ? ' ✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.hakaseFound.size >= HAKASE_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.hakaseFound.add(p.key);
      S.scope = { type: 'point', name: plain(p.name), icon: p.icon };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      hideWish();
      say(`インターネットを 使う時に 気をつける ことは？`);
      setButtons(choiceRow(['個人情報や著作権を守り正しい情報か確かめる', '何でも自由に使ってよい', '気にしなくてよい'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 0) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ 個人情報や 著作権を 守り、正しい 情報か 確かめる ことが、情報化社会を 生きる わたしたちに 大切な 心がけなんだ。`);
        setButtons([{ label: 'ふりかえりタイムへ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['個人情報や著作権を守り正しい情報か確かめる', '何でも自由に使ってよい', '気にしなくてよい'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- ふりかえりタイム：4ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      hideOverlay();
      scopeBurst();
      say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
      setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ツタエの放送局 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>4つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① ニュースは 取材した あと、（<span class="blankWord" data-a="編集">？？？</span>）して 整理してから 放送される。<br>
        ② 情報を はやく 得るには、（<span class="blankWord" data-a="テレビ・インターネット">？？？</span>）が 便利。<br>
        ③ お店は POSシステムで 集めた 情報を（<span class="blankWord" data-a="仕入れ">？？？</span>）に 生かしている。<br>
        ④ 正しい 情報を 見分けるには（<span class="blankWord" data-a="出どころ">？？？</span>）を 確かめる ことが 大切。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 編集してから放送される</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>①家で ニュース番組を 見て、${W.shuzai}・${W.henshuu}・放送の どの 場面か 考えてみよう。②お店に 行った時、レジで バーコードを 読み取る 様子を 観察してみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#7b4fb0'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「ニュースは取材してすぐ放送される？」「お店は集めた情報を何に生かす？」「正しい情報を見分けるコツは？」`);
      setButtons([
        { label: '📡 ニュースの工程図', cls: 'sub', cb: () => this.show('nagare') },
        { label: '📺 メディアの図', cls: 'sub', cb: () => this.show('baitai') },
        { label: '🛒 お店の情報活用の図', cls: 'sub', cb: () => this.show('pos') },
        { label: '🔍 正しい情報の図', cls: 'sub', cb: () => this.show('hantei') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_pos などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
