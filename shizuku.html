<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

   人がうまれるまで（メイン操作・①〜⑦の週数送り）→

   はかせ（いろいろな動物の妊娠期間くらべ・いのちの大切さ）。
   数値はメダカ受精卵の変化（水温約23℃・教育委員会系資料）、

// ---------- ユーティリティ ----------

const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {

const NUMS = '①②③④⑤⑥⑦⑧';

const NINSHIN_ELAPSED = [0, 1, 7, 9, 14, 16, 32, 38];

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgScene(X, Y, sc, top, bottom, floor) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.fillStyle = floor;
  gctx.fillRect(X(0), Y(560), 1000 * sc, 80 * sc);
}
function drawWeed(X, Y, sc, baseX, t) {
  gctx.strokeStyle = '#4a9a6a'; gctx.lineWidth = 6 * sc; gctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const sway = Math.sin(t * 0.8 + i) * 14;
    gctx.beginPath();
    gctx.moveTo(X(baseX + i * 14), Y(560));
    gctx.quadraticCurveTo(X(baseX + i * 14 + sway), Y(460), X(baseX + i * 14 + sway * 1.4), Y(380));
    gctx.stroke();
  }
}

// ---------- メダカの魚（おす・めす） ----------
function drawFish(ctx, cx, cy, s, variant) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(s, s);
  // 尾びれ
  ctx.fillStyle = '#ff8f4a';
  ctx.beginPath(); ctx.moveTo(-58, 0); ctx.lineTo(-92, -26); ctx.lineTo(-92, 26); ctx.closePath(); ctx.fill();
  // からだ
  ctx.beginPath(); ctx.ellipse(12, 0, 62, 30, 0, 0, TAU);
  ctx.fillStyle = '#ffa25c'; ctx.fill();
  ctx.strokeStyle = '#c2600a'; ctx.lineWidth = 2; ctx.stroke();
  // 目
  ctx.fillStyle = '#2a2a2a'; ctx.beginPath(); ctx.arc(58, -6, 4, 0, TAU); ctx.fill();
  // 背びれ
  ctx.fillStyle = '#ffcf8a'; ctx.strokeStyle = '#c2600a'; ctx.lineWidth = 2;
  if (variant === 'male') {
    ctx.beginPath();
    ctx.moveTo(-6, -28); ctx.lineTo(2, -50); ctx.lineTo(9, -28);
    ctx.lineTo(13, -28); ctx.lineTo(21, -48); ctx.lineTo(29, -28);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(-6, -28); ctx.quadraticCurveTo(11, -50, 29, -28);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // 尻びれ
  if (variant === 'male') {
    ctx.beginPath();
    ctx.moveTo(-28, 28); ctx.lineTo(-32, 52); ctx.lineTo(6, 52); ctx.lineTo(9, 28);

  } else {
    ctx.beginPath();

  ctx.restore();
}

// ---------- メダカのたまごの中身 ----------
function tamagoDetail(ctx, cx, cy, r, elapsed, t) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU);
  ctx.fillStyle = 'rgba(255,244,214,.92)'; ctx.fill();
  ctx.strokeStyle = '#e0a020'; ctx.lineWidth = Math.max(1.5, r * 0.025); ctx.stroke();
  if (elapsed >= 1) {
    ctx.beginPath(); ctx.arc(cx - r * 0.4, cy + r * 0.35, r * 0.16, 0, TAU);
    ctx.fillStyle = '#ffd166'; ctx.fill();
    ctx.strokeStyle = '#c98a10'; ctx.lineWidth = Math.max(1, r * 0.02); ctx.stroke();
  }
  ctx.save();
  ctx.translate(cx + r * 0.05, cy - r * 0.15);
  const rot = elapsed >= 9 ? (elapsed >= 10 ? Math.sin(t * 4.5) * 0.25 + 0.35 : 0.35) : 0;
  ctx.rotate(rot);
  if (elapsed >= 2) {
    ctx.beginPath(); ctx.ellipse(r * 0.05, -r * 0.05, r * 0.14, r * 0.11, 0, 0, TAU);
    ctx.fillStyle = elapsed >= 8 ? '#1a1a1a' : '#7a6a4a'; ctx.fill();
  }
  if (elapsed >= 3) {
    const pulse = 1 + Math.sin(t * 7) * 0.15;
    ctx.beginPath(); ctx.arc(-r * 0.18, r * 0.1, r * 0.08 * pulse, 0, TAU);
    ctx.fillStyle = '#d9506e'; ctx.fill();
  }
  if (elapsed >= 4) {
    ctx.strokeStyle = 'rgba(217,80,110,.55)'; ctx.lineWidth = Math.max(1, r * 0.015);
    ctx.beginPath(); ctx.arc(-r * 0.05, r * 0.02, r * 0.32, 0.2, 2.6); ctx.stroke();
  }
  if (elapsed >= 5) {
    ctx.fillStyle = '#ffb08a';
    ctx.beginPath(); ctx.moveTo(r * 0.2, r * 0.15); ctx.quadraticCurveTo(r * 0.4, r * 0.05, r * 0.36, r * 0.32); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
}

function drawBeanShape(ctx, R, week) {
  ctx.fillStyle = '#ffcaa8'; ctx.strokeStyle = '#c97a4a'; ctx.lineWidth = R * 0.03;
  ctx.beginPath(); ctx.ellipse(0, R * 0.12, R * 0.5, R * 0.58, 0, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(R * 0.12, -R * 0.42, R * 0.38, 0, TAU); ctx.fill(); ctx.stroke();
  if (week >= 7) {
    ctx.strokeStyle = '#ffcaa8'; ctx.lineWidth = R * 0.16; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(R * 0.2, -R * 0.05); ctx.quadraticCurveTo(R * 0.55, R * 0.05, R * 0.48, R * 0.42); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-R * 0.05, R * 0.5); ctx.quadraticCurveTo(-R * 0.1, R * 0.85, R * 0.12, R * 0.92); ctx.stroke();
  }
}
function ninshinDetail(ctx, cx, cy, R, week) {
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU);
  ctx.fillStyle = 'rgba(200,230,255,.35)'; ctx.fill();
  const scale = lerp(0.16, 1, clamp(week / 38, 0, 1));
  const headDown = week >= 32;
  const placentaX = cx + R * 0.6, placentaY = cy - R * 0.55;
  if (week >= 1) {
    ctx.strokeStyle = '#e08a9a'; ctx.lineWidth = Math.max(1.5, R * 0.045); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.quadraticCurveTo(cx + R * 0.35, cy - R * 0.25, placentaX, placentaY);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(placentaX, placentaY, R * 0.15, 0, TAU);
    ctx.fillStyle = '#e08a9a'; ctx.fill();
  }
  ctx.save();
  ctx.translate(cx, cy + R * 0.05);
  if (headDown) ctx.rotate(Math.PI);
  ctx.scale(scale, scale);
  drawBeanShape(ctx, R, week);
  ctx.restore();
  ctx.restore();
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'seibetsu') drawSeibetsuScene(X, Y, sc, t);
  else if (S.scene === 'tamago') drawTamagoScene(X, Y, sc, t);
  else if (S.scene === 'ninshin') drawNinshinScene(X, Y, sc, t);
  else if (S.scene === 'hozo') drawHozoScene(X, Y, sc, t);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc, t);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc, t);
}

// ---------- いのちの のぞきまど（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#eef9f6'); grd.addColorStop(1, '#dcefe9');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'tamagopeek') {
    tamagoDetail(sctx, R, R, R * 0.62, S.scope.elapsed, t);
    label(`${Math.round(S.scope.elapsed)}日目`);
  } else if (mode === 'ninshinpeek') {
    ninshinDetail(sctx, R, R, R * 0.7, S.scope.week);
    label(`${Math.round(S.scope.week)}週`);
  } else if (mode === 'point') {
    sctx.fillStyle = '#178a76';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffd6e055'); g2.addColorStop(1, 'rgba(255,214,224,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#178a76'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('💧', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#178a76'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.095}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#2a2a2a';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#5fd0bb', '#ff9fb8', '#ffd166', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

      setButtons(choiceRow(['大きい動物ほど日数が長い', '大きい動物ほど日数が短い', '関係ない'], (i, el) => this.pick(i, el)));
    },
    pick(i, el) {
      markPicked(el);
      if (i === 0) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say('せいかい！ 体が 大きい 動物ほど、生まれるまでの 時間が 長い 傾向が ある。小さな いのちも、大きな いのちも、ちゃんと 育つまでには 時間が かかる。生まれてきた いのちを、大切に しよう。');
        setButtons([{ label: 'ふりかえりタイムへ', cb: nextStep }]);
      } else {
        sHmm();
        say('ちがうよ。もういちど かんがえてみよう。');
        setButtons(choiceRow(['大きい動物ほど日数が長い', '大きい動物ほど日数が短い', '関係ない'], (i2, el2) => this.pick(i2, el2)));
      }
    },
  },

  // --- ふりかえりタイム：5ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      if (slide.video) {
        const videoUrl = `https://www.youtube.com/watch?v=${slide.video}`;
        showOverlay(`
          <h2>${slide.icon} ふりかえりタイム（${n}/${total}）${slide.title}</h2>
          <div id="furikaeriThumb" style="max-width:380px;margin:0 auto;cursor:pointer">
            <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
              <img src="https://img.youtube.com/vi/${slide.video}/hqdefault.jpg" style="width:100%;display:block;opacity:.85">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <div style="width:15%;aspect-ratio:1;min-width:56px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(24px,3vw,34px)">▶</div>
              </div>
            </div>
            <div style="margin-top:.5em;color:#178a76;font-size:clamp(12px,1.3vw,16px)">タップすると 新しい タブで 動画が ひらくよ</div>
          </div>
          <p class="talk">${slide.text()}</p>
          <button class="btn" id="furikaeriNextBtn">${isLast ? 'まとめへ すすむ' : 'つぎへ'}</button>
          <div class="foot">先生へ：動画は外部サイト(YouTube)の教育系チャンネルです。内容を事前にご確認ください。URL: ${videoUrl}</div>
        `);
        $('furikaeriThumb').onclick = () => { sTap(); window.open(videoUrl, '_blank', 'noopener'); };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ シズクの淵 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① メダカは 受精してから 約（<span class="blankWord" data-a="10">？？？</span>）日で ふ化する。<br>
        ② 人は 受精してから 約（<span class="blankWord" data-a="38">？？？</span>）週で 誕生する。<br>
        ③ 赤ちゃんは おなかの中で、へそのお・たいばんを通して（<span class="blankWord" data-a="栄養や酸素">？？？</span>）を もらう。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 人の 赤ちゃんの方が 長い</b>でした！ メダカは 約10日、人は 約266日(38週)——人の方が 約24倍も 長い 時間を かけて 育つ。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>池や 川、田んぼ、水そうなど 近くで メダカや 小さな 生き物を 見つけたら、そっと かんさつしてみよう。図鑑や 写真で 調べるのも いいね。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#b23a5a'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「メダカの おす・めすは どこで 見分ける？」「メダカの たまごは 何日で ふ化する？」「人は 何週で うまれる？」`);
      setButtons([
        { label: '🐟 メダカのおす・めすの 図', cls: 'sub', cb: () => this.show('seibetsu') },
        { label: '🥚 メダカのたまごの 図', cls: 'sub', cb: () => this.show('tamago') },
        { label: '👶 人がうまれるまでの 図', cls: 'sub', cb: () => this.show('ninshin') },
        { label: '💞 へそのお・たいばんの 図', cls: 'sub', cb: () => this.show('hozo') },
        { label: '📖 動物の妊娠期間の 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_ninshin などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
