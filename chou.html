<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（2026-07-23／ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   アオバの葉かげ — チョウの育ち方（小3理科・協力型・1ファイル）
   卵→幼虫（脱皮4回・目もり①〜⑤）→さなぎ→成虫の完全変態を段階送りで観察。
   よそうタイム「さなぎの中で何が起きているか」をはかせチャレンジで回収。
   完全変態（チョウ）と不完全変態（バッタ）の対比で発展。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function easeOutBack(x) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}

const W = {
  tamago: ruby('卵', 'たまご'),
  youchu: ruby('幼虫', 'ようちゅう'),
  dappi: ruby('脱皮', 'だっぴ'),
  sanagi: ruby('蛹', 'さなぎ'),
  seichuu: ruby('成虫', 'せいちゅう'),
  hentai: ruby('変態', 'へんたい'),
  kanzen: ruby('完全変態', 'かんぜんへんたい'),
  fukanzen: ruby('不完全変態', 'ふかんぜんへんたい'),
  shokusou: ruby('食草', 'しょくそう'),
  ukashi: ruby('羽化', 'うか'),
};

// ---------- 幼虫の成長段階（本物の数値：脱皮のたびに体長が変わる） ----------
// 出典：モンシロチョウ飼育記録等（1齢3-5mm→1回目脱皮5-10mm→2回目10-18mm→3回目18-30mm→4回目=終齢30-36mm）
const LARVA_STAGES = [
  { no: 1, mm: '3〜5mm',  midmm: 4,  name: '1れい（ふ化した ばかり）', note: 'たまごから 出てきた ばかり。まず 自分の たまごの からを 食べるよ。' },
  { no: 2, mm: '5〜10mm', midmm: 7,  name: '2れい（1回目の 脱皮あと）', note: '皮が きつくなって 1回目の 脱皮。ひとまわり 大きく なった。' },
  { no: 3, mm: '10〜18mm', midmm: 14, name: '3れい（2回目の 脱皮あと）', note: '2回目の 脱皮。キャベツの葉を もりもり 食べて 育つ。' },
  { no: 4, mm: '18〜30mm', midmm: 24, name: '4れい（3回目の 脱皮あと）', note: '3回目の 脱皮。緑色が こくなって、体つきも しっかり。' },
  { no: 5, mm: '30〜36mm', midmm: 33, name: '5れい・しゅうれい（4回目の 脱皮あと）', note: '4回目の 脱皮で さいごの すがた「しゅうれい幼虫」に。もう たくさん 食べない。' },
];
const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 状態 ----------
const S = {
  stepIndex: 0,
  stageMode: 'field',   // field / hentai / compare
  larvaLv: 0,     // 0=まだ表示なし、1〜5=LARVA_STAGES index
  larvaF: 0,      // tween用の連続値
  hentaiPhase: 0, // 0=幼虫 1=前蛹 2=さなぎ 3=中の変化 4=羽化 5=飛び立ち
  hentaiF: 0,
  eggFound: false,
  tapEnabled: false,
  phase: '', pick: -1,
  sound: true,
  votePicked: -1,
  badges: new Set(),
  anim: {},
};

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));
const sDappi = () => { tone(300, 0, 0.22, 'sine', 0.06); tone(460, 0.14, 0.28, 'sine', 0.06); tone(620, 0.26, 0.3, 'sine', 0.06); };
const sMagic = () => [392, 523, 659, 880, 1174].forEach((f, i) => tone(f, i * 0.12, 0.5, 'sine', 0.07));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

// ---------- 背景（畑・野原） ----------
function drawFieldBG(t, X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(560));
  g.addColorStop(0, '#dff2ec'); g.addColorStop(0.5, '#eefbe0'); g.addColorStop(1, '#daf0be');
  gctx.fillStyle = g;
  gctx.fillRect(X(0), Y(0), 1000 * sc, 560 * sc);
  // 空の 太陽
  gctx.fillStyle = 'rgba(255,244,180,.6)';
  gctx.beginPath(); gctx.arc(X(900), Y(60), 44 * sc, 0, TAU); gctx.fill();
  // くも
  gctx.fillStyle = 'rgba(255,255,255,.75)';
  [[120, 50, 34], [175, 58, 26], [80, 62, 22]].forEach(([cx, cy, r]) => {
    gctx.beginPath(); gctx.arc(X(cx), Y(cy), r * sc, 0, TAU); gctx.fill();
  });
  // 畑の うね
  gctx.fillStyle = '#c9a06a';
  gctx.fillRect(X(0), Y(470), 1000 * sc, 170 * sc);
  gctx.strokeStyle = 'rgba(140,100,50,.3)'; gctx.lineWidth = 1.5 * sc;
  for (let x = 0; x < 1000; x += 90) { gctx.beginPath(); gctx.moveTo(X(x), Y(470)); gctx.lineTo(X(x + 40), Y(640)); gctx.stroke(); }
}

// ---------- キャベツの葉 ----------
function drawCabbageLeaf(X, Y, sc, cx, cy, r, opts) {
  opts = opts || {};
  gctx.save();
  gctx.translate(X(cx), Y(cy));
  gctx.scale(sc, sc);
  gctx.fillStyle = opts.dark ? '#6bb84a' : '#8fd45f';
  gctx.strokeStyle = '#3d7a26'; gctx.lineWidth = 2.4;
  gctx.beginPath();
  for (let i = 0; i <= 12; i++) {
    const a = (i / 12) * TAU;
    const rr = r * (0.82 + 0.18 * Math.sin(a * 5 + cx));
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.86;
    i === 0 ? gctx.moveTo(px, py) : gctx.lineTo(px, py);
  }
  gctx.closePath(); gctx.fill(); gctx.stroke();
  // 葉脈
  gctx.strokeStyle = 'rgba(60,120,30,.4)'; gctx.lineWidth = 1.6;
  gctx.beginPath(); gctx.moveTo(-r * 0.7, 0); gctx.lineTo(r * 0.7, 0); gctx.stroke();
  for (let i = -2; i <= 2; i++) {
    if (i === 0) continue;
    gctx.beginPath(); gctx.moveTo(i * r * 0.28, 0); gctx.lineTo(i * r * 0.42, i > 0 ? -r * 0.35 : r * 0.35); gctx.stroke();
  }
  gctx.restore();
}

function drawEgg(X, Y, sc, cx, cy, s) {
  gctx.save();
  gctx.translate(X(cx), Y(cy)); gctx.scale(sc * s, sc * s);
  gctx.fillStyle = '#f4e28a'; gctx.strokeStyle = '#c9a86a'; gctx.lineWidth = 1;
  gctx.beginPath(); gctx.ellipse(0, 0, 5, 8, 0, 0, TAU); gctx.fill(); gctx.stroke();
  gctx.strokeStyle = 'rgba(160,130,60,.5)'; gctx.lineWidth = .5;
  for (let i = -1; i <= 1; i++) { gctx.beginPath(); gctx.moveTo(i * 2.4, -7); gctx.lineTo(i * 2.4, 7); gctx.stroke(); }
  gctx.restore();
}

// ---------- 幼虫（アオムシ）の描画：sizeMMで大きさが変わる ----------
function drawCaterpillar(X, Y, sc, cx, cy, sizeMM, opts) {
  opts = opts || {};
  const scaleMM = clamp(sizeMM, 3, 36);
  const len = lerp(26, 210, (scaleMM - 3) / 33);   // 全長(px基準)
  const wid = lerp(9, 34, (scaleMM - 3) / 33);      // 太さ
  const segs = 6;
  gctx.save();
  gctx.translate(X(cx), Y(cy));
  gctx.scale(sc, sc);
  if (opts.sway) {
    // ちいさな 呼吸ゆれ
  }
  // からだ（セグメントの連なり）
  for (let i = segs - 1; i >= 0; i--) {
    const p = i / (segs - 1);
    const px = -len / 2 + len * p;
    const segW = wid * (0.62 + 0.5 * Math.sin(p * Math.PI));
    gctx.fillStyle = i % 2 === 0 ? '#8fd45f' : '#9adf6c';
    gctx.strokeStyle = '#3d7a26'; gctx.lineWidth = Math.max(1, wid * 0.05);
    gctx.beginPath(); gctx.ellipse(px, 0, len / segs * 0.62, segW / 2, 0, 0, TAU); gctx.fill(); gctx.stroke();
    if (i % 2 === 1 && segW > wid * 0.5) {
      gctx.fillStyle = '#f4d84a';
      gctx.beginPath(); gctx.arc(px, -segW * 0.22, Math.max(1.4, wid * 0.09), 0, TAU); gctx.fill();
      gctx.beginPath(); gctx.arc(px, segW * 0.22, Math.max(1.4, wid * 0.09), 0, TAU); gctx.fill();
    }
  }
  // あたま
  gctx.fillStyle = '#6bb84a'; gctx.strokeStyle = '#3d7a26'; gctx.lineWidth = Math.max(1, wid * 0.05);
  gctx.beginPath(); gctx.arc(-len / 2, 0, wid * 0.38, 0, TAU); gctx.fill(); gctx.stroke();
  if (scaleMM > 6) {
    gctx.fillStyle = '#2c2015';
    gctx.beginPath(); gctx.arc(-len / 2 - wid * 0.12, -wid * 0.12, Math.max(1, wid * 0.07), 0, TAU); gctx.fill();
    gctx.beginPath(); gctx.arc(-len / 2 - wid * 0.12, wid * 0.12, Math.max(1, wid * 0.07), 0, TAU); gctx.fill();
  }
  gctx.restore();

  // 脱ぎすてた 皮（脱皮した直後の演出）
  if (opts.showSkin) {
    gctx.save();
    gctx.globalAlpha = 0.55;
    gctx.translate(X(cx) - len * sc * 0.3, Y(cy) + wid * sc * 0.9);
    gctx.scale(sc * 0.7, sc * 0.7);
    gctx.strokeStyle = '#c9d8a0'; gctx.lineWidth = 2; gctx.fillStyle = '#eef3d8';
    gctx.beginPath(); gctx.ellipse(0, 0, len * 0.36, wid * 0.3, 0.15, 0, TAU); gctx.fill(); gctx.stroke();
    gctx.restore();
    gctx.globalAlpha = 1;
  }
}

// ---------- さなぎ・羽化 ----------
function drawChrysalis(X, Y, sc, cx, cy, phase) {
  // phase: 0=前蛹(垂れ下がる幼虫) 1=さなぎ 2=中で変化 3=羽化中(殻われ) 4=成虫(羽をのばす)
  gctx.save();
  gctx.translate(X(cx), Y(cy));
  gctx.scale(sc, sc);
  // 枝
  gctx.strokeStyle = '#8a6a42'; gctx.lineWidth = 5; gctx.lineCap = 'round';
  gctx.beginPath(); gctx.moveTo(-90, -170); gctx.lineTo(90, -170); gctx.stroke();
  // 糸（帯蛹の支え）
  gctx.strokeStyle = 'rgba(230,230,210,.85)'; gctx.lineWidth = 1.6;
  gctx.beginPath(); gctx.moveTo(0, -170); gctx.lineTo(0, -60); gctx.stroke();

  if (phase <= 0) {
    const p = clamp(phase + 1, 0, 1);
    gctx.save(); gctx.translate(0, -60); gctx.rotate(Math.PI / 2 * p);
    gctx.fillStyle = '#8fd45f'; gctx.strokeStyle = '#3d7a26'; gctx.lineWidth = 2;
    gctx.beginPath(); gctx.ellipse(0, 0, 70, 15, 0, 0, TAU); gctx.fill(); gctx.stroke();
    gctx.restore();
  } else if (phase < 3) {
    const col = phase < 2 ? '#7fbf60' : '#6aa84f';
    gctx.fillStyle = col; gctx.strokeStyle = '#3d7a26'; gctx.lineWidth = 2.2;
    gctx.beginPath();
    gctx.moveTo(0, -160);
    gctx.quadraticCurveTo(22, -130, 16, -70);
    gctx.quadraticCurveTo(10, -30, 0, -12);
    gctx.quadraticCurveTo(-10, -30, -16, -70);
    gctx.quadraticCurveTo(-22, -130, 0, -160);
    gctx.closePath(); gctx.fill(); gctx.stroke();
    if (phase >= 1.9) {
      // 中で 変化中： もやもや エフェクト
      gctx.save();
      gctx.globalAlpha = 0.5 + 0.2 * Math.sin(performance.now() / 260);
      gctx.fillStyle = '#eef7d8';
      for (let i = 0; i < 4; i++) {
        const yy = -140 + i * 30;
        gctx.beginPath(); gctx.ellipse(0, yy, 10 - i, 6, 0, 0, TAU); gctx.fill();
      }
      gctx.restore(); gctx.globalAlpha = 1;
    }
  } else {
    // 羽化：殻がわれて 出てくる
    const p = clamp((phase - 3), 0, 1);
    gctx.save(); gctx.globalAlpha = 0.85;
    gctx.strokeStyle = '#6aa84f'; gctx.fillStyle = 'rgba(200,225,190,.5)'; gctx.lineWidth = 2;
    gctx.beginPath(); gctx.moveTo(-14, -150); gctx.lineTo(-14 - p * 18, -60); gctx.lineTo(-2, -60); gctx.lineTo(-2, -150); gctx.closePath();
    gctx.fill(); gctx.stroke();
    gctx.beginPath(); gctx.moveTo(14, -150); gctx.lineTo(14 + p * 18, -60); gctx.lineTo(2, -60); gctx.lineTo(2, -150); gctx.closePath();
    gctx.fill(); gctx.stroke();
    gctx.restore(); gctx.globalAlpha = 1;
    drawButterfly(0, -90, 0.35 + p * 0.65, p);
  }
  gctx.restore();
}

function drawButterfly(cx, cy, scale, wingOpen) {
  // 呼び出し側で translate/scale 済みのローカル座標系に描く
  gctx.save();
  gctx.translate(cx, cy); gctx.scale(scale, scale);
  const wOpen = clamp(wingOpen, 0, 1);
  const flap = Math.sin(performance.now() / 180) * 0.12 * wOpen;
  [-1, 1].forEach(dir => {
    gctx.save();
    gctx.rotate(dir * (0.15 - flap) * (1 - wOpen * 0.3));
    gctx.fillStyle = '#fff'; gctx.strokeStyle = '#c9c9c9'; gctx.lineWidth = 2;
    gctx.beginPath();
    gctx.ellipse(dir * 46 * (0.3 + 0.7 * wOpen), -20, 42, 34, 0, 0, TAU);
    gctx.fill(); gctx.stroke();
    gctx.fillStyle = '#f0f0f0';
    gctx.beginPath();
    gctx.ellipse(dir * 40 * (0.3 + 0.7 * wOpen), 26, 30, 26, 0, 0, TAU);
    gctx.fill(); gctx.stroke();
    gctx.fillStyle = '#2c2015';
    gctx.beginPath(); gctx.arc(dir * 34 * (0.3 + 0.7 * wOpen), -30, 4, 0, TAU); gctx.fill();
    gctx.beginPath(); gctx.arc(dir * 58 * (0.3 + 0.7 * wOpen), -14, 3.4, 0, TAU); gctx.fill();
    gctx.restore();
  });
  // からだ
  gctx.fillStyle = '#4a3a28';
  gctx.beginPath(); gctx.ellipse(0, 0, 6, 30, 0, 0, TAU); gctx.fill();
  gctx.strokeStyle = '#4a3a28'; gctx.lineWidth = 2;
  gctx.beginPath(); gctx.moveTo(-3, -28); gctx.quadraticCurveTo(-10, -42, -12, -50); gctx.stroke();
  gctx.beginPath(); gctx.moveTo(3, -28); gctx.quadraticCurveTo(10, -42, 12, -50); gctx.stroke();
  gctx.restore();
}

// ---------- バッタとの対比図（はかせ） ----------
function drawCompare(X, Y, sc) {
  const cx1 = 260, cx2 = 720;
  gctx.fillStyle = '#2c5c1a'; gctx.font = `700 ${Math.max(14, 20 * sc)}px sans-serif`; gctx.textAlign = 'center';

        gctx.beginPath(); gctx.moveTo(X(px + 120), Y(240)); gctx.lineTo(X(px + 110), Y(236)); gctx.moveTo(X(px + 120), Y(240)); gctx.lineTo(X(px + 110), Y(244)); gctx.stroke();

}

function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;

  if (S.stageMode === 'compare') {
    drawFieldBG(t, X, Y, sc);
    drawCompare(X, Y, sc);
    return;
  }

  drawFieldBG(t, X, Y, sc);

  if (S.stageMode === 'field') {
    // 3まいの葉（発見ポイント）
    const leaves = [[220, 300, false], [500, 260, S.eggFound], [780, 320, false]];
    leaves.forEach(([lx, ly, hasEgg]) => {
      drawCabbageLeaf(X, Y, sc, lx, ly, 92);
      if (hasEgg) drawEgg(X, Y, sc, lx, ly - 8, 2.6);
    });
    if (S.larvaLv > 0) {
      const cur = LARVA_STAGES[clamp(Math.round(S.larvaF) - 1, 0, 4)] || LARVA_STAGES[0];
      const mmNow = lerp(LARVA_STAGES[clamp(Math.floor(S.larvaF) - 1, 0, 4)].midmm,
                          (LARVA_STAGES[clamp(Math.ceil(S.larvaF) - 1, 0, 4)] || cur).midmm,
                          S.larvaF - Math.floor(S.larvaF));
      drawCabbageLeaf(X, Y, sc, 500, 380, 150, { dark: true });
      drawCaterpillar(X, Y, sc, 500, 350, mmNow || cur.midmm, { showSkin: S.anim.justMolted });
    }
  } else if (S.stageMode === 'hentai') {
    drawChrysalis(X, Y, sc, 500, 470, S.hentaiF);
  }
}

// ---------- アオバスコープ ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f6fbe8'); grd.addColorStop(1, '#dcefc0');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope || { type: 'idle' };
  if (mode.type === 'egg') {
    sctx.save(); sctx.translate(R, R); sctx.scale(R * 0.09, R * 0.09);
    sctx.fillStyle = '#f4e28a'; sctx.strokeStyle = '#c9a86a'; sctx.lineWidth = 1;
    sctx.beginPath(); sctx.ellipse(0, 0, 5, 8, 0, 0, TAU); sctx.fill(); sctx.stroke();
    sctx.restore();
    label('たまご 〜やく1mm〜');
  } else if (mode.type === 'larva') {
    sctx.save(); sctx.translate(R * 0.25, R);
    drawCaterpillarLocal(sctx, R * 0.014 * (0.5 + (mode.mm || 10) / 40));
    sctx.restore();
    label(mode.label || '幼虫');
  } else if (mode.type === 'skin') {
    sctx.save(); sctx.translate(R, R * 1.15); sctx.scale(R * 0.02, R * 0.02);
    sctx.strokeStyle = '#c9d8a0'; sctx.lineWidth = 3; sctx.fillStyle = '#eef3d8';
    sctx.beginPath(); sctx.ellipse(0, 0, 60, 20, 0.1, 0, TAU); sctx.fill(); sctx.stroke();
    sctx.restore();
    label('ぬけがら（古い皮）');
  } else if (mode.type === 'inside') {
    sctx.save(); sctx.translate(R, R);
    sctx.fillStyle = '#7fbf60'; sctx.strokeStyle = '#3d7a26'; sctx.lineWidth = R * 0.02;
    sctx.beginPath(); sctx.ellipse(0, 0, R * 0.3, R * 0.55, 0, 0, TAU); sctx.fill(); sctx.stroke();
    sctx.globalAlpha = 0.6 + 0.2 * Math.sin(t * 3);
    sctx.fillStyle = '#eef7d8';
    for (let i = 0; i < 5; i++) {
      const a = t * 1.2 + i * 1.3;
      sctx.beginPath(); sctx.ellipse(Math.cos(a) * R * 0.12, Math.sin(a) * R * 0.28, R * 0.05, R * 0.03, 0, 0, TAU); sctx.fill();
    }
    sctx.globalAlpha = 1;
    sctx.restore();
    label('中は ぐちゃぐちゃに？');
  } else if (mode.type === 'butterfly') {
    sctx.save(); sctx.translate(R, R * 1.05);
    drawButterfly(0, 0, R * 0.014, 1);
    sctx.restore();
    label('せいちゅう（成虫）');
  } else {
    sctx.fillStyle = '#8fd45f';
    sctx.beginPath(); sctx.arc(R, R, R * 0.3, 0, TAU); sctx.fill();
    label('タッチして しらべよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#2c6a14';
    sctx.fillText(txt, R, ly);
  }
}
// scope専用の簡易いもむし（sctx用、drawCaterpillarと別実装で座標系を分離）
function drawCaterpillarLocal(ctx, s) {
  ctx.save(); ctx.scale(s, s);
  for (let i = 3; i >= 0; i--) {
    ctx.fillStyle = i % 2 === 0 ? '#8fd45f' : '#9adf6c';
    ctx.strokeStyle = '#3d7a26'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.ellipse(-30 + i * 22, 0, 14, 11, 0, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = '#6bb84a'; ctx.strokeStyle = '#3d7a26'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(-42, 0, 10, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2c2015';
  ctx.beginPath(); ctx.arc(-45, -3, 2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(-45, 3, 2, 0, TAU); ctx.fill();
  ctx.restore();
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#3d7a26', '#e8c53a', '#6bb84a', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  S.anim.tweening = true;
  S.anim.tw = { t: 0, dur, from, to, setter, onDone };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (S.anim.tw) {
    S.anim.tw.t += dt;
    const p = clamp(S.anim.tw.t / S.anim.tw.dur, 0, 1);
    S.anim.tw.setter(lerp(S.anim.tw.from, S.anim.tw.to, easeInOut(p)));
    if (p >= 1) {
      const done = S.anim.tw.onDone;
      S.anim.tw = null; S.anim.tweening = false;
      if (done) done();
    }
  }

  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

// ---------- タップ（葉・幼虫を しらべる） ----------
stageCv.addEventListener('pointerdown', ev => {
  ac();
  if (!S.tapEnabled) return;
  const r = stageCv.getBoundingClientRect();
  const { sc, ox, oy } = mapTransform(r.width, r.height);
  const mx = (ev.clientX - r.left - ox) / sc, my = (ev.clientY - r.top - oy) / sc;
  const step = STEPS[FLOW[S.stepIndex]];
  if (step.onFieldTap) step.onFieldTap(mx, my);
});

window.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') {
    const b = document.querySelector('#btnRow .btn:not(.sub)') || document.querySelector('#panelBody .btn:not(.sub)');
    if (b) b.click();
  }
});

        <p class="talk">🏠 <b>おうちミッション</b><br>おうちの 近くで、キャベツや アブラナの 葉を さがして、モンシロチョウの たまごや 幼虫が いないか かんさつしてみよう。見つけても、むやみに つかまえたり しない こと。<br>
        🚨 やくそく：虫を 見つけても むりに さわらない。手を あらう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#2c6a14'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { stageMode: 'field', larvaLv: 5, larvaF: 5, eggFound: true, scope: { type: 'butterfly' } });
      updateLoc();
      S.tapEnabled = false;
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを ${ruby('出', 'だ')}しあおう。<br>れい：「幼虫は 何回 脱皮する？」「さなぎの中では 何が 起きている？」`);
      setButtons([
        { label: '🥚 卵さがしに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('m_tamago')) },
        { label: '🐛 幼虫の成長に もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('m_youchu')) },
        { label: '📦 さなぎに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('m_sanagi')) },
        { label: '🦋 羽化に もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('m_uka')) },
        { label: '🔍 くらべっこに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('hakase')) },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_youchu などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
