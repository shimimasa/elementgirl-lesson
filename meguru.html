<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   メグルの庭 — 季節と生物・動物の活動/植物の成長（小4理科・生命分野5作目・協力型・1ファイル）
   動物の1年のようすを見つけよう（発見型）→ 植物の1年のようすを見つけよう（発見型）→
   1年をめぐる、生き物カレンダー（メイン操作・①〜⑧の時間送り）→ 気温と生き物の関係（発見/比較型）→
   はかせ（季節と暮らしの知恵）。
   数値：学習指導要領・小4理科「季節と生物」＝動物の活動、植物の成長は暖かい季節・寒い季節などに
   よって違いがある。東京の月別平均気温の平年値（1991〜2020年、気象庁）：1月5.4℃・3月9.4℃・
   4月14.3℃・6月21.9℃・8月26.9℃・10月18.0℃・11月12.5℃・12月7.7℃。東京のサクラ開花日は
   平年3月下旬ごろ（気象庁生物季節観測）。ツバメは3月に西日本、4月に東日本の広範囲へ飛来し、
   あたたかい季節を日本ですごした後、寒くなると南の国へ旅立つ。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
const plain = s => s.replace(/<[^>]+>/g, '');
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}
function lerpColor(c0, c1, f) {
  const p = parseInt(c0.slice(1), 16), q = parseInt(c1.slice(1), 16);
  const r0 = (p >> 16) & 255, g0 = (p >> 8) & 255, b0 = p & 255;
  const r1 = (q >> 16) & 255, g1 = (q >> 8) & 255, b1 = q & 255;
  return `rgb(${Math.round(lerp(r0, r1, f))},${Math.round(lerp(g0, g1, f))},${Math.round(lerp(b0, b1, f))})`;
}

const W = {
  seirei: ruby('精霊', 'せいれい'),
  kisetsu: ruby('季節', 'きせつ'),
  ikimono: ruby('生', 'い') + 'き' + ruby('物', 'もの'),
  katsudou: ruby('活動', 'かつどう'),
  kion: ruby('気温', 'きおん'),
  su: ruby('巣', 'す'),
  wataridori: ruby('渡', 'わた') + 'り' + ruby('鳥', 'どり'),
  kouyou: ruby('紅葉', 'こうよう'),
  fuyume: ruby('冬芽', 'ふゆめ'),
  koromogae: ruby('衣替', 'ころもが') + 'え',
  shun: ruby('旬', 'しゅん'),
  mimamoru: ruby('見守', 'みまも') + 'る',
};

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#fffaf9'); g.addColorStop(1, '#f5c9d8');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
}

// ---------- カード描画（発見型ミッション共通） ----------
function drawCardGrid(X, Y, sc, cards, foundSet, cols, title) {
  bgFill(X, Y, sc);
  const xs3 = [220, 500, 780];
  const xs4 = [180, 380, 620, 820];
  const xs2 = [340, 660];
  cards.forEach((c, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const px = cols === 3 ? xs3[col] : cols === 2 ? xs2[col] : xs4[col];
    const py = row === 0 ? 250 : 440;
    const done = foundSet.has(c.key);
    gctx.beginPath(); gctx.arc(X(px), Y(py), 46 * sc, 0, TAU);
    gctx.fillStyle = done ? '#d9527a' : '#f2c9d8';
    gctx.fill(); gctx.strokeStyle = '#d9527a'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(c.icon, X(px), Y(py - 2));
    gctx.fillStyle = '#7a2848'; gctx.font = `700 ${13 * sc}px sans-serif`;
    gctx.fillText((c.num || c.letter) + ' ' + plain(c.name), X(px), Y(py + 62));
  });
  gctx.fillStyle = '#7a2848'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(title, X(500), Y(70));
}

// ---------- サクラの木（枝ぶり＋花/葉/紅葉を点の集まりで表現） ----------
function drawSakuraTree(X, Y, sc, v) {
  const trunkX = 280, baseY = 520, topY = 280;
  gctx.strokeStyle = '#7a5a3a'; gctx.lineWidth = 16 * sc; gctx.lineCap = 'round';
  gctx.beginPath(); gctx.moveTo(X(trunkX), Y(baseY)); gctx.lineTo(X(trunkX), Y(topY)); gctx.stroke();
  gctx.lineWidth = 8 * sc;
  gctx.beginPath(); gctx.moveTo(X(trunkX), Y(topY + 30)); gctx.lineTo(X(trunkX - 60), Y(topY - 20)); gctx.stroke();
  gctx.beginPath(); gctx.moveTo(X(trunkX), Y(topY + 30)); gctx.lineTo(X(trunkX + 60), Y(topY - 20)); gctx.stroke();
  gctx.beginPath(); gctx.moveTo(X(trunkX), Y(topY + 10)); gctx.lineTo(X(trunkX), Y(topY - 40)); gctx.stroke();

  const i0 = clamp(Math.floor(v), 0, 7), i1 = clamp(Math.ceil(v), 0, 7), f = v - i0;
  const count = Math.round(lerp(SAKURA_COUNT[i0], SAKURA_COUNT[i1], f));
  const color = lerpColor(SAKURA_COLORS[i0], SAKURA_COLORS[i1], f);
  const cx = trunkX, cy = 250, rx = 108, ry = 66, GA = 137.5 * Math.PI / 180;
  for (let i = 0; i < count; i++) {
    const ang = i * GA, rad = Math.sqrt(i / 40);
    const px = cx + Math.cos(ang) * rad * rx, py = cy + Math.sin(ang) * rad * ry;
    gctx.beginPath(); gctx.arc(X(px), Y(py), 8 * sc, 0, TAU);
    gctx.fillStyle = color; gctx.fill();
  }
}

function drawHouseAndSwallow(X, Y, sc, v, t) {

  gctx.fillStyle = '#c9502e'; gctx.fill(); gctx.strokeStyle = '#8a3018'; gctx.lineWidth = 2 * sc; gctx.stroke();
  gctx.fillStyle = '#f5e8d8'; gctx.fillRect(X(620), Y(300), (840 - 620) * sc, (520 - 300) * sc);
  gctx.strokeStyle = '#c9a878'; gctx.lineWidth = 2 * sc; gctx.strokeRect(X(620), Y(300), (840 - 620) * sc, (520 - 300) * sc);
  gctx.fillStyle = '#8ab8d9'; gctx.fillRect(X(700), Y(360), 40 * sc, 40 * sc);

  const idxNow = clamp(Math.round(v), 0, 7);
  const mode = TSUBAME_MODES[idxNow];
  const nestBuilt = idxNow >= 2;
  const nestX = 700, nestY = 305;
  if (nestBuilt) {
    gctx.beginPath(); gctx.ellipse(X(nestX), Y(nestY), 22 * sc, 12 * sc, 0, 0, TAU);
    gctx.fillStyle = '#a87850'; gctx.fill(); gctx.strokeStyle = '#7a5a3a'; gctx.lineWidth = 2 * sc; gctx.stroke();
  }
  if (mode === 'nesting' || mode === 'chicks') {
    gctx.font = `${30 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText('🐦', X(nestX), Y(nestY - 14));
    if (mode === 'chicks') {
      [-12, 0, 12].forEach(dx => {
        gctx.beginPath(); gctx.arc(X(nestX + dx), Y(nestY + 2), 5 * sc, 0, TAU);
        gctx.fillStyle = '#ffe08a'; gctx.fill(); gctx.strokeStyle = '#c9a020'; gctx.lineWidth = 1 * sc; gctx.stroke();
      });

  } else if (mode === 'flying') {
    const bx = 380 + (idxNow * 70) % 420, by = 140 + Math.sin(t * 2) * 10;
    gctx.font = `${30 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText('🐦', X(bx), Y(by));
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#d9527a', '#ff9ec0', '#e8a33d', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') {
    const b = document.querySelector('#btnRow .btn:not(.sub)') || document.querySelector('#panelBody .btn:not(.sub)');
    if (b) b.click();
  }
});

// ---------- UIヘルパー ----------
const bubbleEl = $('bubble'), wishEl = $('wishCard'), btnRow = $('btnRow');
function say(html) {
  bubbleEl.style.animation = 'none'; void bubbleEl.offsetWidth;
  bubbleEl.style.animation = ''; bubbleEl.innerHTML = html;
}
function setWish(icon, html) {
  wishEl.style.display = 'flex';
  wishEl.querySelector('.icon').textContent = icon;
  wishEl.querySelector('.wbody').innerHTML = html;
}
function hideWish() { wishEl.style.display = 'none'; }
function setButtons(list) {
  btnRow.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.cls ? ' ' + b.cls : '');
    el.innerHTML = b.label;
    el.onclick = () => { sTap(); b.cb(el); };
    btnRow.appendChild(el);
  });
}
function award(id) {
  if (S.badges.has(id)) return;
  S.badges.add(id);
  $('bd_' + id).classList.add('on');
  if (typeof recordBadge === 'function') recordBadge(S.badges.size, document.querySelectorAll('#badges .badge').length);
}
const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }
const controlsEl = $('controls');
function setControls(list) {
  controlsEl.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'ctl' + (b.cls ? ' ' + b.cls : ''); el.innerHTML = b.label;
    el.disabled = !!b.disabled;
    el.onclick = () => { if (el.disabled) return; ac(); b.cb(el); };
    controlsEl.appendChild(el);
  });
}
function updateLoc() {
  const titles = {
    doubutsu: '🐦 動物の1年のようすを見つけよう',
    shokubutsu: '🌸 植物の1年のようすを見つけよう',
    meguru: '🍂 1年をめぐる、生き物カレンダー',
    kion: '🌡️ 気温と生き物の関係',
    hakase: '🔎 はかせチャレンジ',
    done: '🍂 メグルの庭 ものがたり',
  };
  $('stageTitle').textContent = titles[S.scene] || 'メグルの庭';
}

function choiceRow(opts, cb) {
  return opts.map((label, i) => ({ label, cls: 'choice', cb: el => cb(i, el) }));
}
function markPicked(el) {
  btnRow.querySelectorAll('.choice').forEach(b => b.classList.remove('picked'));
  el.classList.add('picked');
}

        ② サクラは、寒く なると 葉が 落ちて、（<span class="blankWord" data-a="冬芽">？？？</span>）の すがたで 春を 待つ。<br>
        ③ ツバメは、寒く なると（<span class="blankWord" data-a="南の国">？？？</span>）へ 旅立つ。<br>
        ④ 気温が 高い 季節ほど、生き物の ${W.katsudou}は（<span class="blankWord" data-a="活発">？？？</span>）に なる。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ あたたかい季節だけいて、寒くなると南の方へ旅立つ</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>①近くの木や花を観察して、季節によってどう変わるか記録してみよう。<br>②図鑑やインターネットで、他にどんな渡り鳥がいるか調べてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#d9527a'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「動物の活動は季節でどう変わる？」「サクラの葉が紅葉するのはいつ？」「ツバメは1年中日本にいる？」`);
      setButtons([
        { label: '🐦 動物の1年の図', cls: 'sub', cb: () => this.show('doubutsu') },
        { label: '🌸 植物の1年の図', cls: 'sub', cb: () => this.show('shokubutsu') },
        { label: '🍂 生き物カレンダーの図', cls: 'sub', cb: () => this.show('meguru') },
        { label: '🌡️ 気温と生き物の図', cls: 'sub', cb: () => this.show('kion') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_meguru などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
