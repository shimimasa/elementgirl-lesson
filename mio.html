<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ミオの道場 — 人の体のつくりと運動・骨/筋肉/関節（小4理科・人体分野3作目・協力型・1ファイル）
   骨・筋肉・関節ってなに？（発見型）→ うでを曲げる・のばすしくみ（メイン操作・①〜⑦の数値階段）→
   体のいろいろな関節を見つけよう（発見型）→ 手羽先で見る、動物の体のつくり（発見/比較型）→
   はかせ（骨と筋肉を守る生活の知恵）。
   数値：学習指導要領・小4理科「人の体のつくりと運動」＝人や他の動物の体には骨と筋肉があり、
   骨と骨のつなぎ目の関節でさまざまな動きができること。肘関節の参考可動域は屈曲145°
   （日本整形外科学会・日本リハビリテーション医学会「関節可動域表示ならびに測定法」、WebSearchで裏取り）。
   うでを曲げる時は力こぶがわの筋肉（上腕二頭筋）がちぢみ、反対がわ（上腕三頭筋）はゆるむ
   拮抗筋の関係。ニワトリの手羽先は骨・関節のつくりが人のうでと相同で理科教育の定番教材。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
const plain = s => s.replace(/<[^>]+>/g, '');
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}
function lerpColor(c0, c1, f) {
  const p = parseInt(c0.slice(1), 16), q = parseInt(c1.slice(1), 16);
  const r0 = (p >> 16) & 255, g0 = (p >> 8) & 255, b0 = p & 255;
  const r1 = (q >> 16) & 255, g1 = (q >> 8) & 255, b1 = q & 255;
  return `rgb(${Math.round(lerp(r0, r1, f))},${Math.round(lerp(g0, g1, f))},${Math.round(lerp(b0, b1, f))})`;
}

const W = {
  seirei: ruby('精霊', 'せいれい'),
  hone: ruby('骨', 'ほね'),
  kinniku: ruby('筋肉', 'きんにく'),
  kansetsu: ruby('関節', 'かんせつ'),
  magege: ruby('曲', 'ま') + 'げのばし',
  tebasaki: ruby('手羽先', 'てばさき'),
  junbiundou: ruby('準備運動', 'じゅんびうんどう'),
  shisei: ruby('姿勢', 'しせい'),
  futan: ruby('負担', 'ふたん'),
  seichouki: ruby('成長期', 'せいちょうき'),
  kossetsu: ruby('骨折', 'こっせつ'),

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#fbfffb'); g.addColorStop(1, '#c5e8d5');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
}

// ---------- うでの図（骨・筋肉・関節） ----------
function drawArmXray(X, Y, sc, bendDeg) {
  const shoulder = { x: 230, y: 260 };
  const upperLen = 190, forearmLen = 210;
  const elbow = { x: shoulder.x + upperLen, y: shoulder.y };
  const rad = bendDeg * Math.PI / 180;
  const wrist = { x: elbow.x + forearmLen * Math.cos(rad), y: elbow.y - forearmLen * Math.sin(rad) };
  const bendFrac = clamp(bendDeg / 145, 0, 1);

  function seg(p0, p1, r, fill, stroke) {
    const ang = Math.atan2(p1.y - p0.y, p1.x - p0.x);
    const len = Math.hypot(p1.x - p0.x, p1.y - p0.y);
    gctx.save();
    gctx.translate(X(p0.x), Y(p0.y));
    gctx.rotate(ang);
    gctx.beginPath();
    gctx.roundRect(0, -r * sc, len * sc, r * 2 * sc, r * sc);
    gctx.fillStyle = fill; gctx.fill();
    if (stroke) { gctx.strokeStyle = stroke; gctx.lineWidth = 2 * sc; gctx.stroke(); }
    gctx.restore();
  }

  // 皮ふ（うでの外形）
  seg(shoulder, elbow, 46, '#ffe8d8', '#e8b896');
  seg(elbow, wrist, 38, '#ffe8d8', '#e8b896');

  // きんにく：力こぶがわ（上）と反対がわ（下）。曲げるほど力こぶがわがちぢんで盛り上がる
  const PALE = '#f5d9b8', VIVID = '#e8593f';
  const midX = (shoulder.x + elbow.x) / 2, midY = shoulder.y;
  const bicepR = 24 + bendFrac * 20, tricepR = 24 + (1 - bendFrac) * 20;
  gctx.beginPath(); gctx.ellipse(X(midX), Y(midY - 30), 44 * sc, bicepR * sc, 0, 0, TAU);
  gctx.fillStyle = lerpColor(PALE, VIVID, bendFrac); gctx.fill();
  gctx.strokeStyle = '#8a4a2e'; gctx.lineWidth = 2 * sc; gctx.stroke();
  gctx.beginPath(); gctx.ellipse(X(midX), Y(midY + 30), 44 * sc, tricepR * sc, 0, 0, TAU);
  gctx.fillStyle = lerpColor(PALE, VIVID, 1 - bendFrac); gctx.fill();
  gctx.strokeStyle = '#8a4a2e'; gctx.lineWidth = 2 * sc; gctx.stroke();

  // ほね（中心の線）
  gctx.strokeStyle = '#b8a888'; gctx.lineWidth = 6 * sc; gctx.lineCap = 'round';
  gctx.beginPath(); gctx.moveTo(X(shoulder.x), Y(shoulder.y)); gctx.lineTo(X(elbow.x), Y(elbow.y)); gctx.stroke();
  gctx.beginPath(); gctx.moveTo(X(elbow.x), Y(elbow.y)); gctx.lineTo(X(wrist.x), Y(wrist.y)); gctx.stroke();

  // かんせつ（ひじ）
  gctx.beginPath(); gctx.arc(X(elbow.x), Y(elbow.y), 12 * sc, 0, TAU);
  gctx.fillStyle = '#fff'; gctx.fill(); gctx.strokeStyle = '#1f7a5c'; gctx.lineWidth = 3 * sc; gctx.stroke();

  // 手
  gctx.font = `${28 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('✋', X(wrist.x), Y(wrist.y));

  // ラベル
  gctx.font = `700 ${12 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillStyle = '#8a4a2e';
  gctx.fillText('力こぶがわ', X(midX), Y(midY - 62));
  gctx.fillText('反対がわ', X(midX), Y(midY + 62));
}

function drawStage(t, dt) {

  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);

}

// ---------- ミオのめがね（丸窓） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fbfffb'); grd.addColorStop(1, '#b8e0cc');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'musclebar') {
    drawMuscleBar(R, S.scope.bicep, S.scope.tricep);
  } else if (mode === 'point') {
    sctx.fillStyle = '#1f7a5c';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#b8f0d088'); g2.addColorStop(1, 'rgba(184,240,208,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#1f7a5c'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('💪', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#1f7a5c'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#1a4a3a';
    sctx.fillText(txt, R, ly);
  }

  function drawMuscleBar(R, bicepFrac, tricepFrac) {
    const barW = R * 0.22, gap = R * 0.16;
    const x1 = R - gap / 2 - barW, x2 = R + gap / 2;
    const baseY = R * 1.42, maxH = R * 0.82;
    function bar(x, frac, color) {
      const hh = maxH * clamp(frac || 0, 0, 1);
      sctx.fillStyle = '#eef7f0'; sctx.fillRect(x, baseY - maxH, barW, maxH);
      sctx.fillStyle = color; sctx.fillRect(x, baseY - hh, barW, hh);
      sctx.strokeStyle = '#1f7a5c'; sctx.lineWidth = 1.6; sctx.strokeRect(x, baseY - maxH, barW, maxH);
    }
    bar(x1, bicepFrac, '#e8593f');
    bar(x2, tricepFrac, '#f5d9b8');
    sctx.font = `700 ${R * 0.082}px sans-serif`; sctx.textAlign = 'center'; sctx.fillStyle = '#1a4a3a';
    sctx.fillText('力こぶ', x1 + barW / 2, baseY + R * 0.11);
    sctx.fillText('反対', x2 + barW / 2, baseY + R * 0.11);
    label('きんにくの ちぢみぐあい');
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#1f7a5c', '#5fc99a', '#e8593f', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

const bubbleEl = $('bubble'), wishEl = $('wishCard'), btnRow = $('btnRow');
function say(html) {
  bubbleEl.style.animation = 'none'; void bubbleEl.offsetWidth;
  bubbleEl.style.animation = ''; bubbleEl.innerHTML = html;
}
function setWish(icon, html) {
  wishEl.style.display = 'flex';
  wishEl.querySelector('.icon').textContent = icon;
  wishEl.querySelector('.wbody').innerHTML = html;
}
function hideWish() { wishEl.style.display = 'none'; }
function setButtons(list) {
  btnRow.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.cls ? ' ' + b.cls : '');
    el.innerHTML = b.label;
    el.onclick = () => { sTap(); b.cb(el); };
    btnRow.appendChild(el);
  });
}
function award(id) {
  if (S.badges.has(id)) return;
  S.badges.add(id);
  $('bd_' + id).classList.add('on');
  if (typeof recordBadge === 'function') recordBadge(S.badges.size, document.querySelectorAll('#badges .badge').length);
}
const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }
const controlsEl = $('controls');
function setControls(list) {
  controlsEl.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'ctl' + (b.cls ? ' ' + b.cls : ''); el.innerHTML = b.label;
    el.disabled = !!b.disabled;
    el.onclick = () => { if (el.disabled) return; ac(); b.cb(el); };
    controlsEl.appendChild(el);
  });
}
function updateLoc() {
  const titles = {
    mitsukeru: '🔍 骨・筋肉・関節ってなに？',
    ude: '💪 うでを曲げる・のばすしくみ',
    kansetsu: '🔄 体のいろいろな関節を見つけよう',
    doubutsu: '🍗 手羽先で見る、動物の体のつくり',
    hakase: '🔎 はかせチャレンジ',
    done: '💪 ミオの道場 ものがたり',
  };
  $('stageTitle').textContent = titles[S.scene] || 'ミオの道場';
}

function choiceRow(opts, cb) {
  return opts.map((label, i) => ({ label, cls: 'choice', cb: el => cb(i, el) }));
}
function markPicked(el) {
  btnRow.querySelectorAll('.choice').forEach(b => b.classList.remove('picked'));
  el.classList.add('picked');
}

function gotoStep(i) {
  S.stepIndex = clamp(i, 0, FLOW.length - 1);
  S.phase = ''; S.tween = null;
  hideOverlay(); hideWish();
  setControls([]); setButtons([]);
  STEPS[FLOW[S.stepIndex]].enter();
  updateLoc();
}
const nextStep = () => gotoStep(S.stepIndex + 1);

      updateLoc();
      setWish('💪', `「曲げる」ボタンで ひじを ①0°から ⑦145°まで 曲げていって、きんにくの ようすを たしかめよう。`);

      this.refreshCtl();
    },
    refreshCtl() {
      if (S.udeIdx >= ANGLE_STEPS.length - 1) { this.finish(); return; }
      setControls([{ label: `💪 もっと 曲げる（つぎの段階へ）`, cb: () => this.advance() }]);
    },
    advance() {
      if (S.udeIdx >= ANGLE_STEPS.length - 1) return;
      setControls([]);
      const fromV = S.udeIdx, toV = S.udeIdx + 1;
      startTween(fromV, toV, 0.7, v => {
        S.udeIdxDisplay = v;
        const f = bendFracFor(v);
        S.scope = { type: 'musclebar', bicep: f, tricep: 1 - f };
      }, () => {
        S.udeIdx++; S.udeIdxDisplay = S.udeIdx;
        sTap();
        this.refreshCtl();
      });
    },
    finish() {
      setControls([{ label: '💪 のばしてみる（元にもどす）', cb: () => this.reverse() }]);
      say(`①〜⑦まで、ひじを 曲げたね。こんどは 伸ばして、きんにくが どう 変わるか 見てみよう。`);
    },
    reverse() {
      setControls([]);
      startTween(S.udeIdx, 0, 1.0, v => {
        S.udeIdxDisplay = v;
        const f = bendFracFor(v);
        S.scope = { type: 'musclebar', bicep: f, tricep: 1 - f };
      }, () => {
        S.udeIdx = 0; S.udeIdxDisplay = 0;
        sTap();
        say(`伸ばすと、力こぶがわの きんにくが ゆるんで、反対がわが ちぢんだね。`);
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);

      hideWish(); setButtons([]);

  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      hideOverlay();
      scopeBurst();
      say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
      setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
    },
  },

        <p class="talk" id="blankArea">きょうの <b>4つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 体を 動かせるのは、ほねと（<span class="blankWord" data-a="きんにく">？？？</span>）の はたらきの おかげ。<br>
        ② うでを 曲げると、力こぶがわの きんにくが（<span class="blankWord" data-a="ちぢみ">？？？</span>）、反対がわは ゆるむ。<br>
        ③ 肩と ひざでは、動く（<span class="blankWord" data-a="方向">？？？</span>）が ちがう。<br>
        ④ ニワトリの 手羽先と 人の うでは、ほねの つくりが（<span class="blankWord" data-a="にている">？？？</span>）。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 片方だけ ちぢんで もう片方は ゆるむ</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>①自分の うでを さわりながら ゆっくり 曲げのばしして、力こぶがわと 反対がわ、どちらが ちぢむか たしかめてみよう。<br>②肩・ひざ・ゆびなど、いろんな かんせつが どんな 方向に 動くか、動かしてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#1f7a5c'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「体を動かせるのは、骨と何のおかげ？」「うでを曲げると力こぶがわはどうなる？」「肩とひざ、動き方は同じ？」`);
      setButtons([
        { label: '🔍 骨・筋肉・関節の図', cls: 'sub', cb: () => this.show('mitsukeru') },
        { label: '💪 うでを曲げる図', cls: 'sub', cb: () => this.show('ude') },
        { label: '🔄 いろいろな関節の図', cls: 'sub', cb: () => this.show('kansetsu') },
        { label: '🍗 動物とのくらべっこの図', cls: 'sub', cb: () => this.show('doubutsu') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_ude などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
