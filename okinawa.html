<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   シーサの家 — あたたかい土地の くらし（小5社会・地理・協力型・1ファイル）
   台風の 多さを 知る → 昔ながらの 家の 工夫（赤瓦・しっくい・石垣・フクギ）→
   台風から 家を 守る シミュレーション → 今の くらし（RC造）→
   はかせ（あたたかい 気候を いかした 産業）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  akagawara: ruby('赤瓦', 'あかがわら'),
  shikkui: 'しっくい',
  ishigaki: ruby('石垣', 'いしがき'),
  fukugi: 'フクギ',
  shiisaa: 'シーサー',
  taifu: ruby('台風', 'たいふう'),
  fuusoku: ruby('最大瞬間風速', 'さいだいしゅんかんふうそく'),
  miyako: ruby('宮古島台風', 'みやこじまたいふう'),
  tekkin: ruby('鉄筋', 'てっきん') + 'コンクリート',
  denshougiku: ruby('電照菊', 'でんしょうぎく'),
  satoukibi: 'さとうきび',
  sango: ruby('珊瑚', 'さんご') + '礁',
};

const NUMS = '①②③④⑤⑥⑦⑧';
const WIND_MS = [17, 21, 25, 30, 35, 40, 50, 60];

// ---------- 判定ロジック ----------
function judgeTaifu(n) { // n: 1-8　風の強さ
  if (n <= 2) return { level: 'safe' };
  if (n >= 7) return { level: 'danger' };
  return { level: 'ok' };
}

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));
const sWind = () => { tone(210, 0, 0.7, 'sawtooth', 0.05); tone(140, 0.12, 0.9, 'sawtooth', 0.06); };

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

// ---------- カード発見ポイントの共通描画 ----------
function drawPointMarkers(points, foundSet, X, Y, sc) {
  points.forEach(p => {
    const done = foundSet.has(p.key);
    const px = X(p.x), py = Y(p.y);
    gctx.beginPath(); gctx.arc(px, py, 22 * sc, 0, TAU);
    gctx.fillStyle = done ? '#7a3018' : '#fff';
    gctx.fill();
    gctx.strokeStyle = '#3a2010'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.fillStyle = done ? '#fff' : '#7a3018';
    gctx.font = `700 ${20 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(p.letter, px, py + 1 * sc);
  });
}

  gctx.bezierCurveTo(X(370), Y(440), X(400), Y(370), X(470), Y(360));

// ---------- 家（伝統家屋）の共通イラスト ----------
function drawTree(X, Y, sc, cx, baseY) {
  gctx.fillStyle = '#5a7a2a'; gctx.strokeStyle = '#2a4a10'; gctx.lineWidth = 1.6 * sc;
  gctx.fillRect(X(cx - 5), Y(baseY - 6), 10 * sc, 40 * sc);
  for (let i = 0; i < 3; i++) {
    gctx.beginPath();
    gctx.ellipse(X(cx), Y(baseY - 60 - i * 26), 34 * sc, 20 * sc, 0, 0, TAU);
    gctx.fillStyle = i % 2 === 0 ? '#6fa03a' : '#7fb04a';
    gctx.fill(); gctx.stroke();
  }
}
function drawHouse(X, Y, sc, shakeX) {
  const bx = 500 + (shakeX || 0), baseY = 500;
  gctx.fillStyle = '#b0a690'; gctx.strokeStyle = '#4a2a16'; gctx.lineWidth = 2 * sc;
  gctx.fillRect(X(bx - 270), Y(baseY - 4), 540 * sc, 24 * sc);
  gctx.strokeStyle = 'rgba(74,42,22,.4)'; gctx.lineWidth = 1 * sc;
  for (let lx = bx - 260; lx < bx + 270; lx += 34) {
    gctx.beginPath(); gctx.moveTo(X(lx), Y(baseY - 4)); gctx.lineTo(X(lx), Y(baseY + 20)); gctx.stroke();
  }
  drawTree(X, Y, sc, bx - 250, baseY);
  drawTree(X, Y, sc, bx + 250, baseY);
  gctx.fillStyle = '#fdf6e8'; gctx.strokeStyle = '#4a2a16'; gctx.lineWidth = 2.4 * sc;
  gctx.beginPath(); gctx.rect(X(bx - 170), Y(baseY - 130), 340 * sc, 130 * sc); gctx.fill(); gctx.stroke();
  gctx.fillStyle = '#dfeef2';
  gctx.fillRect(X(bx - 130), Y(baseY - 95), 70 * sc, 60 * sc);
  gctx.fillRect(X(bx + 60), Y(baseY - 95), 70 * sc, 60 * sc);
  gctx.strokeRect(X(bx - 130), Y(baseY - 95), 70 * sc, 60 * sc);
  gctx.strokeRect(X(bx + 60), Y(baseY - 95), 70 * sc, 60 * sc);
  gctx.fillStyle = '#a8492a'; gctx.strokeStyle = '#4a2a16'; gctx.lineWidth = 2.4 * sc;
  gctx.beginPath();
  gctx.moveTo(X(bx - 220), Y(baseY - 130));
  gctx.lineTo(X(bx), Y(baseY - 210));
  gctx.lineTo(X(bx + 220), Y(baseY - 130));
  gctx.lineTo(X(bx + 175), Y(baseY - 118));
  gctx.lineTo(X(bx), Y(baseY - 186));
  gctx.lineTo(X(bx - 175), Y(baseY - 118));
  gctx.closePath(); gctx.fill(); gctx.stroke();
  gctx.strokeStyle = 'rgba(253,246,232,.85)'; gctx.lineWidth = 1.6 * sc;
  for (let i = 1; i <= 3; i++) {
    const t = i / 4;
    gctx.beginPath();
    gctx.moveTo(X(lerp(bx - 220, bx, t)), Y(lerp(baseY - 130, baseY - 210, t)));
    gctx.lineTo(X(lerp(bx, bx + 220, t)), Y(lerp(baseY - 210, baseY - 130, t)));
    gctx.stroke();
  }
  gctx.font = `${30 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('🦁', X(bx), Y(baseY - 200));
}

// ---------- 台風から家を守れ（メイン操作） ----------
function drawWindLines(X, Y, sc, level, t) {
  if (!level) return;
  const n = 3 + level;
  for (let i = 0; i < n; i++) {
    const yy = 50 + (i * 480 / n) + (Math.sin(i * 1.7) * 10);
    const speed = 260 + level * 60;
    const xoff = ((t * speed + i * 90) % 1300);
    const xx = 1050 - xoff;
    if (xx < -80 || xx > 1050) continue;
    gctx.strokeStyle = `rgba(255,255,255,${0.28 + level * 0.05})`;
    gctx.lineWidth = (1.3 + level * 0.18) * sc;
    gctx.beginPath();
    gctx.moveTo(X(xx), Y(yy));
    gctx.lineTo(X(xx - 55 - level * 6), Y(yy + 14));
    gctx.stroke();
  }
}
function drawFlyingTiles(X, Y, sc, t) {
  for (let i = 0; i < 4; i++) {
    const px = 520 + i * 30 - t * (320 + i * 70);
    const py = 300 - t * (170 + i * 30) + i * 8;
    gctx.save();
    gctx.translate(X(px), Y(py));
    gctx.rotate(t * 7 + i);
    gctx.fillStyle = '#a8492a'; gctx.strokeStyle = '#4a2a16'; gctx.lineWidth = 1.4 * sc;
    gctx.beginPath();
    gctx.moveTo(-10 * sc, -6 * sc); gctx.lineTo(10 * sc, -6 * sc); gctx.lineTo(8 * sc, 6 * sc); gctx.lineTo(-8 * sc, 6 * sc);
    gctx.closePath(); gctx.fill(); gctx.stroke();
    gctx.restore();
  }
}
function drawMamoruScene(X, Y, sc) {
  const t = S.windAnimT || 0;
  const level = S.windLevel || 1;
  const stormy = t > 0.15 && level >= 3;
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(400));
  if (stormy) { g.addColorStop(0, '#7ec4cc'); g.addColorStop(1, '#dfeee0'); }
  else { g.addColorStop(0, '#bfeef2'); g.addColorStop(1, '#e6f6e0'); }
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.fillStyle = '#e8d8a8';
  gctx.fillRect(X(0), Y(400), 1000 * sc, 240 * sc);
  const shake = t > 0 && t < 1 && level >= 3 ? Math.sin(t * 60) * Math.min(level, 6) : 0;
  drawHouse(X, Y, sc, shake);
  if (t > 0) drawWindLines(X, Y, sc, level, t);
  if (S.windResult === 'danger' && t >= 1) drawFlyingTiles(X, Y, sc, Math.min((S.windDoneT || 0), 1));
  gctx.fillStyle = '#4a2a16'; gctx.font = `700 ${18 * sc}px sans-serif`; gctx.textAlign = 'center';
  gctx.fillText(`風の 強さ ${NUMS[clamp(level - 1, 0, 7)]}（秒速 約${WIND_MS[clamp(level - 1, 0, 7)]}m）`, X(500), Y(46));
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'taifu') drawTaifuScene(X, Y, sc);
  else if (S.scene === 'kufuu') drawKufuuScene(X, Y, sc);
  else if (S.scene === 'mamoru') drawMamoruScene(X, Y, sc);
  else if (S.scene === 'ima') drawImaScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawMamoruScene(X, Y, sc);
}

// ---------- シーサの めがね（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fff8ec'); grd.addColorStop(1, '#dfb787');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#7a3018'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'gauge') {
    const idx = clamp((S.windLevel || 1) - 1, 0, 7);
    const cx = R, cy = R * 1.05, rad = R * 0.72;
    sctx.strokeStyle = '#e8d2ac'; sctx.lineWidth = R * 0.13; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, 0); sctx.stroke();
    const frac = idx / 7;
    const ang = Math.PI - Math.PI * frac;
    sctx.strokeStyle = frac < 0.25 ? '#4a9a5a' : frac < 0.75 ? '#e0a020' : '#c1442e';
    sctx.lineWidth = R * 0.13;
    sctx.beginPath(); sctx.arc(cx, cy, rad, Math.PI, ang, true); sctx.stroke();
    sctx.strokeStyle = '#4a2a16'; sctx.lineWidth = R * 0.045; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(cx + Math.cos(ang) * rad * 0.88, cy + Math.sin(ang) * rad * 0.88); sctx.stroke();
    sctx.fillStyle = '#4a2a16'; sctx.beginPath(); sctx.arc(cx, cy, R * 0.05, 0, TAU); sctx.fill();
    label(`風速 ${NUMS[idx]}（秒速${WIND_MS[idx]}m）`);
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffe0a0'); g2.addColorStop(1, 'rgba(255,224,160,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#7a3018'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🦁', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#7a3018'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🏠', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#4a2a16';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#7a3018', '#ffe3a0', '#c1442e', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  if (S.windResult === 'danger' && S.windAnimT >= 1) S.windDoneT = clamp((S.windDoneT || 0) + dt * 0.6, 0, 1);
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

    },
  },

  // --- はかせチャレンジ：あたたかい気候をいかした産業 ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' }, hakaseFound: new Set() });
      updateLoc();
      hideWish();
      say(`さいごは <b>はかせチャレンジ</b>！ 台風の 多い あたたかい 気候は、こまることばかりでは ない。沖縄ならではの 産業を 3つ、しょうかいしよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HAKASE_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.hakaseFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.hakaseFound.size >= HAKASE_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.hakaseFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`あたたかい 気候は、沖縄の くらしに とって どんな 意味が あるだろう？`);
      setButtons(choiceRow(['ア こまった ことしか ない', 'イ あたたかさを 生かした 産業が たくさん 生まれている', 'ウ 何も 関係ない'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 1) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ ${W.denshougiku}は 出荷量 日本一、${W.satoukibi}は 台風にも 強い 沖縄いちばんの 作物、そして 美しい ${W.sango}の 海は 観光や 漁業の めぐみに。<br><br>💡 <b>たいせつポイント</b><br>台風と 向き合いながら、あたたかい 気候を うまく 生かす……それが 沖縄の くらしの 知恵なんだ。`);
        setButtons([{ label: 'ふりかえりタイムへ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア こまった ことしか ない', 'イ あたたかさを 生かした 産業が たくさん 生まれている', 'ウ 何も 関係ない'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- ふりかえりタイム：4ミッション+はかせの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      if (slide.video) {
        const videoUrl = `https://www.youtube.com/watch?v=${slide.video}`;
        const canEmbed = slide.embeddable !== false;
        showOverlay(`
          <h2>${slide.icon} ふりかえりタイム（${n}/${total}）${slide.title}</h2>
          <div id="furikaeriThumb" style="max-width:380px;margin:0 auto;cursor:pointer">
            <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
              <img src="https://img.youtube.com/vi/${slide.video}/hqdefault.jpg" style="width:100%;display:block;opacity:.85">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <div style="width:15%;aspect-ratio:1;min-width:56px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(24px,3vw,34px)">▶</div>
              </div>
            </div>
            <div style="margin-top:.5em;color:#3a7ab8;font-size:clamp(12px,1.3vw,16px)">${canEmbed ? 'タップすると この画面で 動画が はじまるよ' : 'タップすると 新しい タブで 動画が ひらくよ'}</div>
          </div>
          <p class="talk">${slide.text()}</p>
          <button class="btn" id="furikaeriNextBtn">${isLast ? 'まとめへ すすむ' : 'つぎへ'}</button>
          <div class="foot">先生へ：動画はYouTubeの教育系チャンネルです。内容を事前にご確認ください。URL: ${videoUrl}</div>
        `);
        $('furikaeriThumb').onclick = () => {
          sTap();
          if (canEmbed) {
            const embedUrl = `https://www.youtube-nocookie.com/embed/${slide.video}?rel=0&modestbranding=1&iv_load_policy=3&autoplay=1`;
            $('furikaeriThumb').outerHTML = `<div style="max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#000"><iframe width="100%" height="100%" src="${embedUrl}" title="${slide.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
          } else {
            window.open(videoUrl, '_blank', 'noopener');
          }
        };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' }, windLevel: 5, windAnimT: 1, windResult: 'ok' });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ シーサの家 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 1966年、宮古島で 記録した 最大瞬間風速は 約（<span class="blankWord" data-a="秒速85m">？？？</span>）。<br>
        ② 屋根の 瓦を しっくいで 固める 理由は、強い（<span class="blankWord" data-a="風">？？？</span>）で 飛ばされないようにするため。<br>
        ③ 今の 沖縄の 家の 多くは（<span class="blankWord" data-a="コンクリート（RC造）">？？？</span>）で できている。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 今は 四角い コンクリートの 家が 多い</b> でした！ 赤瓦の 家は 減り、8わり以上が コンクリートの 家に 変わったんだよ。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>家の まわりで「風や 雨から 守る くふう」（雨戸・ひさし・へい など）を 1つ さがしてみよう。おうちの人と 話してみてね。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#3a2010'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'mamoru', scope: { type: 'glow' }, windLevel: 5, windAnimT: 1, windResult: 'ok' });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 沖縄の くらしについて、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「シーサーは 何を している？」「今の 家は 何で できている？」`);
      setButtons([
        { label: '🌀 台風の 図', cls: 'sub', cb: () => this.show('taifu') },
        { label: '🏠 家の 工夫の 図', cls: 'sub', cb: () => this.show('kufuu') },
        { label: '🏢 今の くらしの 図', cls: 'sub', cb: () => this.show('ima') },
        { label: '🌼 産業の 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_mamoru などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
