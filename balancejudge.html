<script>
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();

<script>
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- アンロック判定 ----------
const REQUIRE_SLUG = 'mihashira';
const BADGE_KEY = 'elementgirl_badge_progress';
function nsKey(base){
  try { return (typeof profileNamespacedKey === 'function') ? profileNamespacedKey(base) : base; }
  catch(e){ return base; }
}
function getBadgeProgress(){
  try { return JSON.parse(localStorage.getItem(nsKey(BADGE_KEY)) || '{}'); }
  catch(e){ return {}; }
}
function isUnlocked(){
  const p = getBadgeProgress()[REQUIRE_SLUG];
  return !!(p && p.total > 0 && p.count >= p.total);
}

// ---------- ベストタイム ----------
const BEST_KEY = 'balancejudge_best_ms';
function getBest(){
  const v = localStorage.getItem(nsKey(BEST_KEY));
  return v !== null ? parseInt(v, 10) : null;
}
function setBest(ms){
  try { localStorage.setItem(nsKey(BEST_KEY), String(ms)); } catch(e){}
}
function fmtTime(ms){
  const s = ms / 1000;
  return s.toFixed(1) + 'びょう';
}

// ---------- シナリオデータ(元本編mihashira.htmlのTAIRITSU配列＝夜の楽器練習の1件+新規4件) ----------
// 各シナリオとも「low=自分の権利に偏りすぎ／good=公共の福祉でちょうどよい(正解)／high=相手に譲りすぎ」の3択構造
// 政治的中立性への配慮：本編と同じく実在の政党・政治家・時事論争には触れず、教科書レベルの身近な対立のみ扱う
const SCENARIOS = [
  { key: 'gakki', situation: '夜おそく、楽器を れんしゅうしたい 自分と、静かに 休みたい 近所の人。権利が ぶつかったよ。',
    options: [
      { key: 'low',  label: '気にせず 大きな音で れんしゅうする', mine: 1.0,  other: 0.15 },
      { key: 'good', label: '時間と 音の 大きさを 決めて れんしゅうする', mine: 0.62, other: 0.62 },
      { key: 'high', label: 'れんしゅうを ぜんぶ やめてしまう', mine: 0.15, other: 1.0 },
    ] },
  { key: 'ball', situation: '公園で 元気に ボール遊びを したい 自分と、すぐ近くで 静かに すごしたい 人。権利が ぶつかったよ。',
    options: [
      { key: 'low',  label: '場所も 気にせず 大声で 思いきり遊ぶ', mine: 1.0,  other: 0.15 },
      { key: 'good', label: '遊ぶ場所と 声の大きさに 気をつけて遊ぶ', mine: 0.62, other: 0.62 },
      { key: 'high', label: 'ボール遊びを ぜんぶ あきらめる', mine: 0.15, other: 1.0 },
    ] },
  { key: 'pet', situation: 'ペットを 自由に 遊ばせたい 自分と、動物が にがてな 近所の人。権利が ぶつかったよ。',
    options: [
      { key: 'low',  label: 'どこでも ペットを 自由に 放しておく', mine: 1.0,  other: 0.15 },
      { key: 'good', label: 'みんなが 使う場所では リードなどで 気をつける', mine: 0.62, other: 0.62 },
      { key: 'high', label: 'ペットを 飼うことを ぜんぶ あきらめる', mine: 0.15, other: 1.0 },
    ] },
  { key: 'taiko', situation: 'お祭りの 太鼓を れんしゅうしたい 自分と、朝早くは 静かにしてほしい 近所の人。権利が ぶつかったよ。',
    options: [
      { key: 'low',  label: '朝早くから 大きな音で れんしゅうする', mine: 1.0,  other: 0.15 },
      { key: 'good', label: '決まった時間だけ、声をかけてから れんしゅうする', mine: 0.62, other: 0.62 },
      { key: 'high', label: '太鼓の れんしゅうを ぜんぶ やめてしまう', mine: 0.15, other: 1.0 },
    ] },
  { key: 'ouen', situation: '運動会の 応えん練習を したい 自分と、静かに くらしたい 近所の人。権利が ぶつかったよ。',
    options: [
      { key: 'low',  label: 'いつでも 大きな声で 応えん練習する', mine: 1.0,  other: 0.15 },
      { key: 'good', label: '時間を決めて 声の大きさに 気をつけて練習する', mine: 0.62, other: 0.62 },
      { key: 'high', label: '応えん練習を ぜんぶ やめてしまう', mine: 0.15, other: 1.0 },
    ] },
];

function shuffled(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- ゲーム状態 ----------
const S = {
  phase: 'title',    // title | lock | level | resultLevel | result
  levelIdx: 0,
  order: [],          // シャッフルされた選択肢配列
  mine: 0.5,
  other: 0.5,
  tween: null,        // {startAt, fromMine, fromOther, toMine, toOther, dur, onDone}
  gameStartAt: 0,
  gameEndAt: 0,
  sound: true,
};

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

// ---------- キャンバス ----------
const stageCv = $('stage'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}
const PAD_T = 30, PAD_B = 16, PAD_X = 14;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#f7fbf3'); g.addColorStop(1, '#c8e4c0');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.fillStyle = '#d0e8c8';
  gctx.beginPath(); gctx.ellipse(X(500), Y(500), 380 * sc, 130 * sc, 0, 0, TAU); gctx.fill();
}

// ---------- 柱を1本描く(mihashira.htmlのdrawPillarを移植) ----------
function drawPillar(X, Y, sc, cx, baseY, h, w, color, capIcon) {
  const top = baseY - h;
  gctx.fillStyle = color;
  gctx.strokeStyle = '#1a3324'; gctx.lineWidth = 2 * sc;
  gctx.beginPath();
  gctx.rect(X(cx - w / 2), Y(top), w * sc, (baseY - top) * sc);
  gctx.fill(); gctx.stroke();
  gctx.fillStyle = 'rgba(255,255,255,.25)';
  gctx.fillRect(X(cx - w / 2), Y(top), w * 0.25 * sc, (baseY - top) * sc);
  if (capIcon) {
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(capIcon, X(cx), Y(top - 24));
  }
}

function drawStage() {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  if (S.phase !== 'level' && S.phase !== 'resultLevel') return;
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  bgFill(X, Y, sc);

  drawPillar(X, Y, sc, 380, 480, 60 + S.mine * 260, 60, '#1f5c34', '🧑');
  drawPillar(X, Y, sc, 620, 480, 60 + S.other * 260, 60, '#245c2c', '🏠');

  gctx.fillStyle = '#1a3324'; gctx.font = `700 ${15 * sc}px sans-serif`; gctx.textAlign = 'center';
  gctx.fillText('じぶんの 権利', X(380), Y(555));
  gctx.fillText('相手の 権利', X(620), Y(555));

  gctx.font = `700 ${16 * sc}px sans-serif`;
  gctx.fillText(`${NUMS[S.levelIdx]} れべる`, X(500), Y(30));
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 60); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 240;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#ffe9a8', '#d4900f', '#3a9a5c', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function stageBurst() {
  const r = $('stageWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 出題進行 ----------
function updateHud(){
  const shown = S.phase === 'result' ? SCENARIOS.length : S.levelIdx + 1;
  $('levelChip').textContent = `れべる ${shown}/${SCENARIOS.length}`;
}
function updateBestChip(){
  const b = getBest();
  $('bestChip').textContent = (b !== null) ? `ベスト ${fmtTime(b)}` : 'ベスト —';
}
function setResultMsg(html){ $('resultMsg').innerHTML = html; }
function setControls(list){
  const el = $('controls');
  el.innerHTML = '';
  list.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'ctl' + (b.cls ? ' ' + b.cls : '');
    btn.innerHTML = b.label;
    btn.disabled = !!b.dis;
    btn.onclick = () => { ac(); b.cb(); };
    el.appendChild(btn);
  });
}

function startLevel(idx){
  S.levelIdx = idx;
  const sc = SCENARIOS[idx];
  S.order = shuffled(sc.options);
  S.mine = 0.5; S.other = 0.5;
  S.tween = null;
  S.phase = 'level';
  updateHud();
  $('situationBox').textContent = sc.situation;
  setResultMsg('3つの こうどうから「ちょうどよい」ものを えらぼう。');
  refreshCtl();
}
function refreshCtl(){
  setControls(S.order.map(opt => ({ label: opt.label, cb: () => onPick(opt) })));
}
function onPick(opt){
  sTap();
  setControls([]);
  const fromMine = S.mine, fromOther = S.other;
  S.tween = {
    startAt: performance.now(), dur: 900,
    fromMine, fromOther, toMine: opt.mine, toOther: opt.other,
  };
  S.pendingOpt = opt;
}
function finishTween(){
  const opt = S.pendingOpt;
  S.tween = null;
  S.mine = opt.mine; S.other = opt.other;
  if (opt.key === 'good') {
    sYes(); stageBurst();
    setResultMsg('✨ おたがいの 権利を 大事に できた！ ちょうどよい つりあいだね。');
    S.phase = 'resultLevel';
    setTimeout(() => {
      if (S.levelIdx >= SCENARIOS.length - 1) onAllClear();
      else startLevel(S.levelIdx + 1);
    }, 1500);
  } else {
    sHmm();
    const hint = opt.key === 'low'
      ? 'それだと じぶんの 権利ばかりに なってしまうよ。'
      : 'それだと 相手に ゆずりすぎに なってしまうよ。';
    setResultMsg('もういちど かんがえてみよう。' + hint);
    S.phase = 'resultLevel';
    setTimeout(() => {
      S.mine = 0.5; S.other = 0.5;
      S.phase = 'level';
      setResultMsg('3つの こうどうから「ちょうどよい」ものを えらぼう。');
      refreshCtl();
    }, 1700);
  }
}

function rankText(ms){
  const s = ms / 1000;
  if (s <= 25) return '👑 パーフェクト！ずばぬけた かんかく！';
  if (s <= 45) return '🌟🌟🌟 すごい！公共の福祉が よく わかったね！';
  if (s <= 75) return '🌟🌟 いいちょうし！';
  return '🌟 ぜんぶ つりあわせたね！';
}
function startGame(){
  S.gameStartAt = performance.now();
  startLevel(0);
}
function onAllClear(){
  S.phase = 'result';
  setControls([]);
  sFanfare();
  S.gameEndAt = performance.now();
  const totalMs = S.gameEndAt - S.gameStartAt;
  const best = getBest();
  const isNewBest = (best === null) || (totalMs < best);
  if (isNewBest) setBest(totalMs);
  $('resultTime').textContent = fmtTime(totalMs);
  $('resultRank').textContent = rankText(totalMs);
  $('resultBestMsg').textContent = isNewBest
    ? '🎉 じぶんの ベストタイム こうしん！'
    : `ベストタイム：${fmtTime(best)}`;
  $('starListEl').innerHTML = SCENARIOS.map((s, i) => `<span class="starChip">${NUMS[i]} ⚖️ つりあわせた</span>`).join('');
  updateHud();
  showOverlay('resultOverlay');
  updateBestChip();
}

// ---------- オーバーレイ ----------
function showOverlay(id){ $(id).classList.remove('hide'); }
function hideOverlay(id){ $(id).classList.add('hide'); }

$('btnStart').addEventListener('click', () => {
  ac();
  hideOverlay('titleOverlay');
  startGame();
  updateBestChip();
});
$('btnRetry').addEventListener('click', () => {
  hideOverlay('resultOverlay');
  showOverlay('titleOverlay');
  updateBestChip();
});

// ---------- 起動 ----------
function boot(){
  if (!isUnlocked()) {
    S.phase = 'lock';
    showOverlay('lockOverlay');
    return;
  }
  showOverlay('titleOverlay');
  updateBestChip();
  const best = getBest();
  if (best !== null) {
    $('bestInfo').style.display = 'block';
    $('bestInfo').innerHTML = `<p>いまの ベストタイム：<b>${fmtTime(best)}</b></p>`;
  }
}

// ---------- ループ ----------
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const t = clamp((now - S.tween.startAt) / S.tween.dur, 0, 1);
    S.mine = lerp(S.tween.fromMine, S.tween.toMine, t);
    S.other = lerp(S.tween.fromOther, S.tween.toOther, t);
    if (t >= 1) finishTween();
  }
  drawStage();
  drawFx(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
boot();
</script>
