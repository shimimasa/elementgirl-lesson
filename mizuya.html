<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ミズヤの里 — 低い土地のくらしと輪中（小4〜5社会・地理・協力型・1ファイル）
   輪中のしくみ発見 → 水位シミュレーション（堤防・母屋・水屋の多層防御） →
   宝暦治水の歴史 → 今のくらし（排水機場） → はかせ（伊勢湾台風とこれからの防災）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  kisosansen: ruby('木曽三川', 'きそさんせん'),
  kisogawa: ruby('木曽川', 'きそがわ'),
  nagaragawa: ruby('長良川', 'ながらがわ'),
  ibigawa: ruby('揖斐川', 'いびがわ'),
  waju: ruby('輪中', 'わじゅう'),
  wajutei: ruby('輪中堤', 'わじゅうてい'),
  mizuya: ruby('水屋', 'みずや'),
  agebune: ruby('上げ舟', 'あげぶね'),
  kaizu: ruby('海津市', 'かいづし'),
  houreki: ruby('宝暦治水', 'ほうれきちすい'),
  satsuma: ruby('薩摩藩', 'さつまはん'),
  hirata: ruby('平田靱負', 'ひらたゆきえ'),
  isewan: ruby('伊勢湾台風', 'いせわんたいふう'),
  haisui: ruby('排水機場', 'はいすいきじょう'),
};

const NUMS = '①②③④⑤⑥⑦⑧';
const SUII_M = ['0.5m', '1.0m', '1.5m', '2.0m', '2.5m', '3.0m', '3.5m', '4.0m'];

// ---------- 判定ロジック ----------
function judgeSuii(n) { // n: 1-8　もし堤防がやぶれた時の水位レベル
  if (n <= 1) return { level: 'low' };
  if (n >= 6) return { level: 'high' };
  return { level: 'mid' };
}

// ---------- 輪中のしくみ：手がかり ----------
const SHIKUMI_POINTS = [
  { key: 0, letter: 'あ', name: '輪中堤', x: 160, y: 260,

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

// ---------- 共通：輪中の断面図（堤防・川・母屋・水屋） ----------
const BASE_Y = 470;      // 地面の高さ
const MIZUYA_H = 240;    // 水屋の石垣の高さ(px) = 6目盛り = 3.0m
const UNIT_H = 40;       // 1目盛り(0.5m)あたりのpx
function drawSection(X, Y, sc, opts) {
  opts = opts || {};
  // 空
  const sky = gctx.createLinearGradient(0, Y(0), 0, Y(300));
  sky.addColorStop(0, '#cfe6d4'); sky.addColorStop(1, '#eef6ee');
  gctx.fillStyle = sky; gctx.fillRect(X(0), Y(0), 1000 * sc, 300 * sc);
  // 地面
  gctx.fillStyle = '#dcd0a8';
  gctx.fillRect(X(0), Y(300), 1000 * sc, 340 * sc);
  // 川（堤防の外側）
  gctx.fillStyle = '#4a90a4';
  gctx.fillRect(X(0), Y(230), 130 * sc, 410 * sc);
  gctx.fillStyle = 'rgba(255,255,255,.25)';
  for (let i = 0; i < 4; i++) { gctx.fillRect(X(20 + i * 28), Y(260 + i * 18), 18 * sc, 5 * sc); }
  // 堤防（輪中堤）
  gctx.fillStyle = '#4a7a56'; gctx.strokeStyle = '#22402e'; gctx.lineWidth = 2 * sc;
  gctx.beginPath();
  gctx.moveTo(X(130), Y(BASE_Y)); gctx.lineTo(X(160), Y(300)); gctx.lineTo(X(230), Y(300)); gctx.lineTo(X(260), Y(BASE_Y));
  gctx.closePath(); gctx.fill(); gctx.stroke();
  // 母屋
  gctx.fillStyle = '#c9a56a'; gctx.strokeStyle = '#22402e'; gctx.lineWidth = 2 * sc;
  gctx.beginPath(); gctx.rect(X(370), Y(BASE_Y - 90), 160 * sc, 90 * sc); gctx.fill(); gctx.stroke();
  gctx.fillStyle = '#8a5a3a';
  gctx.beginPath(); gctx.moveTo(X(360), Y(BASE_Y - 90)); gctx.lineTo(X(450), Y(BASE_Y - 150)); gctx.lineTo(X(540), Y(BASE_Y - 90)); gctx.closePath(); gctx.fill(); gctx.stroke();
  // 上げ舟（母屋の軒下）
  gctx.fillStyle = '#7a5a3a'; gctx.strokeStyle = '#22402e'; gctx.lineWidth = 1.6 * sc;
  gctx.beginPath();
  gctx.moveTo(X(378), Y(BASE_Y - 4)); gctx.lineTo(X(420), Y(BASE_Y - 4)); gctx.lineTo(X(414), Y(BASE_Y + 10)); gctx.lineTo(X(384), Y(BASE_Y + 10));
  gctx.closePath(); gctx.fill(); gctx.stroke();
  // 水屋（石垣＋母屋）
  gctx.fillStyle = '#9aabab'; gctx.strokeStyle = '#22402e'; gctx.lineWidth = 2 * sc;
  gctx.beginPath(); gctx.rect(X(720), Y(BASE_Y - MIZUYA_H), 160 * sc, MIZUYA_H * sc); gctx.fill(); gctx.stroke();
  gctx.strokeStyle = 'rgba(34,64,46,.35)'; gctx.lineWidth = 1 * sc;
  for (let ly = BASE_Y - 40; ly > BASE_Y - MIZUYA_H; ly -= 40) {
    gctx.beginPath(); gctx.moveTo(X(720), Y(ly)); gctx.lineTo(X(880), Y(ly)); gctx.stroke();
  }
  gctx.fillStyle = '#c9a56a'; gctx.strokeStyle = '#22402e'; gctx.lineWidth = 2 * sc;
  gctx.beginPath(); gctx.rect(X(730), Y(BASE_Y - MIZUYA_H - 70), 140 * sc, 70 * sc); gctx.fill(); gctx.stroke();
  gctx.fillStyle = '#4a5f5a';
  gctx.beginPath(); gctx.moveTo(X(718), Y(BASE_Y - MIZUYA_H - 70)); gctx.lineTo(X(800), Y(BASE_Y - MIZUYA_H - 116)); gctx.lineTo(X(882), Y(BASE_Y - MIZUYA_H - 70)); gctx.closePath(); gctx.fill(); gctx.stroke();

  if (opts.waterLevel != null) {
    const wy = BASE_Y - opts.waterLevel * UNIT_H;
    gctx.fillStyle = 'rgba(74,144,164,.72)';
    gctx.fillRect(X(0), Y(wy), 1000 * sc, (BASE_Y + 30 - wy) * sc);

}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'shikumi') drawShikumiScene(X, Y, sc);
  else if (S.scene === 'suii') drawSuiiScene(X, Y, sc);
  else if (S.scene === 'houreki') drawHourekiScene(X, Y, sc);
  else if (S.scene === 'ima') drawImaScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawSuiiScene(X, Y, sc);
}

// ---------- みずやのめがね（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#eef8fa'); grd.addColorStop(1, '#a8d2b0');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#1e5c3a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🏠', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'gauge') {
    const lvl = S.suiiT || 0;
    const bw = R * 0.5, bh = R * 1.0, bx = R - bw / 2, by = R * 0.35;
    sctx.strokeStyle = '#22402e'; sctx.lineWidth = R * 0.025;
    sctx.strokeRect(bx, by, bw, bh);
    const fillH = bh * clamp(lvl / 8, 0, 1);
    sctx.fillStyle = '#4a90a4';
    sctx.fillRect(bx, by + bh - fillH, bw, fillH);
    label(`水位 ${SUII_M[clamp(Math.round(lvl) - 1, 0, 7)] || '0m'}`);
  } else if (mode === 'scroll') {
    sctx.fillStyle = '#8a5a3a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('📜', R, R * 0.85);
    label(S.scope.name || '記録');
  } else if (mode === 'pump') {
    sctx.fillStyle = '#4a90a4'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('💧', R, R * 0.85);
    label('排水機場');
  } else if (mode === 'storm') {
    sctx.fillStyle = '#3a4a3a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🌀', R, R * 0.85);
    label('高潮');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffe9a8'); g2.addColorStop(1, 'rgba(255,233,168,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#1e5c3a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🏠', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#1e5c3a'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#22402e';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#1e5c3a', '#ffe9a8', '#4a9463', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

            <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
              <img src="https://img.youtube.com/vi/${slide.video}/hqdefault.jpg" style="width:100%;display:block;opacity:.85">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <div style="width:15%;aspect-ratio:1;min-width:56px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(24px,3vw,34px)">▶</div>
              </div>
            </div>
            <div style="margin-top:.5em;color:#8a5a3a;font-size:clamp(12px,1.3vw,16px)">タップすると 新しい タブで 動画が ひらくよ</div>
          </div>
          <p class="talk">${slide.text()}</p>
          <button class="btn" id="furikaeriNextBtn">${isLast ? 'まとめへ すすむ' : 'つぎへ'}</button>
          <div class="foot">先生へ：動画は外部サイト(YouTube)の発信元です。内容を事前にご確認ください。URL: ${videoUrl}</div>
        `);
        $('furikaeriThumb').onclick = () => { sTap(); window.open(videoUrl, '_blank', 'noopener'); };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' }, suiiT: 3 });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ミズヤの里 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 母屋より 高い 石垣の 上に 建てた 避難用の 建物を（<span class="blankWord" data-a="水屋（みずや）">？？？</span>）という。<br>
        ② 1754年、江戸幕府に 木曽三川の 治水工事を 命じられた 藩は（<span class="blankWord" data-a="薩摩藩（さつまはん）">？？？</span>）。<br>
        ③ 1959年に 大きな 高潮の 被害を もたらした 台風を（<span class="blankWord" data-a="伊勢湾台風">？？？</span>）という。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 昔から 何度も 水に つかってきたので、堤防や 水屋などの 備えを してきた</b> でした！ ${votedRight ? '（みんなの よそう、ばっちり！）' : ''} 堤防・水屋・排水機場……いくつもの 知恵が 重なって、この 土地の くらしを 守ってきたんだよ。</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>家や 近所で「水や 災害から 守るための 工夫」を 1つ さがしてみよう（土のう、避難場所の 確認 など）。おうちの人と 話してみてね。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#173a28'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'shikumi', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 輪中の くらしについて、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「水屋って 何？」「堤防を 築いたのは どこの 藩？」`);
      setButtons([
        { label: '🏠 輪中の しくみの 図', cls: 'sub', cb: () => this.show('shikumi') },
        { label: '💧 水位シミュレーションの 図', cls: 'sub', cb: () => this.show('suii') },
        { label: '⛏️ 宝暦治水の 図', cls: 'sub', cb: () => this.show('houreki') },
        { label: '🚰 排水機場の 図', cls: 'sub', cb: () => this.show('ima') },
        { label: '🌀 伊勢湾台風の 図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      if (scene === 'suii') S.suiiT = 3;
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_suii などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
