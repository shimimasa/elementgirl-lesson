<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ミノリの花ばたけ — 植物の発芽、成長、結実（小5理科・生命分野8作目・協力型・1ファイル）
   「めばえラボ」（発芽の条件＝水・空気・温度、発芽に光や肥料は不要）の正統な続編。
   日光と成長をくらべよう（メイン操作・時間送り①〜⑦）→肥料と成長をくらべよう（発見型）→
   花のつくりを発見しよう（発見型）→受粉のひみつ（応用推理）→はかせ（実や種子のでき方）。
   数値・事実：小学校学習指導要領・理科・第5学年「植物の発芽、成長、結実」
   （イ 植物の成長には日光や肥料などが関係する／ウ 花にはおしべやめしべなどがあり、
    花粉がめしべの先につく＝受粉すると、めしべのもとが実になり実の中に種子ができる）。
   日光に当てないインゲンマメは茎ばかりひょろひょろのびて葉の色もうすくなる（徒長・黄化）、
   肥料を与えた方は葉の色が濃く葉の数も多いという定性的事実は複数の教育委員会資料でWebSearch裏取り済み
   （具体的な生育日数ごとのcm値は環境依存で信頼できる標準データが見つからないため、数値を捏造せず
    観察可能な葉の数という整数値と、方向性が確かな質的な差＝色・くきの太さで表現する）。
   アブラナの花のつくり（がく4・花びら4・おしべ6＝4長2短・めしべ1）、アサガオの受粉実験
   （つぼみのうちにおしべを取りのぞき袋をかぶせると受粉できず実ができない）もWebSearchで裏取り済み。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
const plain = s => s.replace(/<[^>]+>/g, '');
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {
  seirei: ruby('精霊', 'せいれい'),
  jufun: ruby('受粉', 'じゅふん'),
  kafun: ruby('花粉', 'かふん'),
};

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#f6fbe0'); g.addColorStop(1, '#d9ecb0');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
}

// ---------- カード描画（発見型ミッション共通） ----------
function drawCardGrid(X, Y, sc, cards, foundSet, cols, title) {
  bgFill(X, Y, sc);
  const xs3 = [220, 500, 780];
  const xs4 = [180, 380, 620, 820];
  const xs2 = [340, 660];
  cards.forEach((c, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const px = cols === 3 ? xs3[col] : cols === 2 ? xs2[col] : xs4[col];
    const py = row === 0 ? 250 : 440;
    const done = foundSet.has(c.key);
    gctx.beginPath(); gctx.arc(X(px), Y(py), 46 * sc, 0, TAU);
    gctx.fillStyle = done ? '#e8710e' : '#ffe0b8';
    gctx.fill(); gctx.strokeStyle = '#e8710e'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
    gctx.font = `${34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
    gctx.fillText(c.icon, X(px), Y(py - 2));
    gctx.fillStyle = '#4a3018'; gctx.font = `700 ${13 * sc}px sans-serif`;
    gctx.fillText((c.num || c.letter) + ' ' + plain(c.name), X(px), Y(py + 62));
  });
  gctx.fillStyle = '#4a3018'; gctx.font = `700 ${17 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(title, X(500), Y(70));
}

// ---------- 1．日光と成長をくらべよう（メイン操作・時間送り①〜⑦） ----------
function drawPot(X, Y, sc, cx, stemH, leafCount, color) {
  const baseY = 480;
  gctx.fillStyle = '#a86a3a';
  gctx.fillRect(X(cx - 34), Y(baseY), 68 * sc, 26 * sc);
  gctx.strokeStyle = color; gctx.lineWidth = 5 * sc; gctx.lineCap = 'round';
  gctx.beginPath(); gctx.moveTo(X(cx), Y(baseY)); gctx.lineTo(X(cx), Y(baseY - stemH)); gctx.stroke();
  for (let i = 0; i < leafCount; i++) {
    const t = (i + 1) / (leafCount + 1);
    const ly = baseY - stemH * t;
    const side = i % 2 === 0 ? -1 : 1;
    gctx.fillStyle = color;
    gctx.beginPath();
    gctx.ellipse(X(cx + side * 26), Y(ly), 20 * sc, 10 * sc, side * 0.4, 0, TAU);
    gctx.fill();
  }
}
function drawHikariScene(X, Y, sc) {

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'hikari') drawHikariScene(X, Y, sc);
  else if (S.scene === 'hiryo') drawHiryoScene(X, Y, sc);
  else if (S.scene === 'hana') drawHanaScene(X, Y, sc);
  else if (S.scene === 'jufun') drawJufunScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- ミノリの実りビューア（丸窓） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fff5e0'); grd.addColorStop(1, '#ffd9a8');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#e8710e';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'compare') {
    drawCompareScope(R, S.scope.leafL, S.scope.leafD);
    label(S.scope.label || '');
  } else if (mode === 'flower') {
    drawFlowerScope(R, S.scope.part);
    label(S.scope.label || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffb06688'); g2.addColorStop(1, 'rgba(255,176,102,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#e8710e'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🌻', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#e8710e'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#4a3018';
    sctx.fillText(txt, R, ly);
  }

  function drawMiniPlant(cx, baseY, stemH, leafCount, color) {
    sctx.fillStyle = '#a86a3a';
    sctx.fillRect(cx - R * 0.16, baseY, R * 0.32, R * 0.09);
    sctx.strokeStyle = color; sctx.lineWidth = R * 0.045; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.moveTo(cx, baseY); sctx.lineTo(cx, baseY - stemH); sctx.stroke();
    for (let i = 0; i < leafCount; i++) {
      const t2 = (i + 1) / (leafCount + 1);
      const ly = baseY - stemH * t2;
      const side = i % 2 === 0 ? -1 : 1;
      sctx.fillStyle = color;
      sctx.beginPath();
      sctx.ellipse(cx + side * R * 0.14, ly, R * 0.13, R * 0.065, side * 0.4, 0, TAU);
      sctx.fill();
    }
  }
  function drawCompareScope(R, leafL, leafD) {
    const baseY = R * 1.55;
    drawMiniPlant(R * 0.62, baseY, R * (0.18 + (leafL || 0) * 0.05), leafL || 0, '#4a9e3f');
    drawMiniPlant(R * 1.38, baseY, R * (0.2 + (leafL || 0) * 0.06), leafD || 0, '#c9b23a');
  }

  function drawFlowerScope(R, part) {
    const cx = R, cy = R * 0.62;
    const dim = c => part && part !== c;
    sctx.fillStyle = dim('gaku') ? '#e0ded0' : '#5a9648';
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2 + Math.PI / 4;
      const gx = cx + Math.cos(a) * R * 0.5, gy = cy + Math.sin(a) * R * 0.5;
      sctx.beginPath(); sctx.ellipse(gx, gy, R * 0.16, R * 0.28, a, 0, TAU); sctx.fill();
    }
    sctx.fillStyle = dim('hanabira') ? '#e8e4d0' : '#ffcf40';
    for (let i = 0; i < 4; i++) {
      const a = i * Math.PI / 2;
      const px = cx + Math.cos(a) * R * 0.42, py = cy + Math.sin(a) * R * 0.42;
      sctx.beginPath(); sctx.ellipse(px, py, R * 0.2, R * 0.32, a, 0, TAU); sctx.fill();
    }
    sctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const a = i * TAU / 6 + 0.2;
      const len = i < 4 ? R * 0.26 : R * 0.18;
      const ex = cx + Math.cos(a) * len, ey = cy + Math.sin(a) * len;
      sctx.strokeStyle = dim('oshibe') ? '#d8d4c0' : '#e8710e'; sctx.lineWidth = R * 0.035;
      sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(ex, ey); sctx.stroke();
      sctx.fillStyle = dim('oshibe') ? '#d8d4c0' : '#ffb300';
      sctx.beginPath(); sctx.arc(ex, ey, R * 0.045, 0, TAU); sctx.fill();
    }
    sctx.strokeStyle = dim('meshibe') ? '#d8d4c0' : '#8a4a12'; sctx.lineWidth = R * 0.05;
    sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(cx, cy - R * 0.34); sctx.stroke();
    sctx.fillStyle = dim('meshibe') ? '#d8d4c0' : '#fff5e0';
    sctx.beginPath(); sctx.arc(cx, cy - R * 0.34, R * 0.06, 0, TAU); sctx.fill();
    sctx.lineWidth = R * 0.015; sctx.stroke();
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#e8710e', '#ffb066', '#4a9e3f', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') {
    const b = document.querySelector('#btnRow .btn:not(.sub)') || document.querySelector('#panelBody .btn:not(.sub)');
    if (b) b.click();
  }
});

// ---------- UIヘルパー ----------
const bubbleEl = $('bubble'), wishEl = $('wishCard'), btnRow = $('btnRow');
function say(html) {
  bubbleEl.style.animation = 'none'; void bubbleEl.offsetWidth;
  bubbleEl.style.animation = ''; bubbleEl.innerHTML = html;
}
function setWish(icon, html) {
  wishEl.style.display = 'flex';
  wishEl.querySelector('.icon').textContent = icon;
  wishEl.querySelector('.wbody').innerHTML = html;
}
function hideWish() { wishEl.style.display = 'none'; }
function setButtons(list) {
  btnRow.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.cls ? ' ' + b.cls : '');
    el.innerHTML = b.label;
    el.onclick = () => { sTap(); b.cb(el); };
    btnRow.appendChild(el);
  });
}
function award(id) {
  if (S.badges.has(id)) return;
  S.badges.add(id);
  $('bd_' + id).classList.add('on');
  if (typeof recordBadge === 'function') recordBadge(S.badges.size, document.querySelectorAll('#badges .badge').length);
}
const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }
const controlsEl = $('controls');
function setControls(list) {
  controlsEl.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'ctl' + (b.cls ? ' ' + b.cls : ''); el.innerHTML = b.label;
    el.disabled = !!b.disabled;
    el.onclick = () => { if (el.disabled) return; ac(); b.cb(el); };
    controlsEl.appendChild(el);
  });
}
function updateLoc() {
  const titles = {
    hikari: '☀️ 日光と成長をくらべよう',
    hiryo: '🌿 肥料と成長をくらべよう',
    hana: '🌸 花のつくりを発見しよう',
    jufun: '🐝 受粉のひみつ',
    hakase: '🔎 はかせチャレンジ',
    done: '🌻 ミノリの花ばたけ ものがたり',
  };
  $('stageTitle').textContent = titles[S.scene] || 'ミノリの花ばたけ';
}

function choiceRow(opts, cb) {
  return opts.map((label, i) => ({ label, cls: 'choice', cb: el => cb(i, el) }));
}
function markPicked(el) {
  btnRow.querySelectorAll('.choice').forEach(b => b.classList.remove('picked'));
  el.classList.add('picked');
}

// ---------- ステップ ----------
const FLOW = ['intro', 'vote', 'm_hikari', 'm_hiryo', 'm_hana', 'm_jufun', 'hakase', 'm_furikaeri', 'ending', 'free'];

];

function gotoStep(i) {
  S.stepIndex = clamp(i, 0, FLOW.length - 1);
  S.phase = ''; S.tween = null;
  hideOverlay(); hideWish();
  setControls([]); setButtons([]);
  STEPS[FLOW[S.stepIndex]].enter();
  updateLoc();
}
const nextStep = () => gotoStep(S.stepIndex + 1);

  // --- M1：日光と成長をくらべよう（メイン操作・時間送り①〜⑦） ---
  m_hikari: {
    enter() {
      Object.assign(S, { scene: 'hikari', hikariIdx: -1, hikariIdxDisplay: -1, scope: { type: 'compare', leafL: 0, leafD: 0, label: 'そだてる前' } });
      updateLoc();
      setWish('☀️', `「○日後を見る」ボタンで、日光に 当てた 鉢と 当てない 鉢を、①〜⑦まで じかんを すすめて くらべよう。`);
      say(`左は 日光に 当てた 鉢、右は 日光に 当てない 鉢。同じ 水・肥料で そだてるよ。`);
      this.refreshCtl();
    },
    refreshCtl() {
      if (S.hikariIdx >= HIKARI_DAYS.length - 1) { this.finish(); return; }
      const nextIdx = S.hikariIdx + 1;
      setControls([{ label: `🕐 ${HIKARI_DAYS[nextIdx]}日後を 見る`, cb: () => this.advance() }]);
    },
    advance() {
      if (S.hikariIdx >= HIKARI_DAYS.length - 1) return;
      setControls([]);
      sZoom();
      const fromV = S.hikariIdx, toV = S.hikariIdx + 1;
      startTween(fromV, toV, 0.8, v => {
        S.hikariIdxDisplay = v;
        const leafL = lerpArr(LEAF_LIGHT, clamp(v, 0, 6));
        const leafD = lerpArr(LEAF_DARK, clamp(v, 0, 6));
        S.scope = { type: 'compare', leafL: Math.round(leafL), leafD: Math.round(leafD), label: 'あり' + Math.round(leafL) + 'まい・なし' + Math.round(leafD) + 'まい' };
      }, () => {
        S.hikariIdx++; S.hikariIdxDisplay = S.hikariIdx;
        say(`${NUMS[S.hikariIdx]} ${HIKARI_DAYS[S.hikariIdx]}日め：日光ありは 葉が ${LEAF_LIGHT[S.hikariIdx]}まい、日光なしは 葉が ${LEAF_DARK[S.hikariIdx]}まい。`);
        this.refreshCtl();
      });
    },
    finish() {
      setControls([]);
      say(`①〜⑦まで、日光を 当てた 鉢と 当てない 鉢を くらべたね。育ち方は どう ちがったかな？`);
      setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
    },
    ask() {
      hideWish(); setButtons([]);
      say(`日光に 当てないで 育てた 方は、日光に 当てた 方と くらべて どうだった？`);
      setButtons(choiceRow(['同じように青々と育った', 'くきがひょろひょろのび、葉の色もうすく育ちがおそかった', 'ふつうより早く大きく育った'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 1) {
        sYes(); scopeBurst(); award('m_hikari'); S.phase = 'done';
        const votedRight = S.votePicked.has(0);
        say(`せいかい！ 日光に 当てないと、くきばかり ひょろひょろ のびて、葉の 色も うすく なり、育ちが おそくなる。発芽には 日光は いらなかったけど、そのあと 大きく 育つには 日光が 必要なんだ。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}`);

    },
  },

  // --- ふりかえりタイム：4ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      hideOverlay();
      if (slide.video) {
        this.showVideo(slide, n, total, isLast);
      } else {
        this.showPlain(slide, n, total, isLast);
      }
    },
    showPlain(slide, n, total, isLast) {
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      scopeBurst();
      say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
      setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
    },
    showVideo(slide, n, total, isLast) {
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      scopeBurst();
      say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
      hideWish();
      setButtons([
        { label: '▶ どうがを 見る', cb: () => this.playVideo(slide) },
        { label: isLast ? 'まとめへ すすむ' : 'つぎへ', cls: 'sub', cb: goNext },
      ]);
    },
    playVideo(slide) {
      sTap();
      showOverlay(`
        <h2>${slide.icon} ${slide.title}</h2>
        <div style="max-width:380px;margin:0 auto">
          <div style="position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000">
            <iframe width="100%" height="100%" style="position:absolute;inset:0;border:0"
              src="https://www.youtube-nocookie.com/embed/${slide.video}?rel=0&modestbranding=1&iv_load_policy=3&autoplay=1"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        </div>
        <p class="foot">動画：日本コロムビア公式YouTube「小学校理科DVDシリーズ 5年 花から実へ〜花のつくりと役わり、実のでき方〜」<br>https://www.youtube.com/watch?v=${slide.video}　（先生へ：外部サイトのため、事前に内容をご確認ください）</p>
        <button class="btn" id="videoCloseBtn">とじる</button>
      `);
      $('videoCloseBtn').onclick = () => { sTap(); hideOverlay(); };
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(0);
      showOverlay(`
        <h2>⭐ ミノリの花ばたけ みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>4つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 発芽の あと、大きく 育つには（<span class="blankWord" data-a="日光">？？？</span>）が 必要。<br>
        ② 花には、がく・花びら・（<span class="blankWord" data-a="おしべ">？？？</span>）・めしべが ある。<br>
        ③ おしべの 花粉が めしべの 先に つくことを（<span class="blankWord" data-a="受粉">？？？</span>）と いう。<br>
        ④ 受粉すると、めしべの もとが ふくらんで（<span class="blankWord" data-a="実">？？？</span>）に なり、中に 種子が できる。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>ア いる</b>でした！ 芽が 出た あと、大きく 育つには 日光が 必要でしたね。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>①お家や 近くの 植物の 花を 見つけて、がく・花びら・おしべ・めしべを さがしてみよう。②やさいや くだものを 食べる 時、中に たねが あるか さがしてみよう（たねが あれば、それは 実だった しょうこだよ）。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#e8710e'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「日光なしで育てるとどうなる？」「アブラナの花のおしべは何本？」「実ができるために大事なことは？」`);
      setButtons([
        { label: '☀️ 日光くらべの図', cls: 'sub', cb: () => this.show('hikari') },
        { label: '🌿 肥料くらべの図', cls: 'sub', cb: () => this.show('hiryo') },
        { label: '🌸 花のつくりの図', cls: 'sub', cb: () => this.show('hana') },
        { label: '🐝 受粉のひみつの図', cls: 'sub', cb: () => this.show('jufun') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_hana などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
