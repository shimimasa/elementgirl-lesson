<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   パチの実験場 — 電流のはたらき・乾電池のつなぎ方（小4理科・エネルギー分野5作目・協力型・1ファイル）
   回路のきほんを発見しよう（発見型）→ 直列つなぎと並列つなぎをくらべよう（対照比較・二択操作）→
   電池の数を増やしてみよう（メイン操作・①〜④の数値階段）→ 身の回りの直列・並列を発見しよう（発見型）→
   はかせ（電気を安全に使う知恵）。
   数値：学習指導要領・小4理科「電流のはたらき」＝乾電池のつなぎ方（直列・並列）と、モーターの回り方や
   電流の大きさの関係を検流計で調べる。直列つなぎは電流が強くなり（検流計の値はおよそ2倍）、
   並列つなぎは乾電池1個の時とほとんど変わらない（多くの子が誤解しやすいポイント）。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
const plain = s => s.replace(/<[^>]+>/g, '');
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {
  seirei: ruby('精霊', 'せいれい'),
  denryuu: ruby('電流', 'でんりゅう'),
  kairo: ruby('回路', 'かいろ'),
  chokuretsu: ruby('直列', 'ちょくれつ'),
  heiretsu: ruby('並列', 'へいれつ'),
  kyoku: ruby('極', 'きょく'),
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 数値データ（本物度） ----------
// m_kihon：回路のきほんを発見しよう（発見型）
const KIHON_CARDS = [
  { key: 0, num: '①', icon: '🔋', name: 'かん電池', txt: `かん電池には ＋${W.kyoku}と －${W.kyoku}が ある。電気は ＋${W.kyoku}から 出て、－${W.kyoku}に もどる。` },
  { key: 1, num: '②', icon: '🔌', name: 'どう線', txt: `どう線は、電気を 通す 金ぞくの 線。かん電池と ものを つないで、電気の 通り道「${W.kairo}」を 作る。` },
  { key: 2, num: '③', icon: '⚙️', name: 'モーター', txt: `モーターは、電気の 力で 回る 部品。${W.denryuu}が 流れると 回る。` },
  { key: 3, num: '④', icon: '🔘', name: 'スイッチ', txt: `スイッチを 入れると、${W.kairo}が つながって 電気が 流れる。切ると 電気が 止まる。` },

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#fffdf5'); g.addColorStop(1, '#f0d089');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
}

function drawBattery(X, Y, sc, cx, cy, w, h, vertical) {
  gctx.save();
  gctx.translate(X(cx), Y(cy));
  if (vertical) gctx.rotate(Math.PI / 2);
  const bw = w * sc, bh = h * sc;
  const nub = Math.min(w, h) * 0.16 * sc;
  // 本体（白に近いクリーム色で背景と強コントラスト）
  gctx.fillStyle = '#fffaf0'; gctx.strokeStyle = '#2a1e08'; gctx.lineWidth = 2.8 * sc;
  gctx.beginPath(); gctx.roundRect(-bw / 2, -bh / 2, bw, bh, 7 * sc); gctx.fill(); gctx.stroke();
  // ＋極側の突起（たんし）
  gctx.fillStyle = '#2a1e08';
  gctx.beginPath(); gctx.roundRect(bw / 2 - 1 * sc, -nub / 2, nub * 1.1, nub, 2 * sc); gctx.fill();
  // ＋極側のいろ帯
  gctx.fillStyle = '#e85d75';
  gctx.fillRect(bw / 2 - bw * 0.24, -bh / 2 + 2 * sc, bw * 0.24 - 2 * sc, bh - 4 * sc);
  // ラベル
  gctx.font = `900 ${Math.min(w, h) * 0.34 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillStyle = '#fff';
  gctx.fillText('＋', bw / 2 - bw * 0.12, 0);
  gctx.fillStyle = '#2a1e08';
  gctx.fillText('－', -bw / 2 + bw * 0.16, 0);
  gctx.restore();
}
function drawPropeller(X, Y, sc, cx, cy, r, angle) {
  gctx.save();
  gctx.translate(X(cx), Y(cy));
  gctx.rotate(angle);
  gctx.fillStyle = '#6bb8e8'; gctx.strokeStyle = '#2a6fa8'; gctx.lineWidth = 1.6 * sc;
  for (let i = 0; i < 3; i++) {
    gctx.save();
    gctx.rotate(i * TAU / 3);
    gctx.beginPath();
    gctx.ellipse(0, -r * 0.55 * sc, r * 0.22 * sc, r * 0.55 * sc, 0, 0, TAU);
    gctx.fill(); gctx.stroke();
    gctx.restore();
  }
  gctx.restore();
  gctx.beginPath(); gctx.arc(X(cx), Y(cy), r * 0.18 * sc, 0, TAU);
  gctx.fillStyle = '#4a3400'; gctx.fill();
}
function drawMeterBar(X, Y, sc, cx, cy, w, h, value, maxValue) {
  gctx.fillStyle = '#f0dca8';
  gctx.beginPath(); gctx.roundRect(X(cx - w / 2), Y(cy - h / 2), w * sc, h * sc, 6 * sc); gctx.fill();
  const fillW = w * clamp(value / maxValue, 0, 1);
  gctx.fillStyle = '#e85d75';
  gctx.beginPath(); gctx.roundRect(X(cx - w / 2), Y(cy - h / 2), fillW * sc, h * sc, 6 * sc); gctx.fill();
  gctx.strokeStyle = '#b8860f'; gctx.lineWidth = 2.4 * sc;
  gctx.strokeRect(X(cx - w / 2), Y(cy - h / 2), w * sc, h * sc);
  gctx.fillStyle = '#4a3400'; gctx.font = `700 ${14 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('けんりゅうけい', X(cx), Y(cy - h / 2 - 16));
}

function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'kihon') drawKihonScene(X, Y, sc);
  else if (S.scene === 'kurabe') drawKurabeScene(X, Y, sc, t);
  else if (S.scene === 'denchi') drawDenchiScene(X, Y, sc, t);
  else if (S.scene === 'kurashi') drawKurashiScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fffdf5'); grd.addColorStop(1, '#ffe4a0');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#b8860f';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffe27a88'); g2.addColorStop(1, 'rgba(255,226,122,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#b8860f'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('⚡', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#b8860f'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);

  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#4a3400';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#b8860f', '#ffcf5c', '#e85d75', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

    scope: () => ({ type: 'point', icon: '🔌', name: '回路がひとまわりつながる' }),
    text: () => `かん電池・どう線・モーター・スイッチで、${W.kairo}が できていたね。` },
  { scene: 'kurabe', icon: '⚖️', title: '直列つなぎと並列つなぎをくらべよう',
    setup: () => { S.kurabeState = 'series'; S.kurabeMeter = KURABE_VALUE.series; S.kurabeTested = new Set(['series', 'parallel']); },
    scope: () => ({ type: 'point', icon: '⚖️', name: '直列は速い・並列はかわらない' }),
    text: () => `${W.chokuretsu}つなぎは モーターが 速く 回り、${W.heiretsu}つなぎは 1この 時と かわらなかったね。` },
  { scene: 'denchi', icon: '🔋', title: '電池の数を増やしてみよう',
    setup: () => { S.denchiIdxDisplay = 3; },
    scope: () => ({ type: 'point', icon: '🔋', name: 'メーターやく12' }),
    text: () => `${W.chokuretsu}つなぎで 電池を 増やすほど、${W.denryuu}は 大きくなったね。` },
  { scene: 'kurashi', icon: '🏠', title: '身の回りの直列・並列を発見しよう',
    setup: () => { S.kurashiFound = new Set(KURASHI_CARDS.map(c => c.key)); },
    scope: () => ({ type: 'point', icon: '🔦', name: '身の回りにも回路がある' }),
    text: () => `懐中電灯や リモコンにも、電池の つなぎ方の くふうが 生かされていたね。` },
];

function gotoStep(i) {
  S.stepIndex = clamp(i, 0, FLOW.length - 1);
  S.phase = ''; S.tween = null;
  hideOverlay(); hideWish();
  setControls([]); setButtons([]);
  STEPS[FLOW[S.stepIndex]].enter();
  updateLoc();
}
const nextStep = () => gotoStep(S.stepIndex + 1);

const STEPS = {
  intro: {
    enter() {
      Object.assign(S, { scene: 'kihon', scope: { type: 'idle' } });
      say('……');
      setButtons([]);
      showOverlay(`
        <div class="phasesStrip">🔍⚖️🔋🏠</div>
        <h1>パチの実験場</h1>
        <div class="sub">〜 ${W.denryuu}の はたらき（かん電池の つなぎ方） 〜</div>
        <p class="talk">ようこそ！ わたしは スイッチの 音「パチッ」から 生まれた ${W.seirei}、<b>パチ</b>。この 実験場で、目に 見えない ${W.denryuu}の 力を、いっしょに たしかめよう。かん電池の つなぎ方で、モーターの 回る 速さは 変わると 思う？<br>
        今日は、回路の きほんから、つなぎ方の ひみつまで、たしかめに 行こう！</p>
        <button class="btn" id="startBtn">たいけんを はじめる！</button>
        <div class="foot">先生へ：F11キーで全画面表示になります。操作はぜんぶ画面のボタンです。</div>
      `);
      $('startBtn').onclick = () => { ac(); sTap(); nextStep(); };
    },
  },

  vote: {
    enter() {
      showOverlay(`
        <h2>🤔 よそうタイム</h2>
        <p class="talk">かん電池を 2こ、${W.heiretsu}で つなぐと、1こだけの 時と くらべて、モーターの 回る 速さは どうなると 思う？</p>
        <div class="voteCards">
          <div class="vcard" data-v="0"><span class="vicon">🚀</span><b>ア</b> 速くなる</div>
          <div class="vcard" data-v="1"><span class="vicon">😐</span><b>イ</b> かわらない</div>
          <div class="vcard" data-v="2"><span class="vicon">🐢</span><b>ウ</b> おそくなる</div>
        </div>
        <div class="sub">思う ものに タッチ。きろくシートにも 〇を つけてね。</div>
        <button class="btn" id="voteGo">よし、たしかめよう！</button>
      `);
      panelEl.querySelectorAll('.vcard').forEach(c => {
        c.onclick = () => { sTap(); panelEl.querySelectorAll('.vcard').forEach(x => x.classList.remove('picked')); c.classList.add('picked');
          S.votePicked = new Set([+c.dataset.v]);
        };
      });
      $('voteGo').onclick = () => { sTap(); nextStep(); };
    },
  },

  // --- M1：回路のきほんを発見しよう（発見型） ---
  m_kihon: {
    enter() {
      Object.assign(S, { scene: 'kihon', scope: { type: 'idle' }, kihonFound: new Set() });
      updateLoc();
      setWish('🔍', `①〜④を タッチして、${W.kairo}の きほんを 発見しよう。`);
      say(`かん電池・どう線・モーター・スイッチ。それぞれの やくわりを たしかめてみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(KIHON_CARDS.map(c => ({
        label: c.num + ' ' + (S.kihonFound.has(c.key) ? plain(c.name) : '？？？'),
        cb: () => this.reveal(c),
      })));
      if (S.kihonFound.size >= KIHON_CARDS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(c) {
      sTap(); S.kihonFound.add(c.key);
      S.scope = { type: 'point', icon: c.icon, name: plain(c.name) };
      scopeBurst();
      say(`${c.num} <b>${plain(c.name)}</b>：${c.txt}`);
      this.refreshCtl();
    },
    ask() {
      hideWish(); setButtons([]);
      say(`電気の 通り道の ことを 何と いう？`);
      setButtons(choiceRow(['回路', 'どう線', 'スイッチ'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 0) {
        sYes(); scopeBurst(); award('m_kihon'); S.phase = 'done';
        say(`せいかい！ かん電池・どう線・モーター（豆電球）が ひとまわりに つながった 電気の 通り道を「${W.kairo}」と いうんだ。`);
        setButtons([{ label: 'つぎへ（直列つなぎと並列つなぎをくらべよう）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['回路', 'どう線', 'スイッチ'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- M2：直列つなぎと並列つなぎをくらべよう（対照比較） ---
  m_kurabe: {
    enter() {
      Object.assign(S, { scene: 'kurabe', kurabeState: 'series', kurabeTested: new Set(), kurabeMeter: KURABE_VALUE.series, scope: { type: 'point', icon: '🔋', name: '直列つなぎ' } });
      updateLoc();
      setWish('⚖️', `「${W.chokuretsu}」「${W.heiretsu}」を 切りかえて、モーターの 回る 速さと メーターを くらべよう。両方 ためそう。`);
      say(`かん電池 2こを、つなぎ方を 変えて 比べてみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setControls([
        { label: '━ ' + W.chokuretsu + (S.kurabeState === 'series' ? '（いまコレ）' : ''), cb: () => this.setState('series') },
        { label: '‖ ' + W.heiretsu + (S.kurabeState === 'parallel' ? '（いまコレ）' : ''), cb: () => this.setState('parallel') },
      ]);
      if (S.kurabeTested.size >= 2) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      } else {
        setButtons([]);
      }
    },
    setState(state) {
      sTap(); S.kurabeState = state; S.kurabeTested.add(state);
      S.kurabeMeter = KURABE_VALUE[state];
      S.scope = { type: 'point', icon: '🔋', name: (state === 'series' ? plain(W.chokuretsu) : plain(W.heiretsu)) + '　やく' + S.kurabeMeter };
      scopeBurst();
      this.refreshCtl();
    },
    ask() {
      hideWish(); setControls([]); setButtons([]);
      say(`かん電池を 2こ、${W.heiretsu}で つなぐと、1こだけの 時と くらべて、モーターの 回る 速さは どうなる？`);
      setButtons(choiceRow(['速くなる', 'かわらない', 'おそくなる'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 1) {
        sYes(); scopeBurst(); award('m_kurabe'); S.phase = 'done';
        const votedRight = S.votePicked.has(1);
        say(`せいかい！ ${W.chokuretsu}つなぎは ${W.denryuu}が 強くなり（けんりゅうけいの 値は およそ2倍）、モーターも 速く 回る。でも ${W.heiretsu}つなぎは、1こだけの 時と 電流の 強さが ほとんど かわらないんだ。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}`);
        setButtons([{ label: 'つぎへ（電池の数を増やしてみよう）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど、${W.heiretsu}つなぎの メーターを 思い出してみよう。`);
        setButtons(choiceRow(['速くなる', 'かわらない', 'おそくなる'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- M3：電池の数を増やしてみよう（メイン操作・数値階段①〜④） ---
  m_denchi: {
    enter() {
      Object.assign(S, { scene: 'denchi', denchiIdx: 0, denchiIdxDisplay: 0, scope: { type: 'point', icon: '🔋', name: 'メーターやく' + METER_STEPS[0] } });
      updateLoc();
      setWish('🔋', `「電池をふやす」ボタンで、${W.chokuretsu}つなぎの 電池を ①1こから ④4こまで 増やしていって、メーターと モーターの 変化を たしかめよう。`);
      say(`①は 電池1こ。「電池をふやす」ボタンで、つぎの 段階へ 進むよ。`);
      this.refreshCtl();
    },
    refreshCtl() {
      if (S.denchiIdx >= METER_STEPS.length - 1) { this.finish(); return; }
      setControls([{ label: `🔋 電池をふやす（つぎの段階へ）`, cb: () => this.advance() }]);
    },
    advance() {
      if (S.denchiIdx >= METER_STEPS.length - 1) return;
      setControls([]);
      const fromV = S.denchiIdx, toV = S.denchiIdx + 1;
      startTween(fromV, toV, 0.7, v => {
        S.denchiIdxDisplay = v;
        S.scope = { type: 'point', icon: '🔋', name: 'メーターやく' + Math.round(lerpArr(METER_STEPS, v)) };
      }, () => {
        S.denchiIdx++; S.denchiIdxDisplay = S.denchiIdx;
        sTap();
        this.refreshCtl();
      });
    },
    finish() {
      setControls([]);
      say(`①〜④まで、電池を 増やしたね。${W.denryuu}の 大きさは どう 変わったかな？`);
      setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
    },
    ask() {
      hideWish(); setButtons([]);
      say(`電池を ${W.chokuretsu}で 増やしていくと、${W.denryuu}の 大きさは どうなる？`);
      setButtons(choiceRow(['大きくなる', 'かわらない', '小さくなる'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 0) {
        sYes(); scopeBurst(); award('m_denchi'); S.phase = 'done';
        say(`せいかい！ ${W.chokuretsu}つなぎで 電池の 数を 増やすほど、${W.denryuu}は 大きくなり、モーターも 速く 回る。電池の 数と 電流の 強さは、ほぼ 比例して 大きくなるんだ。`);
        setButtons([{ label: 'つぎへ（身の回りの直列・並列を発見しよう）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど、メーターの 動きを 思い出してみよう。`);
        setButtons(choiceRow(['大きくなる', 'かわらない', '小さくなる'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- M4：身の回りの直列・並列を発見しよう（発見型） ---
  m_kurashi: {
    enter() {
      Object.assign(S, { scene: 'kurashi', scope: { type: 'idle' }, kurashiFound: new Set() });
      updateLoc();
      setWish('🏠', `①〜④を タッチして、身の 回りの 直列・並列の 例を 発見しよう。`);
      say(`かん電池の つなぎ方の くふうは、身の 回りの 道具にも 生かされているよ。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(KURASHI_CARDS.map(c => ({
        label: c.num + ' ' + (S.kurashiFound.has(c.key) ? plain(c.name) : '？？？'),
        cb: () => this.reveal(c),
      })));
      if (S.kurashiFound.size >= KURASHI_CARDS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(c) {
      sTap(); S.kurashiFound.add(c.key);
      S.scope = { type: 'point', icon: c.icon, name: plain(c.name) };
      scopeBurst();
      say(`${c.num} <b>${plain(c.name)}</b>：${c.txt}`);
      this.refreshCtl();
    },
    ask() {
      hideWish(); setButtons([]);
      say(`かん電池を ${W.chokuretsu}に つなぐと、豆電球や LEDは どうなる？`);
      setButtons(choiceRow(['より明るく光る', '明るさはかわらない', '光らなくなる'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 0) {
        sYes(); scopeBurst(); award('m_kurashi'); S.phase = 'done';
        say(`せいかい！ ${W.chokuretsu}つなぎで 電流が 強くなると、豆電球や LEDは より 明るく 光る。懐中電灯などの 身近な 道具にも、この しくみが 生かされているんだ。`);
        setButtons([{ label: 'つぎへ（はかせチャレンジ）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['より明るく光る', '明るさはかわらない', '光らなくなる'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- はかせチャレンジ：電気を安全に使う知恵 ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' }, hakaseFound: new Set() });
      updateLoc();
      say(`さいごは <b>はかせチャレンジ</b>！ 電気を 安全に 使う 知恵を 見てみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HAKASE_POINTS.map(p => ({
        label: p.letter + ' ' + plain(p.name) + (S.hakaseFound.has(p.key) ? ' ✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.hakaseFound.size >= HAKASE_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.hakaseFound.add(p.key);
      S.scope = { type: 'point', name: plain(p.name), icon: p.icon };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      hideWish();
      say(`＋${W.kyoku}と －${W.kyoku}を どう線だけで 直接 つなぐことを 何と いう？`);
      setButtons(choiceRow(['ショート', '直列', '並列'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 0) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ ＋${W.kyoku}と －${W.kyoku}を 直接 つなぐ「ショート」は、大きな ${W.denryuu}が 流れて 熱く なり 危険。電気は 便利だけど、安全に 使う ことも 大切だよ。`);
        setButtons([{ label: 'ふりかえりタイムへ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ショート', '直列', '並列'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- ふりかえりタイム：4ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      hideOverlay();
      scopeBurst();
      say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
      setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ パチの実験場 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>4つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 電池を 直列に つなぐと、${W.denryuu}は（<span class="blankWord" data-a="大きく">？？？</span>）なる。<br>
        ② 電池を 並列に つなぐと、${W.denryuu}は（<span class="blankWord" data-a="かわらない">？？？</span>）。<br>
        ③ ＋きょくと －きょくを 直接 つなぐことを（<span class="blankWord" data-a="ショート">？？？</span>）という。<br>
        ④ 電気の 通り道を（<span class="blankWord" data-a="回路">？？？</span>）という。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ かわらない</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>①家の 中の 懐中電灯や リモコンを 見て、かん電池が 何こ 入っているか 数えてみよう。<br>②図書館や インターネットで、他に どんな 直列・並列の 使われ方が あるか 調べてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#b8860f'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「電気の通り道を何という？」「直列つなぎで電池を増やすと電流はどうなる？」「並列つなぎだとモーターの速さは？」`);
      setButtons([
        { label: '🔍 回路のきほんの図', cls: 'sub', cb: () => this.show('kihon') },
        { label: '⚖️ 直列・並列くらべの図', cls: 'sub', cb: () => this.show('kurabe') },
        { label: '🔋 電池を増やす図', cls: 'sub', cb: () => this.show('denchi') },
        { label: '🏠 身の回りの例の図', cls: 'sub', cb: () => this.show('kurashi') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_denchi などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
