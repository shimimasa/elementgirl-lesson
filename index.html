<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゲーム型授業 一覧</title>
<style>
  :root{
    color-scheme: light;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    background: linear-gradient(180deg,#fef9ef,#eaf3fb);
    color:#2b2b2b;
    padding: clamp(16px,4vw,48px);
  }
  h1{
    font-size: clamp(22px,4vw,34px);
    margin: 0 0 8px;
  }
  p.lead{
    margin: 0 0 14px;
    color:#555;
  }
  .stats{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom: clamp(18px,3vw,28px);
  }
  .stats span{
    background:#fff;
    border:1px solid #e3ddce;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: bold;
    color:#665;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .stats span b{ color:#c76b2c; }

  /* ---- progress / title ---- */
  .progress-panel{
    background: linear-gradient(135deg,#fff7e8,#fff);
    border: 1px solid #f0dfb8;
    border-radius: 16px;
    padding: 14px 18px;
    margin-bottom: 14px;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .progress-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:bold;
    font-size:15px;
    color:#7c5a10;
    white-space:nowrap;
  }
  .progress-title .icon{ font-size:26px; }
  .progress-bar-wrap{
    flex:1;
    min-width:180px;
  }
  .progress-bar-track{
    background:#f1e6cc;
    border-radius:999px;
    height:14px;
    overflow:hidden;
  }
  .progress-bar-fill{
    height:100%;
    background: linear-gradient(90deg,#ffb648,#ff8a3d);
    border-radius:999px;
    transition: width .4s ease;
  }
  .progress-sub{
    font-size:12px;
    color:#a07840;
    margin-top:5px;
    line-height:1.7;
  }
  .progress-sub .progress-next{
    font-size:13px;
    font-weight:bold;
    color:#c76b2c;
  }

  /* ---- profile picker ---- */
  .profile-bar{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom: 14px;
  }
  .profile-bar .profile-label{
    font-size:13px;
    font-weight:bold;
    color:#888;
    margin-right:2px;
  }
  .profile-chip-item{
    display:inline-flex;
    align-items:center;
    gap:2px;
  }
  .profile-chip{
    border:none;
    cursor:pointer;
    font-family:inherit;
    font-weight:bold;
    border-radius:999px;
    padding:9px 18px;
    min-height:40px;
    font-size:14px;
    background:#f1f1f1;
    color:#555;
    transition: transform .1s ease;
  }
  .profile-chip:active{ transform: scale(.93); }
  .profile-chip.active{
    background:#4a7fd6;
    color:#fff;
  }
  .profile-edit-btn{
    border:none;
    cursor:pointer;
    font-family:inherit;
    border-radius:50%;
    width:32px;
    height:32px;
    min-height:32px;
    font-size:13px;
    background:#f1f1f1;
    color:#888;
  }
  .profile-edit-btn:active{ transform: scale(.9); }
  .profile-add-btn{
    cursor:pointer;
    font-family:inherit;
    font-weight:bold;
    border-radius:999px;
    padding:9px 16px;
    min-height:40px;
    font-size:14px;
    background:#fff;
    color:#4a7fd6;
    border:1.5px dashed #4a7fd6;
  }
  .profile-add-btn:active{ transform: scale(.93); }
  .profile-input{
    font-size:18px;
    padding:10px 14px;
    border-radius:10px;
    border:1px solid #ccc;
    width:100%;
    max-width:220px;
    text-align:center;
    font-family:inherit;
    margin:10px 0;
  }
  .profile-name-error{
    min-height:18px;
    font-size:13px;
    color:#c0392b;
    font-weight:bold;
    margin-bottom:6px;
  }
  .profile-modal-actions{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .profile-delete-btn{
    display:inline-flex;
    align-items:center;
    min-height:44px;
    margin-top:10px;
    padding:9px 18px;
    border:none;
    border-radius:999px;
    background:#ffdada;
    color:#a02020;
    font-weight:bold;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
  }
  .profile-delete-btn:active{ transform: scale(.95); }
  .profile-delete-confirm{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #eee;
    font-size:14px;
    color:#a02020;
    font-weight:bold;
  }
  .backup-link{
    display:inline-block;
    margin: 0 0 10px;
    padding: 4px 2px;
    border:none;
    background:none;
    color:#999;
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    font-family:inherit;
  }
  .backup-desc{
    font-size:13px;
    color:#777;
    margin-bottom:10px;
    line-height:1.5;
  }

  /* ---- next up card ---- */
  .nextup{ margin-bottom: 14px; }
  .nextup-label{
    font-size:13px;
    font-weight:bold;
    color:#c76b2c;
    margin-bottom:6px;
  }
  .nextup-body{
    display:flex;
    align-items:center;
    gap:14px;
    background:#fff;
    border:1px solid #eee;
    border-left:6px solid var(--fc,#ccc);
    border-radius:16px;
    padding:12px 16px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    flex-wrap:wrap;
  }
  .nextup-body .card-mascot{ width:64px; height:64px; flex:0 0 64px; margin:0; }
  .nextup-text{ flex:1; min-width:150px; }
  .nextup-text .card-unit{ margin:0 0 2px; font-size:15.5px; }
  .nextup-text .card-title{ font-size:12px; margin-bottom:3px; }
  .nextup-text .meta{ font-size:12.5px; color:#888; line-height:1.5; margin:0; }
  .nextup-progress{ font-size:12.5px; font-weight:bold; color:#c76b2c; margin-top:4px; }
  .nextup-btn{ flex:0 0 auto; }
  .nextup-complete{
    background:#fff7e8;
    border:1px solid #f0dfb8;
    border-radius:16px;
    padding:16px;
    text-align:center;
    font-weight:bold;
    color:#a8790b;
  }

  /* ---- bonus games ---- */
  .bonus-section{ margin-bottom: 14px; }
  .bonus-label{
    font-size:13px; font-weight:bold; color:#a8790b;
    margin-bottom:6px;
    cursor:pointer;
    list-style:none;
    user-select:none;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 2px;
  }
  .bonus-label::-webkit-details-marker{ display:none; }
  .bonus-label::before{
    content:"▶";
    font-size:10px;
    color:#a8790b;
    transition: transform .15s ease;
    display:inline-block;
  }
  details[open] > .bonus-label::before{ transform: rotate(90deg); }
  .bonus-unlocked-count{ color:#c76b2c; }
  .bonus-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .bonus-card{
    background: linear-gradient(160deg, #1a2150, #10152f);
    border-radius: 16px;
    padding: 16px 14px;
    border: 2px solid #f2a93b;
    box-shadow: 0 2px 12px rgba(0,0,0,.18);
    position: relative;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    color: #f2efff;
    text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .bonus-card:hover{ transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.25); }
  .bonus-card .bonus-icon{ font-size: 34px; margin-bottom: 6px; }
  .bonus-card h3{ margin: 0 0 4px; font-size: 16px; color: #ffe9a8; }
  .bonus-card .bonus-meta{ font-size: 12px; color: #bdc4f5; line-height: 1.5; margin: 0; }
  .bonus-card .bonus-tag{
    margin-top: 8px; font-size: 12px; font-weight: bold;
    background: #ffd66b; color: #5a3c00; padding: 3px 12px; border-radius: 999px;
  }
  .bonus-card.locked{
    border-color: #555; filter: grayscale(.4); cursor: default;
  }
  .bonus-card.locked .bonus-tag{ background: #444; color: #ccc; }
  .bonus-goto{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:8px;
    min-height:34px;
    padding:6px 14px;
    border-radius:8px;
    background:#4a7fd6;
    color:#fff;
    font-size:12.5px;
    font-weight:bold;
    text-decoration:none;
    filter: grayscale(0);
    cursor:pointer;
  }
  .bonus-goto:hover{ opacity:.85; }
  .bonus-goto:active{ transform: scale(.96); }
  .bonus-card.locked:hover{ transform:none; box-shadow: 0 2px 12px rgba(0,0,0,.18); }

  /* ---- brain training corner ---- */
  .brain-section{ margin-bottom: 14px; }
  .brain-label{
    font-size:13px; font-weight:bold; color:#3f4f9c;
    margin-bottom:6px;
    cursor:pointer;
    list-style:none;
    user-select:none;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 2px;
  }
  .brain-label::-webkit-details-marker{ display:none; }
  .brain-label::before{
    content:"▶";
    font-size:10px;
    color:#3f4f9c;
    transition: transform .15s ease;
    display:inline-block;
  }
  details[open] > .brain-label::before{ transform: rotate(90deg); }
  .brain-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .brain-card{
    background: linear-gradient(160deg, #eef4ff, #e2f7ee);
    border-radius: 16px;
    padding: 16px 14px;
    border: 2px solid #6ec7a6;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
    position: relative;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    color: #2b3a63;
    text-decoration: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .brain-card:hover{ transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.14); }
  .brain-card .brain-icon{ font-size: 34px; margin-bottom: 6px; }
  .brain-card h3{ margin: 0 0 4px; font-size: 16px; color: #2b3a63; }
  .brain-card .brain-meta{ font-size: 12px; color: #4d6a8c; line-height: 1.5; margin: 0; }
  .brain-card .brain-tag{
    margin-top: 8px; font-size: 12px; font-weight: bold;
    background: #6ec7a6; color: #fff; padding: 3px 12px; border-radius: 999px;
  }

  /* ---- controls ---- */
  .controls{
    background: rgba(255,255,255,.6);
    border:1px solid #e8e2d2;
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 20px;
    backdrop-filter: none;
  }
  .search-row{
    display:flex;
    margin-bottom: 12px;
  }
  #searchBox{
    width:100%;
    max-width: 420px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 15px;
    font-family: inherit;
    background:#fff;
  }
  #searchBox:focus{
    outline: 2px solid #4a7fd6;
    outline-offset: 1px;
  }
  .row-label{
    font-size: 12px;
    color:#888;
    font-weight:bold;
    margin: 8px 0 6px;
  }
  .chiprow{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tab-btn, .chip{
    border:none;
    cursor:pointer;
    font-family: inherit;
    font-weight:bold;
    border-radius: 999px;
    padding: 12px 20px;
    min-height: 44px;
    display:inline-flex;
    align-items:center;
    font-size: 14px;
    background:#f1f1f1;
    color:#555;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .tab-btn:hover, .chip:hover{ transform: translateY(-1px); }
  .tab-btn:active, .chip:active{ transform: scale(.93); }
  .tab-btn.active{
    background:#4a7fd6;
    color:#fff;
    box-shadow: 0 2px 8px rgba(74,127,214,.4);
  }
  .chip{
    background: var(--chip-bg,#f1f1f1);
    color: var(--chip-fg,#555);
    border: 1px solid var(--chip-fg,#ccc);
  }
  .chip.active{
    background: var(--chip-fg,#555);
    color:#fff;
  }
  .grade-row .chip{
    --chip-bg:#f1f1f1;
    --chip-fg:#777;
  }

  .more-toggle{
    display:inline-flex;
    align-items:center;
    min-height:44px;
    margin: 10px 0 0;
    border:none;
    background:none;
    color:#4a7fd6;
    font-weight:bold;
    font-family: inherit;
    font-size:14px;
    cursor:pointer;
    padding:6px 10px 6px 2px;
  }
  .more-toggle:hover{ text-decoration:underline; }
  .more-toggle:active{ transform: scale(.96); }
  .more-filters{ display:none; margin-top:6px; }
  .more-filters.open{ display:block; }

  .result-count{
    font-size: 13px;
    color:#888;
    margin: 4px 0 16px;
  }

  /* ---- subject section ---- */
  .subject-block{
    margin-bottom: 8px;
  }
  .subject-title{
    font-size: 18px;
    font-weight:bold;
    margin: 22px 0 12px;
    padding-bottom:6px;
    border-bottom: 3px solid #ddd;
  }
  .subject-title.science{ color:#2c5c8a; border-color:#bcd7ee; }
  .subject-title.society{ color:#a05a20; border-color:#f0d3ae; }

  .field-heading{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    font-weight:bold;
    margin: 16px 0 10px;
    color:#444;
  }
  .field-heading .fi-badge{
    width:26px; height:26px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    background: var(--fc-bg);
  }
  .field-heading .fi-count{
    font-weight:normal;
    color:#999;
    font-size:13px;
  }

  /* ---- 単元名(主役)／造語タイトル(そえがき) ---- */
  .card-unit{
    font-weight:bold;
    color: var(--fc, #444);
    line-height:1.3;
  }
  .card-title{
    color:#9a9a9a;
    font-weight:normal;
    line-height:1.3;
  }
  .card-title::before{ content:"「"; }
  .card-title::after{ content:"」"; }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(220px,1fr));
    gap: 16px;
    margin-bottom: 6px;
  }
  .card{
    background:#fff;
    border-radius: 16px;
    padding: 16px 14px 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    border:1px solid #eee;
    border-top: 8px solid var(--fc, #ccc);
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(0,0,0,.13);
  }
  .card-fibadge{
    position:absolute;
    top:10px; right:10px;
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    background: var(--fc-bg);
    border: 2px solid var(--fc, #ccc);
  }
  .played-badge{
    position:absolute;
    top:10px; left:10px;
    background:#ffd54f;
    color:#7c5a10;
    font-size:11px;
    font-weight:bold;
    padding:4px 9px;
    border-radius:999px;
    box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  .played-badge.cleared{
    background: linear-gradient(135deg,#ffe27a,#ff9843);
    color:#5a3300;
    box-shadow:0 1px 6px rgba(255,152,67,.5);
  }
  .card-mascot{
    width:84px;
    height:84px;
    margin-bottom:2px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card-mascot svg{
    width:100%;
    height:100%;
    display:block;
  }
  .card-mascot.emoji{
    font-size:52px;
    line-height:1;
  }
  .card .mascot{ width:100%; animation: card-floaty 3.7s ease-in-out infinite; }
  .card .mascot .eyes{ transform-box: fill-box; transform-origin: center; animation: card-blink 4.5s infinite; }
  @keyframes card-floaty{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
  @keyframes card-blink{ 0%,92%,100%{ transform:scaleY(1); } 96%{ transform:scaleY(.1); } }
  .card .card-unit{
    margin: 2px 0 3px;
    font-size: 17px;
  }
  .card .card-title{
    font-size: 13px;
    margin-bottom: 6px;
  }
  .card .meta{
    font-size: 12.5px;
    color:#888;
    margin-bottom: 12px;
    line-height:1.5;
  }
  .card .btnrow{
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .card a, .pick-modal-inner a, .road-body a{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height: 44px;
    padding: 10px 16px;
    border-radius: 8px;
    text-decoration:none;
    font-size: 14px;
    font-weight: bold;
    transition: transform .1s ease, opacity .1s ease;
  }
  .card a.main, .pick-modal-inner a.main, .road-body a.main{
    background:#4a7fd6;
    color:#fff;
  }
  .card a.sheet, .road-body a.sheet{
    background:#f0f0f0;
    color:#333;
  }
  .card a:hover, .pick-modal-inner a:hover, .road-body a:hover{ opacity:.85; }
  .card a:active, .pick-modal-inner a:active, .road-body a:active{ transform: scale(.94); }

  /* ---- roadmap view ---- */
  .roadmap-field-tabs{
    display:none;
    position:sticky;
    top:0;
    z-index:20;
    background:#fffaf0;
    margin: 0 0 16px;
    padding:10px 10px;
    border-radius:14px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
  }
  .roadmap-field-tabs.show{ display:flex; flex-wrap:wrap; gap:8px; }
  .road{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom: 6px;
  }
  .road-node{
    display:flex;
    align-items:stretch;
  }
  .road-badge-col{
    width:40px;
    flex:0 0 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .road-badge{
    width:34px;
    height:34px;
    border-radius:50%;
    background: var(--fc,#999);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:13px;
    flex:0 0 auto;
    box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  .road-line{
    flex:1;
    width:4px;
    min-height:8px;
    margin-top:2px;
    background:#ddd;
    border-radius:2px;
  }
  .road-body{
    flex:1;
    min-width:0;
    margin-left:10px;
    background:#fff;
    border:1px solid #eee;
    border-left:4px solid var(--fc,#ccc);
    border-radius:12px;
    padding: 10px 14px 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,.06);
    position:relative;
  }
  .road-body .played-badge{
    top:-10px;
    left:auto;
    right:10px;
  }
  .road-body-top{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .road-body .card-mascot{
    width:52px;
    height:52px;
    flex:0 0 52px;
    margin-bottom:0;
  }
  .road-body .card-mascot.emoji{ font-size:34px; }
  .road-text{ flex:1; min-width:160px; }
  .road-text .card-unit{ margin:2px 0 2px; font-size:15px; }
  .road-text .card-title{ font-size:12px; margin-bottom:3px; }
  .road-text .meta{ font-size:12.5px; color:#888; line-height:1.5; margin:0; }
  .road-body .btnrow{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-start;
    margin-top:10px;
  }

  .empty-state{
    color:#999;
    font-size:14px;
    padding: 24px 4px;
    text-align:center;
  }

  .pick-random-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    min-height:44px;
    margin: 2px 0 18px;
    padding:10px 22px;
    border:none;
    border-radius:999px;
    background:#ff9843;
    color:#fff;
    font-weight:bold;
    font-family:inherit;
    font-size:15px;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(255,152,67,.4);
    transition: transform .1s ease;
  }
  .pick-random-btn:hover{ transform: translateY(-1px); }
  .pick-random-btn:active{ transform: scale(.95); }

  .pick-modal{
    display:none;
    position:fixed;
    inset:0;

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
  });
}

// ---- きろくのバックアップ（せんせい用・localStorageのJSON書き出し/読み込み） ----
const BACKUP_BASE_KEYS = [PLAYED_KEY, BADGE_KEY, "elementgirl_profiles", "elementgirl_active_profile"];

function collectBackupData(){
  const keys = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(!k) continue;
    const isMatch = BACKUP_BASE_KEYS.some(base => k === base || k.indexOf(base + "__") === 0);
    if(isMatch) keys[k] = localStorage.getItem(k);
  }
  return { exportedAt: new Date().toISOString(), keys };
}

function exportBackup(){
  const data = collectBackupData();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const now = new Date();
  const pad = n => String(n).padStart(2, "0");
  const stamp = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;
  const a = document.createElement("a");
  a.href = url;
  a.download = `elementgirl_backup_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  backupStatusEl.style.color = "#3f8a52";
  backupStatusEl.textContent = "書き出したよ！";
}

function importBackupFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data.keys !== "object") throw new Error("bad format");
      Object.keys(data.keys).forEach(k=> localStorage.setItem(k, data.keys[k]));
      backupStatusEl.style.color = "#3f8a52";
      backupStatusEl.textContent = "読み込んだよ！";
      refreshAll();
    } catch(e){
      backupStatusEl.style.color = "#c0392b";
      backupStatusEl.textContent = "読み込めなかったよ…ファイルを確認してね";
    }
  };
  reader.readAsText(file);
}

// ---- 称号・進捗（作品数が増えても崩れないよう割合ベースのしきい値） ----
function titleThresholds(){
  const total = ITEMS.length;
  return [
    {min:0,                          label:"みならい たんけんか",   icon:"🌱"},
    {min:Math.max(1,Math.round(total*0.10)), label:"いちにんまえ たんけんか", icon:"🔍"},
    {min:Math.round(total*0.25),     label:"はかせの たまご",       icon:"🎓"},
    {min:Math.round(total*0.5),      label:"ものしり はかせ",       icon:"⭐"},
    {min:Math.round(total*0.8),      label:"ぼうけんの たつじん",   icon:"🏅"},
    {min:total,                      label:"でんせつの はかせ",     icon:"👑"},
  ];
}

function getTitleState(playedCount){
  const thresholds = titleThresholds();
  let current = thresholds[0];
  let next = null;
  for(const th of thresholds){
    if(playedCount >= th.min) current = th;
    else { next = th; break; }
  }
  return {current, next};
}

// ---- 「次はこれ！」おすすめ：①途中の作品を再開→②直近の分野の続き→③未着手の分野→④どれか未クリア ----
function pickNextRecommendation(){
  const badgeProgress = getBadgeProgress();
  const clearedSlugs = new Set(ITEMS.filter(it=>isCleared(it.slug, badgeProgress)).map(it=>it.slug));
  if(clearedSlugs.size >= ITEMS.length) return null;

  const inProgress = Object.entries(badgeProgress)
    .filter(([slug, p]) => p && p.total > 0 && p.count > 0 && p.count < p.total)
    .sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));
  if(inProgress.length > 0){
    const item = ITEMS.find(it => it.slug === inProgress[0][0]);
    if(item) return {item, reason:"resume", progress: inProgress[0][1]};
  }

  const playedSet = getPlayedSlugs();
  const playedArr = [...playedSet];
  const lastSlug = playedArr[playedArr.length - 1];
  const lastItem = lastSlug ? ITEMS.find(it=>it.slug===lastSlug) : null;
  if(lastItem){
    const sameField = ITEMS.filter(it=>it.f===lastItem.f && !clearedSlugs.has(it.slug))
      .sort((a,b)=>a.seq-b.seq);
    if(sameField.length > 0) return {item: sameField[0], reason:"continue"};
  }

  const allFields = [...SCIENCE_FIELDS, ...SOCIETY_FIELDS];
  for(const fk of allFields){
    const fieldItems = ITEMS.filter(it=>it.f===fk);
    const fieldCleared = fieldItems.filter(it=>clearedSlugs.has(it.slug));
    if(fieldCleared.length === 0){
      const first = fieldItems.slice().sort((a,b)=>a.seq-b.seq)[0];
      if(first) return {item: first, reason:"new"};
    }
  }

  const anyUncleared = ITEMS.find(it=>!clearedSlugs.has(it.slug));
  return anyUncleared ? {item: anyUncleared, reason:"any"} : null;
}

const profileBarEl = document.getElementById("profileBar");
const profileModalEl = document.getElementById("profileModal");
const profileModalLabelEl = document.getElementById("profileModalLabel");
const profileNameInputEl = document.getElementById("profileNameInput");
const profileNameErrorEl = document.getElementById("profileNameError");
const profileConfirmBtnEl = document.getElementById("profileConfirmBtn");
const profileModalCloseEl = document.getElementById("profileModalClose");
const profileDeleteBtnEl = document.getElementById("profileDeleteBtn");
const profileDeleteConfirmEl = document.getElementById("profileDeleteConfirm");
const profileDeleteYesEl = document.getElementById("profileDeleteYes");
const profileDeleteNoEl = document.getElementById("profileDeleteNo");
const backupOpenBtnEl = document.getElementById("backupOpenBtn");
const backupModalEl = document.getElementById("backupModal");
const backupModalCloseEl = document.getElementById("backupModalClose");
const backupExportBtnEl = document.getElementById("backupExportBtn");
const backupImportBtnEl = document.getElementById("backupImportBtn");
const backupFileInputEl = document.getElementById("backupFileInput");
const backupStatusEl = document.getElementById("backupStatus");
const progressPanelEl = document.getElementById("progressPanel");
const nextUpEl = document.getElementById("nextUpCard");
const statsRow = document.getElementById("statsRow");
const subjectTabsEl = document.getElementById("subjectTabs");
const viewTabsEl = document.getElementById("viewTabs");
const roadmapFieldTabsEl = document.getElementById("roadmapFieldTabs");
const fieldChipsEl = document.getElementById("fieldChips");
const fieldRowWrap = document.getElementById("fieldRowWrap");
const gradeChipsEl = document.getElementById("gradeChips");
const resultCountEl = document.getElementById("resultCount");
const sectionsEl = document.getElementById("sections");
const searchBox = document.getElementById("searchBox");
const searchRowEl = document.querySelector(".search-row");
const moreToggleEl = document.getElementById("moreToggle");

moreToggleEl.addEventListener("click", ()=>{
  state.moreOpen = !state.moreOpen;
  render();
});

const pickRandomBtn = document.getElementById("pickRandomBtn");
const pickModalEl = document.getElementById("pickModal");
const pickModalBodyEl = document.getElementById("pickModalBody");
const pickModalCloseEl = document.getElementById("pickModalClose");

function pickRandomItem(){
  const filtered = ITEMS.filter(matchesFilter);
  const pool = filtered.length > 0 ? filtered : ITEMS;
  const picked = pool[Math.floor(Math.random() * pool.length)];
  showPickModal(picked);
}

function showPickModal(it){
  const info = FIELD_INFO[it.f];
  pickModalBodyEl.innerHTML = `
    <div class="pick-modal-label">🎲 これに きまり！</div>
    ${mascotHTML(it)}
    <h2 class="card-unit">${it.u}</h2>
    <div class="card-title">${it.t}</div>
    <div class="meta">${SUBJECT_LABEL[it.subj]}${it.gt} ／ ${info.label}</div>
    <div class="btnrow" style="margin-top:10px;">
      <a class="main" data-slug="${it.slug}" href="${it.slug}.html">あそびに行く！</a>
    </div>
    <div><button type="button" id="pickAgainBtn" class="pick-again-btn">🔄 もう一回</button></div>
  `;
  document.getElementById("pickAgainBtn").addEventListener("click", pickRandomItem);
  pickModalEl.classList.add("open");
}

pickRandomBtn.addEventListener("click", pickRandomItem);
pickModalCloseEl.addEventListener("click", ()=> pickModalEl.classList.remove("open"));
pickModalEl.addEventListener("click", (e)=>{
  if(e.target === pickModalEl) pickModalEl.classList.remove("open");
});

profileConfirmBtnEl.addEventListener("click", confirmProfile);
profileNameInputEl.addEventListener("keydown", (e)=>{ if(e.key === "Enter") confirmProfile(); });
profileModalCloseEl.addEventListener("click", closeProfileModal);
profileModalEl.addEventListener("click", (e)=>{
  if(e.target === profileModalEl) closeProfileModal();
});
profileDeleteBtnEl.addEventListener("click", requestDeleteProfile);
profileDeleteYesEl.addEventListener("click", confirmDeleteProfile);
profileDeleteNoEl.addEventListener("click", cancelDeleteProfile);

backupOpenBtnEl.addEventListener("click", ()=>{
  backupStatusEl.textContent = "";
  backupModalEl.classList.add("open");
});
backupModalCloseEl.addEventListener("click", ()=> backupModalEl.classList.remove("open"));
backupModalEl.addEventListener("click", (e)=>{
  if(e.target === backupModalEl) backupModalEl.classList.remove("open");
});
backupExportBtnEl.addEventListener("click", exportBackup);
backupImportBtnEl.addEventListener("click", ()=> backupFileInputEl.click());
backupFileInputEl.addEventListener("change", ()=>{
  const file = backupFileInputEl.files[0];
  if(file) importBackupFile(file);
  backupFileInputEl.value = "";
});

function initStats(){
  const scienceCount = ITEMS.filter(it=>it.subj==="science").length;
  const societyCount = ITEMS.filter(it=>it.subj==="society").length;
  const playedCount = getPlayedSlugs().size;
  const badgeProgress = getBadgeProgress();
  const clearedCount = ITEMS.filter(it=>isCleared(it.slug, badgeProgress)).length;
  statsRow.innerHTML = `
    <span>ぜんぶで<b>${ITEMS.length}</b>このぼうけん</span>
    <span>🔬りか <b>${scienceCount}</b></span>
    <span>🏯しゃかい <b>${societyCount}</b></span>
    <span>⭐あそんだ数 <b>${playedCount}</b></span>
    <span>🏆クリアずみ <b>${clearedCount}</b></span>
  `;
}

function renderProgress(){
  const playedCount = getPlayedSlugs().size;
  const total = ITEMS.length;
  const pct = total > 0 ? Math.round(playedCount / total * 100) : 0;
  const {current, next} = getTitleState(playedCount);
  const active = getActiveProfile();
  const namePrefix = active !== "default" ? `${active}さんの ` : "";
  const subText = next
    ? `つぎの称号「${next.icon} ${next.label}」まで あと ${next.min - playedCount}こ！`
    : `ぜんぶの称号を てにいれたよ！さいきょうの はかせだね！`;
  progressPanelEl.innerHTML = `
    <div class="progress-title"><span class="icon">${current.icon}</span>${namePrefix}いまの称号：${current.label}</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
      <div class="progress-sub">${playedCount}／${total}こ あそんだよ（${pct}%）<br><span class="progress-next">${subText}</span></div>
    </div>
  `;
}

function renderNextUp(){
  const rec = pickNextRecommendation();
  if(!rec){
    nextUpEl.innerHTML = `<div class="nextup-complete">👑 ぜんぶの ぼうけんを クリアしたよ！すごい！</div>`;
    return;
  }
  const it = rec.item;
  const info = FIELD_INFO[it.f];
  const label = rec.reason === "resume" ? "🚩 さいごまで やろう！"
    : rec.reason === "continue" ? "🚩 つづきは これ！"
    : "✨ 次は これに ちょうせん！";
  const progressLine = rec.reason === "resume"
    ? `<div class="nextup-progress">★${rec.progress.count}／${rec.progress.total} クリア中</div>`
    : "";
  nextUpEl.innerHTML = `
    <div class="nextup-label">${label}</div>
    <div class="nextup-body" style="--fc:${info.fc}">
      ${mascotHTML(it)}
      <div class="nextup-text">
        <h3 class="card-unit">${it.u}</h3>
        <div class="card-title">${it.t}</div>
        <div class="meta">${SUBJECT_LABEL[it.subj]}${it.gt} ／ ${info.label}</div>
        ${progressLine}
      </div>
      <a class="main nextup-btn" data-slug="${it.slug}" href="${it.slug}.html">あそびに行く！</a>
    </div>
  `;
}

function initSubjectTabs(){
  const tabs = [
    {key:"all", label:`すべて`},
    {key:"science", label:`理科`},
    {key:"society", label:`社会`},
  ];
  subjectTabsEl.innerHTML = tabs.map(tb=>
    `<button type="button" class="tab-btn" data-subject="${tb.key}">${tb.label}</button>`
  ).join("");
  subjectTabsEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.subject = btn.dataset.subject;
      state.fields.clear();
      render();
    });
  });
}

function initViewTabs(){
  const tabs = [
    {key:"grid", label:`📋 いちらん`},
    {key:"roadmap", label:`🗺️ じゅんばん`},
  ];
  viewTabsEl.innerHTML = tabs.map(tb=>
    `<button type="button" class="tab-btn" data-view="${tb.key}">${tb.label}</button>`
  ).join("");
  viewTabsEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.view = btn.dataset.view;
      render();
    });
  });
}

function fieldsForCurrentSubject(){
  if(state.subject === "science") return SCIENCE_FIELDS;
  if(state.subject === "society") return SOCIETY_FIELDS;
  return [...SCIENCE_FIELDS, ...SOCIETY_FIELDS];
}

function renderFieldChips(){
  const fields = fieldsForCurrentSubject();
  fieldChipsEl.innerHTML = fields.map(fk=>{
    const info = FIELD_INFO[fk];
    const active = state.fields.has(fk) ? "active" : "";
    return `<button type="button" class="chip ${active}" data-field="${fk}" style="--chip-bg:${info.bg};--chip-fg:${info.fc}">${info.icon} ${info.label}</button>`;
  }).join("");
  fieldChipsEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const fk = btn.dataset.field;
      if(state.fields.has(fk)) state.fields.delete(fk);
      else state.fields.add(fk);
      render();
    });
  });
}

function initGradeChips(){
  gradeChipsEl.innerHTML = GRADES.map(g=>
    `<button type="button" class="chip" data-grade="${g}">小${g}</button>`
  ).join("");
  gradeChipsEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const g = Number(btn.dataset.grade);
      if(state.grades.has(g)) state.grades.delete(g);
      else state.grades.add(g);
      render();
    });
  });
}

function mascotHTML(it){
  const info = FIELD_INFO[it.f];
  const svg = typeof MASCOTS !== "undefined" ? MASCOTS[it.slug] : null;
  return svg
    ? `<div class="card-mascot">${svg}</div>`
    : `<div class="card-mascot emoji">${FALLBACK_EMOJI[it.slug] || info.icon}</div>`;
}

function cardHTML(it, playedSet, badgeProgress){
  const info = FIELD_INFO[it.f];
  const playedBadge = playedBadgeHTML(it, playedSet, badgeProgress);
  return `
    <div class="card" style="--fc:${info.fc}">
      ${playedBadge}
      <span class="card-fibadge" style="--fc-bg:${info.bg}" title="${info.label}">${info.icon}</span>
      ${mascotHTML(it)}
      <h2 class="card-unit">${it.u}</h2>
      <div class="card-title">${it.t}</div>
      <div class="meta">${SUBJECT_LABEL[it.subj]}${it.gt} ／ ${info.label}</div>
      <div class="btnrow">
        <a class="main" data-slug="${it.slug}" href="${it.slug}.html">じゅぎょう画面</a>
        <a class="sheet" href="${it.slug}-sheet.html">きろくシート</a>
      </div>
    </div>`;
}

function matchesFilter(it){
  if(state.subject !== "all" && it.subj !== state.subject) return false;
  if(state.fields.size > 0 && !state.fields.has(it.f)) return false;
  if(state.grades.size > 0 && !it.g.some(g=>state.grades.has(g))) return false;
  if(state.keyword){
    const hay = `${it.t} ${it.u} ${SUBJECT_LABEL[it.subj]} ${it.gt} ${FIELD_INFO[it.f].label}`;
    if(!hay.includes(state.keyword)) return false;
  }
  return true;
}

function roadNodeHTML(it, num, isLast, playedSet, badgeProgress){
  const info = FIELD_INFO[it.f];
  const playedBadge = playedBadgeHTML(it, playedSet, badgeProgress);
  return `
    <div class="road-node">
      <div class="road-badge-col">
        <span class="road-badge" style="--fc:${info.fc}">${num}</span>
        ${isLast ? "" : `<span class="road-line"></span>`}
      </div>
      <div class="road-body" style="--fc:${info.fc}">
        ${playedBadge}
        <div class="road-body-top">
          ${mascotHTML(it)}
          <div class="road-text">
            <h3 class="card-unit">${it.u}</h3>
            <div class="card-title">${it.t}</div>
            <div class="meta">${SUBJECT_LABEL[it.subj]}${it.gt} ／ ${info.label}</div>
          </div>
        </div>
        <div class="btnrow">
          <a class="main" data-slug="${it.slug}" href="${it.slug}.html">じゅぎょう画面</a>
          <a class="sheet" href="${it.slug}-sheet.html">きろくシート</a>
        </div>
      </div>
    </div>`;
}

function renderRoadmapFieldTabs(fields){
  roadmapFieldTabsEl.innerHTML = fields.map(fk=>{
    const info = FIELD_INFO[fk];
    const count = ITEMS.filter(it=>it.f===fk).length;
    const active = state.roadmapField === fk ? "active" : "";
    return `<button type="button" class="chip ${active}" data-field="${fk}" style="--chip-bg:${info.bg};--chip-fg:${info.fc}">${info.icon} ${info.label}（${count}）</button>`;
  }).join("");
  roadmapFieldTabsEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.roadmapField = btn.dataset.field;
      render();
    });
  });
}

function renderRoadmap(fieldKey){
  resultCountEl.textContent = "";
  const playedSet = getPlayedSlugs();
  const badgeProgress = getBadgeProgress();
  const info = FIELD_INFO[fieldKey];
  const items = ITEMS.filter(it=>it.f===fieldKey).sort((a,b)=>a.seq-b.seq);
  let html = `<div class="field-heading"><span class="fi-badge" style="--fc-bg:${info.bg}">${info.icon}</span>${info.label}<span class="fi-count">（${items.length}）</span></div>`;
  html += `<div class="road">${items.map((it,i)=>roadNodeHTML(it, i+1, i===items.length-1, playedSet, badgeProgress)).join("")}</div>`;
  sectionsEl.innerHTML = html;
}

function render(){
  // subject tab active state
  subjectTabsEl.querySelectorAll("button").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.subject === state.subject);
  });
  viewTabsEl.querySelectorAll("button").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.view === state.view);
  });

  const isRoadmap = state.view === "roadmap";
  searchRowEl.style.display = isRoadmap ? "none" : "flex";
  moreToggleEl.style.display = isRoadmap ? "none" : "inline-flex";
  moreFiltersEl.classList.toggle("open", !isRoadmap && state.moreOpen);
  roadmapFieldTabsEl.classList.toggle("show", isRoadmap);

  if(isRoadmap){
    const fields = fieldsForCurrentSubject().filter(fk=>ITEMS.some(it=>it.f===fk));
    if(!fields.includes(state.roadmapField)) state.roadmapField = fields[0];
    renderRoadmapFieldTabs(fields);
    renderRoadmap(state.roadmapField);
    return;
  }

  fieldRowWrap.style.display = "block";
  renderFieldChips();
  gradeChipsEl.querySelectorAll("button").forEach(btn=>{
    btn.classList.toggle("active", state.grades.has(Number(btn.dataset.grade)));
  });

  moreToggleEl.textContent = state.moreOpen ? "🔼 とじる" : "🔍 もっとくわしく えらぶ";

  const filtered = ITEMS.filter(matchesFilter);
  if(filtered.length === ITEMS.length){
    resultCountEl.textContent = `${ITEMS.length}このぼうけんがあるよ！`;
  } else if(filtered.length === 0){
    resultCountEl.textContent = "";
  } else {
    resultCountEl.textContent = `${filtered.length}こ 見つかったよ！`;
  }

  const playedSet = getPlayedSlugs();
  const badgeProgress = getBadgeProgress();
  const subjectOrder = state.subject === "all" ? ["science","society"] : [state.subject];
  let html = "";
  subjectOrder.forEach(subj=>{
    const fieldOrder = subj === "science" ? SCIENCE_FIELDS : SOCIETY_FIELDS;
    const subjItems = filtered.filter(it=>it.subj===subj);
    if(subjItems.length === 0) return;
    html += `<div class="subject-block"><div class="subject-title ${subj}">${SUBJECT_LABEL[subj]}（${subjItems.length}）</div>`;
    fieldOrder.forEach(fk=>{
      const items = subjItems.filter(it=>it.f===fk);
      if(items.length === 0) return;
      const info = FIELD_INFO[fk];
      html += `<div class="field-heading"><span class="fi-badge" style="--fc-bg:${info.bg}">${info.icon}</span>${info.label}<span class="fi-count">（${items.length}）</span></div>`;
      html += `<div class="grid">${items.map(it=>cardHTML(it, playedSet, badgeProgress)).join("")}</div>`;
    });
    html += `</div>`;
  });

  if(filtered.length === 0){
    html = `<div class="empty-state">😢 みつからなかったよ…べつのことばで さがしてみてね</div>`;
  }
  sectionsEl.innerHTML = html;
}

searchBox.addEventListener("input", ()=>{
  state.keyword = searchBox.value.trim();
  render();
});

migrateLegacyProgressIfNeeded();
initStats();
renderProgress();
renderNextUp();
renderBonusGames();
renderBrainGames();
renderProfileBar();
initSubjectTabs();
initViewTabs();
initGradeChips();
render();

window.addEventListener("pageshow", ()=>{
  initStats();
  renderProgress();
  renderNextUp();
  renderBonusGames();
  renderBrainGames();
  renderProfileBar();
  render();
});
</script>
