<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script src="auth.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ゲーム型授業 一覧</title>
<style>
  :root{
    color-scheme: light;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    background: linear-gradient(180deg,#fef9ef,#eaf3fb);
    color:#2b2b2b;
    padding: clamp(16px,4vw,48px);
  }
  h1{
    font-size: clamp(22px,4vw,34px);
    margin: 0 0 8px;
  }
  p.lead{
    margin: 0 0 14px;
    color:#555;
  }
  .stats{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom: clamp(18px,3vw,28px);
  }
  .stats span{
    background:#fff;
    border:1px solid #e3ddce;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: bold;
    color:#665;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);
  }
  .stats span b{ color:#c76b2c; }

  /* ---- controls ---- */
  .controls{
    background: rgba(255,255,255,.6);
    border:1px solid #e8e2d2;
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 20px;
    backdrop-filter: none;
  }
  .search-row{
    display:flex;
    margin-bottom: 12px;
  }
  #searchBox{
    width:100%;
    max-width: 420px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 15px;
    font-family: inherit;
    background:#fff;
  }
  #searchBox:focus{
    outline: 2px solid #4a7fd6;
    outline-offset: 1px;
  }
  .row-label{
    font-size: 12px;
    color:#888;
    font-weight:bold;
    margin: 8px 0 6px;
  }
  .chiprow{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .tab-btn, .chip{
    border:none;
    cursor:pointer;
    font-family: inherit;
    font-weight:bold;
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 14px;
    background:#f1f1f1;
    color:#555;
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .tab-btn:hover, .chip:hover{ transform: translateY(-1px); }
  .tab-btn.active{
    background:#4a7fd6;
    color:#fff;
    box-shadow: 0 2px 8px rgba(74,127,214,.4);
  }
  .chip{
    background: var(--chip-bg,#f1f1f1);
    color: var(--chip-fg,#555);
    border: 1px solid var(--chip-fg,#ccc);
  }
  .chip.active{
    background: var(--chip-fg,#555);
    color:#fff;
  }
  .grade-row .chip{
    --chip-bg:#f1f1f1;
    --chip-fg:#777;
  }

  .result-count{
    font-size: 13px;
    color:#888;
    margin: 4px 0 16px;
  }

  /* ---- subject section ---- */
  .subject-block{
    margin-bottom: 8px;
  }
  .subject-title{
    font-size: 18px;
    font-weight:bold;
    margin: 22px 0 12px;
    padding-bottom:6px;
    border-bottom: 3px solid #ddd;
  }
  .subject-title.science{ color:#2c5c8a; border-color:#bcd7ee; }
  .subject-title.society{ color:#a05a20; border-color:#f0d3ae; }

  .field-heading{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:15px;
    font-weight:bold;
    margin: 16px 0 10px;
    color:#444;
  }
  .field-heading .fi-badge{
    width:26px; height:26px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
    background: var(--fc-bg);
  }
  .field-heading .fi-count{
    font-weight:normal;
    color:#999;
    font-size:13px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px,1fr));
    gap: 16px;
    margin-bottom: 6px;
  }
  .card{
    background:#fff;
    border-radius: 14px;
    padding: 14px 18px 16px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    border:1px solid #eee;
    border-top: 4px solid var(--fc, #ccc);
    position:relative;
  }
  .card-top{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 6px;
  }
  .card-top .fi-badge{
    width:24px; height:24px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px;
    background: var(--fc-bg);
    flex-shrink:0;
  }
  .card-top .fi-label{
    font-size:12px;
    font-weight:bold;
    color: var(--fc);
  }
  .card h2{
    margin: 0 0 4px;
    font-size: 19px;
  }
  .card .meta{
    font-size: 13px;
    color:#888;
    margin-bottom: 12px;
  }
  .card a{
    display:inline-block;
    margin: 4px 8px 0 0;
    padding: 8px 14px;
    border-radius: 8px;
    text-decoration:none;
    font-size: 14px;
    font-weight: bold;
  }
  .card a.main{
    background:#4a7fd6;
    color:#fff;
  }
  .card a.sheet{
    background:#f0f0f0;
    color:#333;
  }
  .card a:hover{ opacity:.85; }

  .empty-state{
    color:#999;
    font-size:14px;
    padding: 24px 4px;
    text-align:center;
  }
</style>
</head>
<body>
  <h1>ゲーム型授業 一覧</h1>
  <p class="lead">画面をタップして遊ぶだけで、じゅぎょう画面が開きます。</p>
  <div class="stats" id="statsRow"></div>

  <div class="controls">
    <div class="search-row">
      <input type="search" id="searchBox" placeholder="キーワードで検索（例：歴史、電気、小6）">
    </div>

    <div class="row-label">教科</div>
    <div class="chiprow" id="subjectTabs"></div>

    <div id="fieldRowWrap">
      <div class="row-label">分野</div>
      <div class="chiprow" id="fieldChips"></div>
    </div>

    <div class="row-label">学年</div>
    <div class="chiprow grade-row" id="gradeChips"></div>
  </div>

  <div class="result-count" id="resultCount"></div>
  <div id="sections"></div>

<script>

  {t:"ホシゾラの街", u:"環境を守る・公害", subj:"society", f:"chiri", g:[5], gt:"小5", slug:"hoshizora"},
  {t:"ガイトウの町", u:"明治維新と文明開化・歴史", subj:"society", f:"rekishi", g:[6], gt:"小6", slug:"gaitou"},

  {t:"アオバの葉かげ", u:"チョウの育ち方（昆虫の成長）", subj:"science", f:"seimei", g:[3], gt:"小3", slug:"chou"},
  {t:"いろみずの研究所", u:"水よう液の性質（酸性・中性・アルカリ性）", subj:"science", f:"busshitsu", g:[6], gt:"小6", slug:"iromizu"},
  {t:"ウズの実験室", u:"電磁石のひみつ（電流のはたらき）", subj:"science", f:"energy", g:[5], gt:"小5", slug:"uzu"},
  {t:"カガミの丘", u:"光のひみつ（光の性質）", subj:"science", f:"energy", g:[3], gt:"小3", slug:"kagami"},
  {t:"カゲロウの原", u:"影と太陽のひみつ（太陽と地面のようす）", subj:"science", f:"tenmon", g:[3], gt:"小3", slug:"kagerou"},
  {t:"ダンダンの実験場", u:"温度と体積・あたたまり方", subj:"science", f:"ryushi", g:[4], gt:"小4", slug:"dandan"},
  {t:"シズクの淵", u:"動物のたんじょう（メダカ・人）", subj:"science", f:"seimei", g:[5], gt:"小5", slug:"shizuku"},
  {t:"ホムラの炉", u:"ものの燃え方と空気", subj:"science", f:"ryushi", g:[6], gt:"小6", slug:"homura"},
  {t:"ミャクの森", u:"植物の養分と水の通り道", subj:"science", f:"seimei", g:[6], gt:"小6", slug:"myaku"},
  {t:"コドウの丘", u:"人の体のつくりと働き（呼吸・血液循環）", subj:"science", f:"jintai", g:[6], gt:"小6", slug:"kodou"},
  {t:"カザミの丘", u:"天気の変化（雲と天気・台風）", subj:"science", f:"kisho", g:[5], gt:"小5", slug:"kazami"},
  {t:"クルルの発電所", u:"電気の利用（発電・蓄電・センサー）", subj:"science", f:"energy", g:[6], gt:"小6", slug:"kururu"},
];

const SUBJECT_LABEL = {science:"理科", society:"社会"};

const FIELD_INFO = {
  tenmon:    {label:"天文",     icon:"🌙", fc:"#2c4a7c", bg:"#e4ecf7"},
  busshitsu: {label:"物質",     icon:"🧪", fc:"#6a3f96", bg:"#ede3f7"},
  jintai:    {label:"人体",     icon:"❤️", fc:"#b83b52", bg:"#fbe4e8"},
  chigaku:   {label:"地学",     icon:"🪨", fc:"#7c5a2e", bg:"#f3e9d8"},
  rikigaku:  {label:"力学",     icon:"⚙️", fc:"#4a525c", bg:"#e7e9eb"},
  seimei:    {label:"生命",     icon:"🌱", fc:"#3f8a52", bg:"#e3f3e6"},
  energy:    {label:"エネルギー", icon:"⚡", fc:"#a8790b", bg:"#fbf1d6"},
  ryushi:    {label:"粒子",     icon:"⚛️", fc:"#1f8a8a", bg:"#ddf3f3"},
  kisho:     {label:"気象",     icon:"☁️", fc:"#3d7ab5", bg:"#e2eef8"},
  rekishi:   {label:"歴史",     icon:"🏯", fc:"#8c3f3f", bg:"#f6e4e4"},
  chiri:     {label:"地理",     icon:"🗾", fc:"#1f6e58", bg:"#ddf0ea"},
  komin:     {label:"公民",     icon:"🏛️", fc:"#4a3f7c", bg:"#e9e4f5"},
};
const SCIENCE_FIELDS = ["tenmon","busshitsu","jintai","chigaku","rikigaku","seimei","energy","ryushi","kisho"];
const SOCIETY_FIELDS = ["rekishi","chiri","komin"];
const GRADES = [3,4,5,6];

const state = { subject:"all", fields:new Set(), grades:new Set(), keyword:"" };

const statsRow = document.getElementById("statsRow");
const subjectTabsEl = document.getElementById("subjectTabs");
const fieldChipsEl = document.getElementById("fieldChips");
const fieldRowWrap = document.getElementById("fieldRowWrap");
const gradeChipsEl = document.getElementById("gradeChips");
const resultCountEl = document.getElementById("resultCount");
const sectionsEl = document.getElementById("sections");
const searchBox = document.getElementById("searchBox");

function initStats(){
  const scienceCount = ITEMS.filter(it=>it.subj==="science").length;
  const societyCount = ITEMS.filter(it=>it.subj==="society").length;
  statsRow.innerHTML = `
    <span>全<b>${ITEMS.length}</b>作品</span>
    <span>理科 <b>${scienceCount}</b></span>
    <span>社会 <b>${societyCount}</b></span>
  `;
}

function initSubjectTabs(){
  const tabs = [
    {key:"all", label:`すべて`},
    {key:"science", label:`理科`},
    {key:"society", label:`社会`},
  ];
  subjectTabsEl.innerHTML = tabs.map(tb=>
    `<button type="button" class="tab-btn" data-subject="${tb.key}">${tb.label}</button>`
  ).join("");
  subjectTabsEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.subject = btn.dataset.subject;
      state.fields.clear();
      render();
    });
  });
}

function fieldsForCurrentSubject(){
  if(state.subject === "science") return SCIENCE_FIELDS;
  if(state.subject === "society") return SOCIETY_FIELDS;
  return [...SCIENCE_FIELDS, ...SOCIETY_FIELDS];
}

function renderFieldChips(){
  const fields = fieldsForCurrentSubject();
  fieldChipsEl.innerHTML = fields.map(fk=>{
    const info = FIELD_INFO[fk];
    const active = state.fields.has(fk) ? "active" : "";
    return `<button type="button" class="chip ${active}" data-field="${fk}" style="--chip-bg:${info.bg};--chip-fg:${info.fc}">${info.icon} ${info.label}</button>`;
  }).join("");
  fieldChipsEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const fk = btn.dataset.field;
      if(state.fields.has(fk)) state.fields.delete(fk);
      else state.fields.add(fk);
      render();
    });
  });
}

function initGradeChips(){
  gradeChipsEl.innerHTML = GRADES.map(g=>
    `<button type="button" class="chip" data-grade="${g}">小${g}</button>`
  ).join("");
  gradeChipsEl.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const g = Number(btn.dataset.grade);
      if(state.grades.has(g)) state.grades.delete(g);
      else state.grades.add(g);
      render();
    });
  });
}

function cardHTML(it){
  const info = FIELD_INFO[it.f];
  return `
    <div class="card" style="--fc:${info.fc}">
      <div class="card-top">
        <span class="fi-badge" style="--fc-bg:${info.bg}">${info.icon}</span>
        <span class="fi-label">${info.label}</span>
      </div>
      <h2>${it.t}</h2>
      <div class="meta">${it.u} ／ ${SUBJECT_LABEL[it.subj]}${it.gt}</div>
      <a class="main" href="${it.slug}.html">じゅぎょう画面</a>
      <a class="sheet" href="${it.slug}-sheet.html">きろくシート</a>
    </div>`;
}

function matchesFilter(it){
  if(state.subject !== "all" && it.subj !== state.subject) return false;
  if(state.fields.size > 0 && !state.fields.has(it.f)) return false;
  if(state.grades.size > 0 && !it.g.some(g=>state.grades.has(g))) return false;
  if(state.keyword){
    const hay = `${it.t} ${it.u} ${SUBJECT_LABEL[it.subj]} ${it.gt} ${FIELD_INFO[it.f].label}`;
    if(!hay.includes(state.keyword)) return false;
  }
  return true;
}

function render(){
  // subject tab active state
  subjectTabsEl.querySelectorAll("button").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.subject === state.subject);
  });
  fieldRowWrap.style.display = "block";
  renderFieldChips();
  gradeChipsEl.querySelectorAll("button").forEach(btn=>{
    btn.classList.toggle("active", state.grades.has(Number(btn.dataset.grade)));
  });

  const filtered = ITEMS.filter(matchesFilter);
  resultCountEl.textContent = `全${ITEMS.length}作品中 ${filtered.length}作品を表示`;

  const subjectOrder = state.subject === "all" ? ["science","society"] : [state.subject];
  let html = "";
  subjectOrder.forEach(subj=>{
    const fieldOrder = subj === "science" ? SCIENCE_FIELDS : SOCIETY_FIELDS;
    const subjItems = filtered.filter(it=>it.subj===subj);
    if(subjItems.length === 0) return;
    html += `<div class="subject-block"><div class="subject-title ${subj}">${SUBJECT_LABEL[subj]}（${subjItems.length}）</div>`;
    fieldOrder.forEach(fk=>{
      const items = subjItems.filter(it=>it.f===fk);
      if(items.length === 0) return;
      const info = FIELD_INFO[fk];
      html += `<div class="field-heading"><span class="fi-badge" style="--fc-bg:${info.bg}">${info.icon}</span>${info.label}<span class="fi-count">（${items.length}）</span></div>`;
      html += `<div class="grid">${items.map(cardHTML).join("")}</div>`;
    });
    html += `</div>`;
  });

  if(filtered.length === 0){
    html = `<div class="empty-state">条件に合う作品が見つかりませんでした。検索や絞り込みを変えてみてください。</div>`;
  }
  sectionsEl.innerHTML = html;
}

searchBox.addEventListener("input", ()=>{
  state.keyword = searchBox.value.trim();
  render();
});

initStats();
initSubjectTabs();
initGradeChips();
render();
</script>
</body>
</html>
