<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   ミャクの森 — 植物の養分と水の通り道（小6理科・協力型・1ファイル）
   水の通り道を発見（発見型・道管）→
   水を吸い上げる時間（メイン操作・時間送り①〜⑦）→
   水はどこへ行く？（発見型・蒸散と気孔）→
   養分をつくる（発見型・光合成のでんぷん検出）→
   はかせ（くらしの中の水と養分）。
   数値はセロリの色水吸水実験の実測経過（1分で切り口・10分で葉脈・1時間で葉全体・
   24時間で継続吸水）、日本植物生理学会資料（蒸散量は体内水分の5〜10倍）に基づく。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {
  doukan: ruby('道管', 'どうかん'),
  jousan: ruby('蒸散', 'じょうさん'),
  kiko: ruby('気孔', 'きこう'),
  koukousei: ruby('光合成', 'こうごうせい'),
  yobun: ruby('養分', 'ようぶん'),
  seirei: ruby('精霊', 'せいれい'),
  youmyaku: ruby('葉脈', 'ようみゃく'),
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 数値データ（本物度：セロリ色水実験の実測経過・日本植物生理学会資料） ----------
// m_kyuusui: 経過時間ラベル。index0=スタート(0分)、①〜⑦は残り7段階
const KYUUSUI_LABEL = ['スタート', '1分', '10分', '30分', '1時間', '3時間', '5時間', '24時間'];
// 色水がどこまで広がったか（0=無色〜1=葉全体が真っ赤・継続的な吸水）
// 実測：1分で切り口の維管束、10分で葉脈、1時間で葉全体、5〜24時間でさらに濃く
const KYUUSUI_FRAC = [0, 0.08, 0.28, 0.48, 0.66, 0.8, 0.92, 1.0];

// m_doukan: 茎の輪切り断面に輪状に並ぶ道管の発見ポイント（6箇所）
const DOUKAN_ANGLES = [-90, -30, 30, 90, 150, 210];

// m_jousan: 蒸散量は体内の水分の5〜10倍（日本植物生理学会資料）
const JOUSAN_MIN_TIMES = 5, JOUSAN_MAX_TIMES = 10;

// ---------- くらしの中の水と養分 ----------

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function bgGarden(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#f1f8e9'); g.addColorStop(1, '#c8e0ae');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.fillStyle = '#7a9c5c';
  gctx.fillRect(X(0), Y(560), 1000 * sc, 80 * sc);
}

// ---------- 葉っぱ（共通パーツ・染まり具合をfracで表現） ----------
function drawLeafShape(px, py, sc, rot, frac) {
  gctx.save();
  gctx.translate(px, py);
  gctx.rotate(rot);
  const w = 64 * sc, h = 42 * sc;
  gctx.beginPath();
  gctx.moveTo(0, 0);
  gctx.quadraticCurveTo(w * 0.5, -h * 0.75, w, 0);
  gctx.quadraticCurveTo(w * 0.5, h * 0.75, 0, 0);
  gctx.closePath();
  gctx.fillStyle = '#7cb342';
  gctx.fill();
  gctx.strokeStyle = '#3a6b26'; gctx.lineWidth = 1.8 * sc; gctx.stroke();
  if (frac > 0.02) {
    gctx.save();
    gctx.clip();
    gctx.globalAlpha = frac * 0.8;
    gctx.fillStyle = '#e05078';
    gctx.beginPath();
    gctx.moveTo(0, 0);
    gctx.quadraticCurveTo(w * 0.5, -h * 0.75, w, 0);
    gctx.quadraticCurveTo(w * 0.5, h * 0.75, 0, 0);
    gctx.closePath();
    gctx.fill();
    gctx.restore();
  }
  gctx.strokeStyle = 'rgba(58,107,38,.7)'; gctx.lineWidth = 1.2 * sc;
  gctx.beginPath(); gctx.moveTo(0, 0); gctx.lineTo(w * 0.92, 0); gctx.stroke();
  gctx.restore();
}

// ---------- 1．水の通り道を発見（茎の輪切り断面・発見型） ----------

// ---------- 2．水を吸い上げる時間（メイン操作・時間送り①〜⑦） ----------
function drawCelery(X, Y, sc, baseX, baseY, frac) {
  // コップ（色水）
  const cupW = 100, cupH = 80, cupTop = baseY;
  gctx.fillStyle = '#fdf6f2'; gctx.strokeStyle = '#c98aa0'; gctx.lineWidth = 2.5 * sc;
  roundRect(gctx, X(baseX - cupW / 2), Y(cupTop), cupW * sc, cupH * sc, 8 * sc);
  gctx.fill(); gctx.stroke();
  gctx.fillStyle = 'rgba(224, 80, 120, .5)';
  roundRect(gctx, X(baseX - cupW / 2 + 5), Y(cupTop + 16), (cupW - 10) * sc, (cupH - 22) * sc, 6 * sc);
  gctx.fill();

  // 茎
  const stemW = 30, stemH = 210, stemTop = baseY - stemH, stemBot = baseY + 8;
  gctx.fillStyle = '#a9cf8a';
  gctx.fillRect(X(baseX - stemW / 2), Y(stemTop), stemW * sc, stemH * sc);
  const dyeH = stemH * clamp(frac * 1.4, 0, 1);
  gctx.fillStyle = 'rgba(224, 80, 120, .65)';
  gctx.fillRect(X(baseX - stemW / 2), Y(stemBot - dyeH), stemW * sc, dyeH * sc);
  gctx.strokeStyle = '#4a7a3a'; gctx.lineWidth = 2 * sc;
  gctx.strokeRect(X(baseX - stemW / 2), Y(stemTop), stemW * sc, stemH * sc);
  for (let i = -1; i <= 1; i++) {
    gctx.strokeStyle = 'rgba(74,122,58,.5)'; gctx.lineWidth = 1.4 * sc;
    gctx.beginPath(); gctx.moveTo(X(baseX + i * 8), Y(stemTop)); gctx.lineTo(X(baseX + i * 8), Y(stemBot)); gctx.stroke();
  }

  // 葉3枚（染まりは半分すぎてから届く）
  const leaves = [{ dx: -75, dy: -20, rot: -0.55 }, { dx: 75, dy: -20, rot: 0.55 }, { dx: 0, dy: -55, rot: 0 }];
  const leafFrac = clamp((frac - 0.35) / 0.65, 0, 1);
  leaves.forEach(lp => drawLeafShape(X(baseX + lp.dx), Y(stemTop + lp.dy), sc, lp.rot, leafFrac));
}

function drawBranch(X, Y, sc, px, py, hasLeaf, done, animT) {

  gctx.strokeStyle = 'rgba(100,100,100,.7)'; gctx.lineWidth = 2 * sc;
  gctx.fillStyle = 'rgba(220,240,255,.18)';
  roundRect(gctx, X(px - 55), Y(py - 80), 110 * sc, 130 * sc, 20 * sc);
  gctx.fill(); gctx.stroke();
  if (done && hasLeaf) {
    const n = Math.round(14 * animT);
    for (let i = 0; i < n; i++) {

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'doukan') drawDoukanScene(X, Y, sc);
  else if (S.scene === 'kyuusui') drawKyuusuiScene(X, Y, sc);
  else if (S.scene === 'jousan') drawJousanScene(X, Y, sc);
  else if (S.scene === 'youbun') drawYoubunScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- みゃくスコープ（丸窓） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f1f8e9'); grd.addColorStop(1, '#b8d19a');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'water') {
    drawWaterTubes(R, S.scope.frac);
    label('道管を のぼる 水');
  } else if (mode === 'point') {
    sctx.fillStyle = '#2e7d32';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#aed58155'); g2.addColorStop(1, 'rgba(174,213,129,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#2e7d32'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🌿', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#2e7d32'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.09}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#2a2a2a';
    sctx.fillText(txt, R, ly);
  }

  function drawWaterTubes(R, frac) {
    const tubeCount = 6;
    const tubeW = R * 0.15, tubeH = R * 1.0, gap = tubeW * 0.6;
    const totalW = tubeCount * tubeW + (tubeCount - 1) * gap;
    const startX = R - totalW / 2 + tubeW / 2;
    const baseY = R * 1.45;
    for (let i = 0; i < tubeCount; i++) {
      const px = startX + i * (tubeW + gap);
      sctx.strokeStyle = '#5a8a3a'; sctx.lineWidth = 2;
      sctx.strokeRect(px - tubeW / 2, baseY - tubeH, tubeW, tubeH);
      const fillH = tubeH * frac;
      sctx.fillStyle = '#4fc3f7';
      sctx.fillRect(px - tubeW / 2, baseY - fillH, tubeW, fillH);
    }
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#ffca28', '#7cb342', '#2e7d32', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {

  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

window.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') {
    const b = document.querySelector('#btnRow .btn:not(.sub)') || document.querySelector('#panelBody .btn:not(.sub)');
    if (b) b.click();
  }
});

// ---------- UIヘルパー ----------
const bubbleEl = $('bubble'), wishEl = $('wishCard'), btnRow = $('btnRow');
function say(html) {
  bubbleEl.style.animation = 'none'; void bubbleEl.offsetWidth;
  bubbleEl.style.animation = ''; bubbleEl.innerHTML = html;
}
function setWish(icon, html) {
  wishEl.style.display = 'flex';
  wishEl.querySelector('.icon').textContent = icon;
  wishEl.querySelector('.wbody').innerHTML = html;
}
function hideWish() { wishEl.style.display = 'none'; }
function setButtons(list) {
  btnRow.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.cls ? ' ' + b.cls : '');
    el.innerHTML = b.label;
    el.onclick = () => { sTap(); b.cb(el); };
    btnRow.appendChild(el);
  });
}
function award(id) {
  if (S.badges.has(id)) return;
  S.badges.add(id);
  $('bd_' + id).classList.add('on');
}
const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }
const controlsEl = $('controls');
function setControls(list) {
  controlsEl.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'ctl' + (b.cls ? ' ' + b.cls : ''); el.innerHTML = b.label;
    el.disabled = !!b.disabled;
    el.onclick = () => { if (el.disabled) return; ac(); b.cb(el); };
    controlsEl.appendChild(el);
  });
}
function updateLoc() {
  const titles = {
    doukan: '🔍 水の通り道を 発見',
    kyuusui: '⏱️ 水を 吸い上げる 時間',
    jousan: '💧 水は どこへ 行く？',
    youbun: '🌞 養分を つくる',
    hakase: '🌳 くらしの中の 水と養分',
    done: '🌿 ミャクの森 ものがたり',
  };
  $('stageTitle').textContent = titles[S.scene] || 'かんさつ園';
}

function choiceRow(opts, cb) {
  return opts.map((label, i) => ({ label, cls: 'choice', cb: el => cb(i, el) }));
}
function markPicked(el) {
  btnRow.querySelectorAll('.choice').forEach(b => b.classList.remove('picked'));
  el.classList.add('picked');
}

// ---------- ステップ ----------
const FLOW = ['intro', 'vote', 'm_doukan', 'm_kyuusui', 'm_jousan', 'm_youbun', 'hakase', 'ending', 'free'];

function gotoStep(i) {
  S.stepIndex = clamp(i, 0, FLOW.length - 1);
  S.phase = ''; S.tween = null;
  hideOverlay(); hideWish();
  setControls([]); setButtons([]);
  STEPS[FLOW[S.stepIndex]].enter();
  updateLoc();
}
const nextStep = () => gotoStep(S.stepIndex + 1);

      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#2e7d32'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 友だちと クイズを 出しあおう。<br>れい：「水は くきの どこを 通る？」「葉は 毎日 どれくらい 水を 出す？」「養分は どうやって 作られる？」`);
      setButtons([
        { label: '🔍 水の通り道の図', cls: 'sub', cb: () => this.show('doukan') },
        { label: '⏱️ 水を吸い上げる時間の図', cls: 'sub', cb: () => this.show('kyuusui') },
        { label: '💧 蒸散の図', cls: 'sub', cb: () => this.show('jousan') },
        { label: '🌞 養分をつくる図', cls: 'sub', cb: () => this.show('youbun') },
        { label: '🌳 くらしの中の図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_kyuusui などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
