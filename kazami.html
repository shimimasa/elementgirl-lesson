<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（2026-07-23／ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

'use strict';
/* =====================================================
   カザミの丘 — 雲と天気・台風（小5理科・協力型・1ファイル）
   雲の観察（発見型）→ 雲の動きと天気の変化（メイン操作・時間送り①〜⑦）→
   台風の強さ（メイン操作・数値階段①〜⑦・山型の勢力変化）→
   台風のそなえ（発見型）→ はかせ（本物の数値クイズ）。
   数値：雲量0〜8=晴れ・9〜10=くもり、天気はおよそ西から東へ変化、
   台風は最大風速およそ17.2m/s以上の熱帯低気圧、
   強さの階級=強い(33〜44m/s未満)/非常に強い(44〜54m/s未満)/猛烈な(54m/s以上)、
   台風は年間やく25個発生し8月が最多、南のあたたかい海上で生まれ北上後に東へ曲がる。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {
  tenki: ruby('天気', 'てんき'),
  kumo: ruby('雲', 'くも'),
  kumoryou: ruby('雲量', 'うんりょう'),
  taifu: ruby('台風', 'たいふう'),
  fuusoku: ruby('風速', 'ふうそく'),
  nettei: ruby('熱帯低気圧', 'ねったいていきあつ'),
  nishi: ruby('西', 'にし'),
  higashi: ruby('東', 'ひがし'),
  bousai: ruby('防災', 'ぼうさい'),
  hinan: ruby('避難', 'ひなん'),
  seirei: ruby('精霊', 'せいれい'),
  hassei: ruby('発生', 'はっせい'),
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 数値データ（本物度） ----------
// 雲量の決め方：空全体を10として、0〜8=晴れ、9〜10=くもり（気象庁の天気の決め方）
function kumoTenki(ryou) { return ryou <= 8 ? '晴れ' : 'くもり'; }

// m_kumo：雲の観察カード（発見型）
const CLOUD_CARDS = [
  { key: 0, num: '①', ryou: 2, txt: '雲が すこしだけ。雲の量は<b>2</b>。0〜8だから、天気は「晴れ」。' },
  { key: 1, num: '②', ryou: 5, txt: '雲が 空の半分くらい。雲の量は<b>5</b>。まだ 0〜8なので「晴れ」。' },
  { key: 2, num: '③', ryou: 8, txt: '雲が だいぶ多い。雲の量は<b>8</b>。ギリギリ「晴れ」。' },
  { key: 3, num: '④', ryou: 10, txt: '空いちめん 雲。雲の量は<b>10</b>。9〜10だから「くもり」。' },

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function bgSky(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#f5fbff'); g.addColorStop(1, '#8ec3dc');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
}
function drawCloudPuff(px, py, r, alpha) {

  gctx.strokeStyle = `rgba(140,170,190,${alpha})`; gctx.lineWidth = 1.6;
  [[-0.7, 0, 0.6], [0.5, -0.25, 0.7], [0, 0.15, 0.85], [1.1, 0.1, 0.5], [-1.3, 0.15, 0.45]].forEach(([dx, dy, s]) => {
    gctx.beginPath(); gctx.arc(px + dx * r, py + dy * r, r * s, 0, TAU); gctx.fill(); gctx.stroke();
  });
}

function drawTaifuScene(X, Y, sc) {
  bgSky(X, Y, sc);
  const v = lerpArr(TYPHOON_STEPS, S.taifuIdxDisplay);
  const st = typhoonState(v);
  const cx = 500, cy = 330;
  const spin = performance.now() / 1000 * (1 + v / 30);
  const rad = (60 + v * 1.6) * sc;
  const col = st.key === 'violent' ? '#c62828' : st.key === 'vstrong' ? '#e65100' : st.key === 'strong' ? '#ef6c00' : st.key === 'typhoon' ? '#1565c0' : '#5f8fa8';
  gctx.save();
  gctx.translate(X(cx), Y(cy));
  for (let arm = 0; arm < 3; arm++) {
    gctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const a = spin + arm * (TAU / 3) + i * 0.22;
      const r = rad * (i / 40);
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      if (i === 0) gctx.moveTo(px, py); else gctx.lineTo(px, py);
    }
    gctx.strokeStyle = col; gctx.lineWidth = 8 * sc; gctx.lineCap = 'round'; gctx.stroke();
  }
  gctx.beginPath(); gctx.arc(0, 0, 16 * sc, 0, TAU); gctx.fillStyle = '#fff'; gctx.fill();
  gctx.strokeStyle = col; gctx.lineWidth = 3 * sc; gctx.stroke();

  gctx.fillStyle = '#12324a'; gctx.font = `700 ${22 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'kumo') drawKumoScene(X, Y, sc);
  else if (S.scene === 'ugoki') drawUgokiScene(X, Y, sc);
  else if (S.scene === 'taifu') drawTaifuScene(X, Y, sc);
  else if (S.scene === 'bousai') drawBousaiScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- カザミスコープ（丸窓） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f5fbff'); grd.addColorStop(1, '#b0d4e6');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'cloudgrid') {
    drawCloudGrid(R, S.scope.ryou);
    label(S.scope.label || '');
  } else if (mode === 'wind') {
    drawWindMeter(R, S.scope.v);
    label(S.scope.label || '');
  } else if (mode === 'point') {
    sctx.fillStyle = '#0d47a1';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#64b5f655'); g2.addColorStop(1, 'rgba(100,181,246,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#0d47a1'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🌀', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#0d47a1'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.09}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#12324a';
    sctx.fillText(txt, R, ly);
  }

  function drawCloudGrid(R, ryou) {
    const cols = 5, rows = 2, cellSize = R * 0.28;
    const startX = R - (cols - 1) * cellSize / 2, startY = R * 0.62 - (rows - 1) * cellSize / 2;
    let idx = 0;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const px = startX + c * cellSize, py = startY + r * cellSize;
        sctx.beginPath(); sctx.arc(px, py, cellSize * 0.36, 0, TAU);
        sctx.fillStyle = idx < ryou ? '#5fa8d3' : '#eaf6fb';
        sctx.fill();
        sctx.strokeStyle = '#0d47a1'; sctx.lineWidth = 1.4; sctx.stroke();
        idx++;
      }
    }
  }

  function drawWindMeter(R, v) {
    const cx = R, cy = R * 0.78, mr = R * 0.55;
    const maxV = 60;
    const frac = clamp(v / maxV, 0, 1);
    sctx.lineWidth = R * 0.1; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(cx, cy, mr, Math.PI, 0); sctx.strokeStyle = 'rgba(13,71,161,.18)'; sctx.stroke();
    sctx.beginPath(); sctx.arc(cx, cy, mr, Math.PI, Math.PI + Math.PI * frac);
    const col = v >= 54 ? '#c62828' : v >= 44 ? '#e65100' : v >= 33 ? '#ef6c00' : v >= 17.2 ? '#1565c0' : '#5f8fa8';
    sctx.strokeStyle = col; sctx.stroke();
    const ang = Math.PI + Math.PI * frac;
    sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(cx + Math.cos(ang) * mr * 0.85, cy + Math.sin(ang) * mr * 0.85);
    sctx.strokeStyle = '#12324a'; sctx.lineWidth = R * 0.03; sctx.stroke();
    sctx.beginPath(); sctx.arc(cx, cy, R * 0.05, 0, TAU); sctx.fillStyle = '#12324a'; sctx.fill();
  }
}

      life: 1, size: 2 + Math.random() * 4,

}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

function say(html) {
  bubbleEl.style.animation = 'none'; void bubbleEl.offsetWidth;

}
function setWish(icon, html) {
  wishEl.style.display = 'flex';
  wishEl.querySelector('.icon').textContent = icon;
  wishEl.querySelector('.wbody').innerHTML = html;
}
function hideWish() { wishEl.style.display = 'none'; }
function setButtons(list) {
  btnRow.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.cls ? ' ' + b.cls : '');
    el.innerHTML = b.label;
    el.onclick = () => { sTap(); b.cb(el); };
    btnRow.appendChild(el);
  });
}
function award(id) {
  if (S.badges.has(id)) return;
  S.badges.add(id);
  $('bd_' + id).classList.add('on');
}
const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }
const controlsEl = $('controls');
function setControls(list) {
  controlsEl.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'ctl' + (b.cls ? ' ' + b.cls : ''); el.innerHTML = b.label;
    el.disabled = !!b.disabled;
    el.onclick = () => { if (el.disabled) return; ac(); b.cb(el); };
    controlsEl.appendChild(el);
  });
}

        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 雲が どちらから 動いてくるかを 見る</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>きょうか あす、空を 見上げて 雲の量を 10段階で 数えてみよう。0〜8なら「晴れ」、9〜10なら「くもり」。きろくノートに 書いて、じっさいの ${W.tenki}と くらべてみてね。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#0d47a1'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「雲の量が9〜10だと どんな天気？」「${W.taifu}は 何m/sから 台風になる？」「${W.taifu}は どちらの海で 生まれる？」`);
      setButtons([
        { label: '☁️ 雲の観察の図', cls: 'sub', cb: () => this.show('kumo') },
        { label: '🌬️ 雲の動きの図', cls: 'sub', cb: () => this.show('ugoki') },
        { label: '🌀 台風の強さの図', cls: 'sub', cb: () => this.show('taifu') },
        { label: '🎒 台風のそなえの図', cls: 'sub', cb: () => this.show('bousai') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_taifu などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
