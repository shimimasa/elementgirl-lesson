<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

   ヒビキの谷 — 音の性質・ふるえ/大きさ/つたわり方（小3理科・エネルギー分野4作目・協力型・1ファイル）
   いろいろな音のもとをしらべよう（発見型）→ たたく強さと音の大きさ（メイン操作・①〜⑦の数値階段）→
   糸電話で音をつたえよう（対照実験・二択操作）→ 震えをピタッと止めてみよう（発見/実験型）→
   はかせ（音と安心なくらし）。
   数値：学習指導要領・小3理科「音の性質」＝物から音が出たり伝わったりするとき物は震えている、
   音の大きさが変わると物の震え方が変わる。音の大きさの目安（デシベル）は静かな図書館 約40dB／
   ふつうの会話 約60dB／電車の中 約80dBという一般的な資料値をアンカーに線形補間（WebSearchで裏取り）。
   糸電話は口→コップ内の空気→コップ→糸→コップ→コップ内の空気→耳という経路で振動を伝え、
   糸がたるむと振動が伝わらず、糸や底を指で押さえても振動が遮断されて聞こえなくなる。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
const plain = s => s.replace(/<[^>]+>/g, '');
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {

  shindou: ruby('振動', 'しんどう'),

  toshokan: ruby('図書館', 'としょかん'),
  kaiwa: ruby('会話', 'かいわ'),
  densha: ruby('電車', 'でんしゃ'),

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 数値データ（本物度） ----------
// m_furue：いろいろな音のもとをしらべよう（発見型）

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#fdf7ff'); g.addColorStop(1, '#e6c4e0');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
}

// ---------- カード描画（発見型ミッション共通） ----------
function drawCardGrid(X, Y, sc, cards, foundSet, cols, title) {

  });

// ---------- たいこの図（震え・波形の共通描画） ----------
function drawDrumFig(X, Y, sc, cx, cy, r, amp, phaseT) {
  const bodyW = r * 1.5, bodyH = r * 1.5;
  gctx.beginPath(); gctx.roundRect(X(cx - bodyW / 2), Y(cy - bodyH * 0.05), bodyW * sc, bodyH * sc, 12 * sc);
  gctx.fillStyle = '#c9502e'; gctx.fill(); gctx.strokeStyle = '#7a2f18'; gctx.lineWidth = 2 * sc; gctx.stroke();
  const squish = 1 - Math.min(0.55, amp * 0.45 * (0.5 + 0.5 * Math.sin(phaseT * 13)));
  gctx.beginPath(); gctx.ellipse(X(cx), Y(cy - bodyH * 0.05), r * sc, r * 0.34 * sc * squish, 0, 0, TAU);
  gctx.fillStyle = '#f0d8a8'; gctx.fill(); gctx.strokeStyle = '#8a5a2e'; gctx.lineWidth = 2.4 * sc; gctx.stroke();
  if (amp > 0.04) {
    for (let i = 0; i < 3; i++) {
      const rr = r * 0.85 + i * 22 + ((phaseT * 60) % 22);
      const a2 = Math.min(1, amp) * (1 - i * 0.32);
      if (a2 <= 0) continue;
      gctx.beginPath(); gctx.arc(X(cx), Y(cy - bodyH * 0.05), rr * sc, -0.85, 0.85);
      gctx.strokeStyle = `rgba(138,63,174,${a2.toFixed(2)})`; gctx.lineWidth = 2.6 * sc; gctx.stroke();
    }
  }
}

// ---------- 波形の帯（音の大きさミッション用） ----------
function drawWaveStrip(X, Y, sc, amp, phaseT, x0, x1, ymid) {
  gctx.strokeStyle = 'rgba(138,63,174,.25)'; gctx.lineWidth = 1.4 * sc;
  gctx.beginPath(); gctx.moveTo(X(x0), Y(ymid)); gctx.lineTo(X(x1), Y(ymid)); gctx.stroke();
  gctx.beginPath();
  const N = 120;
  for (let i = 0; i <= N; i++) {
    const xr = x0 + (x1 - x0) * (i / N);
    const yr = ymid + Math.sin((i / N) * TAU * 4 + phaseT * 4) * amp * 92;
    if (i === 0) gctx.moveTo(X(xr), Y(yr)); else gctx.lineTo(X(xr), Y(yr));
  }
  gctx.strokeStyle = '#e8703f'; gctx.lineWidth = 4 * sc; gctx.lineJoin = 'round'; gctx.lineCap = 'round'; gctx.stroke();
}

// ---------- 3．糸電話で音をつたえよう（対照実験） ----------
function drawItodenwaScene(X, Y, sc) {
  bgFill(X, Y, sc);
  const cup1 = { x: 190, y: 320 }, cup2 = { x: 810, y: 320 };
  function drawCup(cx, cy) {
    gctx.beginPath();
    gctx.moveTo(X(cx - 42), Y(cy - 55)); gctx.lineTo(X(cx + 42), Y(cy - 55));
    gctx.lineTo(X(cx + 30), Y(cy + 55)); gctx.lineTo(X(cx - 30), Y(cy + 55)); gctx.closePath();
    gctx.fillStyle = '#fdf7ff'; gctx.fill(); gctx.strokeStyle = '#8a3fae'; gctx.lineWidth = 2.6 * sc; gctx.stroke();
  }
  const slack = S.itoState === 'slack';
  function stringPoint(f) {
    const sx = cup1.x, sy = cup1.y - 32, ex = cup2.x, ey = cup2.y - 32;
    if (!slack) return { x: sx + (ex - sx) * f, y: sy + (ey - sy) * f };
    const mx = (sx + ex) / 2, my = Math.max(sy, ey) + 160;
    const x = (1 - f) * (1 - f) * sx + 2 * (1 - f) * f * mx + f * f * ex;
    const y = (1 - f) * (1 - f) * sy + 2 * (1 - f) * f * my + f * f * ey;
    return { x, y };
  }
  gctx.beginPath();
  for (let i = 0; i <= 30; i++) { const p = stringPoint(i / 30); if (i === 0) gctx.moveTo(X(p.x), Y(p.y)); else gctx.lineTo(X(p.x), Y(p.y)); }
  gctx.strokeStyle = '#8a5a2e'; gctx.lineWidth = 2.8 * sc; gctx.stroke();
  drawCup(cup1.x, cup1.y); drawCup(cup2.x, cup2.y);
  gctx.font = `${30 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('🗣️', X(cup1.x), Y(cup1.y + 10));
  gctx.fillText('👂', X(cup2.x), Y(cup2.y + 10));
  if (S.itoTestProgress > 0) {
    let f = S.itoTestProgress, alpha = 1;
    if (slack && f > 0.5) { alpha = Math.max(0, 1 - (f - 0.5) * 2.6); f = Math.min(f, 0.62); }
    const p = stringPoint(f);
    gctx.beginPath(); gctx.arc(X(p.x), Y(p.y), 11 * sc, 0, TAU);
    gctx.fillStyle = `rgba(232,112,63,${alpha.toFixed(2)})`; gctx.fill();
  }
  gctx.fillStyle = '#3a2050'; gctx.font = `700 ${16 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText(slack ? '〜 いま：たるませている 〜' : '━━ いま：ピンと張っている ━━', X(500), Y(70));
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'furue') drawFureScene(X, Y, sc);
  else if (S.scene === 'ookisa') drawOokisaScene(X, Y, sc, t);
  else if (S.scene === 'itodenwa') drawItodenwaScene(X, Y, sc);
  else if (S.scene === 'tomeru') drawTomeruScene(X, Y, sc, t);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- ヒビキのみみ（丸窓） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fffcff'); grd.addColorStop(1, '#dfb3d8');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'gauge') {
    drawGauge(R, S.scope.db, S.scope.tag);
  } else if (mode === 'point') {
    sctx.fillStyle = '#8a3fae';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#f0c2ff88'); g2.addColorStop(1, 'rgba(240,194,255,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#8a3fae'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🥁', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#8a3fae'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#3a2050';
    sctx.fillText(txt, R, ly);
  }

  function drawGauge(R, db, tag) {
    const cx = R, topY = R * 0.32, botY = R * 1.48, tubeW = R * 0.34;
    const DB_MIN = 30, DB_MAX = 90;
    const frac = clamp(((db || 0) - DB_MIN) / (DB_MAX - DB_MIN), 0, 1);
    sctx.strokeStyle = '#8a3fae'; sctx.lineWidth = R * 0.03;
    sctx.beginPath(); sctx.roundRect(cx - tubeW / 2, topY, tubeW, botY - topY, tubeW * 0.3); sctx.stroke();
    const fillTop = botY - (botY - topY) * frac;
    sctx.beginPath(); sctx.roundRect(cx - tubeW / 2 + 3, fillTop, tubeW - 6, botY - fillTop, (tubeW - 6) * 0.3);
    sctx.fillStyle = '#e8703f'; sctx.fill();
    sctx.fillStyle = '#3a2050'; sctx.font = `700 ${R * 0.13}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(Math.round(db || 0) + 'dB', cx + R * 0.5, R * 0.7);
    label(tag || '');
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#8a3fae', '#c98ae0', '#e8703f', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

function say(html) {
  bubbleEl.style.animation = 'none'; void bubbleEl.offsetWidth;
  bubbleEl.style.animation = ''; bubbleEl.innerHTML = html;
}
function setWish(icon, html) {
  wishEl.style.display = 'flex';
  wishEl.querySelector('.icon').textContent = icon;
  wishEl.querySelector('.wbody').innerHTML = html;
}
function hideWish() { wishEl.style.display = 'none'; }
function setButtons(list) {
  btnRow.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.cls ? ' ' + b.cls : '');
    el.innerHTML = b.label;
    el.onclick = () => { sTap(); b.cb(el); };
    btnRow.appendChild(el);
  });
}
function award(id) {
  if (S.badges.has(id)) return;
  S.badges.add(id);
  $('bd_' + id).classList.add('on');
  if (typeof recordBadge === 'function') recordBadge(S.badges.size, document.querySelectorAll('#badges .badge').length);
}
const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }
const controlsEl = $('controls');
function setControls(list) {
  controlsEl.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'ctl' + (b.cls ? ' ' + b.cls : ''); el.innerHTML = b.label;
    el.disabled = !!b.disabled;
    el.onclick = () => { if (el.disabled) return; ac(); b.cb(el); };
    controlsEl.appendChild(el);
  });
}
function updateLoc() {
  const titles = {
    furue: '👂 いろいろな音のもとをしらべよう',
    ookisa: '🥁 たたく強さと音の大きさ',
    itodenwa: '🧵 糸電話で音をつたえよう',
    tomeru: '✋ 震えをピタッと止めてみよう',
    hakase: '🔎 はかせチャレンジ',
    done: '🥁 ヒビキの谷 ものがたり',
  };
  $('stageTitle').textContent = titles[S.scene] || 'ヒビキの谷';
}

function choiceRow(opts, cb) {
  return opts.map((label, i) => ({ label, cls: 'choice', cb: el => cb(i, el) }));
}
function markPicked(el) {
  btnRow.querySelectorAll('.choice').forEach(b => b.classList.remove('picked'));
  el.classList.add('picked');
}

// ---------- ステップ ----------
const FLOW = ['intro', 'vote', 'm_furue', 'm_ookisa', 'm_itodenwa', 'm_tomeru', 'hakase', 'm_furikaeri', 'ending', 'free'];

// ふりかえりタイム：4ミッションの場面を1つずつ見せ直すスライドショー（自作アニメーションで再現）
const FURIKAERI_SLIDES = [
  { scene: 'furue', icon: '👂', title: 'いろいろな音のもとをしらべよう',
    setup: () => { S.furueFound = new Set(FURE_CARDS.map(c => c.key)); },
    scope: () => ({ type: 'point', icon: '🥁', name: '音が出る物はみな震えている' }),
    text: () => `たいこも すずも わゴムも のども、音が 出ている 時は みんな ${W.shindou}していたね。` },
  { scene: 'ookisa', icon: '🥁', title: 'たたく強さと音の大きさ',
    setup: () => { S.ookisaIdxDisplay = 6; },
    scope: () => ({ type: 'gauge', db: OOKISA_DB[6], tag: ookisaTagFor(6) }),
    text: () => `たたく 強さを 強くすると、ふるえ方（ふれはば）も 音の 大きさも 大きくなったね。` },
  { scene: 'itodenwa', icon: '🧵', title: '糸電話で音をつたえよう',
    setup: () => { S.itoState = 'slack'; S.itoTestProgress = 0; S.itoTested = new Set(['taut', 'slack']); },
    scope: () => ({ type: 'point', icon: '🔇', name: 'たるむと聞こえにくい' }),
    text: () => `糸を ピンと 張らないと、ふるえが うまく 伝わらず、声は 聞こえにくく なったね。` },
  { scene: 'tomeru', icon: '✋', title: '震えをピタッと止めてみよう',
    setup: () => { S.tomeruRinging = false; S.tomeruAmp = 0; },
    scope: () => ({ type: 'point', icon: '✋', name: 'ふるえが止まると音も止まる' }),
    text: () => `鳴っている 物に そっと ふれると、ふるえが 止まって、音も 止まったね。` },
];

function gotoStep(i) {
  S.stepIndex = clamp(i, 0, FLOW.length - 1);
  S.phase = ''; S.tween = null;
  hideOverlay(); hideWish();
  setControls([]); setButtons([]);
  STEPS[FLOW[S.stepIndex]].enter();
  updateLoc();
}
const nextStep = () => gotoStep(S.stepIndex + 1);

const STEPS = {
  intro: {
    enter() {
      Object.assign(S, { scene: 'furue', scope: { type: 'idle' } });
      say('……');
      setButtons([]);
      showOverlay(`
        <div class="phasesStrip">👂🥁🧵✋</div>

        <div class="sub">〜 音の 性質（ふるえ・大きさ・つたわり方） 〜</div>

        今日は、音の もとから、音の 大きさ、${W.itodenwa}の しくみまで、いっしょに たしかめに 行こう！</p>
        <button class="btn" id="startBtn">たいけんを はじめる！</button>

  },

  vote: {

        <h2>🤔 よそうタイム</h2>
        <p class="talk">${W.itodenwa}の 糸を、ピンと 張らずに たるませても、声は 同じように 聞こえると 思う？</p>

          <div class="vcard" data-v="1"><span class="vicon">🔇</span><b>イ</b> 聞こえにくく なる（ほとんど聞こえない）</div>

        <button class="btn" id="voteGo">よし、たしかめよう！</button>

      panelEl.querySelectorAll('.vcard').forEach(c => {
        c.onclick = () => { sTap(); panelEl.querySelectorAll('.vcard').forEach(x => x.classList.remove('picked')); c.classList.add('picked');

      });

    },
  },

  // --- M1：いろいろな音のもとをしらべよう（発見型） ---
  m_furue: {
    enter() {
      Object.assign(S, { scene: 'furue', scope: { type: 'idle' }, furueFound: new Set() });

      setWish('👂', `①〜④を タッチして、音が 出る 物を しらべよう。`);

      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(FURE_CARDS.map(c => ({
        label: c.num + ' ' + (S.furueFound.has(c.key) ? plain(c.name) : '？？？'),

  // --- M2：たたく強さと音の大きさ（メイン操作・数値階段①〜⑦） ---
  m_ookisa: {
    enter() {
      Object.assign(S, { scene: 'ookisa', ookisaIdx: 0, ookisaIdxDisplay: 0, scope: { type: 'gauge', db: OOKISA_DB[0], tag: ookisaTagFor(0) } });
      updateLoc();
      setWish('🥁', `「たたく」ボタンで たいこを たたく 強さを ①から ⑦まで 上げていって、膜の ふるえ方と 音の 大きさを たしかめよう。`);
      say(`①は そっと たたいた 時。「たたく」ボタンで、つぎの 強さへ 進むよ。`);
      this.refreshCtl();
    },
    refreshCtl() {
      if (S.ookisaIdx >= OOKISA_DB.length - 1) { this.finish(); return; }
      setControls([{ label: `🥁 もっと 強く たたく（つぎの段階へ）`, cb: () => this.advance() }]);
    },
    advance() {
      if (S.ookisaIdx >= OOKISA_DB.length - 1) return;
      setControls([]);
      const fromV = S.ookisaIdx, toV = S.ookisaIdx + 1;
      startTween(fromV, toV, 0.7, v => {
        S.ookisaIdxDisplay = v;
        S.scope = { type: 'gauge', db: lerpArr(OOKISA_DB, v), tag: ookisaTagFor(Math.round(v)) };
      }, () => {
        S.ookisaIdx++; S.ookisaIdxDisplay = S.ookisaIdx;
        sTap();
        this.refreshCtl();
      });
    },
    finish() {
      setControls([]);
      say(`①〜⑦まで、たたく 強さを 上げたね。強く たたくと、ふるえ方は どう なったかな？`);
      setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
    },
    ask() {
      hideWish(); setButtons([]);
      say(`たたく 強さを 強くすると、たいこの 膜の ふるえ方は、たたく 前と くらべて どうなる？`);
      setButtons(choiceRow(['大きく（はげしく）ふるえる', 'かわらない', '小さく（おとなしく）ふるえる'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 0) {
        sYes(); scopeBurst(); award('m_ookisa'); S.phase = 'done';
        say(`せいかい！ たたく 強さを 強くすると、たいこの 膜の ふるえ方（ふれはば）が 大きくなり、音も 大きくなる。音の 大きさの 目安（デシベル）で いうと、①そっと たたいた 時は ${W.toshokan}くらい（やく40dB）、④ふつうに たたいた 時は ふつうの ${W.kaiwa}くらい（やく60dB）、⑦力いっぱい たたいた 時は ${W.densha}の 中くらい（やく80dB）に なるんだ。<br><br>💡 <b>たいせつポイント</b><br>ふるえ方（ふれはば）が 大きいほど、音は 大きい。`);
        setButtons([{ label: 'つぎへ（糸電話で音をつたえよう）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど、たいこの 膜の うごきを 思い出してみよう。`);
        setButtons(choiceRow(['大きく（はげしく）ふるえる', 'かわらない', '小さく（おとなしく）ふるえる'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- M3：糸電話で音をつたえよう（対照実験） ---
  m_itodenwa: {
    enter() {
      Object.assign(S, { scene: 'itodenwa', itoState: 'taut', itoTested: new Set(), itoTestProgress: 0, scope: { type: 'point', icon: '🧵', name: '糸電話をためそう' } });
      updateLoc();
      setWish('🧵', `「ピンと張る」「たるませる」を えらんで、「こえを 出してみる」で たしかめよう。両方 ためそう。`);
      say(`${W.itodenwa}は、口の 声を 糸の ふるえで 伝えて 聞く 道具。糸の 張り方を 変えて、聞こえ方を くらべてみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setControls([
        { label: '🧵 ピンと 張る' + (S.itoState === 'taut' ? '（いまコレ）' : ''), cb: () => this.setState('taut') },
        { label: '〜 たるませる' + (S.itoState === 'slack' ? '（いまコレ）' : ''), cb: () => this.setState('slack') },
      ]);
      if (S.itoTested.size >= 2) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      } else {
        setButtons([{ label: '🔊 こえを 出してみる', cb: () => this.test() }]);
      }
    },
    setState(state) {
      sTap(); S.itoState = state; S.itoTestProgress = 0;
      S.scope = { type: 'point', icon: '🧵', name: state === 'taut' ? 'ピンと張った' : 'たるませた' };
      this.refreshCtl();
    },
    test() {
      setControls([]); setButtons([]);
      const heard = S.itoState === 'taut';
      startTween(0, 1, 1.0, v => { S.itoTestProgress = v; }, () => {
        S.itoTested.add(S.itoState);
        if (heard) {
          sYes(); scopeBurst(); S.scope = { type: 'point', icon: '🔊', name: 'きこえた！' };
          say(`ピンと 張った 糸は、声の ふるえを しっかり 伝える。「きこえた！」`);
        } else {
          sHmm(); S.scope = { type: 'point', icon: '🔇', name: 'きこえにくい…' };
          say(`たるんだ 糸は、ふるえが うまく 伝わらない。「きこえにくい…」`);
        }
        S.itoTestProgress = 0;
        this.refreshCtl();
      });
    },
    ask() {
      hideWish(); setButtons([]);
      say(`${W.itodenwa}の 糸を たるませると、声は どうなる？`);
      setButtons(choiceRow(['同じように聞こえる', '聞こえにくくなる（ほとんど聞こえない）', 'むしろよく聞こえる'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 1) {
        sYes(); scopeBurst(); award('m_itodenwa'); S.phase = 'done';
        const votedRight = S.votePicked.has(1);
        say(`せいかい！ ${W.itodenwa}は、口 → コップの中の 空気 → コップ → 糸 → コップ → コップの中の 空気 → 耳、という 順番で ふるえを 伝えている。糸が たるむと ふるえが うまく ${W.tsutawaru}ず、聞こえにくく なる。糸を ${W.yubi}で つまんでも、ふるえが 止まって 同じように 聞こえなく なるんだ。${votedRight ? '（みんなの よそう、ばっちり！）' : ''}`);
        setButtons([{ label: 'つぎへ（震えをピタッと止めてみよう）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。糸を たるませた 時の 聞こえ方を 思い出してみよう。`);
        setButtons(choiceRow(['同じように聞こえる', '聞こえにくくなる（ほとんど聞こえない）', 'むしろよく聞こえる'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

        say(`ちがうよ。もういちど かんがえてみよう。`);

  // --- ふりかえりタイム：4ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      hideOverlay();
      scopeBurst();
      say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
      setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ ヒビキの谷 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>4つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 音が 出ている 物は、みんな（<span class="blankWord" data-a="ふるえている">？？？</span>）。<br>
        ② たいこを 強く たたくと、ふるえ方が（<span class="blankWord" data-a="大きく">？？？</span>）なり、音も 大きくなる。<br>
        ③ 糸電話の 糸が たるむと、ふるえが 伝わらず、声は（<span class="blankWord" data-a="聞こえにくく">？？？</span>）なる。<br>
        ④ 鳴っている 物に そっと ふれると、ふるえが（<span class="blankWord" data-a="止まる">？？？</span>）ので、音も 止まる。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 聞こえにくく なる（ほとんど聞こえない）</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>①紙コップと たこ糸で 糸電話を 作って、家族や 友だちと 話してみよう。糸を ピンと 張ると よく 聞こえるよ。<br>②家の 中の 音（テレビの音・話し声など）を、大きい/小さいで くらべてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#8a3fae'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「音が出ている物に共通することは？」「強くたたくとふるえ方はどうなる？」「糸電話の糸がたるむとどうなる？」`);
      setButtons([
        { label: '👂 音のもとの図', cls: 'sub', cb: () => this.show('furue') },
        { label: '🥁 音の大きさの図', cls: 'sub', cb: () => this.show('ookisa') },
        { label: '🧵 糸電話の図', cls: 'sub', cb: () => this.show('itodenwa') },
        { label: '✋ ふるえを止める図', cls: 'sub', cb: () => this.show('tomeru') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_ookisa などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
</body>
</html>
