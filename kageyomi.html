<style>

<script>
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// ---------- アンロック判定 ----------
const REQUIRE_SLUG = 'kagerou';
const BADGE_KEY = 'elementgirl_badge_progress';
function nsKey(base){
  try { return (typeof profileNamespacedKey === 'function') ? profileNamespacedKey(base) : base; }
  catch(e){ return base; }
}
function getBadgeProgress(){
  try { return JSON.parse(localStorage.getItem(nsKey(BADGE_KEY)) || '{}'); }
  catch(e){ return {}; }
}
function isUnlocked(){
  const p = getBadgeProgress()[REQUIRE_SLUG];
  return !!(p && p.total > 0 && p.count >= p.total);
}

// ---------- ベストタイム ----------
const BEST_KEY = 'kageyomi_best_ms';
function getBest(){
  const v = localStorage.getItem(nsKey(BEST_KEY));
  return v ? parseInt(v, 10) : null;
}
function setBest(ms){
  try { localStorage.setItem(nsKey(BEST_KEY), String(ms)); } catch(e){}
}
function fmtTime(ms){
  const s = ms / 1000;
  const m = Math.floor(s / 60);
  const r = (s - m * 60).toFixed(1).padStart(4, '0');
  return `${String(m).padStart(2,'0')}:${r}`;
}

// ---------- 数値データ（カゲロウの原 kagerou.html と同じ本物データ。東京・春分秋分・棒100cm） ----------
const TIMES = [8, 9, 10, 11, 12, 13, 14, 15];
const SHADOW_LEN = [225, 143, 100, 78, 73, 78, 100, 143];
const SHADOW_AZ = [288.6, 300.3, 315.2, 335.1, 360, 384.9, 404.8, 419.7]; // 0=北 90=東 180=南 270=西・時計まわり

// 4区分（本編m_houiの「朝=西・正午=北・夕方=東」の考え方をそのまま4分割に拡張）
const ZONES = [
  { key: 'asa', label: 'あさ', idxs: [0, 1] },
  { key: 'hirumae', label: 'ひるまえ', idxs: [2, 3] },
  { key: 'shougo', label: 'しょうごごろ', idxs: [4] },
  { key: 'yugata', label: 'ゆうがた', idxs: [5, 6, 7] },
];
function zoneOfIdx(idx){ return ZONES.find(z => z.idxs.includes(idx)); }
// 2段階抽選（まず区分を均等に選び、区分内の時こくを選ぶ）で4択の正解が偏らないようにする
function pickQuestionIdx(){
  const z = ZONES[Math.floor(Math.random() * ZONES.length)];
  return z.idxs[Math.floor(Math.random() * z.idxs.length)];
}
const QUESTION_COUNT = 10;

// ---------- ゲーム状態 ----------
const S = {
  phase: 'title',   // title | lock | playing | result
  quizIdx: 0,
  correctCount: 0,
  curTimeIdx: 0,
  answered: false,
  sound: true,
  startTime: 0,
};

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));
const sHmm = () => { tone(392, 0, 0.18, 'sine', 0.07); tone(349, 0.16, 0.3, 'sine', 0.07); };
const sFanfare = () => [523, 587, 659, 784, 880, 1046, 1318, 1568].forEach((f, i) => tone(f, i * 0.08, 0.45, 'triangle', 0.1));

// ---------- キャンバス ----------
const stageCv = $('stage'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}
const PAD_T = 26, PAD_B = 16, PAD_X = 16;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function bgFieldSky(X, Y, sc, top) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(top));
  g.addColorStop(0, '#eaf6ff'); g.addColorStop(1, '#d8ecdc');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, top * sc);
}
function polarPoint(cx, cy, angleDeg, radius) {
  const rad = angleDeg * Math.PI / 180;
  return { x: cx + Math.sin(rad) * radius, y: cy - Math.cos(rad) * radius };
}

// ---------- 方位コンパス（カゲロウの原 drawCompassScene を移植。太陽は隠して影だけ見せる） ----------
function drawCompassScene(X, Y, sc, az, lenCm) {
  const cx = 500, cy = 350, R = 220;
  bgFieldSky(X, Y, sc, 640);
  let g = gctx.createRadialGradient(X(cx), Y(cy), 0, X(cx), Y(cy), (R + 55) * sc);
  g.addColorStop(0, '#eaf6d8'); g.addColorStop(1, '#c8e4b0');
  gctx.fillStyle = g;
  gctx.beginPath(); gctx.arc(X(cx), Y(cy), (R + 55) * sc, 0, TAU); gctx.fill();
  gctx.strokeStyle = '#7ab890'; gctx.lineWidth = 3 * sc;
  gctx.beginPath(); gctx.arc(X(cx), Y(cy), R * sc, 0, TAU); gctx.stroke();
  const CARD = [{ a: 0, l: '北' }, { a: 45, l: '' }, { a: 90, l: '東' }, { a: 135, l: '' }, { a: 180, l: '南' }, { a: 225, l: '' }, { a: 270, l: '西' }, { a: 315, l: '' }];
  CARD.forEach(c => {
    const p1 = polarPoint(cx, cy, c.a, R), p2 = polarPoint(cx, cy, c.a, R - (c.l ? 24 : 12));
    gctx.strokeStyle = c.l ? '#2a7a52' : '#a8c8a8'; gctx.lineWidth = (c.l ? 3 : 1.6) * sc;
    gctx.beginPath(); gctx.moveTo(X(p1.x), Y(p1.y)); gctx.lineTo(X(p2.x), Y(p2.y)); gctx.stroke();
    if (c.l) {
      const lp = polarPoint(cx, cy, c.a, R + 28);
      gctx.fillStyle = '#1c3a52'; gctx.font = `700 ${25 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
      gctx.fillText(c.l, X(lp.x), Y(lp.y));
    }
  });
  gctx.fillStyle = '#8a6a3a'; gctx.strokeStyle = '#5a4020'; gctx.lineWidth = 2 * sc;
  gctx.beginPath(); gctx.arc(X(cx), Y(cy), 13 * sc, 0, TAU); gctx.fill(); gctx.stroke();
  const lenPx = clamp(50 + lenCm * 0.72, 0, R - 15);
  const tip = polarPoint(cx, cy, az, lenPx);
  const grad = gctx.createLinearGradient(X(cx), Y(cy), X(tip.x), Y(tip.y));
  grad.addColorStop(0, 'rgba(35,45,35,.78)'); grad.addColorStop(1, 'rgba(35,45,35,.32)');
  gctx.strokeStyle = grad; gctx.lineWidth = 15 * sc; gctx.lineCap = 'round';
  gctx.beginPath(); gctx.moveTo(X(cx), Y(cy)); gctx.lineTo(X(tip.x), Y(tip.y)); gctx.stroke();
}

function drawStage() {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  if (S.phase !== 'playing') return;
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  const az = SHADOW_AZ[S.curTimeIdx] % 360, len = SHADOW_LEN[S.curTimeIdx];
  drawCompassScene(X, Y, sc, az, len);
  gctx.fillStyle = '#1c3a52'; gctx.font = `700 ${19 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('このかげは、なんじごろ？', X(500), Y(60));
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 60); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 240;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#ffd166', '#4fae7a', '#2a7a52', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function stageBurst() {
  const r = $('stageWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 出題進行 ----------
function updateProgChip(){ $('progChip').textContent = `${S.quizIdx}/${QUESTION_COUNT}`; }
function setResultMsg(html){ $('resultMsg').innerHTML = html; }
function setControls(list){
  const el = $('controls');
  el.innerHTML = '';
  list.forEach(b => {
    const btn = document.createElement('button');
    btn.className = 'ctl' + (b.cls ? ' ' + b.cls : '');
    btn.innerHTML = b.label;
    btn.disabled = !!b.dis;
    btn.onclick = () => { ac(); b.cb(); };
    el.appendChild(btn);
  });
}
function nextQuestion(){
  if (S.quizIdx >= QUESTION_COUNT) { onAllClear(); return; }
  S.curTimeIdx = pickQuestionIdx();
  S.answered = false;
  updateProgChip();
  setResultMsg('かげの 向きと 長さを 見て、なんじごろか えらぼう。');
  setControls(ZONES.map(z => ({ label: z.label, cb: () => onChoose(z.key) })));
}
function onChoose(zoneKey){
  if (S.phase !== 'playing' || S.answered) return;
  S.answered = true;
  ac(); sTap();
  const trueZone = zoneOfIdx(S.curTimeIdx);
  const correct = zoneKey === trueZone.key;
  const hour = TIMES[S.curTimeIdx];
  if (correct) {
    S.correctCount++;
    sYes(); stageBurst();
    setResultMsg(`🎯 せいかい！ ${hour}時ごろの かげだよ。`);
  } else {
    sHmm();
    setResultMsg(`😥 ちがったよ。これは「${trueZone.label}」（${hour}時ごろ）の かげだったよ。`);
  }
  setControls([]);
  S.quizIdx++;
  updateProgChip();
  setTimeout(nextQuestion, 1500);
}

function rankText(correct){
  if (correct >= QUESTION_COUNT) return '👑 パーフェクト！ぜんぶ せいかい！';
  if (correct >= 8) return '🌟🌟🌟 すごい！かげ名人！';
  if (correct >= 5) return '🌟🌟 いいちょうし！';
  return '🌱 もういちど、かげと太陽の1日を たしかめてみよう！';
}
function startGame(){
  S.quizIdx = 0;
  S.correctCount = 0;
  S.startTime = performance.now();
  S.phase = 'playing';
  nextQuestion();
}
function onAllClear(){
  S.phase = 'result';
  setControls([]);
  sFanfare();
  const elapsed = performance.now() - S.startTime;
  const best = getBest();
  const isNewBest = (best === null) || (elapsed < best);
  if (isNewBest) setBest(Math.round(elapsed));
  $('resultCorrect').textContent = `${S.correctCount} / ${QUESTION_COUNT} もん せいかい`;
  $('resultTime').textContent = fmtTime(elapsed);
  $('resultBestMsg').innerHTML = isNewBest
    ? '🎉 じぶんの ベストタイム こうしん！'
    : `ベストタイム：${fmtTime(best)}`;
  $('starListEl').innerHTML = `<span class="starChip">${rankText(S.correctCount)}</span>`;
  showOverlay('resultOverlay');
  updateBestChip();
}

// ---------- オーバーレイ ----------
function showOverlay(id){ $(id).classList.remove('hide'); }
function hideOverlay(id){ $(id).classList.add('hide'); }

function updateBestChip(){
  const b = getBest();
  $('bestChip').textContent = b ? `ベスト ${fmtTime(b)}` : 'ベスト —';
}

$('btnStart').addEventListener('click', () => {
  ac();
  hideOverlay('titleOverlay');
  startGame();
  updateBestChip();
});
$('btnRetry').addEventListener('click', () => {
  hideOverlay('resultOverlay');
  showOverlay('titleOverlay');
  updateBestChip();
});

// ---------- 起動 ----------
function boot(){
  if (!isUnlocked()) {
    S.phase = 'lock';
    showOverlay('lockOverlay');
    return;
  }
  showOverlay('titleOverlay');
  updateBestChip();
  const best = getBest();
  if (best !== null) {
    $('bestInfo').style.display = 'block';
    $('bestInfo').innerHTML = `<p>いまの ベストタイム：<b>${fmtTime(best)}</b></p>`;
  }
}

// ---------- ループ ----------
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  drawStage();
  drawFx(dt);
  if (S.phase === 'playing') {
    $('timeChip').textContent = fmtTime(now - S.startTime);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
boot();
</script>
