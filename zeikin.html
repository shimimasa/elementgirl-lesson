<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

   よそう(税金がなかったら くらしは？) → 税金の種類さがし(発見) →
   もし税金がなかったら(発見・よそう回収) → 予算をくばろう(①〜⑧で試す・メイン操作) →
   予算は誰が決める(発見) → はかせ（社会保障が最大・国債への依存）。

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

const W = {
  kokuzei: ruby('国税', 'こくぜい'),
  chihouzei: ruby('地方税', 'ちほうぜい'),
  chokusetsuzei: ruby('直接税', 'ちょくせつぜい'),
  kansetsuzei: ruby('間接税', 'かんせつぜい'),
  shohizei: ruby('消費税', 'しょうひぜい'),
  shotokuzei: ruby('所得税', 'しょとくぜい'),
  yosan: ruby('予算', 'よさん'),
  naikaku: ruby('内閣', 'ないかく'),
  kokkai: ruby('国会', 'こっかい'),
  shingi: ruby('審議', 'しんぎ'),
  giketsu: ruby('議決', 'ぎけつ'),
  shakaihoshou: ruby('社会保障関係費', 'しゃかいほしょうかんけいひ'),
  kousaihi: ruby('国債費', 'こくさいひ'),
  kokusai: ruby('国債', 'こくさい'),
  shoushikoureika: ruby('少子高齢化', 'しょうしこうれいか'),
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 手がかりデータ ----------
const SHURUI_POINTS = [
  { key: 0, letter: 'あ', name: '国税', x: 730, y: 210,
    txt: `国に 納める 税を ${W.kokuzei}と いうよ。防衛や 外交、社会保障など、国全体の 仕事に 使われるんだ。` },

let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || 0.12, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}

}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'shurui') drawShuruiScene(X, Y, sc);
  else if (S.scene === 'nakattara') drawNakattaraScene(X, Y, sc);
  else if (S.scene === 'yosan') drawYosanScene(X, Y, sc);
  else if (S.scene === 'kokkai') drawKokkaiScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawKokkaiScene(X, Y, sc);
}

// ---------- マルのめ（スコープ） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#f2f9f3'); grd.addColorStop(1, '#9cc2a8');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'point') {
    sctx.fillStyle = '#143d24'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔎', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'gauge') {
    const lvl = (S.yosan && S.yosan.levelF) || 0;
    const bw = R * 0.5, bh = R * 1.0, bx = R - bw / 2, by = R * 0.35;
    sctx.strokeStyle = '#143d24'; sctx.lineWidth = R * 0.025;
    sctx.strokeRect(bx, by, bw, bh);
    const fillH = bh * clamp(lvl / 8, 0, 1);
    sctx.fillStyle = '#2e8b4f';
    sctx.fillRect(bx, by + bh - fillH, bw, fillH);
    label(`配分 ${NUMS[clamp(Math.round(lvl) - 1, 0, 7)] || ''}`);
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffe9a8'); g2.addColorStop(1, 'rgba(255,233,168,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#143d24'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🪙', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#143d24'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.9)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#143d24';
    sctx.fillText(txt, R, ly);
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#143d24', '#c9a227', '#2e8b4f', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

  wishEl.querySelector('.icon').textContent = icon;
  wishEl.querySelector('.wbody').innerHTML = html;
}
function hideWish() { wishEl.style.display = 'none'; }
function setButtons(list) {
  btnRow.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn' + (b.cls ? ' ' + b.cls : '');
    el.innerHTML = b.label;
    el.onclick = () => { sTap(); b.cb(el); };
    btnRow.appendChild(el);
  });
}
function award(id) {
  if (S.badges.has(id)) return;
  S.badges.add(id);
  $('bd_' + id).classList.add('on');
}
const overlayEl = $('overlay'), panelEl = $('panelBody');
function showOverlay(html) { panelEl.innerHTML = html; overlayEl.classList.add('show'); }
function hideOverlay() { overlayEl.classList.remove('show'); }
const controlsEl = $('controls');
function setControls(list) {
  controlsEl.innerHTML = '';
  list.forEach(b => {
    const el = document.createElement('button');
    el.className = 'ctl' + (b.cls ? ' ' + b.cls : ''); el.innerHTML = b.label;
    el.disabled = !!b.disabled;
    el.onclick = () => { if (el.disabled) return; ac(); b.cb(el); };
    controlsEl.appendChild(el);
  });
}
function updateLoc() {
  $('locChip').textContent = 'いまの 日本';
  const titles = {
    shurui: '🏙️ 税金の 種類さがし',
    nakattara: '❓ もし 税金が なかったら',
    yosan: '🚧 予算を くばろう',
    kokkai: '🏛️ 予算は 誰が 決める？',
    hakase: '📊 日本の 予算の 内わけ',
    done: '🪙 マルの蔵 ものがたり',
  };
  $('stageTitle').textContent = titles[S.scene] || 'まちの くらし';
}

// ---------- ステップ ----------
const FLOW = ['intro', 'vote', 'm_shurui', 'm_nakattara', 'm_yosan', 'm_kokkai', 'hakase', 'ending', 'free'];

function gotoStep(i) {
  S.stepIndex = clamp(i, 0, FLOW.length - 1);
  S.phase = ''; S.tween = null;
  hideOverlay(); hideWish();
  setControls([]);
  STEPS[FLOW[S.stepIndex]].enter();
  updateLoc();
}
const nextStep = () => gotoStep(S.stepIndex + 1);

function choiceRow(opts, cb) {
  return opts.map((label, i) => ({ label, cls: 'choice', cb: el => cb(i, el) }));
}
function markPicked(el) {
  btnRow.querySelectorAll('.choice').forEach(b => b.classList.remove('picked'));
  el.classList.add('picked');
}

const STEPS = {
  intro: {
    enter() {
      Object.assign(S, { scene: 'shurui', scope: { type: 'idle' } });
      say('……');
      setButtons([]);
      showOverlay(`
        <div class="phasesStrip">🪙🏙️🏛️</div>
        <h1>マルの蔵</h1>
        <div class="sub">〜 税金と くらし 〜</div>
        <p class="talk">ようこそ！ わたしは 硬貨の 重なりから 生まれた 精霊、<b>マル</b>。みんなが 払っている「税金」は、まちの くらしを ささえる 大切な お金なんだ。<b>いっしょに たしかめに いこう！</b><br>
        もし 税金が なかったら、まちの くらしは どう なるだろう……見ていこう。</p>
        <button class="btn" id="startBtn">税金の ひみつを たしかめに 出かける！</button>
        <div class="foot">先生へ：F11キーで全画面表示になります。操作は画面のボタンとタッチです。</div>
      `);
      $('startBtn').onclick = () => { ac(); sTap(); nextStep(); };
    },
  },

  vote: {
    enter() {
      showOverlay(`
        <h2>🤔 よそうタイム</h2>
        <p class="talk">もし 税金が なかったら、みんなの くらしは どうなると 思う？</p>
        <div class="voteCards">
          <div class="vcard" data-v="0"><span class="vicon">😀</span><b>ア</b> 今と 変わらない</div>
          <div class="vcard" data-v="1"><span class="vicon">😢</span><b>イ</b> 学校や 病院、道路などで 困る 人が でてくる</div>
          <div class="vcard" data-v="2"><span class="vicon">💰</span><b>ウ</b> みんな もっと お金を 自由に 使えて 便利に なる</div>
        </div>
        <div class="sub">思う ものに タッチ。きろくシートにも 〇を つけてね。</div>
        <button class="btn" id="voteGo">よし、たしかめよう！</button>
      `);
      panelEl.querySelectorAll('.vcard').forEach(c => {
        c.onclick = () => { sTap(); panelEl.querySelectorAll('.vcard').forEach(x => x.classList.remove('picked')); c.classList.add('picked');
          S.votePicked = new Set([+c.dataset.v]);
        };
      });
      $('voteGo').onclick = () => { sTap(); nextStep(); };
    },
  },

  // --- M1：税金の種類さがし ---
  m_shurui: {
    enter() {
      Object.assign(S, { scene: 'shurui', scope: { type: 'idle' }, shuruiFound: new Set() });
      updateLoc();
      hideWish();
      say(`税金には いろいろな 種類が あるんだ。4つの 手がかりを 調べてみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(SHURUI_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.shuruiFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.shuruiFound.size >= SHURUI_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.shuruiFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`買い物の ときに 払う ${W.shohizei}は、直接税と 間接税の どちら？`);
      setButtons(choiceRow(['ア 直接税', 'イ 間接税', 'ウ どちらでも ない'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 1) {
        sYes(); scopeBurst(); award('m_shurui'); S.phase = 'done';
        say(`せいかい！ 消費税は お店が 納めるけど、実さいに 払っているのは わたしたち。納める 人と 負担する 人が ちがうから ${W.kansetsuzei}なんだ。<br><br>💡 <b>たいせつポイント</b><br>税金には、納め先で 分ける ${W.kokuzei}と ${W.chihouzei}、納め方で 分ける ${W.chokusetsuzei}と ${W.kansetsuzei}が あるんだね。`);
        setButtons([{ label: 'つぎへ（もし税金がなかったら）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 直接税', 'イ 間接税', 'ウ どちらでも ない'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- M2：もし税金がなかったら（よそうタイム回収） ---
  m_nakattara: {
    enter() {
      Object.assign(S, { scene: 'nakattara', scope: { type: 'idle' }, nakattaraFound: new Set() });
      updateLoc();
      hideWish();
      say(`もし 税金が なかったら、まちは どうなって しまうだろう？ 4つの 手がかりを 調べてみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(NAKATTARA_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.nakattaraFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.nakattaraFound.size >= NAKATTARA_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.nakattaraFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`税金には、どんな 役わりが あるだろう？`);
      setButtons(choiceRow(['ア 一部の 人だけが 得を する', 'イ みんなで お金を 出し合って、みんなが 使える サービスを ささえる', 'ウ ただ 集めて ためて おくだけ'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 1) {
        sYes(); scopeBurst(); award('m_nakattara'); S.phase = 'done';
        say(`せいかい！ 学校・救急車・道路・消防……税金が なかったら、これらは お金を 払える 人しか 使えなく なって しまうかもしれない。<br><br>💡 <b>たいせつポイント</b><br>税金は、みんなで 出し合って、みんなが 使える サービスを ささえる しくみなんだね。`);
        setButtons([{ label: 'つぎへ（予算をくばろう）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 一部の 人だけが 得を する', 'イ みんなで お金を 出し合って、みんなが 使える サービスを ささえる', 'ウ ただ 集めて ためて おくだけ'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- M3：予算をくばろう（メイン操作） ---
  m_yosan: {
    enter() {
      Object.assign(S, { scene: 'yosan', scope: { type: 'gauge' }, yosan: { levelF: 0 }, yosanTries: new Set(), tryT: 0 });
      updateLoc();
      hideWish();
      say(`道路や 橋を 直す「公共事業」に、予算を どれだけ 回すか 決めよう。目もり①〜⑧で えらんで、ちょうどよいか ためそう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      const list = [];
      for (let n = 1; n <= 8; n++) list.push({ label: NUMS[n - 1], cls: 'pos' + (S.yosanLevel === n ? ' sel' : ''), cb: () => { S.yosanLevel = n; this.refreshCtl(); } });
      list.push({ label: '💰 予算を 決める', cb: () => this.build() });
      setControls(list);
    },
    build() {
      setControls([]);
      say(`目もり ${NUMS[S.yosanLevel - 1]} の 配分で、予算を くばる……`);
      sClank();
      startTween(0, S.yosanLevel, 1.1, v => { S.yosan.levelF = v; }, () => this.judge());
    },
    judge() {
      const r = judgeYosan(S.yosanLevel);
      S.yosanTries.add(S.yosanLevel);
      if (r.level === 'good') {
        sYes(); scopeBurst(); award('m_yosan'); S.phase = 'done';
        say(`✨ 道路や 橋も 直り、社会保障や 教育にも じゅうぶんな 予算が 回せる、ちょうどよい 配分に なった！ ✨<br><br>💡 <b>たいせつポイント</b><br>予算には 限りが あるから、どこかに 多く 使えば、どこかが 少なく なる。バランスを 考えて 配分することが 大切なんだ。`);
        setButtons([{ label: 'つぎへ（予算は誰が決める）', cb: nextStep }]);
      } else if (r.level === 'low') {
        sHmm(); S.tryT = 0;
        say(`予算が 少なすぎて、こわれた 道路や 橋が 直せず、みんなが 困って しまいそうだ……もういちど 配分を えらんでみよう。`);
        this.refreshCtl();
      } else {
        sHmm(); S.tryT = 0;
        say(`予算を かけすぎて、社会保障や 教育に 回す お金が 足りなくなり、別の ところで 困る 人が 出て しまいそうだ……もういちど 配分を えらんでみよう。`);
        this.refreshCtl();
      }
    },
  },

  // --- M4：予算は誰が決める ---
  m_kokkai: {
    enter() {
      Object.assign(S, { scene: 'kokkai', scope: { type: 'idle' }, kokkaiFound: new Set() });
      updateLoc();
      hideWish();
      say(`予算の 使いみちは、誰が 決めているのだろう？ 2つの 手がかりを 調べてみよう。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(KOKKAI_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.kokkaiFound.has(p.key) ? '✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.kokkaiFound.size >= KOKKAI_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.kokkaiFound.add(p.key);
      S.scope = { type: 'point', name: p.name };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      say(`予算の 使いみちを 最終的に 決めるのは？`);
      setButtons(choiceRow(['ア 内閣だけで 決める', 'イ 国会（みんなが 選んだ 代表）で 話し合って 決める', 'ウ 税務署が 決める'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 1) {
        sYes(); scopeBurst(); award('m_kokkai'); S.phase = 'done';
        say(`せいかい！ ${W.naikaku}が つくった 予算案を、わたしたちが 選挙で 選んだ ${W.kokkai}議員が 話し合い（${W.shingi}）、決める（${W.giketsu}）んだ。<br><br>💡 <b>たいせつポイント</b><br>税金の 使いみちは、みんなの 代表が 話し合って 決めている。だから 選挙で 誰を えらぶかも 大切なんだね。`);
        setButtons([{ label: 'つぎへ（はかせチャレンジ）', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 内閣だけで 決める', 'イ 国会（みんなが 選んだ 代表）で 話し合って 決める', 'ウ 税務署が 決める'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  // --- はかせチャレンジ：日本の予算の内わけ ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' } });
      updateLoc();
      hideWish();
      say(`さいごは <b>はかせチャレンジ</b>！ 日本の 予算（歳出）は 全部で 約122兆円。円グラフで 内わけを 見てみよう。`);
      setButtons([{ label: 'くわしく 見る', cb: () => this.ask() }]);
    },
    ask() {
      sTap();
      say(`日本の 予算で、いちばん 多く 使われているのは どれだろう？`);
      setButtons(choiceRow(['ア 防衛関係費', 'イ 社会保障関係費', 'ウ 公共事業関係費'], (i, el) => this.pick(i, el)));
    },
    pick(n, el) {
      markPicked(el);
      if (n === 1) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ 年金・医療・介護などに 使われる ${W.shakaihoshou}が 予算の 約3分の1で いちばん 多いんだ。${W.shoushikoureika}が 進む 日本では、この 金がくは これからも 増え続けると 言われているよ。また、税金だけでは 足りず、${W.kokusai}という 国の 借金にも たよっているんだ。<br><br>💡 <b>たいせつポイント</b><br>予算の バランスを どう とるかは、これからの 日本の 大きな 課題なんだね。`);
        setButtons([{ label: 'まとめへ すすむ', cb: nextStep }]);
      } else {
        sHmm();
        say(`ちがうよ。もういちど かんがえてみよう。`);
        setButtons(choiceRow(['ア 防衛関係費', 'イ 社会保障関係費', 'ウ 公共事業関係費'], (i, el2) => this.pick(i, el2)));
      }
    },
  },

  ending: {
    enter() {
      Object.assign(S, { scene: 'kokkai', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ マルの蔵 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>3つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 国に 納める 税を（<span class="blankWord" data-a="国税">？？？</span>）、都道府県や 市区町村に 納める 税を（<span class="blankWord" data-a="地方税">？？？</span>）と いう。<br>
        ② 消費税のように、納める 人と 負担する 人が ちがう 税を（<span class="blankWord" data-a="間接税">？？？</span>）と いう。<br>
        ③ 予算の 使いみちは（<span class="blankWord" data-a="国会">？？？</span>）で 話し合って 決められる。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ 学校や 病院、道路などで 困る 人が でてくる</b> でした！ ${votedRight ? '（みんなの よそう、ばっちり！）' : ''} 税金は、みんなで 出し合って、みんなが 使える サービスを ささえる しくみだったんだね。</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>買い物の レシートを 見て、消費税が いくら 書かれているか さがしてみよう。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#0f2a18'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'shurui', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ 税金の しくみについて、${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「消費税は 直接税？間接税？」「予算は 誰が 決める？」`);
      setButtons([
        { label: '🏙️ 税金の 種類の 図', cls: 'sub', cb: () => this.show('shurui') },
        { label: '❓ もし税金がなかったらの 図', cls: 'sub', cb: () => this.show('nakattara') },
        { label: '🚧 予算をくばろうの 図', cls: 'sub', cb: () => this.show('yosan') },
        { label: '🏛️ 国会の 図', cls: 'sub', cb: () => this.show('kokkai') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) {
      S.scene = scene;
      updateLoc(); sTap();
    },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => { if (confirm('さいしょから やりなおしますか？')) location.reload(); };
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_yosan などで途中から始められます）
const qsStep = new URLSearchParams(location.search).get('step');
gotoStep(Math.max(0, FLOW.indexOf(qsStep)));
requestAnimationFrame(loop);
</script>
